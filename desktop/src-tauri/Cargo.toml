[package]
name = "firetower-desktop"
version = "0.10.0" # x-release-please-version
edition = "2021"
description = "Firetower, as a desktop application"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The feature is declared on every platform so the build script sees one
# feature set whatever the target; Tauri ignores it off macOS.
# `image-png` is for the taskbar overlay: `set_overlay_icon` takes an `Image`,
# and decoding the one in `icons/ember.png` needs the decoder compiled in.
# `image-png` is for the taskbar overlay and the tray: both take an `Image`,
# and decoding the PNGs in `icons/` needs the decoder compiled in. `tray-icon`
# is the Windows notification area (`tray.rs`); it is declared on every
# platform so the build script sees one feature set whatever the target, and
# the module itself is `cfg`-ed off outside Windows.
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The translucent sidebar, and the island's four AppKit flags.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
# Already in the tree — Tauri builds on both. Declared here because `island.rs`
# reaches for NSScreen and NSWindow directly, and a transitive dependency is
# not an API you are allowed to call.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "NSView", "NSWindow"] }

# The island's window flags on Windows. Pinned to the same major as Tauri's
# own: `WebviewWindow::hwnd()` hands back a `windows::Win32::Foundation::HWND`
# from *its* copy of the crate, and two majors in one tree makes that handle a
# different type that no amount of casting will accept.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
incremental = true

# Out of the main Cargo workspace on purpose: the prototype must not change
# what `cargo build` does at the repository root.
[workspace]
