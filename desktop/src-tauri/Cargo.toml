[package]
name = "firetower-desktop"
version = "0.0.0"
edition = "2021"
description = "Firetower, as a Mac application"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

# Out of the main Cargo workspace on purpose: the prototype must not change
# what `cargo build` does at the repository root.
[workspace]
