[package]
name = "firetower-desktop"
version = "0.6.0" # x-release-please-version
edition = "2021"
description = "Firetower, as a desktop application"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The feature is declared on every platform so the build script sees one
# feature set whatever the target; Tauri ignores it off macOS.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The translucent sidebar is the one macOS-only thing.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[profile.dev]
incremental = true

# Out of the main Cargo workspace on purpose: the prototype must not change
# what `cargo build` does at the repository root.
[workspace]
