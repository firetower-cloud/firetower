[package]
name = "firetower-desktop"
version = "0.30.0" # x-release-please-version
edition = "2021"
description = "Firetower, as a desktop application"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The feature is declared on every platform so the build script sees one
# feature set whatever the target; Tauri ignores it off macOS.
# `image-png` is for the taskbar overlay: `set_overlay_icon` takes an `Image`,
# and decoding the one in `icons/ember.png` needs the decoder compiled in.
# `image-png` is for the taskbar overlay and the tray: both take an `Image`,
# and decoding the PNGs in `icons/` needs the decoder compiled in.
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# The native save sheet. Asked for from `save_download` rather than from the
# renderer, so it needs no entry in `capabilities/` — see the note there.
tauri-plugin-dialog = "2"
# Downloading a file or a zip out of a workspace. The fetch happens here and
# not in the renderer so that a hundred megabytes never crosses the IPC bridge
# or sits in the webview's heap; it streams from the control plane to the path
# somebody picked. Already in the tree under the updater plugin — declared
# because a transitive dependency is not an API you are allowed to call.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
# Waiting for the save sheet without blocking the runtime the window is drawn
# on, and writing a download to disk as it arrives rather than holding ten
# gigabytes of it in memory first. Declared for the same reason `reqwest` is.
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Reading the `message` out of a refusal from the control plane, which is the
# difference between saying what went wrong and writing JSON to disk under a
# `.zip`.
serde_json = "1"
# `Said` and `Done` — the keychain's answers, which the renderer switches on
# the tag of. Already in the tree under Tauri; declared because deriving is
# calling an API, and a transitive dependency is not one you are allowed to
# call. The `derive` feature is the only part used.
serde = { version = "1", features = ["derive"] }

# The translucent sidebar.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
# Already in the tree — Tauri builds on both. Declared here because
# `capture.rs` reaches for the Objective-C runtime directly, and a transitive
# dependency is not an API you are allowed to call.
objc2 = "0.6"
# `NSImage` and `NSBitmapImageRep` are for `capture.rs`: `takeSnapshot` hands
# back an NSImage and the only way out of one to PNG bytes is a bitmap rep.
# `capture.rs` names both through `class!` rather than as types, so this is
# here to link AppKit as much as to import it; the feature list is the set
# those two classes sit behind and is not worth paring further.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
# `capture.rs`: a width to scale the snapshot to (`NSNumber`, which lives in
# `NSValue`), the properties dictionary PNG encoding takes, and the `NSData`
# the bytes come back in.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSValue"] }
# The completion handler `takeSnapshot` is given. Paired with objc2's major,
# for the same reason the `windows` crate below is pinned to Tauri's.
block2 = "0.6"

# The in-memory stream `capture.rs` hands WebView2 to write a PNG into.
# Pinned to the same major as Tauri's own, for the same reason `webview2-com`
# below is: a handle from *its* copy of the crate is a different type across
# two majors in one tree, and no amount of casting will accept it.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# `capture.rs` on Windows. Pinned to the majors Tauri already resolves, for the
# same reason the `windows` crate is: `PlatformWebview::controller()` hands back
# an `ICoreWebView2Controller` from *its* copy, and two majors in one tree makes
# that a different type no cast will accept.
webview2-com = "0.38"
# WebView2 photographs the webview at its real size — there is no
# `snapshotWidth` the way WebKit has — so the downscale is done here. macOS
# does not link this: `takeSnapshot` scales as it captures.
image = { version = "0.25", default-features = false, features = ["png"] }

# The notification area (`tray.rs`). Asked for only on the platform that has
# one, so the Mac build does not link a tray implementation it can never use.
# Unlike `macos-private-api` above, nothing in `build.rs` reads this one, so
# it is safe to vary by target.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }

[profile.dev]
incremental = true

# Out of the main Cargo workspace on purpose: the prototype must not change
# what `cargo build` does at the repository root.
[workspace]
