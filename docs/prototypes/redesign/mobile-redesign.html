/* ──────────────────────────────────────────────────────────────────────────
   TOKENS

   Two sets, kept apart on purpose.

   `--d-*` is the *document*: the page you are reading, the chrome around the
   phones. It is `docs/prototypes/redesign/desktop-redesign.html`'s own sheet,
   copied verbatim, so the two halves of this redesign are set in one voice.

   `--p-*` is the *phone*: `mobile/src/design/tokens.generated.ts`, which is
   compiled from `web/app/globals.css`. The dark branch below is that file,
   byte for byte. The light branch is the derivation `docs/design-handoff.md`
   §4 specifies, carried from the desktop artifact where it already exists and
   worked out here where it does not — every one of those is measured in Spec
   and says what it was measured against.

   Nothing in the phone set is invented for looks. Where a value is new it is
   listed in Spec under "What this adds to globals.css".
   ────────────────────────────────────────────────────────────────────────── */
:root{
  /* The document, light. */
  --d-desk:#ECEEF1; --d-sheet:#FFFFFF; --d-raised:#F5F6F8; --d-sunk:#E6E8ED;
  --d-hair:#E3E5EA; --d-ink:#15161A; --d-body:#45474F; --d-quiet:#787B85;
  --d-hush:#A4A7B1; --d-ember:#FF5E1A; --d-ember-ink:#BF4714; --d-brick:#B83A30;
  --d-amber:#A8780F; --d-good:#2F7D52; --d-good-bg:#EAF6EE; --d-slate:#44607E;
  --d-lift-1:0 1px 2px rgb(21 22 26 / .05);
  --d-lift-2:0 2px 6px rgb(21 22 26 / .06), 0 0 0 1px rgb(21 22 26 / .04);
  --d-lift-3:0 18px 44px -18px rgb(21 22 26 / .26), 0 2px 8px rgb(21 22 26 / .05);
  --d-device:0 1px 1px rgb(21 22 26 / .10), 0 32px 70px -26px rgb(21 22 26 / .34);

  /* The phone, light. Derived; measured in Spec. */
  --p-ground:#FFFFFF; --p-panel:#F7F8FA; --p-raise:#F1F3F6; --p-overlay:#E6E8ED;
  --p-line:#E3E5EA; --p-line-soft:#EDEEF2; --p-settling:#C9CCD3;
  --p-bone:#15161A; --p-text:#45474F; --p-dim:#787B85; --p-mute:#A4A7B1;
  --p-ember:#FF5E1A; --p-ember-ink:#BF4714; --p-ember-tint:#FFF0E8; --p-ember-deep:#EAA078;
  --p-sage:#2F7D52; --p-sage-tint:#EAF6EE; --p-sage-deep:#A9D6BB;
  --p-brick:#B83A30; --p-brick-tint:#FFF3F2; --p-brick-deep:#F7A9A0;
  --p-amber:#653400; --p-amber-soft:#A8780F; --p-amber-tint:#FCEBCE; --p-amber-deep:#B79045;
  --p-slate:#44607E; --p-slate-tint:#EDF1F6; --p-slate-deep:#AFC0D2;
  --p-kind-source:#4f688a; --p-kind-native:#8b5b39; --p-kind-data:#776520;
  --p-kind-style:#6b5f93; --p-kind-media:#37714d; --p-kind-store:#925178;
  --p-kind-prose:#65666f;
  --p-syn-comment:#878792; --p-syn-string:#2d5439; --p-syn-keyword:#65598e;
  --p-syn-type:#4c647d; --p-syn-number:#5a4c14; --p-syn-fn:#895a37; --p-syn-attr:#676771;
  /* The platform's own chrome, which is not ours and does not follow our ramp. */
  --p-sys-bar:rgb(255 255 255 / .72); --p-sys-line:rgb(21 22 26 / .10);
  --p-scrim:rgb(21 22 26 / .34);
  --p-raise-shadow:0 1px 2px rgb(21 22 26 / .06);
  --p-rest-shadow:0 1px 2px rgb(21 22 26 / .05), 0 0 0 1px rgb(21 22 26 / .055);
  --p-float-shadow:0 20px 48px -18px rgb(21 22 26 / .26), 0 2px 8px rgb(21 22 26 / .05), 0 0 0 1px rgb(21 22 26 / .04);

  --d-font:"Archivo",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --d-narrow:"Archivo Narrow",var(--d-font);
  --d-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
  --swift:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --d-desk:#060608; --d-sheet:#131317; --d-raised:#1B1C20; --d-sunk:#232429;
  --d-hair:#2A2C31; --d-ink:#F5F5F7; --d-body:#C6C8CF; --d-quiet:#8B8E98;
  --d-hush:#60636D; --d-ember:#FF6B2C; --d-ember-ink:#FF9A6B; --d-brick:#E5645A;
  --d-amber:#fab219; --d-good:#6EC08A; --d-good-bg:#12251A; --d-slate:#7D95B0;
  --d-lift-1:inset 0 1px 0 rgb(255 255 255 / .03);
  --d-lift-2:inset 0 1px 0 rgb(255 255 255 / .04), 0 1px 2px rgb(0 0 0 / .4);
  --d-lift-3:inset 0 1px 0 rgb(255 255 255 / .05), 0 18px 44px -18px rgb(0 0 0 / .72);
  --d-device:0 0 0 1px rgb(255 255 255 / .06), 0 32px 70px -26px rgb(0 0 0 / .8);

  /* The phone, dark. `mobile/src/design/tokens.generated.ts`, verbatim. */
  --p-ground:#0b0b0c; --p-panel:#111113; --p-raise:#17171a; --p-overlay:#1e1e22;
  --p-line:#26262b; --p-line-soft:#1a1a1e; --p-settling:#3e3e46;
  --p-bone:#f4f4f5; --p-text:#c8c8ce; --p-dim:#8b8b93; --p-mute:#5e5e67;
  --p-ember:#ff6b2c; --p-ember-ink:#ff9a6b; --p-ember-tint:#2a1509; --p-ember-deep:#7a3417;
  --p-sage:#6ec08a; --p-sage-tint:#12251a; --p-sage-deep:#2c5b3d;
  --p-brick:#e5645a; --p-brick-tint:#2a1414; --p-brick-deep:#6e2f2b;
  --p-amber:#fab219; --p-amber-soft:#fab219; --p-amber-tint:#2a2008; --p-amber-deep:#7a5a0d;
  --p-slate:#7d95b0; --p-slate-tint:#161d26; --p-slate-deep:#35485c;
  --p-kind-source:#7b93b8; --p-kind-native:#b8845f; --p-kind-data:#c2ab63;
  --p-kind-style:#9a8cc4; --p-kind-media:#79b58d; --p-kind-store:#bd79a1;
  --p-kind-prose:#9a9aa4;
  --p-syn-comment:#6a6a74; --p-syn-string:#8fb99a; --p-syn-keyword:#9a8cc4;
  --p-syn-type:#7d95b0; --p-syn-number:#c2ab63; --p-syn-fn:#b8845f; --p-syn-attr:#8a8a94;
  --p-sys-bar:rgb(11 11 12 / .72); --p-sys-line:rgb(255 255 255 / .10);
  --p-scrim:rgb(0 0 0 / .45);
  --p-raise-shadow:inset 0 1px 0 rgb(255 255 255 / .04), 0 1px 2px rgb(0 0 0 / .4);
  --p-rest-shadow:inset 0 1px 0 rgb(255 255 255 / .05), 0 0 0 1px rgb(255 255 255 / .07);
  --p-float-shadow:inset 0 1px 0 rgb(255 255 255 / .06), 0 20px 48px -18px rgb(0 0 0 / .76);
  color-scheme:dark;
}
/* ──────────────────────────────────────────────────────────────────────────
   THE DOCUMENT

   Every selector in this block begins `.d-`. Every selector in the next block
   begins `.p-`. No class is ever defined both unscoped and as somebody's
   descendant — that is the collision the desktop work paid five bugs for, and
   the audit in Spec proves the rule holds rather than asserting it.
   ────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--d-desk)}
body{font-family:var(--d-font);color:var(--d-body);-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--d-slate);outline-offset:2px;border-radius:4px}

.d-wrap{max-width:1780px;margin:0 auto;padding:30px 26px 90px}
.d-mast{margin-bottom:22px}
.d-mast h1{font-size:19px;font-weight:600;letter-spacing:-.012em;color:var(--d-ink);line-height:1.3}
.d-lede{font-size:13.5px;color:var(--d-quiet);max-width:60ch;margin-top:5px;line-height:1.55}
.d-lede b{color:var(--d-body);font-weight:540}

.d-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:7px}
.d-bar[data-sep="1"]{margin-top:2px}
.d-chip{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--d-quiet);
  white-space:nowrap;transition:background var(--swift) 140ms,color var(--swift) 140ms}
.d-chip:hover{color:var(--d-body);background:var(--d-raised)}
.d-chip[aria-pressed="true"]{background:var(--d-sheet);color:var(--d-ink);font-weight:530;box-shadow:var(--d-lift-1)}
.d-chip[data-mini="1"]{font-size:12.5px;padding:5px 9px}
.d-group{display:flex;gap:2px;background:var(--d-sunk);padding:3px;border-radius:10px}
.d-group .d-chip{padding:5px 10px}
.d-spacer{flex:1}
.d-legend{font-size:12px;color:var(--d-hush);margin-right:6px;font-family:var(--d-narrow);
  letter-spacing:.01em;flex:none}

/* The stage the devices stand on. */
.d-stage{background:var(--d-sheet);border-radius:16px;padding:30px 24px;box-shadow:var(--d-lift-1)}
.d-stage[data-plain="1"]{background:none;box-shadow:none;padding:0;border-radius:0;overflow:visible}
.d-row{display:flex;flex-wrap:wrap;gap:40px 24px;align-items:flex-start;justify-content:center}
.d-scale{overflow:hidden;position:relative}
.d-scale > .p-dev{transform-origin:top left}
.d-row[data-left="1"]{justify-content:flex-start}
.d-cap{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;
  color:var(--d-hush);padding:12px 4px 0}
.d-cap b{color:var(--d-quiet);font-weight:530}
.d-cap code{font-family:var(--d-mono);font-size:11.5px}

/* A device, and the label under it. */
.d-dev{flex:none;display:flex;flex-direction:column;align-items:center;gap:0}
.d-name{font-size:12.5px;color:var(--d-quiet);margin-top:11px;text-align:center;font-weight:530}
.d-sub{font-size:11.5px;color:var(--d-hush);text-align:center;margin-top:1px;
  font-family:var(--d-mono);letter-spacing:-.01em}
.d-band{font-size:11px;margin-top:5px;padding:2px 8px;border-radius:99px;
  font-family:var(--d-narrow);letter-spacing:.02em}
.d-band[data-b="push"]{background:var(--d-raised);color:var(--d-quiet)}
.d-band[data-b="float"]{background:#EDF1F6;color:var(--d-slate)}
.d-band[data-b="dock"]{background:var(--d-good-bg);color:var(--d-good)}

/* Prose sections under the stage. */
.d-note{max-width:70ch;margin:34px auto 0;padding:0 4px}
.d-note h2{font-size:22px;font-weight:600;color:var(--d-ink);letter-spacing:-.016em;margin-bottom:10px;line-height:1.25}
.d-note h3{font-size:15.5px;font-weight:600;color:var(--d-ink);letter-spacing:-.008em;margin:26px 0 7px}
.d-note h4{font-size:13.5px;font-weight:600;color:var(--d-body);margin:16px 0 4px}
.d-note p{font-size:15px;line-height:1.72;color:var(--d-body);margin-bottom:11px}
.d-note li{font-size:15px;line-height:1.66;color:var(--d-body);margin:0 0 7px 19px}
.d-note b{color:var(--d-ink);font-weight:580}
.d-note code{font-family:var(--d-mono);font-size:12.8px;background:var(--d-raised);
  padding:1px 5px;border-radius:4px;color:var(--d-body)}
.d-note a{color:var(--d-slate)}
.d-wide{max-width:none;margin-left:0;margin-right:0}
/* Coverage is a three-column table and will not read in a 70ch measure. */
.d-roomy{max-width:1080px}
.d-roomy p{max-width:72ch}
.d-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px;
  max-width:1200px;margin:34px auto 0}
.d-cols h4{font-size:14px;font-weight:600;color:var(--d-ink);margin-bottom:6px;letter-spacing:-.006em}
.d-cols p{font-size:13.6px;line-height:1.62;color:var(--d-body)}
.d-cols b{color:var(--d-ink);font-weight:570}
.d-cols code{font-family:var(--d-mono);font-size:12px;color:var(--d-quiet)}

/* Tables: measurements, type, motion, coverage. */
.d-tbl{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:13.6px}
.d-tbl th{text-align:left;font-weight:500;color:var(--d-hush);font-size:11.5px;
  font-family:var(--d-narrow);letter-spacing:.03em;padding:0 14px 7px 0;border-bottom:1px solid var(--d-hair)}
.d-tbl td{padding:8px 14px 8px 0;border-bottom:1px solid var(--d-hair);
  color:var(--d-body);vertical-align:top;line-height:1.5}
.d-tbl tr:last-child td{border-bottom:0}
.d-tbl td:first-child{color:var(--d-ink)}
.d-tbl code{font-family:var(--d-mono);font-size:12.2px;background:var(--d-raised);
  padding:1px 5px;border-radius:4px}
.d-num{font-family:var(--d-mono);font-size:12.6px;font-variant-numeric:tabular-nums}
.d-ok{color:var(--d-good)}
.d-bad{color:var(--d-brick)}
.d-warn{color:var(--d-amber)}
.d-swatch{display:inline-block;width:11px;height:11px;border-radius:3px;
  vertical-align:-1px;margin-right:6px;box-shadow:inset 0 0 0 1px rgb(21 22 26 / .12)}

/* Coverage. */
.d-cov{margin:4px 0 18px}
.d-covrow{display:grid;grid-template-columns:1fr 78px 2.1fr;gap:12px;align-items:baseline;
  padding:6px 0 6px 2px;border-bottom:1px solid var(--d-hair);font-size:13.4px}
.d-covrow:last-child{border-bottom:0}
.d-covrow[data-head="1"]{padding-top:13px;font-weight:580;color:var(--d-ink);
  border-bottom-color:transparent}
.d-covrow[data-sub="1"] > span:first-child{padding-left:17px;color:var(--d-body)}
.d-covrow > span:first-child{color:var(--d-ink)}
.d-covrow > span:last-child{color:var(--d-quiet);font-size:12.6px;line-height:1.45}
.d-covrow code{font-family:var(--d-mono);font-size:11.8px;background:var(--d-raised);
  padding:1px 4px;border-radius:3px;white-space:nowrap}
.d-pip{display:inline-flex;align-items:center;gap:6px;font-size:12.4px;color:var(--d-quiet)}
.d-pip i{width:8px;height:8px;border-radius:99px;display:block;flex:none}
.d-pip i[data-k="Y"]{background:var(--d-good)}
.d-pip i[data-k="P"]{background:var(--d-amber)}
.d-pip i[data-k="N"]{background:var(--d-hush)}
.d-pip i[data-k="X"]{box-shadow:inset 0 0 0 1.5px var(--d-hush)}
.d-tally{display:flex;gap:3px;align-items:center;padding-top:5px}
.d-tally i{width:7px;height:7px;border-radius:99px;display:block}
.d-tally i[data-k="Y"]{background:var(--d-good)}
.d-tally i[data-k="P"]{background:var(--d-amber)}
.d-tally i[data-k="N"]{background:var(--d-hush)}
.d-tally i[data-k="X"]{box-shadow:inset 0 0 0 1.5px var(--d-hush)}
.d-covgrp{font-size:15.5px;font-weight:600;color:var(--d-ink);margin:30px 0 2px;letter-spacing:-.008em}
.d-covlegend{display:flex;flex-wrap:wrap;gap:17px;font-size:12.6px;color:var(--d-quiet);margin:12px 0 6px}

 /* The index. A tile is the control that opens the thing it shows. */
.d-sheet{display:flex;flex-wrap:wrap;gap:24px 20px;max-width:1080px;margin:4px auto 0;padding:0 4px}
.d-tile{display:flex;flex-direction:column;align-items:flex-start;width:146px;
  text-align:left;cursor:pointer}
.d-tile:hover .d-scale{transform:translateY(-2px)}
.d-scale{transition:transform 140ms var(--swift)}
.d-tilelab{font-size:13px;color:var(--d-ink);font-weight:530;margin-top:10px;line-height:1.35}
.d-tilenote{font-size:12px;color:var(--d-hush);margin-top:2px;line-height:1.35}

/* The ruler on the Poses tab — the one bold thing in this document. */
.d-ruler{position:relative;height:84px;margin:0 auto 10px;max-width:1120px;overflow:hidden}
.d-rline{position:absolute;left:0;right:0;top:40px;height:1px;background:var(--d-hair)}
.d-rband{position:absolute;top:30px;height:21px;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-family:var(--d-narrow);
  letter-spacing:.04em}
.d-rband[data-b="push"]{background:var(--d-raised);color:var(--d-quiet)}
.d-rband[data-b="float"]{background:#EDF1F6;color:var(--d-slate)}
.d-rband[data-b="dock"]{background:var(--d-good-bg);color:var(--d-good)}
.d-rtick{position:absolute;top:22px;width:1px;height:38px;background:var(--d-quiet)}
.d-rtick[data-soft="1"]{background:var(--d-hair);top:28px;height:26px}
.d-rlab{position:absolute;top:58px;transform:translateX(-50%);font-family:var(--d-mono);
  font-size:11.5px;color:var(--d-ink);white-space:nowrap}
.d-rwho{position:absolute;top:2px;transform:translateX(-50%);font-size:11px;
  color:var(--d-quiet);white-space:nowrap}
.d-rbad{position:absolute;top:58px;transform:translateX(-50%);font-size:11.5px;
  color:var(--d-brick);white-space:nowrap}

/* The transition player. */
.d-play{display:flex;gap:7px;align-items:center;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.d-step{padding:7px 13px;border-radius:9px;background:var(--d-raised);font-size:13px;
  color:var(--d-body);box-shadow:var(--d-lift-1)}
.d-step:hover{background:var(--d-sunk)}
.d-step[aria-pressed="true"]{background:var(--d-ink);color:var(--d-sheet)}
.d-arrow{color:var(--d-hush);font-size:13px}
.d-moving{font-size:12.6px;color:var(--d-quiet);text-align:center;margin-top:14px;
  min-height:38px;max-width:62ch;margin-left:auto;margin-right:auto;line-height:1.5}
.d-moving b{color:var(--d-ink);font-weight:570}

/* A callout that marks a trap. */
.d-trap{border-left:2px solid var(--d-brick);padding:3px 0 3px 13px;margin:14px 0;
  font-size:13.6px;color:var(--d-body);line-height:1.6}
.d-trap b{color:var(--d-brick);font-weight:580}
.d-keep{border-left:2px solid var(--d-good);padding:3px 0 3px 13px;margin:14px 0;
  font-size:13.6px;color:var(--d-body);line-height:1.6}
.d-keep b{color:var(--d-good);font-weight:580}
.d-flag{border-left:2px solid var(--d-amber);padding:3px 0 3px 13px;margin:14px 0;
  font-size:13.6px;color:var(--d-body);line-height:1.6}
.d-flag b{color:var(--d-amber);font-weight:580}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important;
    animation-iteration-count:1 !important}
}
/* ──────────────────────────────────────────────────────────────────────────
   THE PHONE

   1 CSS pixel = 1 point. A 390 device is 390px wide here, so every number on
   this page is the number an engineer puts in a stylesheet.

   The vocabulary is the accepted desktop design's, carried over rather than
   re-derived:

   - **A row is a name and one timestamp.** No repository, no branch, no
     agent mark, no status word, no chevron. If something matters enough to
     be in a row it has to earn the space against the name, and almost
     nothing does.
   - **One accent.** An ember dot means an agent is waiting on you, and
     nothing else on the screen is saturated. Work happening is three grey
     dots, which is the only thing that moves at rest.
   - **Almost no rules, and no cards.** Space separates things; a border is a
     last resort. The only card in the app is the composer, and only while
     you are writing in it.
   - **No tracked-out capitals, and no meta strings joined with middle dots.**

   Density is `mobile/STYLE.md`'s, not the desk's: a 44pt floor on anything
   tappable, 52pt for a primary action, and reading at 17 on 1.62.
   ────────────────────────────────────────────────────────────────────────── */
.p-dev{position:relative;border-radius:40px;background:#0A0A0C;padding:9px;
  box-shadow:var(--d-device);flex:none}
:root[data-theme="dark"] .p-dev{background:#2A2C31}
.p-dev[data-kind="android"]{border-radius:30px;padding:7px}
.p-dev[data-kind="front"]{border-radius:30px;padding:8px}
.p-screen{position:relative;overflow:hidden;border-radius:32px;background:var(--p-ground);
  color:var(--p-text);font-family:var(--d-font);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;font-feature-settings:"cv05" 1}
.p-dev[data-kind="android"] .p-screen{border-radius:24px}
.p-dev[data-kind="front"] .p-screen{border-radius:23px}
.p-hinge{position:absolute;top:9px;bottom:9px;width:2px;background:rgb(255 255 255 / .07);
  left:50%;margin-left:-1px;pointer-events:none;z-index:40;border-radius:2px}

/* The system's own bars. Translucent, content scrolls under. */
.p-status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 7px;font-size:14px;font-weight:600;color:var(--p-bone);
  letter-spacing:-.01em;z-index:30;position:relative}
.p-status[data-kind="android"]{height:30px;padding:0 15px 4px;font-size:12px;font-weight:500}
.p-status[data-kind="front"]{height:44px;padding:0 20px 6px;font-size:13px}
.p-glyphs{display:flex;gap:5px;align-items:center;opacity:.85}
.p-notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:30px;
  border-radius:99px;background:#0A0A0C;z-index:35}
.p-notch[data-kind="android"]{width:11px;height:11px;border-radius:99px;top:9px;left:auto;right:15px;transform:none}
.p-notch[data-kind="front"]{width:76px;height:23px;top:8px}

.p-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.p-panes{flex:1;min-height:0;display:flex;position:relative}

/* The tab bar. The system owns it; it takes the system's material. */
.p-tabs{flex:none;display:flex;background:var(--p-sys-bar);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);padding-top:8px;z-index:30}
.p-tabs[data-kind="android"]{padding-top:10px;background:var(--p-panel);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.p-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--p-mute);padding-bottom:4px}
.p-tab[aria-selected="true"]{color:var(--p-bone)}
.p-tablab{font-size:10.5px;font-weight:530;letter-spacing:.004em}
.p-tabs[data-kind="android"] .p-tablab{font-size:12px}
.p-pillbg{width:60px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:99px}
.p-tabs[data-kind="android"] .p-tab[aria-selected="true"] .p-pillbg{background:var(--p-overlay)}
.p-home{flex:none;height:34px;display:flex;align-items:center;justify-content:center;
  background:var(--p-sys-bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:30}
.p-home[data-kind="android"]{height:24px;background:var(--p-panel);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.p-homebar{width:140px;height:5px;border-radius:99px;background:var(--p-bone);opacity:.28}
.p-home[data-kind="android"] .p-homebar{width:112px;height:3px}

/* The trailing tab rail. On the Duo's inner display the system lifts the tab
   bar out of the bottom and lays it down the trailing edge — `(tabs)/_layout`
   says so, and it is why that file uses `NativeTabs` rather than `Tabs`. */
.p-rail{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:18px 0;background:var(--p-sys-bar);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);z-index:30}
.p-railitem{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 0;color:var(--p-mute);border-radius:14px}
.p-railitem[aria-selected="true"]{color:var(--p-bone)}
.p-raillab{font-size:10.5px;font-weight:530}

.p-scroll{flex:1;min-height:0;overflow:hidden;position:relative}
.p-col{width:100%;max-width:640px;margin:0 auto}
.p-read{width:100%;max-width:560px;margin:0 auto}

/* ── Type ──────────────────────────────────────────────────────────────────
   The scale is `tokens.generated.ts`. Tracking is size-specific: large text
   wants it negative, small text a touch positive.
   ──────────────────────────────────────────────────────────────────────── */
.p-lede{font-size:32px;line-height:1.1;letter-spacing:-.028em;font-weight:560;color:var(--p-bone)}
.p-display{font-size:28px;line-height:1.18;letter-spacing:-.024em;font-weight:560;color:var(--p-bone)}
.p-title{font-size:18px;line-height:1.35;letter-spacing:-.012em;font-weight:560;color:var(--p-bone)}
.p-readtx{font-size:17px;line-height:1.62;color:var(--p-text);letter-spacing:-.003em}
.p-ui{font-size:15px;line-height:1.5;color:var(--p-text)}
.p-meta{font-size:13px;line-height:1.45;color:var(--p-dim)}
.p-micro{font-size:12.5px;line-height:1.45;color:var(--p-mute);letter-spacing:.004em}
.p-mono{font-family:var(--d-mono);font-size:13px;letter-spacing:-.016em;color:var(--p-dim)}
.p-sec{font-size:13.5px;color:var(--p-dim);font-weight:500;letter-spacing:-.002em}
.p-ink{color:var(--p-bone)}
.p-dimtx{color:var(--p-dim)}
.p-mutetx{color:var(--p-mute)}

/* ── Headers. No rule under them; space does the work. ───────────────────── */
.p-head{flex:none;display:flex;align-items:center;gap:2px;padding:2px 8px 4px;position:relative;z-index:20}
.p-hgrow{min-width:0;flex:1;padding:0 4px}
.p-tap{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:99px;color:var(--p-dim);flex:none}
.p-tap:active{opacity:.45}
.p-tap[aria-pressed="true"]{background:var(--p-raise);color:var(--p-bone)}
.p-who{display:flex;align-items:center;gap:9px;height:44px;padding:0 6px;border-radius:12px}
.p-who:active{opacity:.45}
.p-mono-sq{width:26px;height:26px;border-radius:7px;background:var(--p-raise);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--p-dim);flex:none}
.p-mono-sq[data-big="1"]{width:38px;height:38px;border-radius:10px;font-size:16px}
.p-mono-sq[data-dark="1"]{border:1px dashed var(--p-settling);color:var(--p-mute);background:none}

/* ── The signals ───────────────────────────────────────────────────────────
   An ember dot is an agent waiting on you. Three grey dots is work
   happening — the only thing that moves at rest. Everything else gets
   nothing at all, which is most rows.
   ──────────────────────────────────────────────────────────────────────── */
.p-dot{width:8px;height:8px;border-radius:99px;background:var(--p-ember);flex:none;
  animation:p-pulse 3.4s cubic-bezier(.16,1,.3,1) infinite}
@keyframes p-pulse{0%,100%{box-shadow:0 0 0 0 rgb(255 94 26 / .38)}50%{box-shadow:0 0 0 5px rgb(255 94 26 / 0)}}
.p-dots{display:inline-flex;gap:3.5px;align-items:center;flex:none}
.p-dots i{width:3.5px;height:3.5px;border-radius:99px;background:var(--p-mute);
  animation:p-type 1.4s ease-in-out infinite}
.p-dots i:nth-child(2){animation-delay:180ms}
.p-dots i:nth-child(3){animation-delay:360ms}
@keyframes p-type{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .p-dot{animation:none}
  .p-dots i{animation:none;opacity:.55}
}

/* ── The inbox ─────────────────────────────────────────────────────────── */
.p-item{display:block;width:100%;padding:0 20px;margin-bottom:34px;text-align:left}
.p-item:active{opacity:.5}
.p-itemtop{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.p-itemname{font-size:18px;line-height:1.3;letter-spacing:-.012em;font-weight:560;color:var(--p-bone);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-when{font-size:13px;color:var(--p-mute);flex:none;font-variant-numeric:tabular-nums}
/* `display:block`, not an inline span: padding-left on an inline box lands
   on the first line only, which indents the opening line and leaves the rest
   under the dot. The question has to align with the name on every line. */
.p-itemsay{display:block;font-size:17px;line-height:1.62;color:var(--p-text);
  letter-spacing:-.003em;padding-left:19px}
.p-quiet{display:flex;align-items:center;gap:11px;width:100%;min-height:50px;padding:0 20px;text-align:left}
.p-quiet:active{opacity:.5}
.p-quietname{font-size:18px;line-height:1.3;letter-spacing:-.012em;color:var(--p-bone);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-quiet[data-soft="1"] .p-quietname{color:var(--p-dim)}
.p-grow{flex:1}
.p-sechead{padding:18px 20px 8px}
.p-switch{margin:2px 20px 28px;display:flex;align-items:center;gap:14px;background:var(--p-raise);
  border-radius:22px;padding:11px 11px 11px 18px;font-size:15px;line-height:1.4;
  color:var(--p-dim);text-align:left}
.p-switch:active{opacity:.6}
.p-switchgo{background:var(--p-ground);border-radius:99px;padding:8px 15px;font-size:15px;
  font-weight:530;color:var(--p-bone);box-shadow:var(--p-raise-shadow);display:flex;align-items:center;gap:4px}

/* ── The transcript ────────────────────────────────────────────────────── */
.p-tr{padding:6px 20px 10px}
.p-you{max-width:86%;background:var(--p-raise);border-radius:18px;padding:12px 16px;
  margin:0 0 22px auto;font-size:17px;line-height:1.55;color:var(--p-bone);width:fit-content}
.p-agent{font-size:17px;line-height:1.62;color:var(--p-text);margin-bottom:20px;letter-spacing:-.003em}
.p-agent b{color:var(--p-bone);font-weight:560}
.p-agent code{font-family:var(--d-mono);font-size:15px;letter-spacing:-.018em;color:var(--p-bone)}
.p-work{margin:0 0 20px;display:flex;flex-direction:column;gap:7px}
.p-step{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--p-mute);min-height:22px}
.p-step em{font-style:normal;font-family:var(--d-mono);font-size:13px;letter-spacing:-.016em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-fold{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--p-mute);min-height:30px}
.p-sub{box-shadow:inset 1px 0 0 var(--p-line);padding-left:15px;margin-left:4px;
  display:flex;flex-direction:column;gap:7px}
.p-think{font-size:13.5px;color:var(--p-mute);margin-bottom:20px}
.p-artcard{display:block;width:100%;text-align:left;border-radius:14px;overflow:hidden;
  background:var(--p-raise);margin:0 0 20px}
.p-artcard:active{opacity:.7}
.p-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:99px;
  background:var(--p-raise);font-size:15px;color:var(--p-dim)}

/* ── The approval: the one loud surface in the app ─────────────────────── */
.p-askcard{background:var(--p-ember-tint);border-radius:20px;margin:0 12px 10px;
  padding:18px 20px 20px;display:flex;flex-direction:column;gap:13px}
.p-asklab{font-size:14px;color:var(--p-ember-ink);font-weight:530;letter-spacing:-.004em}
.p-askq{font-size:19px;line-height:1.38;font-weight:560;color:var(--p-bone);letter-spacing:-.016em}
.p-askcode{font-family:var(--d-mono);font-size:13px;line-height:1.55;color:var(--p-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-askrow{display:flex;gap:12px;margin-top:3px}
.p-askno{flex:1;height:48px;background:var(--p-ground);border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:530;color:var(--p-text)}
.p-askyes{flex:1;height:48px;background:var(--p-bone);border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--p-ground)}
.p-askno:active,.p-askyes:active{opacity:.6}

/* ── The composer: a pill at rest, a card to write in ──────────────────── */
/* A scroll edge rather than a hard divider, which is what a translucent
   floating object wants where it overlaps content. */
.p-comp{flex:none;padding-bottom:10px;position:relative}
.p-comp::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;
  background:linear-gradient(to top,var(--p-ground),transparent);pointer-events:none}
.p-box{background:var(--p-ground);border-radius:26px;margin:0 26px;padding:6px 6px 6px 20px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--p-rest-shadow)}
.p-box[data-open="1"]{margin:0 12px;border-radius:22px;padding:16px 12px 10px;
  flex-direction:column;align-items:stretch;gap:12px;box-shadow:var(--p-float-shadow)}
.p-ph{flex:1;font-size:17px;color:var(--p-mute);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.003em}
.p-typed{font-size:17px;line-height:26px;color:var(--p-bone);padding:0 6px;letter-spacing:-.003em}
.p-ctl{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;
  justify-content:center;flex:none;color:var(--p-mute)}
.p-ctl[data-rest="1"]{width:38px;height:38px}
.p-ctl:active{opacity:.5}
.p-send{width:40px;height:40px;border-radius:99px;background:var(--p-bone);color:var(--p-ground);
  display:flex;align-items:center;justify-content:center;flex:none}
.p-send:active{opacity:.75}
.p-ctlrow{display:flex;align-items:center;gap:6px}
/* The strip scrolls, so it fades rather than ending on a razor: a chip cut
   to a two-pixel sliver reads as a rendering fault, and a chip fading out
   reads as more of them. */
.p-picks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden;
  mask-image:linear-gradient(to right,#000 76%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 76%,transparent)}
.p-pick{display:flex;align-items:center;gap:7px;height:34px;padding:0 5px;font-size:14.5px;
  color:var(--p-dim);white-space:nowrap;flex:none}
.p-meter{height:2px;border-radius:2px;background:var(--p-line);overflow:hidden;margin:0 18px 8px}
.p-meterfill{height:100%;background:var(--p-settling);border-radius:2px}

/* The shelf: the decisions that are unmade until you start. It sits on the
   page above the composer card, which is where the desk puts it, and it
   scrolls — three chips do not fit 390 and which three is the server's
   business. There is no shelf inside a workspace: those choices are settled
   there, and furniture repeating them implies they are still open. */
.p-shelf{display:flex;gap:8px;padding:0 14px 10px;overflow:hidden;
  mask-image:linear-gradient(to right,#000 92%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 92%,transparent)}
.p-chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;
  background:var(--p-raise);font-size:15px;color:var(--p-text);white-space:nowrap;flex:none}
.p-chip:active{opacity:.6}
.p-chip[data-want="1"]{color:var(--p-dim);background:none;box-shadow:inset 0 0 0 1px var(--p-line)}
.p-plate{width:58px;height:58px;border-radius:18px;background:var(--p-raise);display:flex;
  align-items:center;justify-content:center;color:var(--p-mute)}

/* Where the workspace's own facts live: under the header, quiet, no bar. */
.p-facts{flex:none;display:flex;align-items:center;gap:15px;padding:0 20px 16px;
  font-size:13.5px;color:var(--p-mute);min-height:34px}
.p-facts b{color:var(--p-dim);font-weight:500}

/* ── Sheets, menus, scrims ─────────────────────────────────────────────── */
.p-scrim{position:absolute;inset:0;background:var(--p-scrim);z-index:45}
.p-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--p-ground);
  border-radius:22px 22px 0 0;z-index:46;box-shadow:var(--p-float-shadow);
  padding-bottom:14px;max-height:84%;display:flex;flex-direction:column}
.p-grab{width:38px;height:5px;border-radius:99px;background:var(--p-settling);
  margin:9px auto 2px;flex:none}
.p-sheethead{padding:12px 22px 14px;flex:none}
.p-menuitem{display:flex;align-items:center;gap:15px;min-height:52px;padding:0 22px;
  font-size:17px;color:var(--p-text)}
.p-menuitem:active{background:var(--p-raise)}
.p-menuitem[data-danger="1"]{color:var(--p-brick)}
.p-menurule{height:1px;background:var(--p-line-soft);margin:8px 0}
.p-pop{position:absolute;z-index:46;background:var(--p-ground);border-radius:20px;
  box-shadow:var(--p-float-shadow);padding:8px;min-width:234px;
  transform-origin:bottom left;animation:p-grow 170ms var(--swift)}
@keyframes p-grow{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.p-pop{animation:none}}
.p-popitem{display:flex;align-items:flex-start;gap:14px;min-height:50px;padding:10px 14px;
  border-radius:13px;color:var(--p-text);font-size:17px;width:100%}
.p-popitem:active{background:var(--p-raise)}
.p-popnote{font-size:13px;color:var(--p-mute);line-height:1.35;margin-top:2px;display:block}

/* ── Columns at 951, panels at 669 ─────────────────────────────────────── */
.p-side{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--p-ground);
  box-shadow:inset 1px 0 0 var(--p-line-soft)}
.p-float{position:absolute;top:0;bottom:0;right:0;z-index:46;background:var(--p-ground);
  box-shadow:-10px 0 42px -14px rgb(0 0 0 / .3);display:flex;flex-direction:column;min-height:0}

/* ── The overview ──────────────────────────────────────────────────────── */
.p-member{display:flex;align-items:center;gap:11px;padding:11px 20px;min-height:48px}
.p-member[data-on="1"]{background:var(--p-raise)}
.p-planstep{display:flex;align-items:flex-start;gap:12px;padding:7px 20px;font-size:16px;
  color:var(--p-text);line-height:1.45}
.p-planbox{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--p-settling);
  flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center}
.p-planbox[data-s="done"]{background:var(--p-settling)}
.p-planbox[data-s="doing"]{box-shadow:inset 0 0 0 1.5px var(--p-bone)}
.p-planstep[data-s="done"]{color:var(--p-mute)}

/* ── Diff, files, ship ─────────────────────────────────────────────────── */
.p-texttabs{display:flex;gap:24px;padding:0 20px 16px}
.p-texttab{font-size:17px;color:var(--p-mute);padding-bottom:8px;letter-spacing:-.008em;
  box-shadow:inset 0 -2px 0 transparent}
.p-texttab[aria-selected="true"]{color:var(--p-bone);font-weight:530;box-shadow:inset 0 -2px 0 var(--p-bone)}
.p-difffile{display:flex;align-items:center;gap:12px;padding:13px 20px;min-height:48px}
.p-diffline{display:flex;font-family:var(--d-mono);font-size:15px;line-height:22px;letter-spacing:-.018em}
.p-gutter{width:46px;flex:none;text-align:right;padding-right:11px;color:var(--p-mute);font-size:12.5px}
.p-src{padding-left:12px;white-space:pre;overflow:hidden;color:var(--p-text);flex:1}
.p-diffline[data-d="+"]{background:var(--p-sage-tint)}
.p-diffline[data-d="+"] .p-gutter{color:var(--p-sage)}
.p-diffline[data-d="-"]{background:var(--p-brick-tint)}
.p-diffline[data-d="-"] .p-gutter{color:var(--p-brick)}
.p-tree{display:flex;align-items:center;gap:11px;min-height:46px;padding:0 20px;
  font-size:16px;color:var(--p-text)}
.p-primary{height:52px;border-radius:15px;background:var(--p-bone);color:var(--p-ground);
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;
  margin:0 20px}
.p-primary:active{opacity:.75}
.p-second{height:52px;border-radius:15px;background:var(--p-raise);color:var(--p-text);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:530;margin:0 20px}
.p-field{background:var(--p-raise);border-radius:14px;padding:14px 16px;font-size:17px;
  color:var(--p-bone);min-height:52px;display:flex;align-items:center;letter-spacing:-.003em}
.p-field:active{opacity:.7}
.p-fieldlab{display:flex;align-items:baseline;gap:9px;padding:0 2px 7px}
.p-stab{display:flex;align-items:center;gap:8px;height:42px;padding:0 13px;font-size:14px;
  color:var(--p-mute);white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.p-stab[aria-selected="true"]{color:var(--p-bone);box-shadow:inset 0 -2px 0 var(--p-bone)}
.p-stab[data-preview="1"]{font-style:italic}

/* Cards and posters. A grid of pictures is the one place a card is right.
   The tile needs an edge, because a poster of a page that is itself white
   has no boundary against a white ground. */
.p-card{border-radius:14px;overflow:hidden;background:var(--p-ground);display:block;
  text-align:left;outline:1px solid var(--p-line);outline-offset:-1px}
.p-card:active{opacity:.7}
.p-poster{aspect-ratio:16/10;background:var(--p-raise);display:flex;align-items:center;
  justify-content:center;color:var(--p-mute);width:100%}
.p-grid{display:grid;gap:16px;padding:0 20px}
.p-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:76px 38px;text-align:center}

/* Connecting. Two steps, said once at the top rather than numbered on every
   screen — the content already says which one you are on. */
.p-steps{display:flex;align-items:center;gap:6px;margin-bottom:26px}
.p-steps i{width:22px;height:3px;border-radius:2px;background:var(--p-line)}
.p-steps i[data-on="1"]{background:var(--p-settling)}
.p-steps span{font-size:13px;color:var(--p-mute);margin-left:5px}
.p-found{display:flex;align-items:center;gap:13px;background:var(--p-raise);border-radius:14px;
  padding:13px 10px 13px 14px;font-size:15px;color:var(--p-dim)}
.p-found > span{min-width:0}
.p-found .p-micro{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-bad{background:var(--p-brick-tint);border-radius:14px;padding:14px 16px;margin-top:22px;
  font-size:15px;line-height:1.55;color:var(--p-text)}
.p-bad b{display:block;color:var(--p-brick);font-weight:560;margin-bottom:4px}

.p-sheen{display:inline-flex}
.p-sheen span{color:var(--p-mute);animation:p-sheen 1.6s linear infinite;white-space:pre}
@keyframes p-sheen{0%,100%{color:var(--p-mute)}44%{color:var(--p-bone)}}
@media (prefers-reduced-motion:reduce){.p-sheen span{animation:none;color:var(--p-dim)}}

/* ── The three surfaces a window does not have ─────────────────────────── */
.p-lock{background:linear-gradient(168deg,#1d2432,#0e1219 58%,#16131b);height:100%;
  display:flex;flex-direction:column;align-items:center;padding-top:76px;gap:30px}
.p-locktime{font-size:80px;font-weight:560;color:#fff;letter-spacing:-.035em;line-height:1}
.p-lockdate{font-size:17px;color:rgb(255 255 255 / .76);margin-top:-20px}
.p-push{width:88%;border-radius:20px;background:rgb(255 255 255 / .16);
  backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  padding:15px 17px;display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 10px 30px -12px rgb(0 0 0 / .5)}
.p-pushapp{width:38px;height:38px;border-radius:10px;background:#15161A;display:flex;
  align-items:center;justify-content:center;flex:none}
.p-pushtitle{font-size:15.5px;font-weight:600;color:#fff;letter-spacing:-.008em}
.p-pushbody{font-size:15.5px;color:rgb(255 255 255 / .88);line-height:1.4;margin-top:2px}
.p-pushwhen{font-size:12.5px;color:rgb(255 255 255 / .58);flex:none}
.p-springboard{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 16px;padding:44px 24px}
.p-icon{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.p-iconart{width:62px;height:62px;border-radius:15px;background:#15161A;display:flex;
  align-items:center;justify-content:center;position:relative}
.p-badge{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:99px;
  background:var(--p-ember);color:#fff;font-size:13px;font-weight:600;display:flex;
  align-items:center;justify-content:center;padding:0 6px;border:2px solid #0A0A0C}
.p-iconlab{font-size:11px;color:rgb(255 255 255 / .9)}

/* The peek: the phone's answer to a hover preview. */
.p-peek{position:absolute;z-index:47;left:16px;right:16px;border-radius:22px;
  background:var(--p-ground);box-shadow:0 30px 70px -20px rgb(0 0 0 / .5);
  overflow:hidden;animation:p-peekin 220ms var(--swift)}
@keyframes p-peekin{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.p-peek{animation:none}}
.p-peekbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:13px}
.p-wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.p-wavebar{width:3px;border-radius:2px;background:var(--p-settling)}
</style>
</head>

      <b>Notes</b>. Light is the design; dark follows from it, and on a phone the system decides
      which you get.</p>

const COLUMN = 640;   // rows, lists, controls — things you scan

  innerp:  { id:"innerp",  w:669, h:951, kind:"ios",     regular:true, hinge:true,
             name:"Duo · inner, portrait", sub:"669 × 951 pt" },
  innerl:  { id:"innerl",  w:951, h:669, kind:"ios",     regular:true, hinge:true,

/* How much of the window the app is actually laid out in.
   `(tabs)/_layout.tsx` uses `NativeTabs` precisely so the system can lift the
   tab bar out of the bottom and lay it down the trailing edge on the Duo's
   inner display. A sidebar-shaped tab bar *insets* its content, so the view
   the conversation lives in is narrower than the window by the rail. That is
   the default here; the toggle on the Duo tab turns it off so you can see
   what the thresholds assume. Spec says why this has to be checked on a
   device before anybody builds against it. */
const railOn = p => !!p.regular;
function contentW(p) { return railOn(p) && S.inset ? p.w - RAIL : p.w; }

/**
 * push under 600 · float 600–820 · dock 820 and over — and the two thresholds
 * are not asking the same question, which is why putting both of them on one
 * number is what makes 820 wrong.
 *
 * **Whether a panel is worth offering at all** is a question about the
 * *device*: a phone has no room for one at any width, and the front panel is
 * a phone. That is the window, and 600 is the right number for it.
 *
 * **Whether a panel may dock** is a question about the *box the conversation
 * is laid out in*: it may only dock if the conversation keeps `READING` and
 * the column clears `DOCK_MIN`. That is 840 of laid-out width — a window of
 * 914 once the system's trailing tab rail is taken off it.
 *
 * Conflating them puts the dock line at 820, where docking leaves the
 * conversation 466: the front panel's width, on the inner display. And
 * putting *both* on the laid-out width flips 669 into `push` by five points,
 * which contradicts the rule the whole band exists to serve.
 */
function band(p) {
  const w = typeof p === "number" ? p : p.w;
  const cw = typeof p === "number" ? p : contentW(p);
  if (w < 600) return "push";
  return cw >= READING + DOCK_MIN ? "dock" : "float";
}

/* What a docked column may take: whatever is left once the conversation has
   its measure, and never less than a panel's worth. `[id].tsx` currently
   writes `Math.min(340, Math.max(280, width - 400))`, which is the same idea
   with 400 standing in for READING and no floor test — so it returns 280 at
   widths where 280 does not fit. */

  const left = cw - READING;

            ["Nothing","One other","Two others","Three others","Four others","Five others"][rest.length]+

/** `from` lets a device show the part of the turn a tab is about. */
function transcript(from) {
  let out = "";
  TURNS.slice(from || 0).forEach(t => {
    if (t.k === "you") out += '<div class="p-you">'+esc(t.text)+'</div>';
    else if (t.k === "agent") out += '<div class="p-agent">'+t.html+'</div>';
    else if (t.k === "think")
      out += '<div class="p-think">'+esc(t.text)+'</div>';
    else if (t.k === "work") {
      out += '<div class="p-work">'+
        (t.fold ? '<button class="p-fold" data-go="noop">'+ic("right",13)+esc(t.fold)+
          (t.where ? ' <span class="p-micro">'+esc(t.where)+'</span>' : "")+'</button>' : "")+
        t.steps.map(s => '<span class="p-step">'+ic("file",12)+'<em>'+esc(s.a)+'</em>'+
          (s.d ? '<span class="p-micro" style="color:var(--p-sage)">'+esc(s.d)+'</span>' : "")+'</span>').join("")+
      '</div>';
    } else if (t.k === "artifact") {
      /* A poster in the turn, not a running copy. The live bytes are mounted
         in exactly one place and this is not it. */
      out += '<button class="p-artcard" data-go="goto:artifact">'+
        '<span class="p-poster" style="border-radius:12px 12px 0 0">'+poster()+'</span>'+
        '<span style="display:flex;align-items:center;gap:10px;padding:11px 14px">'+
          '<span style="color:var(--p-mute);display:flex">'+ic("shapes",16)+'</span>'+
          '<span class="p-ui p-ink" style="flex:1;font-weight:530">'+esc(t.title)+'</span>'+
          '<span class="p-when">v'+t.v+'</span>'+
          '<span style="color:var(--p-mute);display:flex">'+ic("right",15)+'</span></span>'+
      '</button>';
    } else if (t.k === "task") {
      out += '<div class="p-work">'+
        '<span class="p-step">'+agentMark(t.agent,12,"var(--p-mute)")+
          '<span style="color:var(--p-text)">'+esc(t.title)+'</span>'+
          ic("check",12,"var(--p-sage)")+'</span>'+
        '<div class="p-sub">'+t.steps.map(s =>
          '<span class="p-step">'+ic("search",12)+'<em>'+esc(s.a)+'</em></span>').join("")+
          '<span class="p-step" style="color:var(--p-text)">'+esc(t.back)+'</span>'+
        '</div></div>';
    }
  });
  return out;
}

function composer(st) {
  const m = st.comp;

      '<span class="p-pill">'+ic("eye",15)+'You are watching this work.</span></div>';
  }
  const open = m === "open" || m === "dictate";
  const atWork = m === "working";
  if (m === "dictate") {
    return '<div class="p-comp"><div class="p-box" data-open="1">'+
      '<div class="p-typed">The amber band should stay neutral until</div>'+
      '<div class="p-ctlrow">'+
        '<span class="p-wave" aria-label="Hearing you">'+
          [3,6,11,18,22,14,9,17,24,20,12,7,15,21,13,8,5,10,16,9,4,3,7,13,19].map((h,i) =>
            '<i class="p-wavebar" style="height:'+h+'px;opacity:'+(0.3+i/40).toFixed(2)+'"></i>').join("")+
        '</span>'+
        '<button class="p-ctl" data-go="comp:open" aria-label="Stop dictating">'+ic("x",20)+'</button>'+
      '</div></div></div>';
  }
  const pickers = open
    ? '<button class="p-pick" data-go="noop">'+agentMark("ClaudeCode",14,"var(--p-mute)")+

      '<button class="p-pick" data-go="noop">Medium'+ic("down",13)+'</button>'
    : "";
  const send = atWork
    ? '<button class="p-send" data-go="comp:rest" aria-label="Stop">'+ic("stop",14)+'</button>'
    : open
      ? '<button class="p-send" data-go="comp:rest" aria-label="Send">'+ic("arrowup",20)+'</button>'
      : '<button class="p-ctl" data-rest="1" data-go="comp:dictate" aria-label="Dictate">'+ic("mic",19)+'</button>';
  return '<div class="p-comp">'+
    (open ? '<div class="p-meter"><i class="p-meterfill" style="width:64%"></i></div>' : "")+
    '<div class="p-box"'+(open?' data-open="1"':'')+'>'+
      (open
        ? '<div class="p-typed">Stay neutral. A plan with no soft limit has nothing to be 80% of.</div>'+
          '<div class="p-ctlrow">'+
            '<button class="p-ctl" data-go="menu:attach" aria-label="Attach">'+ic("clip",19)+'</button>'+
            /* The picker strip scrolls. Four of them do not fit beside a
               paperclip, a microphone and a send button, and which pickers

            '<button class="p-ctl" data-go="comp:dictate" aria-label="Dictate">'+ic("mic",19)+'</button>'+send+

          '<button class="p-ph" data-go="comp:open">'+(atWork?"Say something while it works\u2026":"Reply to Claude Code\u2026")+'</button>'+send)+
    '</div></div>';
}

function sideColumn(w) {

  return '<div class="p-side" style="width:'+w+'px">'+
    /* This workspace first. The conversation is about this work; the list of
       other workspaces is the thing you left to get here, and ordering is

    '<div class="p-texttabs" style="padding:14px 20px 12px">'+
      [["overview","This workspace"],["inbox","Inbox"]].map(([id,lab]) =>

        'data-go="side:'+id+'">'+lab+'</button>').join("")+'</div>'+

      ? PLACES.map(x => '<button class="p-quiet"'+(x.id==="w1"?' data-on="1" style="background:var(--p-raise)"':

          (isBlocked(x) ? '<i class="p-dot"></i>' : "")+

      : overviewBody())+'</div></div>';
}

/* ── The screen ───────────────────────────────────────────────────────────── */
function workspaceScreen(p, st) {
  const cw = contentW(p);
  const b = band(p);
  const pw = panelW(cw);
  /**
   * Open on arrival where it costs the conversation nothing it needs, and
   * not where it costs it all of it.
   *
   * `st.rail` is `null` until somebody presses the control, and then it is
   * their answer. Docked defaults open because the conversation still clears
   * its measure beside it; floated defaults closed because a floated panel
   * covers the thing you came to read. Arriving at a *width* changes
   * neither — see <b>Moving</b>.
   */
  const open = st.rail === null ? b === "dock" : st.rail;
  const beside = b === "dock" && pw > 0 && open;
  const floating = b === "float" && open;
  const convo = beside ? cw - pw : cw;

  const header =
    '<div class="p-head">'+
      '<button class="p-tap" data-go="goto:inbox" aria-label="Back">'+ic("left",23)+'</button>'+
      '<div class="p-hgrow">'+
        '<div class="p-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          'Quota meter rounding</div>'+
      '</div>'+
      '<button class="p-tap" data-go="rail" aria-pressed="'+(open && b!=="push")+'" '+
        'aria-label="Show this workspace">'+ic("panel",20)+'</button>'+
      '<button class="p-tap" data-go="menu:ws" aria-label="More">'+ic("dots",21)+'</button>'+
    '</div>';

  /* What the workspace *is*, under the header rather than over the composer:
     it is a fact about the workspace, not about the message being written.
     Quiet, no bar, no border — it is the way into the repository and nothing
     more. Real layout rather than a string joined with middle dots. */
  const strip =
    '<button class="p-facts" data-go="goto:repo" style="width:100%">'+
      agentMark("ClaudeCode", 14, "var(--p-mute)")+
      '<span>Claude Code</span>'+
      '<span class="p-grow"></span>'+
      '<span><b>4</b> files changed</span>'+
      ic("right",14)+
    '</button>';

  const stream =
    '<div class="p-scroll"><div class="p-read" style="max-width:'+READING+'px">'+
      '<div class="p-tr" style="padding-bottom:'+(st.comp==="open"||st.comp==="dictate"?74:22)+'px">'+
        transcript(st.from)+
        (st.comp === "working"
          ? '<div style="margin-top:4px">'+sheen("Working")+'</div>' : "")+
      '</div></div></div>';

  const column =
    '<div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">'+
      stream+
      (st.comp === "ask" ? approval() : "")+
      composer(st)+
    '</div>';

  const body =
    header+strip+
    '<div class="p-panes">'+column+(beside ? sideColumn(pw) : "")+
      (floating ? '<button class="p-scrim" data-go="rail" aria-label="Dismiss"></button>'+
        '<div class="p-float" style="width:'+Math.min(340, cw-80)+'px">'+
        '<div class="p-scroll">'+overviewBody()+'</div></div>' : "")+
    '</div>';

  return { body, convo, beside, floating, pw, b };
}

/**
 * The library.
 *
 * Every tile is a **poster**, never a live frame. An artifact is untrusted
 * HTML; a grid of six as frames would be six page loads, six runtimes and
 * six sets of timers behind a grid nobody is looking at. A poster is
 * rendered once per version and cacheable forever, because a version's bytes
 * cannot change.
 *
 * **No poster yet is an ordinary state**, not an error. A version is
 * published before anything has photographed it, and a fresh library hits
 * that on every tile at once — so the plate is drawn properly rather than
 * left to a broken-image glyph. The same plate covers a poster that 404s,
 * because the two are the same thing to look at.
 *
 * A grid is a considered exception to the house rule about cards: there is
 * no hierarchy here to flatten, one kind of object, and what identifies each
 * one is a picture. Two columns at 390; three once there is room, because a
 * grid reflows and a column does not.

/**
 * Connecting this phone to a Firetower.
 *
 * Two questions asked in order and never at the same time: **where** it is,
 * then **who you are there**. Only the first has an answer that is the same
 * for everybody at a company, and knowing it is what lets the app name
 * *whose* Firetower you are about to hand a password to — `/bootstrap` is
 * unauthenticated and answers with the organisation before anybody types.
 *
 * The copy is the desk's, because this flow exists there and is complete;
 * a second wording of the same six screens is how two clients start
 * disagreeing about what went wrong. Three things are the phone's own:
 * the cleartext notice, the mesh-VPN guidance on a failure, and "this
 * phone" where the desk says "this Mac".
 *
 * There is no *name the organisation* or *set up* step. Those are a
 * server's first boot, which `which-surface.md` gives to the web.
 */
function connectScreen(p, st) {
  const mode = (st && st.connect) || "where";
  const wrap = (step, inner) =>
    '<div class="p-scroll"><div class="p-read" style="padding:0 26px;display:flex;'+
      'flex-direction:column;justify-content:center;height:100%">'+
      '<div class="p-steps">'+[0,1].map(n =>
        '<i'+(n <= step ? ' data-on="1"' : '')+'></i>').join("")+
        '<span>'+(step ? "Who you are" : "Where it is")+'</span></div>'+
      inner+'</div></div>';
  const plate = g => '<span class="p-plate" style="margin-bottom:20px">'+ic(g,24)+'</span>';
  const bad = (head, body) => '<div class="p-bad"><b>'+head+'</b>'+body+'</div>';

  if (mode === "reaching") {
    return wrap(0, plate("globe")+
      '<h1 class="p-lede">Looking for it\u2026</h1>'+
      '<p class="p-readtx p-dimtx" style="margin-top:12px">Trying https, then http. Only the scheme '+
        'that answers is kept.</p>'+
      '<div class="p-found" style="margin-top:24px">'+
        '<span class="p-dots"><i></i><i></i><i></i></span>'+
        '<span><b class="p-ink">ft-e1.tail9c2b.ts.net</b>'+
        '<span class="p-micro" style="display:block">asking what is there</span></span></div>');
  }
  if (mode === "noroute") {
    return wrap(0, plate("slash")+
      '<h1 class="p-lede">Nothing answered there.</h1>'+
      '<p class="p-readtx p-dimtx" style="margin-top:12px">The address reached nothing on https or '+
        'http. A Firetower is never on the public internet, so this phone reaches one over your '+
        'mesh VPN \u2014 connect to that first.</p>'+
      bad("Could not reach ft-e1.tail9c2b.ts.net",

/* ═══════════════════════════════════════════════════════════════════════════
   STATE AND DISPATCH

   One state object. Every control in a phone writes to it and the page
   re-renders — so a state you can reach by tapping is a state that exists,
   and the reachability audit in Spec is a list of which ones you can.
   ═══════════════════════════════════════════════════════════════════════════ */
const S = {
  tab:"poses", pose:"iphone", screen:"inbox", era:"next",
  filter:"all", mode:"ok", comp:"rest", rail:null, side:"overview",
  repo:"diff", tasks:"ok", repos:"list", connect:"where",
  menu:null, peek:null, inset:true, theme:"light", duo:"innerp", morphing:false, scale:1,
  newstate:"blank", art:"library", scaleSet:false,
};
/* Which destination is lit while you are on a given screen. */
const HOME_TAB = { inbox:"inbox", workspace:"inbox", overview:"inbox", repo:"inbox",
  file:"inbox", artifacts:"you", artifact:"you", tasks:"tasks", config:"config",
  repos:"config", you:"you" };
/* A pushed route covers the bottom bar. It does not cover the trailing rail,
   because the rail belongs to the system and the stack pushes inside it —
   which is why on the inner display the destinations stay reachable from
   inside a workspace, and on a phone they do not. */
const PUSHED = new Set(["workspace","overview","repo","file","repos","artifacts","artifact"]);
const MODAL = new Set(["new","connect","lock","home"]);

function renderScreen(name, p) {
  switch (name) {
    case "inbox":     return inboxScreen(p, S);
    case "workspace": return workspaceScreen(p, S).body;
    case "overview":  return pageHead("Quota meter rounding","","goto:workspace")+
                             '<div class="p-scroll">'+overviewBody()+'</div>';
    case "repo":      return repoScreen(p, S);
    case "file":      return fileScreen(p);
    case "tasks":     return tasksScreen(p, S);
    case "new":       return newScreen(p, S);
    case "config":    return configScreen(p);
    case "repos":     return reposScreen(p, S);
    case "you":       return youScreen(p);
    case "artifacts": return artifactsScreen(p, S);
    case "artifact":  return artifactScreen(p);
    case "connect":   return connectScreen(p, S);
    case "lock":      return lockScreen();
    case "home":      return homeScreen();
    default:          return '<div class="p-empty">Nothing here.</div>';
  }
}

/** A device showing the current screen, with whatever overlay is open on it. */
function live(poseId, screen, extra) {
  const p = POSES[poseId];
  const name = screen || S.screen;
  let over = "";
  if (name === S.screen) {
    if (S.menu === "attach") over = attachPop();
    else if (S.menu === "ws") over = workspaceMenu();
    else if (S.menu === "servers") over = serversSheet();
    else if (S.menu === "art") over = artifactMenu();
    if (S.peek) over = peekOver(p, S.peek);
  }
  const bare = name === "lock" || name === "home";
  return plinth(p, renderScreen(name, p), Object.assign({
    tab: HOME_TAB[name] || "inbox",
    noTabs: MODAL.has(name) || bare,
    pushed: PUSHED.has(name),
    bare, over,
  }, extra || {}));
}

/* ═══════════════════════════════════════════════════════════════════════════
   EVENTS. One delegated listener; `data-go` is the whole vocabulary.
   ═══════════════════════════════════════════════════════════════════════════ */
function act(go) {
  const [verb, arg] = go.split(":");
  switch (verb) {
    case "tab": S.screen = arg; S.menu = null; S.peek = null; break;
    case "goto": S.screen = arg; S.menu = null; S.peek = null; break;
    case "open": S.screen = "workspace"; S.comp = "ask"; S.peek = null; S.menu = null; break;
    case "back": S.screen = S.screen === "file" ? "repo" : S.screen === "repo" ? "workspace" : "inbox"; break;
    case "filter": S.filter = arg; break;
    case "repo": S.repo = arg; break;
    case "side": S.side = arg; break;
    case "comp": S.comp = arg; S.menu = null; break;
    case "menu": S.menu = arg || null; break;
    case "peek": S.peek = arg || null; break;
    /* `null` means "whatever the band says". The first press records an
       answer and keeps it across a fold, which is the continuity rule. */
    case "rail": S.rail = !(S.rail === null ? true : S.rail); break;
    case "connect": S.connect = arg; break;
    case "noop": break;
  }
  draw();
}

/* A tile on the index carries the whole state it drew itself in. */
document.addEventListener("click", e => {
  const tile = e.target.closest("[data-sheet]");
  if (!tile) return;
  tile.dataset.sheet.split("&").filter(Boolean).forEach(pair => {
    const [k, v] = pair.split("=");
    S[k] = v === "true" ? true : v === "false" ? false : v === "null" ? null : v;
  });
  window.scrollTo({ top:0 });
  draw();
  e.stopPropagation();
}, true);
/* A div with a role has to answer the keyboard itself. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tile = e.target.closest && e.target.closest("[data-sheet]");
  if (!tile) return;
  e.preventDefault();
  tile.click();
});

document.addEventListener("click", e => {
  if (e.target.closest("[data-sheet]")) return;
  const t = e.target.closest("[data-go],[data-set],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; window.scrollTo({ top:0 }); draw(); return; }
  if (t.dataset.set) {
    const [k, v] = t.dataset.set.split(":");
    S[k] = v === "true" ? true : v === "false" ? false : (k === "scale" ? Number(v) : v);
    if (k === "scale") S.scaleSet = true;
    if (k === "theme") document.documentElement.dataset.theme = v;
    draw(); return;
  }
  act(t.dataset.go);
});
/* Long-press is the peek. A pointer held still for 420ms over a row, which is
   the gesture iOS already spends on a context menu — so the preview and the
   menu are one thing rather than two that fight. */
let holdTimer = null;
document.addEventListener("pointerdown", e => {
  const row = e.target.closest("[data-peek]");
  if (!row) return;
  holdTimer = setTimeout(() => { holdTimer = null; S.peek = row.dataset.peek; draw(); }, 420);
});
["pointerup","pointercancel","pointermove","scroll"].forEach(ev =>
  document.addEventListener(ev, () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }, true));
/* ═══════════════════════════════════════════════════════════════════════════
   THE DOCUMENT'S OWN TABS
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── The ruler ─────────────────────────────────────────────────────────────
   The one bold thing in this document. It is not decoration: every mark on
   it is a number out of `measure.ts`, the surfaces reference, or arithmetic
   this page does on them.
   ──────────────────────────────────────────────────────────────────────── */
const RMIN = 340, RMAX = 1000;
const rx = w => ((w - RMIN) / (RMAX - RMIN) * 100).toFixed(2) + "%";
function ruler() {
  /* Each mark carries the row it sits on, so 390 and 412 do not collide. */
  const marks = [
    [390,"iPhone",0], [412,"Android",1], [466,"Duo · front panel",0],
    [669,"Duo · inner, portrait",0], [951,"Duo · inner, landscape",0],
  ];
  return '<div class="d-ruler">'+
    '<div class="d-rline"></div>'+
    '<div class="d-rband" data-b="push" style="left:0;width:'+rx(600)+'">push — the panel is its own screen</div>'+
    '<div class="d-rband" data-b="float" style="left:'+rx(600)+';width:calc('+rx(914)+' - '+rx(600)+')">float — over the top, nothing taken</div>'+
    '<div class="d-rband" data-b="dock" style="left:'+rx(914)+';right:0">dock</div>'+
    '<i class="d-rtick" data-soft="1" style="left:'+rx(600)+'"></i>'+
    '<span class="d-rlab" style="left:'+rx(600)+';color:var(--d-hush)">600</span>'+
    '<i class="d-rtick" data-soft="1" style="left:'+rx(820)+'"></i>'+
    '<span class="d-rbad" style="left:'+rx(820)+'">820 · documented</span>'+
    '<i class="d-rtick" data-soft="1" style="left:'+rx(914)+'"></i>'+
    '<span class="d-rlab" style="left:'+rx(914)+';top:70px;color:var(--d-good)">914 · measured</span>'+
    marks.map(([w,who,r]) => '<i class="d-rtick" style="left:'+rx(w)+'"></i>'+
      '<span class="d-rwho" style="left:'+rx(w)+';top:'+(r?-15:2)+'px">'+who+'</span>'+
      '<span class="d-rlab" style="left:'+rx(w)+';top:58px">'+w+'</span>').join("")+
  '</div>';
}

/* ── Tab bodies ───────────────────────────────────────────────────────────── */

function tabPoses() {
  const k = poseScale();
  const row = POSE_ORDER.map(id => live(id, "inbox", { scale:k })).join("");
  return '<div class="d-stage"><div class="d-row">'+row+'</div></div>'+
    '<div class="d-cap"><b>Five widths, one app.</b>'+
      '<span>1 CSS pixel = 1 pt, at the scale the chip above says.</span>'+
      '<span><code>COLUMN 640</code> · <code>READING 560</code></span>'+
      '<span>Every name, question, branch and time is invented.</span></div>'+
    '<div class="d-note d-wide" style="max-width:min(1120px,100%)">'+ruler()+'</div>'+
    '<div class="d-note"><h2>The bands are the design, not a breakpoint</h2>'+
      '<p>Three behaviours, and each threshold is the width at which the previous one would start '+
      'stealing from the thing being read. <b>Push</b> under 600: the panel gets its own screen. '+
      '<b>Float</b> from 600: over the top, the conversation keeps its full width underneath, and '+
      'the scrim dismisses it. <b>Dock</b> from 914: beside — and 914 rather than 820 is this '+
      'page\u2019s own arithmetic, below.</p>'+
      '<div class="d-trap"><b>669 is the trap.</b> It is wider than a phone, so it invites a docked '+
      'panel — and docking there leaves the conversation 329, narrower than the 390 phone this design '+
      'came from. (255, once the system\u2019s own tab rail is counted; see <b>The Duo</b>.) The whole '+
      'rule exists to stop that one move.</div>'+
      '<div class="d-keep"><b>951 is the only pose with room for two things</b>, and it gets them: a '+
      '340-point column beside a conversation that still clears its measure. What goes in that column '+
      'is a choice, and the choice is the inbox — see <b>The Duo</b>.</div>'+
            '<p>Two of the ruler’s marks are not device widths. <b>600</b> is the app’s own and it is a '+
      'question about the device — is this a phone. <b>914</b> is the width at which a column can '+
      'dock without taking the conversation below its measure, and it is a question about the box; '+
      'this page computes it rather than quoting it. The <b>820</b> in the documents is that second '+
      'question answered against the window instead, which is about ninety points early. Nothing '+
      'ships between 820 and 914 today, so it is wrong rather than harmful — but it is the number '+
      'somebody will reach for when the next device appears.</p>'+
      '<p>Nothing exists between 466 and 669, which is why the push/float line can sit at 600 '+
      'without ever having been tested by a real screen, and why the float band has to be right '+
      'first time.</p>'+
    '</div>'+
    columnsWhatChanged();
}

  const other = S.era === "next" ? "now" : "next";

      plinth(p, inboxScreen(p, Object.assign({}, S, { era:other })),
        { tab:"inbox", over:"", noBand:true,
          label: other === "now" ? "Now \u2014 a rebuild of what ships" : "Next",
          sub: other === "now" ? "app/(tabs)/index.tsx, redrawn here" : "" })+
      live(p.id, "inbox")+
    '</div></div>'+
    '<div class="d-cap"><b>The same screen, twice.</b>'+
      '<span>The left phone is a rebuild of <code>app/(tabs)/index.tsx</code> as it stands, not a '+
      'screenshot of it.</span><span>'+p.w+' \u00d7 '+p.h+' pt</span></div>'+

    '<div class="d-note"><h2>Count what is on each screen</h2>'+
      '<p>The row on the left carries seven things: a four-quadrant glyph, a name, a timestamp, a '+
      'status word, a branch in monospace, an agent mark, and a chevron. The row on the right '+
      'carries two \u2014 a name and a timestamp \u2014 and the two that are stopped carry a third, '+
      'which is the question. Everything that came off is one tap away in the thing the row opens.</p>'+
      '<div class="d-trap"><b>That is not a tidy-up; it is the whole brief.</b> The repository and '+
      'the branch are the vocabulary of a version-control tool, and the accepted desktop design '+
      'deleted them from every resting surface for exactly that reason. A phone showing '+
      '<code>northwind/api \u00b7 fix/quota-rounding</code> under every item is the app the redesign '+
      'is moving away from, in the place where it is read most often.</div>'+

      '<h3>One accent, counted</h3>'+
      '<p>The left screen spends colour five ways at once: the count in ember, a tint behind every '+
      'blocked row, and a glyph that is ember, slate, sage or brick depending on what it is. Four '+
      'hues in one list is four answers to <i>what matters here</i>, which is the same as none \u2014 '+
      'and the handoff records that the desktop\u2019s own first round put six ember dots on one '+
      'screen and was rejected for it.</p>'+
      '<p>On the right, ember appears twice and means one thing. The three grey dots say work is '+
      'happening and are the only thing on the screen that moves. Everything else is told apart by '+
      '<b>weight</b>: a workspace that is working or that ended badly keeps the ink, one that is '+
      'merely idle gives it up.</p>'+

      '<h3>Ranked, not grouped</h3>'+
      '<p>Grouping by repository scatters the two things that need you through the list and leaves '+
      'the tint to find them. Here they come to the top under the sentence that counts them, and the '+
      'rest sit under a line that says how many they are.</p>'+
      '<div class="d-keep"><b>That line is not the desktop\u2019s.</b> The desktop says \u201cFour '+
      'others are still working\u201d over a list that includes one that failed and one that handed '+
      'back. This says <i>five others, none of them asking</i>, which is true of all five. A line '+
      'that is wrong about a third of its list is the kind of small lie that makes somebody stop '+
      'trusting the screen.</div>'+

      '<h3>The filter is gone</h3>'+
      '<p>A segmented control pinned above the content is chrome taking a tenth of a 390-point screen '+
      'to answer a question the ranking already answers: <i>Waiting</i> is the top of the list. The '+
      'desktop Dashboard has no filter either. <b>Rejected:</b> keeping it, which is what ships \u2014 '+
      'and moving it into the \u22ef menu, which would be a control nobody finds for a question '+
      'nobody has.</p>'+

      '<h3>Long-press is the hover</h3>'+
      '<p>The desktop rail expands a destination\u2019s panel on hover, and the handoff flags that it '+
      'cannot survive the trip. What hover was <i>for</i> can: look at something without committing '+
      'to it. Hold a row and the question lifts out of it with <b>No</b> and <b>Allow</b> under it, '+
      'and the rest of the row\u2019s menu below that \u2014 so clearing three approvals in a queue is '+
      'three holds rather than three round trips. One gesture, not two: iOS already spends '+
      'long-press on a context menu with a preview above it, and this is that.</p>'+
      '<div class="d-flag"><b>Both halves have to be drawn or neither works.</b> A peek that only '+
      'previews is a slower way to open the row. A menu with no preview is the menu that is already '+
      'there. The value is entirely in answering from the list.</div>'+

      '<h3>Three absences, said apart</h3>'+
      '<p>Loading, unreachable and nothing-yet are three different sentences, and the state chips '+
      'above open each of them. The unreachable one says what to do about it rather than what went '+
      'wrong, because a Firetower behind a VPN that is off is the predicted case rather than an '+
      'error.</p>'+

}

function tabWorkspace() {
  const p = POSES[S.pose] || POSES.iphone;
  return '<div class="d-stage"><div class="d-row">'+live(p.id, "workspace")+
    plinth(POSES.iphone, (function(){ const k = S.comp; S.comp = "open";
      const b = workspaceScreen(POSES.iphone, S).body; S.comp = k; return b; })(),
      { tab:"inbox", pushed:true, noBand:true, label:"The composer, open",
        sub:"a card to write in \u00b7 inset 12 \u00b7 radius 20" })+
    '</div></div>'+
    '<div class="d-cap"><b>The screen everything else gets you to.</b>'+
      '<span>Left: the state the chips select. Right: the composer open, always.</span>'+
      '<span>Transcript measure <code>'+READING+'</code></span></div>'+
    '<div class="d-note"><h2>The conversation</h2>'+
      '<p>Four voices, taken from the desk rather than re-derived. <b>The agent speaks onto the '+
      'ground</b> — no bubble, no avatar; its turn is long and it is what you came to read. <b>You get '+
      'a raised card</b>, right-aligned. <b>Tool calls hang off a hairline</b>, so a turn that touched '+
      'fourteen files is one paragraph with work attached. <b>A subagent gets its own rail</b>, one '+
      'level in, with what it came back with at the end of it.</p>'+
      '<h3>The approval is the one loud surface</h3>'+
      '<p>The agent is genuinely stopped while it is up — the tool call is held open on the host — and '+
      'it can sit there for hours. So it gets the ember, the question at lede size, and two 48-point '+
      'buttons far enough apart that neither is hit by accident. This is the one place in Firetower '+
      'where a mis-tap runs a command somebody did not agree to.</p>'+
      '<p>It rides above the composer rather than inside the transcript, so the keyboard carries it: '+
      'the card, the composer and the list’s bottom inset all read the same shared value in the same '+
      'frame.</p>'+
      '<h3>The composer is two shapes</h3>'+
      '<p>A pill at rest, inset 30 from both edges; a card to write in, inset 12, corners from 28 to '+
      '20, controls on a second row. The box <i>steps toward you</i> rather than merely growing, and '+
      'that is one shared value doing three things at once. Three ways out: send, blur, and drag it '+
      'down — and a draft truncated into the pill is still there when you tap it.</p>'+
      '<p><b>The send control is whatever comes next.</b> Empty it is the microphone, because saying '+
      'something is the alternative to typing it rather than a second control competing for the same '+
      'corner. With words in it, send. While the agent works, stop — the same button in the same place.</p>'+
      '<div class="d-keep"><b>The bottom of the screen belongs to the message.</b> What the workspace '+
      '<i>is</i> — its diff, its files, its pull request — is a strip under the header, not over the '+
      'composer. It is a fact about the workspace, not about the message being written.</div>'+
      '<h3>Dictation</h3>'+
      '<p>On device, because Firetower’s whole architecture is that nothing leaves machines you own, '+
      'and a composer that shipped audio to a transcription service to reach an agent running on your '+
      'own hardware would be the one place that stopped being true. The wave is a <b>trail, not a '+
      'meter</b>: the newest sample enters at the right and the history slides left, so a pause leaves '+
      'a visible gap and you can see the shape of what you just said.</p>'+
      '<h3>What a viewer gets</h3>'+
      '<p>No composer, and no greyed-out one either — a line saying what the screen is for. '+
      '<code>maySpeak === false</code>, tested for exactly, because an older control plane sends no '+
      'such field and treating that as read-only would hide the composer from everybody.</p>'+
    '</div>';
}
/* ═══════════════════════════════════════════════════════════════════════════
   THE DUO — three poses, and the arithmetic each one survives or does not
   ═══════════════════════════════════════════════════════════════════════════ */
function duoSums() {
  const rows = ["front","innerp","innerl"].map(id => {
    const p = POSES[id], rail = railOn(p) && S.inset ? RAIL : 0;
    const cw = p.w - rail, b = band(p), pw = panelW(cw);
    const convo = pw > 0 && b === "dock" ? cw - pw : cw;
    const ok = b !== "dock" || pw > 0;
    return { p, rail, cw, b, pw, convo, ok };
  });
  return '<table class="d-tbl"><thead><tr><th>Pose</th><th>Window</th><th>System rail</th>'+
    '<th>Laid out in</th><th>Band</th><th>Column</th><th>Conversation</th><th>Verdict</th></tr></thead><tbody>'+
    rows.map(r => '<tr><td>'+esc(r.p.name)+'</td>'+
      '<td class="d-num">'+r.p.w+'</td>'+
      '<td class="d-num">'+(r.rail ? "−"+r.rail : "—")+'</td>'+
      '<td class="d-num">'+r.cw+'</td>'+
      '<td>'+r.b+'</td>'+
      '<td class="d-num">'+(r.b === "dock" ? (r.pw || "none") : "—")+'</td>'+
      '<td class="d-num">'+r.convo+(r.convo < READING ? ' <span class="d-bad">under '+READING+'</span>' : '')+'</td>'+
      '<td>'+(r.convo >= READING
        ? '<span class="d-ok">clears its measure</span>'
        : r.b === "float"
          ? '<span class="d-ok">floats, so nothing is taken</span>'
          : '<span class="d-bad">squeezed</span>')+'</td></tr>').join("")+
    '</tbody></table>';
}

function tabDuo() {
  const show = S.duo;
  const p = POSES[show];
  const cw = contentW(p);
  /* The wrong answer at 669, drawn so it can be compared rather than argued. */
  const wrong = (function () {
    if (show !== "innerp") return "";
    const fake = { id:"innerp", w:669, h:951, kind:"ios", regular:true, hinge:true,
      name:"669, with the overview docked", sub:"the move the rule forbids" };
    const panel = 340;
    const convo = cw - panel;
    const body =
      '<div class="p-head"><button class="p-tap">'+ic("left",23)+'</button>'+
      '<div class="p-hgrow"><div class="p-title">Quota meter rounding</div></div>'+
      '<button class="p-tap" aria-pressed="true">'+ic("panel",20)+'</button>'+
      '<button class="p-tap">'+ic("dots",21)+'</button></div>'+
      '<div class="p-facts">'+agentMark("ClaudeCode",14,"var(--p-mute)")+'<span>Claude Code</span>'+
        '<span class="p-grow"></span><span><b>4</b> files changed</span>'+ic("right",14)+'</div>'+
      '<div class="p-panes">'+
