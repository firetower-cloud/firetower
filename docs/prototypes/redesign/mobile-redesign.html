      '</div>';
    return '<div class="d-dev">'+device(fake, body, { tab:"inbox", pushed:true })+
      '<div class="d-name" style="color:var(--d-brick)">Docked at 669 — the trap</div>'+
      '<div class="d-sub">conversation '+convo+' pt, against the 390 phone it came from</div></div>';
  })();

  const main = live(show, "workspace");
  return '<div class="d-stage"><div class="d-row">'+main+wrong+'</div></div>'+
    '<div class="d-cap"><b>'+esc(p.name)+'</b><span>window '+p.w+
      (railOn(p) && S.inset ? ' · laid out in '+cw : "")+'</span>'+
      '<span>the overview control is in the header; press it</span></div>'+
    '<div class="d-note"><h2>Three poses, and only one of them is a tablet</h2>'+
      duoSums()+
      '<p style="margin-top:14px">Every number above is computed by this page from the pose’s own '+
      'width as it draws it. Change the <b>system rail</b> toggle and the whole table moves.</p>'+

      '<h3>The 74 points nobody has counted</h3>'+
      '<p><code>app/(tabs)/_layout.tsx</code> uses <code>NativeTabs</code> rather than '+
      '<code>Tabs</code> for one stated reason: on the Duo the system lifts navigation and tab bars '+
      'out of the bottom and lays them vertically down the trailing edge, and it can only move a bar '+
      'it owns. That is the right call and it is drawn here.</p>'+
      '<div class="d-flag"><b>It also changes every threshold.</b> A sidebar-shaped tab bar insets its '+
      'content, so the view the conversation is laid out in is narrower than the window by the rail. '+
      '<code>app/workspace/[id].tsx</code> reads <code>useWindowDimensions()</code> — the <i>window</i> '+
      '— and compares that to 600 and 820. At 669 the conversation is laid out in 595, not 669; at 951 '+
      'it is 877, not 951.</div>'+
      '<p>Two consequences, both arithmetic. First, the documented <b>329 left after docking at 669</b> '+
      'is optimistic: it is 255. Second — and this is the one that matters, because it affects the pose '+
      'the design is <i>supposed</i> to win — at 951 a 340-point column leaves the conversation '+
      '<b>537</b>, which is under <code>READING</code> 560. The pose that exists to hold two things '+
      'holds them 23 points too tightly.</p>'+
      '<p>So the panel width stops being a constant and becomes what is left: '+
      '<code>min(340, laid-out width − 560)</code>, and no panel at all below 280. At 951 that is '+
      '<b>317</b>, and the conversation gets its 560 exactly. <code>[id].tsx</code> currently writes '+
      '<code>Math.min(340, Math.max(280, width − 400))</code>, which is the same idea with 400 '+
      'standing in for <code>READING</code> and no test that 280 actually fits — so it returns 280 at '+
      'widths where 280 does not.</p>'+
      '<div class="d-trap"><b>And the dock threshold is wrong by about ninety points.</b> Docking needs '+
      '560 for the conversation and 280 for the column: 840 of laid-out width, which is a window of '+
      '<b>914</b> once the rail is taken. The documented 820 would dock into 746 and leave the '+
      'conversation 466 — the front panel’s width, on the inner display. No shipped pose is between '+
      '820 and 914, so nothing is broken today; a Duo one inch wider, or a rail one size larger, and '+
      'it would be.</div>'+
      '<p>This is the one thing in this design that has to be checked on a device before anybody builds '+
      'against it, and the check is small: log <code>useWindowDimensions().width</code> beside the '+
      '<code>onLayout</code> width of the conversation column on the inner display. If they differ, the '+
      'thresholds move to the second one. The toggle above draws both answers.</p>'+

      '<h3>What the inner display is actually for</h3>'+
      '<p>At <b>669</b>: more of one thing. The measures hold — a list is still capped at 640 and prose '+
      'at 560 — so an unfolded portrait screen shows <i>more rows</i> and a <i>longer transcript</i>, '+
      'not a second column. Two things change honestly: the artifact grid goes from two tiles to three, '+
      'because a grid reflows and a column does not; and the destinations stay on screen inside a '+
      'workspace, because the system rail does not go away when a route pushes. On a phone the tab bar '+
      'does.</p>'+
      '<p>At <b>951</b>: two things, and the second one is a choice. The code already docks the '+
      'overview there and that is correct but modest — the overview is a reference panel, not '+
      'somewhere you work. The column carries a two-way switch, and its other setting is <b>the '+
      'inbox</b>.</p>'+
      '<div class="d-keep"><b>Why the inbox.</b> The product thesis is <i>an agent that stops is only '+
      'expensive if nobody is there</i>. Four agents waiting is four round trips on a phone and four '+
      'taps on the inner display, because the list keeps your place while the conversation answers. '+
      'That is the only thing this pose can do that no other surface can, and it is worth the one '+
      'control it costs.</div>'+
      '<p><b>Two panes, never three.</b> Opening the repository at 951 replaces the conversation in the '+
      'right pane; the left column stays the inbox. The right pane is always <i>the thing you are '+
      'reading</i> and the left is always <i>where you are</i>, which is the shape of Mail on an iPad '+
      'and the reason nobody has to be taught it.</p>'+

      '<h3>The front panel is not a small inner display</h3>'+
      '<p>466 is narrower than a phone with a rail on it and wider than a phone without. It is a phone, '+
      'and the only concession it gets is that nothing assumes 390: every measure is a maximum, so '+
      'the extra 76 points go into the row rather than into a second column. A split here would leave '+
      '126.</p>'+
      '<div class="d-flag"><b>A build claim, not a design one.</b> The surfaces reference is explicit: '+
      'the app must be built on the SDK image that lets it resize, or it runs in compatibility mode '+
      'and none of these poses happen at all. Nothing drawn on this page is reachable without that, '+
      'so it belongs in the scope rather than in the polish phase.</p></div>'+
    '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   MOVING — unfolding and rotating, which is where this gets caught out
   ═══════════════════════════════════════════════════════════════════════════ */
const MOVES = {
  front:  { to:["innerp"], say:'<b>Unfold.</b> 466 → 669. The band goes push → float. '+
    'The tab bar leaves the bottom and stands up on the trailing edge; the content it was sitting '+
    'under keeps its height. An overview that was a <i>pushed route</i> is popped and re-opened as '+
    'the floated panel, so what you were reading stays what you are reading and only its container '+
    'changes. Scroll position, focus and a half-typed message all survive — they belong to the '+
    'component, not to the layout.' },
  innerp: { to:["front","innerl"], say:'<b>Rotate.</b> 669 → 951. Float → dock. A panel that was '+
    'floated open becomes the docked column and the conversation reflows around it; a panel that was '+
    'closed stays closed, because arriving at a width is not the same as arriving at a screen. '+
    '<b>Fold back</b> and the floated panel becomes a pushed route again.' },
  innerl: { to:["innerp"], say:'<b>Rotate back.</b> 951 → 669. Dock → float, and the open column '+
    'becomes the open floated panel rather than closing. That is the surfaces reference’s rule — '+
    'an open sheet’s state is not lost across the change — and it costs the conversation nothing, '+
    'because a floated panel sits over its full width rather than taking any of it. The scrim is '+
    'there the instant it lands.' },
};

function tabMoving() {
  const id = S.morphW ? "morph" : S.duo;
  const base = POSES[S.duo];
  const p = S.morphW
    ? { id:"morph", w:S.morphW, h:S.morphH, kind:"ios", hinge:true, regular:S.morphW >= 600,
        name:"…", sub:S.morphW+" pt" }
    : base;
  const seq = [["front","Front panel","466"],["innerp","Inner, portrait","669"],["innerl","Inner, landscape","951"]];
  return '<div class="d-play">'+seq.map(([v,lab,w],i) =>
      (i ? '<span class="d-arrow">'+ic("right",13)+'</span>' : "")+
      '<button class="d-step" data-move="'+v+'" aria-pressed="'+(S.duo===v)+'">'+lab+
      ' <span class="d-num">'+w+'</span></button>').join("")+'</div>'+
    '<div class="d-stage" id="d-morph"><div class="d-row">'+
      plinth(p, workspaceScreen(p, S).body, { tab:"inbox", pushed:true, noBand:true, scale:0.7,
        label:(S.morphW ? "unfolding…" : base.name),
        sub:p.w+' × '+p.h+' pt · '+band(p) })+
    '</div></div>'+
    '<div class="d-moving">'+(MOVES[S.duo] ? MOVES[S.duo].say : "")+'</div>'+
    '<div class="d-note"><h2>What moves, and what must not</h2>'+
      '<div class="d-flag"><b>This plays the change slowly, and the real one is instantaneous.</b> '+
      'A device does not pass through 540 points on its way from 466 to 669. The animation exists so '+
      'the order the decisions fire in is visible — watch the tab bar stand up at 600, and the panel '+
      'change container at the same moment.</div>'+
      '<h3>The rule that outranks the others</h3>'+
      '<p><b>Rotating changes where a panel lands; it never changes what a button does.</b> The control '+
      'in the header reads <i>show me the overview</i> at every width. At 390 and 466 it pushes a '+
      'route; at 669 it floats a panel; at 951 it docks a column. Three placements, one meaning, and '+
      'the button never moves on the screen.</p>'+
      '<h3>Five things a fold must not lose</h3>'+
      '<table class="d-tbl"><thead><tr><th>What</th><th>Why it survives</th></tr></thead><tbody>'+
      '<tr><td>Scroll position</td><td>The transcript’s offset belongs to the list, not the pose. '+
        '<code>maintainVisibleContentPosition</code> is already holding it against items arriving '+
        'above; a width change is the same problem.</td></tr>'+
      '<tr><td>A half-typed message</td><td><code>workspace/draft.ts</code> already survives '+
        'backgrounding, a server switch and a cold start. A rotation is strictly easier.</td></tr>'+
      '<tr><td>Focus and the keyboard</td><td>The <code>TextInput</code> holds the same slot in the '+
        'tree through the composer’s own morph, which is the same requirement one level up.</td></tr>'+
      '<tr><td>An open panel</td><td>It changes container, never openness — except the one case below.'+
        '</td></tr>'+
      '<tr><td>An open sheet or menu</td><td>The attach menu and the workspace menu are anchored to '+
        'controls that do not move. A sheet at 390 is a sheet at 951.</td></tr>'+
      '</tbody></table>'+
      '<h3>The one case where openness does change</h3>'+
      '<p>Arriving at a <i>screen</i> with the band already docked opens the column, because it costs '+
      'the conversation nothing it needs. Arriving at a screen floated does not, because it costs it '+
      'all of it. Arriving at a <i>width</i> changes neither: a panel you opened stays open and a '+
      'panel you closed stays closed, in both directions.</p>'+
      '<p>I had this wrong before reading the surfaces reference. I had rotation from 951 to 669 '+
      'closing the docked column, on the grounds that a floated panel landing over the conversation '+
      'is the squeeze the rule forbids. It is not: a floated panel sits <i>over</i> the full-width '+
      'conversation rather than taking width from it, and the reference says plainly that an open '+
      'sheet’s state must survive the change. It stays open.</p>'+
      '<h3>Not covered</h3>'+
      '<p>Three transitions are named and not drawn: <b>unfolding with the keyboard up</b> (the '+
      'keyboard is dismissed by the system on a size-class change on iOS, so the composer returns to '+
      'its pill with the draft in it — stated, not verified); <b>unfolding mid-upload</b>, where the '+
      'attachment chip has to keep its own id rather than its index; and <b>the app being launched '+
      'directly into the inner display from a notification</b>, where there is no previous pose to '+
      'carry anything from.</p>'+
    '</div>';
}
function tabRepo() {
  const p = POSES[S.pose] || POSES.iphone;
  return '<div class="d-stage"><div class="d-row">'+
      live(p.id, "repo")+plinth(POSES.iphone, fileScreen(POSES.iphone),
        { pushed:true, noBand:true, label:"One file", sub:"with the strip above it" })+
    '</div></div>'+
    '<div class="d-cap"><b>A page, not a sheet.</b><span>Diff · Files · Commit, then one file with '+
      'the strip above it.</span><span>gutter 44 · row 21 · code 15/1.6</span></div>'+
    '<div class="d-note"><h2>The repository is a page</h2>'+
      '<p>The desk puts this in a rail beside the conversation, on the argument that reviewing a diff '+
      'must not hide the conversation explaining it. That argument does not survive the trip, and the '+
      'first attempt here proved it: as a sheet over 390 it left three lines of conversation — which '+
      'is not context — and squeezed the diff into a third of the screen while pushing the one control '+
      'that ships the work below the fold.</p>'+
      '<p>A phone has no <i>beside</i>. What it has is a stack and a back gesture, and one gesture '+
      'away is what <i>next to</i> means here. The strip under the header says what changed; tapping '+
      'it opens a page that has room.</p>'+
      '<div class="d-keep"><b>Code scrolls; it never wraps</b>, and the gutter is pinned while it '+
      'does. Both halves. A rule that says "scrolls" is not satisfied by one that only says "does not '+
      'wrap" — that was the bug: <code>numberOfLines={1}</code> kept each line whole and nothing '+
      'carried it sideways, so the rest was laid out and then clipped.</div>'+
      '<h3>One button, and it says what it does</h3>'+
      '<p><code>shipping()</code> reduces every checkout to one stage — uncommitted, unpushed, pushed, '+
      'open — and one honest label. The desk’s three controls in a row do not fit and should not be '+
      'squeezed; the stage model exists precisely so a narrow screen can offer the one verb that '+
      'applies instead of four and a puzzle.</p>'+
      '<p>The title and body are <code>describe_session</code>’s own proposal, a draft to edit rather '+
      'than a box to fill. Nothing acts on them until the button.</p>'+
      '<h3>The count is clamped to the file</h3>'+
      '<p>"33 lines, 40 touched" is the kind of small lie that makes a reader stop trusting the rest '+
      'of the screen, and it happens the moment the lines and the touched set are counted in two '+
      'passes.</p>'+
      '<h3>At 951 this is the right pane</h3>'+
      '<p>Opening the repository on the inner display in landscape replaces the conversation rather '+
      'than adding a third column. Two panes, never three — and the back gesture out of it is the same '+
      'gesture at every width.</p>'+
    '</div>';
}

function tabStart() {
  const p = POSES[S.pose] || POSES.iphone;
  return '<div class="d-stage"><div class="d-row">'+
      live(p.id, ["tasks","new","config","repos"].includes(S.screen) ? S.screen : "tasks")+
      plinth(POSES.iphone, newScreen(POSES.iphone, Object.assign({}, S,
        { newstate: S.newstate === "task" ? "norepo" : "task" })),
        { noTabs:true, noBand:true,
          label: S.newstate === "task" ? "Nothing connected yet" : "Seeded from a task",
          sub: S.newstate === "task" ? "the one setting a phone owns" : "the title and the repository came with it" })+
    '</div></div>'+
    '<div class="d-cap"><b>From <i>what could I work on</i> to <i>an agent is running</i>.</b>'+
      '<span>Tasks · New · Config · Connect a repository · Connect a Firetower</span></div>'+
    '<div class="d-note"><h2>Starting work</h2>'+
      '<p>Tapping a task starts a workspace seeded from it, and that is the one thing the Tasks screen '+
      'is for. <b>No prompt is ever sent on creation</b>, including from a task: the agent starts and '+
      'waits, and what you want doing is said in the conversation where it can be answered. A task '+
      'seeds the composer, unsent.</p>'+
      '<h3>Six fields, one scrolling form</h3>'+
      '<p>A workspace is a checkout on a machine with agents in it, so the form has to ask for all '+
      'three. Six fields do not fit on 390, and a wizard would hide the one thing people change most '+
      '— the repository — behind three taps. So: one form, pickers as panels, the action pinned to '+
      'the foot. The same decision as the Commit tab, for the same reason.</p>'+
      '<h3>The one administrative screen, and why it is allowed</h3>'+
      '<p>Mobile writes no access of any kind. Connecting a repository is the exception and it is '+
      'argued rather than assumed: the new-workspace form asks for a repository, and a client that '+
      'cannot produce one answers <i>start work on that</i> with <i>go and find a laptop</i>, which is '+
      'the one thing the phone exists not to be. It lists what the control plane’s git token can '+
      'already see; it grants nobody anything.</p>'+
      '<div class="d-flag"><b>And three things it deliberately will not do.</b> No device flow — a code '+
      'to type into a browser, entered from the device that <i>is</i> the browser, is the worst place '+
      'to run that. No pasted remote — a URL typed on a phone keyboard is the worst way to enter one. '+
      'No settings, env or removal. Each is said on the screen rather than drawn greyed out.</div>'+
      '<h3>Connecting a Firetower</h3>'+
      '<p>Two questions, asked in order and never at the same time: <b>where</b> it is, then <b>who '+
      'you are</b> there. Only the first has an answer that is the same for everybody at a company, '+
      'and knowing it is what lets the app tell you <i>whose</i> Firetower you are about to hand a '+
      'password to.</p>'+
      '<p>The phone adds one thing the desk does not need: it says when an address is not encrypted. '+
      'A great many installs are <code>http://192.168.1.40:4400</code> or a Tailscale name, both '+
      'platforms block cleartext by default, and the app allows it on purpose — so it owes you the '+
      'fact. In <code>--color-dim</code> and never as an error: an unencrypted address on a mesh VPN '+
      'is a normal way to run this.</p>'+
      '<p>The failure that is predicted is drawn as the common one, written as what to do rather than '+
      'what went wrong. <i>No route</i> is three questions about Tailscale, not a stack trace — and '+
      'the stack trace is underneath it in mono, small, for the one person who wants it.</p>'+
    '</div>';
}

function tabYou() {
  const p = POSES[S.pose] || POSES.iphone;
  return '<div class="d-stage"><div class="d-row">'+
      live(p.id, S.screen === "you" || S.screen === "artifacts" ? S.screen : "you")+
      plinth(POSES.iphone, lockScreen(),
        { bare:true, noTabs:true, noBand:true, label:"The notification", sub:"and the lock screen it lands on" })+
      plinth(POSES.iphone, homeScreen(),
        { bare:true, noTabs:true, noBand:true, label:"The badge", sub:"set from the payload, not from a poll" })+
    '</div></div>'+
    '<div class="d-cap"><b>The three surfaces a window does not have.</b>'+
      '<span>The notification, the lock screen and the icon badge are where ember earns its keep.</span></div>'+
    '<div class="d-note"><h2>Ember, off the screen</h2>'+
      '<p>A phone gives the one loud colour three surfaces a window cannot: the app icon badge, the '+
      'notification, and the inbox row. It gets those and nothing else. Not the tab bar, not the send '+
      'button, not a pull-to-refresh spinner.</p>'+
      '<p>The notification is the product. Without it you have to remember to open the app, and if you '+
      'remember to open the app you did not need it. It carries the session’s <i>name</i> and the '+
      'agent’s own note, because a notification has to say which of four agents wants something '+
      'before anybody will open it.</p>'+
      '<div class="d-keep"><b>The badge comes from the payload, not from a poll.</b> That is the one '+
      'thing the desktop’s dock badge gets by polling and a phone cannot — so the count rides in the '+
      'push and the icon is right with the app not running.</div>'+
      '<p>What the title and body actually are, said where it matters: the control plane encrypts them '+
      'to a key whose private half never left this device, and the relay forwards a token and a blob. '+
      'The setting on <b>You</b> says that in those words, because <i>opt in to notifications</i> is '+
      'not informed consent when the thing being opted into is a third party you did not choose.</p>'+
      '<h3>You is this phone’s; Config is one server’s</h3>'+
      '<p>They were one tab for an afternoon. A server’s repositories sitting under the list of '+
      'servers reads as a thing and the things inside it at the same level, and a section legend is '+
      'not enough to say which is which. <b>You</b> survives every server in that list going away.</p>'+
      '<h3>Artifacts is a grid, and that is a considered exception</h3>'+
      '<p>The house rule names "a rounded card around everything" as a habit that makes an interface '+
      'look generated, because one radius on every object flattens the hierarchy it was meant to '+
      'express. There is no hierarchy to flatten here: one kind of object, and what identifies each is '+
      'a picture. Two columns at 390 and three at 669 — a third column at phone width makes every '+
      'poster too small to recognise, which defeats the only reason for a grid.</p>'+
      '<p>Every tile is a <b>poster</b>, never a live frame. An artifact is untrusted HTML and a grid '+
      'of six would be six page loads, six runtimes and six sets of timers. The live bytes are mounted '+
      'in exactly one place: the viewer.</p>'+
      '<h3>What is not here, and says so</h3>'+
      '<p>No invite, no role, no team membership, no sharing sheet. Not greyed out — absent, with one '+
      'line at the foot naming where it is done. A greyed-out <i>Invite</i> is the clearest possible '+
      'way to tell somebody they are being withheld from.</p>'+
    '</div>';
}

  const n = k => all.filter(r => r[1] === k).length;
  const real = all.length - n("X");
  const pip = k => '<span class="d-pip"><i data-k="'+k+'"></i>'+
    (k === "Y" ? "Yes" : k === "P" ? "Partly" : k === "N" ? "No" : "n/a")+'</span>';
  const dot = (k, c) => '<span class="d-pip"><i data-k="'+k+'"></i>'+c+'</span>';

  return '<div class="d-note d-roomy"><h2>Coverage</h2>'+
    '<p>Every <b>feature</b> the phone app has — not every component. A component-level tick hides '+
    'what is inside it, which is how the desktop’s first coverage table passed while three of a '+
    'detail’s four tabs were missing. So each row below is something that can <i>independently</i> '+
    'be missing: a provider, a tab, a menu item, an action, a state, a field. A parent row carries a '+
    'tally of its children and never a verdict of its own.</p>'+
    '<p><b>'+n("Y")+' drawn · '+n("P")+' partly · '+n("N")+' not yet</b>, out of '+real+
    ' features — plus '+n("X")+' marked <i>deliberately not drawn</i>, which is a different answer '+
    'from “no”.</p>'+
    '<p class="d-covlegend">'+dot("Y","Drawn, with its states")+dot("P","Partly — something real is missing")+
      dot("N","Not yet")+dot("X","Deliberately not drawn")+'</p>'+
    COV.map(([group, rows]) => '<h3 class="d-covgrp">'+esc(group)+'</h3><div class="d-cov">'+
      rows.map(r => {
        if (!r[3]) return '<div class="d-covrow"><span>'+r[0]+'</span>'+pip(r[1])+'<span>'+(r[2]||"")+'</span></div>';
        const tally = ["Y","P","N","X"].map(k =>
          r[3].filter(x => x[1] === k).map(() => '<i data-k="'+k+'"></i>').join("")).join("");
        return '<div class="d-covrow" data-head="1"><span>'+r[0]+'</span>'+
          '<span class="d-tally">'+tally+'</span><span>'+(r[2]||"")+'</span></div>'+
          r[3].map(k => '<div class="d-covrow" data-sub="1"><span>'+k[0]+'</span>'+pip(k[1])+
            '<span>'+(k[2]||"")+'</span></div>').join("");
      }).join("")+'</div>').join("")+
    '<h3 class="d-covgrp">What <i>deliberately not drawn</i> means</h3>'+
    '<p>Twelve rows are marked <i>n/a</i> rather than <i>no</i>, and the difference is the point of '+
    'the column. Four are rules this surface is not allowed to break — sharing a workspace, pasting '+
    'a remote, a device flow, a fleet-wide row list — and drawing any of them would be drawing the '+
    'thing the design exists to refuse. Four are behaviours a still image cannot carry: a back '+
    'gesture, a haptic, a keyboard convention, a draft surviving a cold start; each is specified in '+
    'Spec instead. Two are assets rather than screens. One is annotation, which is reachable and '+
    'deliberately not taken because the save has no mapping yet and a composer that collects a note '+
    'and drops it is worse than none.</p>'+
    '<p>The last is the interesting one. <b>iPhone in landscape</b> is marked n/a because '+
    '<code>app.config.ts</code> sets <code>orientation: "portrait"</code> — so it cannot happen. '+
    'That same line is why the Duo’s landscape pose cannot happen either, and why the '+
    '<code>dock</code> branch in <code>app/workspace/[id].tsx</code> is currently unreachable. It is '+
    'the first item in the code delta.</p>'+
  '</div>';
}
/* ═══════════════════════════════════════════════════════════════════════════
   MEASUREMENT

   Everything in this block computes a fact about this page rather than
   asserting one. Where a number here disagrees with a number in the prose,
   the prose is wrong.
   ═══════════════════════════════════════════════════════════════════════════ */
function hexToRgb(h) {
  h = String(h).trim();
  if (h[0] !== "#") return null;
  if (h.length === 4) h = "#"+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  if (h.length !== 7) return null;
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function relLum(rgb) {
  const [r,g,b] = rgb.map(v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function ratio(a, b) {
  const x = hexToRgb(a), y = hexToRgb(b);
  if (!x || !y) return null;
  const l1 = relLum(x), l2 = relLum(y);
  return (Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05);
}
/** Both branches of the real sheet, read off the real document. */
const TOKENS = (function () {
  const root = document.documentElement, was = root.dataset.theme;
  const read = () => {
    const cs = getComputedStyle(root), out = {};
    for (const n of ["ground","panel","raise","overlay","line","line-soft","settling",
      "bone","text","dim","mute","ember","ember-ink","ember-tint","ember-deep",
      "sage","sage-tint","sage-deep","brick","brick-tint","brick-deep",
      "amber","amber-soft","amber-tint","amber-deep","slate","slate-tint","slate-deep",
      "kind-source","kind-native","kind-data","kind-style","kind-media","kind-store","kind-prose",
      "syn-comment","syn-string","syn-keyword","syn-type","syn-number","syn-fn","syn-attr"])
      out[n] = cs.getPropertyValue("--p-"+n).trim();
    return out;
  };
  root.dataset.theme = "light"; const light = read();
  root.dataset.theme = "dark";  const dark = read();
  root.dataset.theme = was || "light";
  return { light, dark };
})();

function contrastTable() {
  const row = (tok, against, label, note, floor) => {
    const L = ratio(TOKENS.light[tok], TOKENS.light[against]);
    const D = ratio(TOKENS.dark[tok], TOKENS.dark[against]);
    const ok = L >= floor;
    return '<tr><td><code>--color-'+tok+'</code></td>'+
      '<td><span class="d-swatch" style="background:'+TOKENS.light[tok]+'"></span>'+
        '<span class="d-num">'+TOKENS.light[tok]+'</span></td>'+
      '<td><span class="d-swatch" style="background:'+TOKENS.dark[tok]+'"></span>'+
        '<span class="d-num">'+TOKENS.dark[tok]+'</span></td>'+
      '<td>'+label+'</td>'+
      '<td class="d-num '+(ok?"d-ok":"d-bad")+'">'+L.toFixed(2)+'</td>'+
      '<td class="d-num">'+D.toFixed(2)+'</td>'+
      '<td>'+note+'</td></tr>';
  };
  return '<table class="d-tbl"><thead><tr><th>Token</th><th>Light</th><th>Dark</th>'+
    '<th>Measured against</th><th>Light</th><th>Dark</th><th>What it is for</th></tr></thead><tbody>'+
    PAIRS.map(p => row(p[0], p[1], p[2], p[3], p[4])).join("")+
    '</tbody></table>';
}
function rampTable(list, against, floor, title) {
  const rows = list.map(t => {
    const L = ratio(TOKENS.light[t], TOKENS.light[against]);
    const D = ratio(TOKENS.dark[t], TOKENS.dark[against]);
    return { t, L, D, ok: L >= floor };
  });
  const worstL = Math.min(...rows.map(r => r.L)), worstD = Math.min(...rows.map(r => r.D));
  return '<p><b>'+title+'</b> — measured against the page. The floor is whatever the dark set’s own '+
    'weakest member clears, which this page computes as <b class="d-num">'+worstD.toFixed(2)+
    '</b>; the light set’s weakest is <b class="d-num '+(worstL>=floor?"d-ok":"d-bad")+'">'+
    worstL.toFixed(2)+'</b>.</p>'+
    '<table class="d-tbl"><thead><tr><th>Token</th><th>Light</th><th>Dark</th>'+
    '<th>on light</th><th>on dark</th></tr></thead><tbody>'+
    rows.map(r => '<tr><td><code>--color-'+r.t+'</code></td>'+
      '<td><span class="d-swatch" style="background:'+TOKENS.light[r.t]+'"></span>'+
        '<span class="d-num">'+TOKENS.light[r.t]+'</span></td>'+
      '<td><span class="d-swatch" style="background:'+TOKENS.dark[r.t]+'"></span>'+
        '<span class="d-num">'+TOKENS.dark[r.t]+'</span></td>'+
      '<td class="d-num '+(r.ok?"d-ok":"d-bad")+'">'+r.L.toFixed(2)+'</td>'+
      '<td class="d-num">'+r.D.toFixed(2)+'</td></tr>').join("")+'</tbody></table>';
}

/* ── The audits ───────────────────────────────────────────────────────────── */

/**
 * The tabs the audits walk.
 *
 * Coverage, Spec and Notes are documents: they hold no phone and no control
 * that changes state. Spec is additionally excluded because it *is* the
 * audits — walking it from inside them is unbounded recursion, which is how
 * this page first hung. A check that can hang is worse than a slow one.
 */
const WALKED = DTABS.map(t => t[0]).filter(id => !["coverage","spec","notes"].includes(id));

/**
 * The collision audit.
 *
 * Five got through on the desktop, and the ones that hurt were not two
 * unscoped rules fighting. They were a class defined *unscoped* in one place
 * and used as somebody's *descendant* in another, where the unscoped rule
 * leaks every property the scoped one does not set. So this records, for each
 * class, whether it is ever the key of a bare selector and whether it is ever
 * the key of a descendant selector — and a class that is both is a finding.
 *
 * The reverse case only the live DOM can catch: a class carried by an element
 * that no rule in the sheet matches. That is the second pass.
 */
function auditClasses() {
  const bare = new Map(), desc = new Map(), any = new Set();
  for (const sheet of document.styleSheets) {
    let rules; try { rules = sheet.cssRules; } catch (e) { continue; }
    /* `r.selectorText` first, and recurse only where there is something to
       recurse into. Testing `r.cssRules` first looks right and is not: since
       Chrome shipped CSS nesting, every `CSSStyleRule` carries an empty
       `CSSRuleList`, which is an object and therefore truthy — so the first
       version of this took the recursive branch for every rule on the page
       and examined no selectors at all. It reported nought collisions out of
       nought classes and passed. That is exactly the check that cannot fail,
       which is why the count of classes examined is printed beside the
       result rather than kept to itself. */
    const walk = list => { for (const r of list) {
      if (r.cssRules && r.cssRules.length) walk(r.cssRules);
      if (!r.selectorText) continue;
      r.selectorText.split(",").forEach(sel => {
        sel = sel.trim(); if (!sel) return;
        const parts = sel.split(/\s+|>|\+|~/).filter(Boolean);
        const key = parts[parts.length-1];
        (key.match(/\.[A-Za-z0-9_-]+/g) || []).forEach(c => {
          const name = c.slice(1); any.add(name);
          if (parts.length > 1) {
            /* Which classes the ancestor part carries, so a base-plus-variant
               pair can be told from a genuine leak. */
            const up = parts.slice(0, -1).join(" ").match(/\.[A-Za-z0-9_-]+/g) || [];
            desc.set(name, { sel, up: up.map(x => x.slice(1)) });
          } else {
            bare.set(name, sel);
          }
        });
      });
    } };
    walk(rules);
  }
  /**
   * Two different findings, and only one of them is a bug.
   *
   * A class with a bare rule *and* a contextual override is ordinary CSS —
   * `.p-tablab` and `.p-tabs[data-kind="android"] .p-tablab` are one
   * component varying itself, and the override is meant to win. That is an
   * inventory, not a failure.
   *
   * The failure is the one the desktop paid five bugs for: a class defined
   * bare in one component and used as *somebody else's* descendant, where
   * the bare rule leaks every property the scoped rule does not set. A
   * poster inheriting a page wrapper's padding; an annotation card leaking
   * `position:absolute` into a heading. Those are always cross-namespace, so
   * that is what this tests.
   */
  const variants = [...any].filter(c => bare.has(c) && desc.has(c))
    .map(c => ({ cls:c, bare:bare.get(c), desc:desc.get(c).sel }));
  const ns = c => (c.match(/^[a-z]+-/) || [""])[0];
  const leaks = variants.filter(v => {
    const d = desc.get(v.cls);
    return d.up.length > 0 && d.up.every(a => ns(a) !== ns(v.cls));
  });

  /* Pass two: anything in the live DOM wearing a class the sheet never
     matches on that element. Only the live DOM can find this one — a class
     defined solely as somebody's descendant, used under a different parent,
     renders completely unstyled while the stylesheet stays valid.

     The selectors are indexed by class name first. Testing every element
     against every rule is O(n×m) and on this page that is tens of millions
     of `matches` calls. */
  const byClass = new Map();
  const index = list => { for (const r of list) {
    if (r.cssRules && r.cssRules.length) index(r.cssRules);
    if (!r.selectorText) continue;
    (r.selectorText.match(/\.[A-Za-z0-9_-]+/g) || []).forEach(c => {
      const n = c.slice(1);
      if (!byClass.has(n)) byClass.set(n, []);
      byClass.get(n).push(r.selectorText);
    });
  } };
  for (const sheet of document.styleSheets) {
    try { index(sheet.cssRules); } catch (e) {}
  }
  const unmatched = new Map();
  document.querySelectorAll("[class]").forEach(el => {
    el.classList.forEach(c => {
      const sels = byClass.get(c);
      if (!sels) { unmatched.set(c, (unmatched.get(c)||0)+1); return; }
      let hit = false;
      for (const sel of sels) { try { if (el.matches(sel)) { hit = true; break; } } catch (e) {} }
      if (!hit) unmatched.set(c, (unmatched.get(c)||0)+1);
    });
  });
  return { classes:any.size, variants, leaks, unmatched:[...unmatched.entries()] };
}

/** Drive every control on every tab and report anything that throws. */
function auditControls() {
  const keep = JSON.stringify(S);
  const seen = new Set(), bad = [];
  let n = 0;
  WALKED.forEach(id => {
    S.tab = id;
    let html = ""; try { html = bodyFor(id); } catch (e) { bad.push({ where:"render "+id, err:String(e) }); return; }
    const box = document.createElement("div"); box.innerHTML = html;
    box.querySelectorAll("[data-go]").forEach(el => {
      const go = el.dataset.go; n++;
      if (seen.has(id+"|"+go)) return;
      seen.add(id+"|"+go);
      const snap = JSON.stringify(S);
      try {
        const [verb, arg] = go.split(":");
        /* The same switch the page runs, without the redraw. */
        if (verb === "tab" || verb === "goto") S.screen = arg;
        else if (verb === "open") { S.screen = "workspace"; S.comp = "ask"; }
        else if (verb === "filter") S.filter = arg;
        else if (verb === "repo") S.repo = arg;
        else if (verb === "side") S.side = arg;
        else if (verb === "comp") S.comp = arg;
        else if (verb === "menu") S.menu = arg || null;
        else if (verb === "peek") S.peek = arg || null;
        else if (verb === "rail") S.rail = !S.rail;
        else if (verb === "connect") S.connect = arg;
        bodyFor(id);
      } catch (e) { bad.push({ where:id+" → "+go, err:String(e) }); }
      Object.assign(S, JSON.parse(snap));
    });
  });
  Object.assign(S, JSON.parse(keep));
  return { controls:n, bad };
}

/** Nothing tappable under 44 points. The phone's floor, from `STYLE.md`. */
const TAPPABLE = ".p-tap,.p-ctl,.p-send,.p-item,.p-quiet,.p-menuitem,.p-popitem,.p-askno,"+
  ".p-askyes,.p-tab,.p-railitem,.p-primary,.p-second,.p-who,.p-difffile,.p-tree,"+
  ".p-facts,.p-stab,.p-pill,.p-field,.p-card,.p-texttab,.p-member,.p-switch";
function auditTargets() {
  const bad = [];
  let n = 0;
  document.querySelectorAll(TAPPABLE).forEach(el => {
    /* `offsetWidth`, not `getBoundingClientRect()`. The devices on the Poses
       tab are drawn inside a `transform: scale()` so five of them fit a
       frame, and a bounding rect reports the *visual* size — so every target
       on the page failed the 44pt floor the moment the default view stopped
       being 1:1. The layout size ignores transforms, which is the number a
       stylesheet actually holds. */
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!h && !w) return;
    n++;
    if (h < 44 || w < 44) bad.push({ cls: el.className.split(" ")[0], h, w });
  });
  const by = new Map();
  bad.forEach(b => { const k = b.cls+" "+b.w+"×"+b.h; by.set(k, (by.get(k)||0)+1); });
  return { n, bad:[...by.entries()] };
}
function tabSpec() {
  const cls = auditClasses(), ctl = auditControls(), reach = auditReach(), tgt = auditTargets();
  const missed = reach.filter(r => !r.ok);

    const rail = railOn(p) && S.inset ? RAIL : 0, cw = p.w - rail;
    return '<tr><td>'+esc(p.name)+'</td><td class="d-num">'+p.w+' × '+p.h+'</td>'+
      '<td class="d-num">'+(rail||"—")+'</td><td class="d-num">'+cw+'</td>'+
      '<td>'+band(p)+'</td><td class="d-num">'+Math.min(cw, COLUMN)+'</td>'+
      '<td class="d-num">'+Math.min(cw, READING)+'</td></tr>';

  '<p>Measured on this page as it is drawn, at 1 CSS pixel to the point. Everything here is a '+
  'number an engineer can put in a stylesheet.</p>'+

  '<h3>Evidence, before any of it</h3>'+
  '<div class="d-flag"><b>An emulated viewport, and nothing else.</b> Every pose on this page is a '+
  'CSS box at the stated width in a desktop browser. No gesture has been run under touch: not the '+
  'long-press, not the drag-down out of the composer, not the sideways scroll on a diff, not the '+
  'sheet following a finger. A screenshot verifies layout and never a gesture. No real device, no '+
  'simulator, no foldable. The four checks the surfaces reference asks for that <i>can</i> only be '+
  'done on hardware are listed at the foot of Notes.</div>'+

  '<h3>The poses</h3>'+
  '<table class="d-tbl"><thead><tr><th>Pose</th><th>Window</th><th>System rail</th>'+
    '<th>Laid out in</th><th>Band</th><th>COLUMN here</th><th>READING here</th></tr></thead><tbody>'+
    POSE_ORDER.map(id => poseRow(POSES[id])).join("")+'</tbody></table>'+
  '<p>Both maximums are maximums: below them nothing changes, so the phone and the front panel are '+

    ["Not authorised", "repos", { tab:"start", screen:"repos", repos:"noauth" }, ""],
    ["You", "you", { tab:"you", screen:"you" }, "this phone's"],
    ["Switching Firetower", "you", { tab:"you", screen:"you", menu:"servers" }, ""],
    ["The notification", "lock", { tab:"you" }, ""],
    ["The badge", "home", { tab:"you" }, "set from the payload"],
  ]],
];

function tabIndex() {
  const keep = JSON.stringify(S);
  const K = 0.34;
  const cell = (label, screen, patch, note) => {
    Object.assign(S, JSON.parse(keep), patch);
    let html = "";
    try { html = renderScreen(screen, POSES.iphone); } catch (e) { html = ""; }
    let over = "";
    if (S.menu === "attach") over = attachPop();
    else if (S.menu === "ws") over = workspaceMenu();
    else if (S.menu === "servers") over = serversSheet();
    else if (S.menu === "art") over = artifactMenu();
    if (S.peek) over = peekOver(POSES.iphone, S.peek);
    const bare = screen === "lock" || screen === "home";
    const dev = device(POSES.iphone, html, {
      tab: HOME_TAB[screen] || "inbox",
      noTabs: MODAL.has(screen) || bare,
      pushed: PUSHED.has(screen), bare, over,
    });
    Object.assign(S, JSON.parse(keep));
    const q = Object.keys(patch).map(k => k+"="+patch[k]).join("&");
    /* A div with a button's role, not a `<button>`. A device is a tree of
       `<div>`s and the parser closes a `<button>` the moment it meets one —
       which silently dropped the label, the note and every overlay out of
       the tile and left them loose on the page. It looked like a CSS
       containing-block problem for a while and it was a parsing one. */
    return '<div class="d-tile" role="button" tabindex="0" data-sheet="'+esc(q)+'" '+
        'aria-label="Open '+esc(label)+'">'+
      '<div class="d-scale" style="width:'+Math.round((POSES.iphone.w+18)*K)+'px;height:'+
        Math.round((POSES.iphone.h+18)*K)+'px">'+
        '<div style="transform:scale('+K+');transform-origin:top left;width:'+
          (POSES.iphone.w+18)+'px">'+dev+'</div></div>'+
      '<div class="d-tilelab">'+esc(label)+'</div>'+
      (note ? '<div class="d-tilenote">'+esc(note)+'</div>' : "")+
    '</div>';
  };
  const n = SHEET.reduce((a, g) => a + g[1].length, 0);
  return '<div class="d-note d-roomy"><h2>Every screen</h2>'+
    '<p><b>'+n+' screens, every one of them a control.</b> Press a tile and the document goes to '+
    'the tab and the state that draws it at full size. This page exists because three of the four '+
    'things that came back from the first review were drawn and not found — a tab row says '+
    'where you can go and never what is there.</p></div>'+
    SHEET.map(([group, items]) =>
      '<div class="d-note d-roomy" style="margin-top:30px"><h3 class="d-covgrp" '+
        'style="margin-top:0">'+esc(group)+'</h3></div>'+
      '<div class="d-sheet">'+items.map(it => cell(it[0], it[1], it[2], it[3])).join("")+'</div>'
    ).join("");
}
function tabArtifacts() {
  const p = POSES[S.pose] || POSES.iphone;
  const showing = S.screen === "artifact" ? "artifact" : "artifacts";
  return '<div class="d-stage"><div class="d-row">'+
      live(p.id, showing)+
      plinth(POSES.iphone, (function () {
        const k = S.comp, f = S.from; S.comp = "rest"; S.from = 5;
        const b = workspaceScreen(POSES.iphone, S).body; S.comp = k; S.from = f; return b;
      })(), { tab:"inbox", pushed:true, noBand:true,
        label:"In a turn", sub:"a poster in the conversation that made it" })+
    '</div></div>'+
    '<div class="d-cap"><b>The library, the card in a turn, and the one place the bytes run.</b>'+
      '<span>Two tiles at 390, three at 669 — a grid reflows; a column does not.</span></div>'+
    '<div class="d-note"><h2>Artifacts</h2>'+
      '<p>An artifact is what an agent publishes when you ask it to <i>show</i> you something — a '+
      'mock-up, a chart, a report. On a phone they matter more than on a desk, because showing is '+
      'the thing a small screen is good at and reviewing a diff is the thing it is worst at.</p>'+

      '<h3>Owned by you, not by the workspace</h3>'+
      '<p><code>reclaim.rs</code> deletes a workspace within a minute of its last session ending '+
      'and the cascade takes the conversation with it. A library spanning conversations can only '+
      'exist if these rows sit outside that cascade, and they do: <code>artifacts</code> has '+
      'foreign keys to <code>users</code> and <code>organizations</code> and to nothing else. That '+
      'is why the library hangs off <b>You</b> rather than off a workspace — and why a card can '+
      'still be in a transcript whose workspace is gone.</p>'+

      '<h3>A poster, never a live frame</h3>'+
      '<div class="d-keep"><b>Non-negotiable, and the reason is security rather than taste.</b> An '+
      'artifact is untrusted HTML. In an unsandboxed frame it is same-origin with the app, which '+
      'puts the bridge within reach of it. It is also six page loads, six runtimes and six sets of '+
      'timers for a grid of six. The live bytes are mounted in exactly one place, and that place '+
      'is the viewer.</div>'+
      '<p>The viewer loads with <code>?ft-shot</code>, which asks the control plane not to inject '+
      'the annotation picker. It saves a 21 KB runtime and the HTML rewrite that produces it on '+
      'every open, and it caches correctly because the server puts the flag in the '+
      '<code>ETag</code> — the flag selects between two different bodies.</p>'+

      '<h3>No poster yet is an ordinary state</h3>'+
      '<p>A version is published before anything has photographed it, so a fresh library hits that '+
      'on every tile at once. It is a plate with the glyph on it and the words <i>no picture '+
      'yet</i>, not a broken-image icon and not an error. The same plate covers a poster that '+
      '404s — an old row whose bytes went with a deleted version — because the two are the same '+
      'thing to look at.</p>'+

      '<h3>Read, not managed</h3>'+
      '<p>No sharing, no directory, no grant. The <b>⋯</b> offers the address, earlier versions, '+
      'and the workspace that made it; under a rule it says where the rest is done. A greyed-out '+
      '<i>Share</i> is the clearest possible way to tell somebody they are being withheld from.</p>'+
      '<div class="d-flag"><b>Annotation is reachable and deliberately not taken.</b> The picker '+
      'wakes up when the page is framed by a parent that speaks for a panel, and selections do '+
      'reach native code that way. What is missing is the save: <code>KeepAnnotation</code> wants '+
      'an <code>ElementSnapshot</code> and a <code>port</code>, and an artifact carries a version '+
      'id rather than a port — so the mapping is a design question rather than a wiring one. A '+
      'composer that collects a note and drops it is worse than no composer.</div>'+
    '</div>';
}

function tabConnect() {
  const p = POSES[S.pose] || POSES.iphone;
  const other = { where:"who", reaching:"noroute", noroute:"notone", notone:"who",
    who:"locked", locked:"where" }[S.connect] || "who";
  return '<div class="d-stage"><div class="d-row">'+
      live(p.id, "connect")+
      plinth(POSES.iphone, connectScreen(POSES.iphone, Object.assign({}, S, { connect:other })),
        { noTabs:true, noBand:true, label:"Next in the flow", sub:"" })+
    '</div></div>'+
    '<div class="d-cap"><b>The first thing anybody sees.</b>'+
      '<span>Six steps. Where it is, then who you are there.</span>'+
      '<span>The copy is the desk’s; three lines are the phone’s own.</span></div>'+
    '<div class="d-note"><h2>Connecting to a Firetower</h2>'+
      '<p>Two questions, asked in order and never at the same time: <b>where</b> it is, then '+
      '<b>who you are</b> there. Only the first has an answer that is the same for everybody at a '+
      'company, and asking it first is what lets the app name <i>whose</i> Firetower you are about '+
      'to hand a password to — <code>/bootstrap</code> is unauthenticated and answers with the '+
      'organisation before anybody types.</p>'+
      '<p>One field takes the address, and it is an address rather than a code. A code carries no '+
      'address, and a fleet of self-hosted servers has nowhere to look one up that would not be a '+
      'hosted service holding every install’s whereabouts — which is the thing this architecture '+
      'exists to avoid.</p>'+

      '<div class="d-keep"><b>The copy is the desktop’s, deliberately.</b> This flow exists there '+
      'and is complete — eight steps on the First run tab, including the sign-in with its '+
      '<code>firetower passwd</code> line. A second wording of the same six screens is how two '+
      'clients come to disagree about what went wrong. Three lines are the phone’s own: the '+
      'cleartext notice, the mesh-VPN guidance on a failure, and <i>this phone</i> where the desk '+
      'says <i>this Mac</i>.</div>'+

      '<h3>Two failures, and they are different</h3>'+
      '<p><b>Nothing answered there</b> is the address reaching nothing on https or http. <b>That '+
      'is not a Firetower</b> is something answering that is not one — <code>/api/v1/bootstrap</code> '+
      'did not come back with a name and a version, so it may be a proxy in front of something '+
      'else. Collapsing them into "could not connect" throws away the only thing that says what to '+
      'do next.</p>'+
      '<p>Both are written as what to do rather than what went wrong, and the stack trace sits '+
      'under them in mono for the one person who wants it. On a phone the predicted failure is a '+
      'VPN that is off, so that is the first question asked.</p>'+

      '<h3>It says when an address is not encrypted</h3>'+
      '<p>A great many installs are <code>http://192.168.1.40:4400</code>, a <code>.local</code> '+
      'name or a Tailscale address. Both platforms block cleartext by default and the app allows '+
      'it on purpose — <code>NSAllowsLocalNetworking</code> and a '+
      '<code>network_security_config.xml</code> — so it owes you the fact. In '+
      '<code>--color-dim</code> and never as an error: an unencrypted address on a mesh VPN is a '+
      'normal way to run this, not a mistake.</p>'+

      '<h3>Replacing a password, which this app cannot do</h3>'+
      '<p>It happens once, under duress, on the control plane’s own interface. The app does not '+
      'carry a second copy of the screen that decides whether somebody can get in at all — two '+
      'implementations of that is one more than anybody can keep correct, and a browser is always '+
      'the same version as the server behind it. The address offered is the one that was typed to '+
      'find this server, because that is the address proven to work from this phone.</p>'+
      '<p>It is reached two ways, which is why it is a component rather than part of sign-in: at '+
      'the door, when the password just typed turns out to be temporary; and mid-session, when an '+
      'administrator resets a password under a running app. Without the second, the phone becomes '+
      'a wall of <i>could not reach the control plane</i> for a server that is answering '+
      'perfectly.</p>'+

      '<h3>What is not here</h3>'+
      '<p>No <i>name the organisation</i> and no <i>set up</i>. Those are a server’s first boot, '+
      'which <code>docs/which-surface.md</code> gives to the web — along with downloading the app '+
      'and signing in for the first time. A phone connects to a Firetower that exists.</p>'+
    '</div>';
}
/* ═══════════════════════════════════════════════════════════════════════════
   DRAW
   ═══════════════════════════════════════════════════════════════════════════ */
function bodyFor(id) {
  switch (id) {
    case "poses":     return tabPoses();
    case "index":     return tabIndex();
    case "art":       return tabArtifacts();
    case "connect":   return tabConnect();
    case "inbox":     return tabInbox();
    case "workspace": return tabWorkspace();
    case "duo":       return tabDuo();
    case "moving":    return tabMoving();
    case "repo":      return tabRepo();
    case "start":     return tabStart();
    case "you":       return tabYou();
    case "coverage":  return tabCoverage();
    case "spec":      return tabSpec();
    case "notes":     return tabNotes();
    default:          return "";
  }
}

const POSE_CHIPS = POSE_ORDER.map(id => [id, POSES[id].name.replace("Duo · ","")+" "+POSES[id].w]);

function subsFor(id) {
  const t = themeChips();
  switch (id) {
    case "index":
      return '<span class="d-legend">Press a tile to open it full size</span>'+
        '<span class="d-spacer"></span>'+t;
    case "art":
      return gos("Screen", [["goto:artifacts","The library"],["goto:artifact","Reading one"]], S.screen)+
        chips("Library", [["library","Has posters"],["fresh","None photographed yet"],
          ["none","Nothing published"]], "art", S.art)+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    case "connect":
      return chips("Step", [["where","Where is it"],["reaching","Looking"],["noroute","Nothing answered"],
        ["notone","Not a Firetower"],["who","Who are you"],["locked","Replace it"]], "connect", S.connect)+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    case "poses":
      return chips("Scale", [["1","100%"],["0.75","75%"],["0.55","55%"],["0.42","42%"],["0.3","30%"]],
        "scale", String(poseScale()))+
        '<span class="d-spacer"></span>'+t;
    case "inbox":
      return chips("Version", [["now","Now"],["next","Next"]], "era", S.era)+
        gos("State", [["filter:all","All"],["filter:waiting","Waiting"],["filter:working","Working"]], S.filter)+
        chips("Absence", [["ok","Has rows"],["loading","Loading"],["error","Unreachable"],["empty","Nothing yet"]], "mode", S.mode)+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    case "workspace":
      return gos("Composer", [["comp:rest","At rest"],["comp:open","Writing"],["comp:ask","An approval"],
        ["comp:working","Working"],["comp:dictate","Dictating"],["comp:viewer","Watching"]], S.comp)+
        gos("Over it", [["menu:","None"],["menu:attach","Attach"],["menu:ws","Workspace menu"],
          ["menu:servers","Switch server"]], S.menu||"")+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    case "duo":
      return chips("Pose", [["front","Front panel 466"],["innerp","Inner portrait 669"],
          ["innerl","Inner landscape 951"]], "duo", S.duo)+
        chips("System rail", [["true","Insets the content"],["false","Overlays it"]], "inset", String(S.inset))+
        chips("Column", [["inbox","Inbox"],["overview","This workspace"]], "side", S.side)+
        gos("Panel", [["rail", (S.rail === null ? band(POSES[S.duo]) === "dock" : S.rail)
          ? "Hide it" : "Show it"]], "")+'<span class="d-spacer"></span>'+t;
    case "moving":
      return '<span class="d-legend">Press a pose to play the change</span>'+
        chips("System rail", [["true","Insets"],["false","Overlays"]], "inset", String(S.inset))+
        '<span class="d-spacer"></span>'+t;
    case "repo":
      return gos("Tab", [["repo:diff","Diff"],["repo:files","Files"],["repo:ship","Commit"]], S.repo)+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    case "start":
      return gos("Screen", [["goto:new","New workspace"],["goto:tasks","Tasks"],
        ["goto:config","Config"],["goto:repos","Connect a repository"]], S.screen)+
        chips("New workspace", [["blank","Empty"],["task","From a task"],["norepo","No repository"]],
          "newstate", S.newstate)+
        chips("Repositories", [["list","The picker"],["noauth","Not authorised"]], "repos", S.repos)+
        chips("Trackers", [["ok","Connected"],["none","None connected"]], "tasks", S.tasks)+
        '<span class="d-spacer"></span>'+t;
    case "you":
      return gos("Screen", [["goto:you","You"],["menu:servers","Switching"]], S.screen)+
        chips("Pose", POSE_CHIPS, "pose", S.pose)+'<span class="d-spacer"></span>'+t;
    default:
      return '<span class="d-spacer"></span>'+t;
  }
}

/* The Poses tab fits five devices to whatever frame this is rendered in,
   until somebody picks a scale themselves. Every other tab is 1:1, because
   it shows one or two devices and they fit. */
function poseScale() { return S.scaleSet ? S.scale : S.autoScale; }

function draw() {
  document.getElementById("d-tabs").innerHTML = DTABS.map(([id, lab]) =>
    '<button class="d-chip" data-tab="'+id+'" aria-pressed="'+(S.tab===id)+'">'+esc(lab)+'</button>').join("");
  document.getElementById("d-subs").innerHTML = subsFor(S.tab);
  document.getElementById("d-stage").innerHTML = bodyFor(S.tab);
}

/* ── The fold, played slowly ───────────────────────────────────────────────
   A device does not pass through 540 points on its way from 466 to 669. The
   animation exists so the order the decisions fire in is visible.
   ──────────────────────────────────────────────────────────────────────── */
const STILL = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function morphTo(to) {
  const from = POSES[S.duo], target = POSES[to];
  if (STILL || from.id === target.id) { S.duo = to; draw(); return; }
  const t0 = performance.now(), dur = 700;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    S.morphW = Math.round(from.w + (target.w - from.w) * e);
    S.morphH = Math.round(from.h + (target.h - from.h) * e);
    const stage = document.getElementById("d-stage");
    if (stage) stage.innerHTML = bodyFor("moving");
    if (k < 1) requestAnimationFrame(tick);
    else { S.morphW = null; S.morphH = null; S.duo = to; draw(); }
  };
  requestAnimationFrame(tick);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-move]");
  if (t) morphTo(t.dataset.move);
});

/* The first view fits the frame it is rendered in.
   An artifact is shown in a frame anywhere from about 380px to a whole
   window, and five phones at 1:1 is 2900. The scale is computed from the
   width rather than guessed, and the chip row says what it came out as. */
function fitScale() {
  const w = document.documentElement.clientWidth - 60;
  const widest = POSE_ORDER.reduce((n, id) => n + POSES[id].w + 42, 0);
  const two = POSES.innerp.w + POSES.innerl.w + 110;
  /* The binding constraint at a narrow frame is the widest single device,
     because a row that cannot fit one makes the whole page scroll sideways
     and the masthead goes with it. */
  const want = Math.min(1, w / Math.max(two, widest / 2.2), (w - 20) / POSES.innerl.w);
  return [1, 0.75, 0.55, 0.42, 0.3].find(k => k <= want) || 0.3;
}
S.scale = 1;
S.autoScale = fitScale();
document.documentElement.dataset.theme = S.theme;
draw();
/* And again if the frame is resized. Only the Poses tab depends on it. */
let fitTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    const k = fitScale();
    if (k !== S.autoScale) { S.autoScale = k; if (S.tab === "poses") draw(); }
  }, 180);
});
</script>
</body>
