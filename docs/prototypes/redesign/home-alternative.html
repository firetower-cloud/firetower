:root{
  --desk:#ECEEF1;        /* the chrome the sheet sits on */
  --sheet:#FFFFFF;       /* the one white: the page you are reading */
  --raised:#F5F6F8;      /* a control, a chip, a hovered row */
  --sunk:#E6E8ED;        /* a pressed chip, a recessed track */
  --hair:#E3E5EA;        /* the rare hairline */

  --ink:#15161A;         /* a title, the one sentence     18.1:1 */
  --body:#45474F;        /* what somebody reads            9.3:1 */
  --quiet:#787B85;       /* secondary                      4.2:1 */
  --hush:#A4A7B1;        /* a timestamp. The faintest.     2.4:1 */

  --ember:#FF5E1A;       /* the only saturated thing on the screen */
  --ember-ink:#BF4714;   /* ember where it has to be read  5.1:1 */
  --brick:#B83A30;       /* and only when something broke  5.7:1 */
  /* Amber and brick's tint and deep, re-gated. These are globals.css's own
     names — the badge is composed the same way in both themes: the colour on
     its tint, inside its deep. Each light value holds a* and b* and moves L*
     until it reproduces the ratio its dark counterpart holds over the same
     neighbour. Figures in Spec. */
  --color-amber:#653400;      /* on its tint           8.76:1  (dark: 8.75) */
  --color-amber-soft:#A8780F; /* proposed — see Spec   3.92:1 on white */
  --color-amber-tint:#FCEBCE; /* on the sheet          1.17:1  (dark: 1.18) */
  --color-amber-deep:#B79045; /* border, on its tint   2.53:1  (dark: 2.52) */
  --color-brick-tint:#FFF3F2; /* on the sheet          1.09:1  (dark: 1.09) */
  --color-brick-deep:#F7A9A0; /* border, on its tint   1.74:1  (dark: 1.74) */

  /* Host marks. A brand, not a signal — the rule that a server is a mark and
     never a colour is about *Firetower* servers, and these are somebody
     else's logo. Two of the three needed a light value: GitHub's #f4f4f5
     measures 1.10:1 on white, and GitLab's orange 2.86:1, under the 3:1 floor
     for a non-text graphic. Each takes its own brand's light-mode mark rather
     than a derived one — a logo is not ours to reinterpolate. */
  --color-host-github:#1B1F23;  /* GitHub's own light mark   16.58:1 */
  --color-host-gitlab:#E24329;  /* GitLab's logo dark tone    4.14:1 */
  --color-host-gitea:#609926;   /* unchanged; it already clears 3.45:1 */
  --slate-ink:#44607E;   /* a pending change, and the control that made one */

  /* File kinds and chart series, re-gated for a white ground. Each is the
     dark hue with L* lowered, a* and b* held, until it clears the floor the
     dark set’s own weakest member clears on #111113 — 5.7:1 for a kind,
     4.8:1 for a series. Figures in the notes. */
  --color-kind-source:#4f688a; --color-kind-native:#8b5b39; --color-kind-data:#776520;
  --color-kind-style:#6b5f93; --color-kind-media:#37714d; --color-kind-store:#925178;
  --color-kind-prose:#65666f;
  --color-series-1:#2575bd; --color-series-2:#00825d; --color-series-3:#7465c1; --color-series-4:#ba4b76;

  /* Syntax. Each matches its own dark ratio against #111113, because here the
     ratios *are* the design — comment is deliberately the faintest. Chroma is
     capped at C* 34 so every one stays under the quietest loud signal. */
  --color-syn-comment:#878792; --color-syn-string:#2d5439; --color-syn-keyword:#65598e;
  --color-syn-type:#4c647d;    --color-syn-number:#5a4c14; --color-syn-fn:#895a37;
  --color-syn-attr:#676771;
  --touched:#EAF6EE;          /* a line this session wrote */
  --touched-ink:#2F7D52;

  --lift-1:0 1px 2px rgb(21 22 26 / .05);
  --lift-2:0 2px 6px rgb(21 22 26 / .06), 0 0 0 1px rgb(21 22 26 / .04);
  --lift-3:0 18px 44px -18px rgb(21 22 26 / .26), 0 2px 8px rgb(21 22 26 / .05);
  --window-lift:0 1px 1px rgb(21 22 26 / .10), 0 32px 70px -26px rgb(21 22 26 / .34);
  --scrim:linear-gradient(to top, var(--sheet) 62%, rgb(255 255 255 / 0));

  --swift:cubic-bezier(.16,1,.3,1);
  --quick:140ms;

  --font:"Archivo",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;

  color-scheme:light;
}
:root[data-theme="dark"]{
  --desk:#060608; --sheet:#131317; --raised:#1B1C20; --sunk:#232429; --hair:#2A2C31;
  --ink:#F5F5F7; --body:#C6C8CF; --quiet:#8B8E98; --hush:#60636D;
  --ember:#FF6B2C; --ember-ink:#FF9A6B; --brick:#E5645A;
  /* globals.css verbatim. --color-amber-soft is the one proposed addition and
     equals --color-amber here, so dark does not move at all. */
  --color-amber:#fab219; --color-amber-soft:#fab219; --color-amber-tint:#2a2008;
  --color-amber-deep:#7a5a0d; --color-brick-tint:#2a1414; --color-brick-deep:#6e2f2b;
  --color-host-github:#f4f4f5; --color-host-gitlab:#fc6d26; --color-host-gitea:#609926;
  --slate-ink:#7D95B0;
  --color-kind-source:#7b93b8; --color-kind-native:#b8845f; --color-kind-data:#c2ab63;
  --color-kind-style:#9a8cc4; --color-kind-media:#79b58d; --color-kind-store:#bd79a1;
  --color-kind-prose:#9a9aa4;
  --color-series-1:#3f86cf; --color-series-2:#1f9b74; --color-series-3:#8b7ad8; --color-series-4:#cc5c86;
  --color-syn-comment:#6a6a74; --color-syn-string:#8fb99a; --color-syn-keyword:#9a8cc4;
  --color-syn-type:#7d95b0;    --color-syn-number:#c2ab63; --color-syn-fn:#b8845f;
  --color-syn-attr:#8a8a94;
  --touched:#12251A; --touched-ink:#6EC08A;
  --lift-1:inset 0 1px 0 rgb(255 255 255 / .03);
  --lift-2:inset 0 1px 0 rgb(255 255 255 / .04), 0 1px 2px rgb(0 0 0 / .4);
  --lift-3:inset 0 1px 0 rgb(255 255 255 / .05), 0 18px 44px -18px rgb(0 0 0 / .72);
  --window-lift:0 0 0 1px rgb(255 255 255 / .06), 0 32px 70px -26px rgb(0 0 0 / .8);
  --scrim:linear-gradient(to top, var(--sheet) 62%, rgb(19 19 23 / 0));
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--desk)}
body{font-family:var(--font);color:var(--body);-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1;font-size:15px;line-height:1.6}
[role="button"]{cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;resize:none}
::placeholder{color:var(--hush)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:rgb(255 94 26 / .18)}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ═══════════════════════════════════════════════════════════════════
   TYPE — a scale, with tracking and leading set per size rather than
   one letter-spacing for everything.
   ═══════════════════════════════════════════════════════════════════ */
.t-display{font-size:40px;line-height:1.08;letter-spacing:-.028em;font-weight:530;color:var(--ink)}
.t-lede   {font-size:17px;line-height:1.58;letter-spacing:-.004em}
.t-name   {font-size:16px;line-height:1.35;letter-spacing:-.008em;font-weight:520;color:var(--ink)}
.t-body   {font-size:15px;line-height:1.6}
.t-ui     {font-size:14px;line-height:1.45}
.t-meta   {font-size:13px;line-height:1.4;letter-spacing:.004em;color:var(--hush)}
.t-micro  {font-size:11.5px;line-height:1.35;letter-spacing:.012em}
.num      {font-variant-numeric:tabular-nums}

</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   THE PAGE AROUND THE PROTOTYPE — a plain ground, a title, and the
   two controls that earn their place. Nothing else.
   ═══════════════════════════════════════════════════════════════════ */
.sheetpage{max-width:1480px;margin:0 auto;padding:40px clamp(16px,3vw,40px) 120px}
.head{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font-size:19px;line-height:1.3;letter-spacing:-.016em;font-weight:560;color:var(--ink)}
.head p{font-size:13.5px;color:var(--quiet);margin-top:3px;max-width:60ch}
.head .ctl{margin-left:auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--sunk)}
.seg button{height:28px;padding:0 12px;border-radius:8px;font-size:13.5px;color:var(--quiet);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background var(--quick) var(--swift),color var(--quick) var(--swift)}
.seg button:hover{color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--lift-1)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--raised)}

.stage{display:flex;justify-content:center;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;min-width:0;max-width:100%}
.stage[data-pan="true"]{justify-content:flex-start}
.fitbox{flex:none;overflow:hidden}
.scaler{transform-origin:top left;width:max-content}
.caption{margin-top:14px;font-size:12.5px;color:var(--hush);display:flex;gap:18px;flex-wrap:wrap}
.caption b{font-weight:500;color:var(--quiet)}

/* ═══════════════════════════════════════════════════════════════════
   THE WINDOW
   ═══════════════════════════════════════════════════════════════════ */
.win{position:relative;background:var(--desk);border-radius:12px;overflow:hidden;flex:none;
  box-shadow:var(--window-lift);display:flex;flex-direction:column;color:var(--body)}

/* The title bar spans the window. 78px of gutter is what the traffic
   lights need before anything may start — AppKit's number, not a taste. */
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding-right:12px;position:relative;z-index:6}

.hcol[data-bare="true"] .air{min-height:0;padding-bottom:26px}

/* The band above the composer.

   It holds one line and only ever one line: a greeting. It used to hold the
   page's whole answer to *is something waiting on me* — the sentence at 34px
   and the questions under it — and that is gone by the user's decision. What
   is left of the idea is still worth the name: the band is a reserved height
   so the composer sits at the same y on every state, and `--air` comes off the
   window height so a taller window buys more white above the greeting rather
   than a longer line of text. The measure is fixed; the air is not. */
.air{min-height:var(--air,192px);display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:28px}
.air h1{font-size:34px;line-height:1.14;letter-spacing:-.026em;font-weight:530;color:var(--ink)}
.air .sub{margin-top:9px;font-size:16.5px;line-height:1.55;color:var(--quiet);max-width:46ch}

/* The questions as the Dashboard draws them, kept for exactly one thing: the
   miniature in *Where waiting goes* that records what this page looked like
   before the decision. Nothing on the live page uses it. */
.air .asks{margin-top:18px;display:flex;flex-direction:column}
.air .ask{padding:10px 16px;margin:0 -16px;border-radius:13px;width:calc(100% + 32px)}
.air .ask + .ask{margin-top:2px}
.air .ask > .top > .dot{top:17px}
.air .ask .nm{font-size:15px}
.air .ask .q{margin-top:4px;font-size:15.5px;line-height:1.5}

/* ── The composer, in the middle ──────────────────────────────────
   The same card as the Dashboard's, the same shelf above it and the
   same footer under it. One difference, and it is the point: at rest
   it is three lines tall rather than one. A docked composer is a
   thing you reach for; a composer in the middle of the page is the
   thing you came to use, and it should look like somewhere to write
   rather than somewhere to type a command. */
.mid{position:relative;z-index:1;flex:none}
.mid .shelf{margin:0 14px -14px}
/* Softer than the docked card's. That one floats over a scrolling page and
   has to separate itself from moving text; this one sits in still white with
   content above and below it, where a 44px drop reads as a dialog. A hairline
   ring does the separating and the drop only says which way is up. */
.mid .composer{box-shadow:0 14px 36px -16px rgb(21 22 26 / .22), 0 2px 6px rgb(21 22 26 / .05)}
:root[data-theme="dark"] .mid .composer{box-shadow:var(--lift-3)}
.mid .composer .in{min-height:64px;font-size:17px}
.mid .composer .bar{margin-top:14px}

/* ── The two sections under the composer ─────────────────────────
   One shape, two contents. *Agents waiting for you* is work asking for you
   and *Recent artifacts* is work you made, so the actionable one goes first
   when both are there. Same heading, same size, same colour — the only thing
   that tells them apart is the ember on the chips, which is the one place in
   the product that colour is allowed to mean anything.

   The artifacts are posters, never live frames: an artifact is untrusted HTML
   and in a frame it is same-origin with the app. ArtifactShot.tsx says it at
   length and at the top, and the reason is security before it is taste. */
.sect{margin-top:20px;flex:none}
.sect:first-of-type{margin-top:22px}
.sect .hd{display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:14px;font-weight:400;color:var(--quiet);letter-spacing:.004em}
.sect .all{margin-left:auto;display:inline-flex;align-items:center;gap:3px;
  font-size:13.5px;color:var(--quiet);flex:none;transition:color var(--quick) var(--swift)}
.sect .all:hover{color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:14px}
.sect .none{margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--quiet);max-width:56ch}

/* ── Waiting somewhere you are not ────────────────────────────────
   Below the artifacts, not above them. It is about another Firetower,
   which is a tier below the one you are looking at — and putting it
   in the band would push a question out of it. */
.hcol .elsewhere{margin-top:10px;align-self:flex-start}

/* ── A waiting agent, as a chip ───────────────────────────────────
   A name and one timestamp, which is what a row is in this design, with the
   dot in front. The question itself is one press away rather than on the page.

   **Two dots, and no more.** The budget is three ember marks on screen at
   once and the rail's avatar can claim one, so the third waiting agent and
   everything after it joins a quiet chip at the end with a count and no dot.
   The rule is the system's own: anything past the budget is shape, weight or
   position, never another hue. Drawn in the *Four waiting* state. */
.chips{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;flex:none}
.chips .sw{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 14px;border-radius:99px;
  background:var(--raised);font-size:13.5px;color:var(--body);flex:none;max-width:306px;
  transition:background var(--quick) var(--swift)}
.chips .sw:hover{background:var(--sunk);color:var(--ink)}
.chips .sw b{font-weight:400;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips .sw .age{color:var(--hush);font-variant-numeric:tabular-nums;flex:none}
.chips .sw[data-over="true"]{color:var(--quiet)}

/* ═══════════════════════════════════════════════════════════════════
   THE PAGE AROUND IT — this document's own chrome
   ═══════════════════════════════════════════════════════════════════ */
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunk);flex-wrap:wrap;
  margin-bottom:18px;width:max-content;max-width:100%}
.tabs button{height:30px;padding:0 13px;border-radius:9px;font-size:13.5px;color:var(--quiet);
  white-space:nowrap;transition:background var(--quick) var(--swift),color var(--quick) var(--swift)}
.tabs button:hover{color:var(--body)}
.tabs button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--lift-1)}
:root[data-theme="dark"] .tabs button[aria-pressed="true"]{background:var(--raised)}

/* Everything here wraps. The frame an artifact is shown in can be 380px wide,
   and a control row that refuses to wrap sets a minimum width on the whole
   document — which is what pushed the window off the right edge at 420px and
   made the stage measure itself against a viewport that was not there. */
.bars{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin-bottom:22px;max-width:100%}
.bars .grp{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;min-width:0}
.seg{flex-wrap:wrap}
.head .ctl{min-width:0}
.lab{font-size:12.5px;color:var(--hush)}

.twoup{display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:nowrap}
.twoup .one{flex:none;min-width:0}
.twoup .cap{margin-bottom:10px;display:flex;align-items:baseline;gap:9px}
.twoup .cap b{font-size:14.5px;font-weight:530;color:var(--ink);letter-spacing:-.006em}
.twoup .cap s{text-decoration:none;font-size:12.5px;color:var(--hush)}
.squint .win{filter:blur(3px)}

/* ── A document tab ──────────────────────────────────────────────── */
.doc2{max-width:760px}
.doc2 h2{font-size:21px;line-height:1.25;letter-spacing:-.018em;font-weight:530;color:var(--ink);margin-top:44px}
.doc2 h2:first-child{margin-top:0}
.doc2 h3{font-size:16px;font-weight:530;color:var(--ink);letter-spacing:-.008em;margin-top:28px}
.doc2 p{font-size:14.5px;line-height:1.7;color:var(--body);margin-top:10px;max-width:70ch}
.doc2 p.q{color:var(--quiet)}
.doc2 ul{margin-top:10px;padding-left:19px}
.doc2 li{font-size:14.5px;line-height:1.7;color:var(--body);margin-top:5px;max-width:68ch}
.doc2 b{font-weight:530;color:var(--ink)}
.doc2 code{font-family:var(--mono);font-size:12.5px;background:var(--raised);padding:1px 5px;border-radius:5px}
.verdict{margin-top:16px;padding:16px 18px;border-radius:14px;background:var(--raised);
  border-left:2px solid var(--ink)}
.verdict b{display:block;font-size:14.5px;font-weight:530;color:var(--ink)}
.verdict p{margin-top:5px;font-size:14px;line-height:1.65;color:var(--body)}

/* The four answers, as miniatures you can press. */
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:26px 22px;margin-top:22px}
.ans{display:block;text-align:left;width:100%}
.ans .mini{display:block;width:100%;border-radius:12px;overflow:hidden;position:relative;
  background:var(--sheet);box-shadow:var(--lift-2);aspect-ratio:1280/824;
  transition:transform 220ms var(--swift),box-shadow 220ms var(--swift)}
.ans:hover .mini{transform:translateY(-3px);box-shadow:var(--lift-3)}
.ans[aria-pressed="true"] .mini{box-shadow:var(--lift-3),0 0 0 2px var(--ink)}
.ans .mini .inner{position:absolute;top:0;left:0;transform-origin:top left}
.ans .t{display:block;margin-top:11px;font-size:14.5px;color:var(--ink);letter-spacing:-.006em;font-weight:500}
.ans .d{display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--quiet)}
.ans .v{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--quiet)}
.ans .v i{width:5px;height:5px;border-radius:99px;flex:none;background:var(--hush)}
.ans .v[data-good="yes"] i{background:var(--touched-ink)}
.ans .v[data-good="no"] i{background:var(--brick)}

/* The contact sheet. Every state, a third of the way up. */
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:28px 22px;margin-top:20px}
.cell{display:block;text-align:left;width:100%}
.cell .mini{display:block;width:100%;border-radius:10px;overflow:hidden;position:relative;
  background:var(--sheet);box-shadow:var(--lift-2);aspect-ratio:1280/824;
  transition:transform 200ms var(--swift),box-shadow 200ms var(--swift)}
.cell:hover .mini{transform:translateY(-2px);box-shadow:var(--lift-3)}
.cell .mini .inner{position:absolute;top:0;left:0;transform-origin:top left}
.cell .t{display:block;margin-top:9px;font-size:13.5px;color:var(--ink);letter-spacing:-.005em}
.cell .d{display:block;margin-top:2px;font-size:12.5px;color:var(--quiet)}
.secthead{margin-top:38px;font-size:14px;color:var(--quiet)}
.secthead:first-child{margin-top:0}

/* A banner that says what this page is not. */
.invented{margin-bottom:22px;padding:13px 16px;border-radius:12px;background:var(--raised);
  font-size:13px;line-height:1.6;color:var(--quiet);max-width:none}
.invented b{color:var(--ink);font-weight:530}

</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════
   An alternative home for the Firetower desktop app.

   A greeting, a composer in the middle of the page, and two sections
   under it: the agents waiting for you, then the artifacts you made.

   Every name, question, title and timestamp below is invented. The
   shapes follow Session, Workspace and Artifact in
   desktop/src/api/generated/model, and the world is the same one the
   accepted artifact uses, so the two can be compared row for row.
   ═══════════════════════════════════════════════════════════════════ */

const TOWERS=[
 {id:"nw",org:"Northwind",mark:"Nw",who:"kevin@northwind.co",reach:"live",waiting:2,working:4},
 {id:"ld",org:"Ledger",mark:"Le",who:"kevin@ledger-ops.com",reach:"live",waiting:1,working:2},
];
const ASKS=[
 {id:"w1",name:"Quota meter rounding",age:"12m",agent:"claude",
  q:"The amber band starts at 80% of the soft limit. Should a plan with no soft limit show the band at all, or stay neutral until it hits the hard one?"},
 {id:"w3",name:"Light mode for the whole app",age:"41m",agent:"claude",
  q:"Three of the file colours are too pale to read on a white page. Darken them, or give light mode its own set?"},
];
/* Four, for the ember budget. The third and fourth never get a dot. */
const ASKS4=[...ASKS,
 {id:"w7",name:"Ship the skill bundle",age:"1h",agent:"codex",q:"Two skills declare the same hook."},
 {id:"w8",name:"A deliberately long workspace name that will not fit in a chip",age:"2h",agent:"cursor",q:"Which branch?"},
];
const WORKING=[
 {id:"w5",name:"Poke at the deploy script",age:"8m",live:true,agent:"shell",branch:null,where:"Firetower’s machine",repo:null},
 {id:"w6",name:"Reconcile the webhook retries",age:"2h",live:true,agent:"cursor",branch:"fix/webhook-retry",where:"build-01",repo:"acme/ledger-sync"},
 {id:"w2",name:"Backfill the invoice index",age:"3h",live:true,agent:"codex",branch:"chore/invoice-index",where:"Firetower’s machine",repo:"northwind/api"},
 {id:"w4",name:"Composer context meter",age:"1d",live:false,agent:"claude",branch:"feat/context-meter",where:"Firetower’s machine",repo:"northwind/web"},
];
const ARTS=[
  {t:"Quota meter, four shapes", v:3, from:"Quota meter rounding", age:"12m", p:"chart"},
  {t:"Light mode token sheet", v:7, from:"Light mode for the whole app", age:"41m", p:"sheet"},
  {t:"Invoice index — before and after", v:2, from:"Backfill the invoice index", age:"3h", p:"diff"},
];
/* A tile is 212px wide at 1280 and a title that does not fit is the
   ordinary case, not the edge one. This state is also what caught a
   real bug — see the note above `.three` in the stylesheet. */
const ARTS_LONG=[
  {t:"A deliberately long artifact title that runs past the end of its tile", v:1, from:"Composer context meter", age:"1d", p:"report"},
  {t:"Webhook retry timeline", v:1, from:"Reconcile the webhook retries", age:"2h", p:null, pending:true},
  {t:"Context meter at six fill levels", v:5, from:"Composer context meter", age:"1d", p:"timeline"},
];
const WORDS=["no","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];

const DEST=[
 {id:"home",label:"Dashboard",icon:"house",key:"1"},
 {id:"tasks",label:"Tasks",icon:"list-todo",key:"2"},
 {id:"artifacts",label:"Artifacts",icon:"shapes",key:"3"},
 {id:"skills",label:"Skills",icon:"puzzle",key:"4"},
];
const FOOT=[
 {id:"config",label:"Configuration",icon:"settings"},
 {id:"updates",label:"Updates",icon:"download",news:true},
];

/* ── What the page is showing ────────────────────────────────── */
const S={
  tab:"home", theme:"light", w:1280,
  state:"waiting",   // see STATES
  when:null,         // null = off the clock; morning | afternoon | evening
  order:"waiting",   // which section comes first
  squint:false,
  legacy:false,      // the band as it was before the decision — one miniature
};
/* `air` is the reserved band. It holds one line now, so it is smaller
   than the version that held the questions; `airLegacy` is what that
   version needed, and the gap between the two is the space the page
   got back. */
const WIN={1280:{w:1280,h:824,air:192,airLegacy:280},
           1680:{w:1680,h:960,air:258,airLegacy:344}};

const asks = () => S.state==="waiting"||S.state==="noart" ? ASKS
                 : S.state==="waiting4" ? ASKS4 : [];
const working= () => S.state==="fresh" ? [] : WORKING;
const arts   = () => (S.state==="noart"||S.state==="fresh") ? []
                   : S.state==="noposter" ? ARTS.map(a=>({...a,p:null,pending:true}))
                   : S.state==="long"   ? ARTS_LONG
                   : ARTS;
const elsewhere = () => asks().length ? [TOWERS[1]] : [];

/* ── The greeting ────────────────────────────────────────────────
   Always a greeting, never a status. The same sentence whether four
   agents are waiting or none are — the user's decision, and the
   reasoning and what it costs are in *Where waiting goes*.

   Three variants off the machine's own clock. The boundaries are the
   ordinary ones and the late-night window is the only interesting
   call: 00:00–04:59 takes *evening* rather than a fourth greeting,
   because a fourth is a joke and a joke you cannot dismiss gets old
   by the third night. */
const GREETINGS={morning:"Good morning",afternoon:"Good afternoon",evening:"Good evening"};
function partOfDay(){
  if(S.when) return S.when;
  const h=new Date().getHours();
  return h<5 ? "evening" : h<12 ? "morning" : h<18 ? "afternoon" : "evening";
}

/* ── The rail ────────────────────────────────────────────────── */
function railIcon(name,on){
  const d=ICONS[name]; if(!d) return "";
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="${on?2:1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
function rail(){
  const el=elsewhere();
  const btn=(d,on)=>`<button class="rbtn" aria-current="${on?"page":"false"}"
    title="${d.label}${d.key?`   ⌘${d.key}`:""}" aria-label="${d.label}">
    ${railIcon(d.icon,on)}${d.news?`<span class="news" title="A newer build is out"></span>`:""}</button>`;
  return `<nav class="rail" aria-label="Destinations">
    ${DEST.map(d=>btn(d,d.id==="home")).join("")}
    <span class="sep"></span>
    ${FOOT.map(d=>btn(d,false)).join("")}
    <span class="rgrow"></span>
    <button class="avatar" aria-haspopup="menu" aria-expanded="false"
      title="Kevin Piacentini — Northwind${el.length?" · someone is waiting elsewhere":""}">
      <span class="face">KP</span>
      ${el.length?`<span class="dot" style="position:absolute;top:4px;right:3px;box-shadow:0 0 0 2.5px var(--desk)"></span>`:""}
    </button>
  </nav>`;
}

/* ── The panel ───────────────────────────────────────────────────
   Unchanged from the accepted design. A workspace that is waiting on
   you is the brightest text tier in medium weight, never a second
   ember dot. */
function panel(){
  const mine=[...asks().map(a=>({...a,hot:true})),...working().filter(w=>!w.repo||!w.repo.startsWith("acme"))];
  const shared=working().filter(w=>w.repo&&w.repo.startsWith("acme"));
  const row=w=>`<button class="prow ${w.hot?"hot":""}" title="${esc(w.name)}${w.hot?" — waiting on you":""}">
    <span class="lbl">${esc(w.name)}</span><span class="age">${w.age}</span></button>`;
  return `<div class="phead">
      <span class="nm">Workspaces</span>
      <button class="gbtn" title="Find anything   ⌘P" aria-label="Find anything">${ic("search",15)}</button>
      <button class="gbtn" title="Hide this panel   ⌘\\" aria-label="Hide this panel">${ic("panel-left-close",15)}</button>
    </div>
    <div class="pscroll">
      <button class="prow strong"><span style="width:8px;flex:none;display:grid;place-items:center;color:var(--quiet)">${ic("pencil",14)}</span><span class="lbl">New workspace</span><span class="kbd">⌘N</span></button>
      ${mine.length?`<div class="plabel"><span>Recent</span></div>${mine.map(row).join("")}`
        :`<p style="padding:14px 9px;font-size:13.5px;color:var(--quiet)">Nothing running yet.</p>`}
      ${shared.length?`<div class="plabel"><span>Shared with you</span></div>${shared.map(row).join("")}`:""}
    </div>`;
}

/* ── The composer ────────────────────────────────────────────────
   Firetower's, not Claude's. The shelf above carries the repository
   and the machine — on this page those choices are unmade, and
   making them is the act of starting work. The footer carries who
   does it and how. Claude's home has neither, because it has nothing
   to decide: its model row is a preference, ours is what the thing
   will be.

   `mid` is the centred variant. Same card, three lines tall at rest.  */
function composer(mid){
  return `<div class="${mid?"mid":"dock"}">${mid?"":`<div class="wrap">`}
    <div class="shelf">
      <button class="sc" data-set="true">
        <span class="ic">${ic("folder-git-2",15)}</span>northwind/api${ic("chevron-down",13)}</button>
      <button class="sc" data-set="true">
        <span class="ic">${ic("monitor",15)}</span>Firetower’s machine<span class="ok" title="Ready"></span>${ic("chevron-down",13)}</button>
    </div>
    <div class="composer">
      <div class="in" contenteditable="true" role="textbox" aria-label="Start something new"
        data-ph="Start something new…"></div>
      <div class="bar">
        <button class="chip" title="Attach a file or an image" aria-label="Attach a file or an image">${ic("paperclip",16)}</button>
        <button class="chip"><span class="ic">${ic("users-round",15)}</span>Just an agent${ic("chevron-down",13)}</button>
        <button class="chip" data-set="true"><span class="ic">${AGENT.claude(14)}</span>Claude Code · Opus 5${ic("chevron-down",13)}</button>
        <button class="chip" style="margin-left:auto" title="Dictate" aria-label="Dictate">${ic("mic",16)}</button>
        <button class="send" title="Start it   ⏎" aria-label="Start it">${ic("arrow-up",17)}</button>
      </div>
    </div>
  ${mid?"":`</div>`}</div>`;
}

/* ── A poster, never a live frame ────────────────────────────────
   An <img> against a picture rendered once per version. Two degraded
   states are drawn. *Not photographed yet* carries a moving bar,
   because something is coming; *cannot be photographed* does not,
   because nothing is. A fresh install hits the first on every tile at
   once, which is why it is a state here rather than an edge case. */
function shot(a){
  if(a.p) return `<span class="shot" data-has="true" aria-hidden="true">
    <img class="pic" alt="" decoding="async"
      src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(poster(a.p))}"></span>`;
  return `<span class="shot" data-has="false" aria-hidden="true">
    <span class="plate">${ic("shapes",22)}</span>
    ${a.pending?`<span class="pending"><i></i></span>`:""}</span>`;
}
function tile(a){
  return `<button class="art" title="${esc(a.t)}">
    ${shot(a)}
    <span class="nm">${esc(a.t)}</span>
    <span class="mt"><span class="from">${esc(a.from)}</span><span class="age">${a.age}</span></span>
  </button>`;
}

/* ── The band ────────────────────────────────────────────────── */
function band(){
  /* The version before the decision, kept for one miniature in
     *Where waiting goes*. Nothing on the live page reaches it. */
  if(S.legacy){
    const a=asks(), w=working();
    if(!a.length) return `<div class="air">
      <h1>${WORDS[w.length]} agents are working.</h1>
      <p class="sub">Nothing needs you right now.</p></div>`;
    return `<div class="air">
      <h1>${WORDS[a.length]} agent${a.length>1?"s":""} ${a.length>1?"are":"is"} waiting on you.</h1>
      <div class="asks">${a.slice(0,2).map(x=>`
        <button class="ask">
          <span class="top"><span class="dot"></span><span class="nm">${esc(x.name)}</span><span class="age">${x.age}</span></span>
          <span class="q" style="display:block">${esc(x.q)}</span>
        </button>`).join("")}</div></div>`;
  }
  return `<div class="air"><h1>${GREETINGS[partOfDay()]}, what should we work on?</h1></div>`;
}

/* ── Agents waiting for you ──────────────────────────────────────
   Two chips carry a dot and everything past that is a count without
   one. The budget is three ember marks on screen and the rail's
   avatar can take the third. */
const DOTTED=2;
function waitingSection(){
  const a=asks();
  if(!a.length) return "";
  const over=a.length-DOTTED;
  return `<section class="sect">
    <div class="hd"><h2>Agents waiting for you</h2></div>
    <div class="chips">
      ${a.slice(0,DOTTED).map(x=>`<button class="sw" title="${esc(x.name)} — ${esc(x.q)}">
        <span class="dot"></span><b>${esc(x.name)}</b><span class="age">${x.age}</span></button>`).join("")}
      ${over>0?`<button class="sw" data-over="true" title="${over} more waiting">
        <b>${over} more</b></button>`:""}
    </div>
  </section>`;
}

function artifactsSection(){
  const ar=arts();
  /* First run gets nothing at all — not a heading over three grey plates, and
     not a sentence explaining what artifacts are. The composer is the only
     thing to do and the page says so by having nothing else on it. */
  if(!ar.length) return asks().length ? `<section class="sect">
    <p class="none">Nothing published yet. Ask an agent to show you something and the page it makes lands here.</p>
  </section>` : "";
  return `<section class="sect">
    <div class="hd"><h2>Recent artifacts</h2>
      <button class="all">View all${ic("chevron-right",14)}</button></div>
    <div class="three">${ar.map(tile).join("")}</div>
  </section>`;
}

/* ── The home ────────────────────────────────────────────────── */
function home(){
  const el=elsewhere();
  const a=S.legacy ? "" : waitingSection(), r=artifactsSection();
  const bare = !asks().length && !arts().length;
  /* In the record miniature the questions are in the band, so the chips
     section must not also be there — it would show both answers at once and
     the comparison would be of a page that never existed. */
  return `<div class="home"><div class="hcol" data-bare="${bare}">
    ${band()}
    ${composer(true)}
    ${S.order==="waiting" ? a+r : r+a}
    ${el.length?`<button class="elsewhere">
      <span>${WORDS[el[0].waiting]} more waiting in <b>${el[0].org}</b> — you are not in it</span>
      <span class="go">Switch${ic("chevron-right",13)}</span>
    </button>`:""}
  </div></div>`;
}

/* ── The Dashboard as it stands ──────────────────────────────────
   A rebuild, not a screenshot — the markup and the stylesheet are
   lifted from docs/prototypes/redesign/desktop-redesign.html so the
   two pages are drawn by the same hand and the comparison is fair.
   It is the accepted design and nothing here proposes changing it. */
function dashboard(){

  if(!a.length&&!w.length) return `<div class="blank"><div class="in">
      <span class="glyph">${ic("terminal",24)}</span>
      <h2>What should we build?</h2>
      <p>Describe it, and an agent starts on it in its own copy of the code.</p>
    </div></div>${composer(false)}`;
  const head = a.length
    ? `<h1 class="t-display">${WORDS[all.length]} agent${all.length>1?"s":""} ${all.length>1?"are":"is"} waiting on you.</h1>`
    : `<h1 class="t-display">${WORDS[w.length]} agents are working.</h1>
       <p class="hero-sub">Nothing needs you right now.</p>`;
  return `<div class="scroll"><div class="col">
    ${head}
    ${a.length?`<div class="asks">${a.map(x=>`
      <button class="ask">
        <span class="top"><span class="dot"></span><span class="nm">${esc(x.name)}</span><span class="age">${x.age}</span></span>
        <span class="q" style="display:block">${esc(x.q)}</span>
      </button>`).join("")}</div>`:""}
    ${el.length?`<button class="elsewhere">
      <span>${WORDS[el[0].waiting]} more waiting in <b>${el[0].org}</b> — you are not in it</span>
      <span class="go">Switch${ic("chevron-right",13)}</span>
    </button>`:""}
    ${w.length?`<section class="also">
      <h2>${a.length?`${WORDS[w.length]} other${w.length>1?"s":""} ${w.length>1?"are":"is"} still working`:"Working"}</h2>
      <div class="rows">${w.map(x=>`
        <button class="wrow">
          <span class="top">
            <span class="nm">${esc(x.name)}</span>
            ${x.live?`<span class="typing" title="Working now"><i></i><i></i><i></i></span>`:""}
            <span class="age">${x.age}</span>
          </span>
          <span class="more"><span>
            <i>${AGENT[x.agent](13)}</i>
            ${x.branch?`<span class="br">${x.branch}</span>`:`<span>no branch yet</span>`}
            <i>${ic("monitor",13)}</i><span>${x.where}</span>
          </span></span>
        </button>`).join("")}</div>
    </section>`:""}

}

/* ── The window ──────────────────────────────────────────────── */
function win(which,dims){
  const d=dims||WIN[S.w];
  const air = (which!=="dash" && S.legacy) ? d.airLegacy : d.air;
  return `<div class="win" style="width:${d.w}px;height:${d.h}px;--air:${air}px">
    <div class="titlebar">
      <span class="lights"><i></i><i></i><i></i></span>
      <button class="ftid" title="Switch Firetower">

        <span class="org">Northwind</span><span class="sep">/</span><span class="who">kevin@northwind.co</span>
        <span style="color:var(--hush);display:grid">${ic("chevron-down",13)}</span>
      </button>
      <span class="tb-right">
        <button class="gbtn" title="Hide the panel   ⌘\\">${ic("panel-left",15)}</button>
      </span>
    </div>
    <div class="body">
      ${rail()}
      <div class="panel">${panel()}</div>
      <main class="sheet">${which==="dash"?dashboard():home()}</main>

/* ── The page around it ──────────────────────────────────────── */
const TABS=[
  ["home","The home"],
  ["side","Beside the Dashboard"],
  ["where","Where waiting goes"],
  ["states","Every state"],
  ["notes","Notes"],
];
const STATES=[
  ["waiting","Two waiting"],
  ["waiting4","Four waiting"],
  ["calm","Nothing waiting"],
  ["noart","No artifacts yet"],
  ["fresh","Nothing at all"],
  ["noposter","No posters yet"],
  ["long","A title that does not fit"],
];
const WHENS=[["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"]];
const MINI={w:1280,h:824,air:192,airLegacy:280};

function seg(act,items,now){
  return `<span class="seg">${items.map(([id,l])=>
    `<button data-act="${act}" data-v="${id}" aria-pressed="${now===id}">${l}</button>`).join("")}</span>`;
}

function tabHome(){
  const d=WIN[S.w];
  const both = asks().length && arts().length;
  return `<div class="bars">
      <span class="grp"><span class="lab">State</span>${seg("state",STATES,S.state)}</span>
      <span class="grp"><span class="lab">Greeting</span>${seg("when",WHENS,partOfDay())}</span>
      <span class="grp"><span class="lab">Window</span>${seg("w",[["1280","1280 × 824"],["1680","1680 × 960"]],String(S.w))}</span>
      ${both?`<span class="grp"><span class="lab">Order</span>${seg("order",[["waiting","Waiting first"],["artifacts","Artifacts first"]],S.order)}</span>`:""}
    </div>
    <div class="stage"><div class="fitbox"><div class="scaler">${win("home",d)}</div></div></div>
    <p class="caption"><b>${d.w} × ${d.h}</b>
      <span>The greeting is the same sentence on every state; the sections under it are what change.</span>
      <span>Every name, question and timestamp is invented.</span></p>`;
}

function tabSide(){
  return `<div class="bars">
      <span class="grp"><span class="lab">State</span>${seg("state",STATES.slice(0,5),S.state)}</span>
      ${seg("squint",[["off","Reading distance"],["on","From across the room"]],S.squint?"on":"off")}
    </div>
    <p class="invented">The right-hand window is <b>the Dashboard as accepted</b> — rebuilt here from
      <code>desktop-redesign.html</code>'s own markup and stylesheet, so both pages are drawn by the
      same hand and neither is flattered. <b>From across the room</b> is a blur, not a measurement.
      It is here to make the one thing this change costs visible rather than arguable: squint at the
      pair and the Dashboard still says <i>something wants you</i>, while the proposal says
      <i>a page with an input on it</i>.</p>
    <div class="stage ${S.squint?"squint":""}"><div class="fitbox"><div class="scaler">
      <div class="twoup">
        <div class="one">
          <div class="cap"><b>The proposal</b><s>a greeting, a composer, two sections</s></div>
          ${win("home",MINI)}
        </div>
        <div class="one">
          <div class="cap"><b>The Dashboard today</b><s>accepted, and shipped</s></div>
          ${win("dash",MINI)}
        </div>
      </div>
    </div></div></div>`;
}

function tabWaiting(){
  const wasL=S.legacy, wasS=S.state;
  S.state="waiting";
  S.legacy=true;  const before=win("home",MINI);
  S.legacy=false; const after =win("home",MINI);
  S.legacy=wasL; S.state=wasS;
  const mini=(html,t,d)=>`<div class="ans">
      <span class="mini"><span class="inner" style="width:1280px;height:824px">${html}</span></span>
      <span class="t">${t}</span><span class="d">${d}</span></div>`;
  return `<div class="doc2">
    <h2>If the composer takes the centre, where does “two agents are waiting on you” go?</h2>
    <p>That was the whole of this change. A centred input is not hard to draw and it is not what
      anybody argues about. The Dashboard opens with a sentence because <b>an agent that has
      stopped is only expensive if nobody is there</b>, and the interface is built so <i>is
      something waiting on me</i> is answerable from across the room.</p>
    <p><b>It is settled, and this is the record of it.</b> Four answers were drawn: the sentence and
      the questions in a reserved band above the composer; an ember-dotted strip beneath it; two
      different pages depending on whether anything waits; and a count on the rail. The first was
      recommended. The decision went the other way, and what is drawn now is a fifth answer —
      <b>the waiting agents are a section under the composer, wearing the same small heading as the
      artifacts and carrying the same small chips. The headline is always a greeting and never a
      status.</b></p>
  </div>
  <div class="four" style="max-width:1120px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
    ${mini(before,"What was recommended","The sentence at 34px with the agents’ own questions under it, in a band that reserved room for them. The composer sat 88px lower and the artifacts were below the fold.")}
    ${mini(after,"What is drawn now","A greeting, and the waiting agents as a section of chips under the composer. The headline reports nothing, and the whole page fits.")}
  </div>
  <div class="doc2">
    <h3>What it costs, plainly</h3>
    <p>The product’s central question is demoted from the largest type on the page to a peer of
      <i>Recent artifacts</i>. Measured against the Dashboard that ships: the answer to <i>is
      something waiting on me</i> goes from <b>34px of ink about 12% of the way down the window</b>
      to <b>13.5px of text about 63% of the way down</b>, and the agent’s own question — the
      sentence that usually tells you whether this is ten seconds of work or an hour — leaves the
      page entirely and becomes a tooltip and a click. Open <b>Beside the Dashboard</b> and turn
      the blur on; that is the honest picture of the trade.</p>
    <p>A smaller and sharper cost. Both sections now wear the same heading at the same size in the
      same colour, so <b>the only thing distinguishing work that wants you from work you made is an
      8px dot</b>. That is a great deal of weight on one mark, and it is the first thing I would
      watch once somebody has lived with it for a week.</p>

    <h3>What still carries the thesis</h3>
    <p>More than the page alone suggests, and this is why the decision is defensible rather than
      merely made.</p>
    <ul>
      <li><b>The ember dot on each chip.</b> Small, but still the only saturated colour in the
        product and still meaning exactly one thing.</li>
      <li><b>The rail’s avatar dot</b>, for an agent waiting in a Firetower you are not in.
        Unchanged.</li>
      <li><b>The dock badge and the menu-bar island</b> — which are the real answer to <i>across
        the room</i>, and always were. <code>App.tsx:85</code> sums the waiting count across
        <b>every</b> server and pushes it to <code>bridge.setBadge</code>; <code>:97</code> feeds
        <code>islandState(fleet)</code> the same way. Neither is touched by this change, so the
        machine-wide question is still answerable <b>without the window open at all</b> — which is
        a stronger guarantee than a headline inside a window you may not be looking at.</li>
      <li><b>The panel</b>, two inches to the left, which still lists a waiting workspace at the
        brightest text tier in medium weight.</li>
    </ul>
    <p>The honest summary: the thesis survives, but it now lives in the chrome and in the operating
      system rather than in the page. That is a real move and it is worth making knowingly.</p>

    <h3>Two things I would still argue</h3>
    <p><b>The order of the sections.</b> Drawn with <i>Agents waiting for you</i> first, which I
      recommend: one is work asking for you and the other is work you made, and the actionable one
      goes first. The <b>Order</b> control on <b>The home</b> flips it, and the reversed version is
      the last tile in <b>Every state</b>. Artifacts-first reads calmer, and it is wrong for the
      same reason a quiet smoke alarm is wrong.</p>
    <p><b>The ember budget.</b> Two chips carry a dot; everything past that is a count with no dot —
      the Dashboard’s own rule, carried over. <b>Four waiting</b> in <b>Every state</b> draws it.
      Without the cap a busy morning puts five ember dots in a row directly under the composer,
      which is the exact failure the first round of this design was rejected for.</p>
  </div>`;
}

function tabStates(){
  const wasS=S.state, wasO=S.order;
  /* A div with role=button rather than a <button>. The window inside it
     contains buttons of its own, and a nested <button> start tag makes the
     parser close the outer one — so the whole window escaped the cell and the
     grid collapsed to a column of full-size windows. Found by rendering it. */
  const cell=(label,note)=>`<div class="cell" role="button" tabindex="0"
      data-act="open" data-s="${S.state}" data-o="${S.order}"
      aria-label="${label} — open full size">
      <span class="mini"><span class="inner" style="width:1280px;height:824px">${win("home",MINI)}</span></span>
      <span class="t">${label}</span><span class="d">${note}</span>
    </div>`;
  const cells=STATES.map(([sid,st])=>{ S.state=sid; S.order="waiting"; return cell(st,noteFor(sid)); }).join("");
  S.state="waiting"; S.order="artifacts";
  const flipped=cell("Artifacts first","The order reversed, for comparison. Not recommended — see Where waiting goes.");
  S.state=wasS; S.order=wasO;
  return `<p class="invented">Every state of the page, at a third scale, plus the reversed section
    order. Press one to open it full size on <b>The home</b>. A tab row says where you can go and
    never what is there, which is why this sheet exists.</p>
    <div class="sheetgrid">${cells}${flipped}</div>`;
}
function noteFor(id){
  return {
    waiting:"Both sections, waiting first. The ordinary busy morning.",
    waiting4:"Two chips carry a dot; the rest become a count. The ember budget, drawn.",
    calm:"No waiting heading at all — an empty section is furniture.",
    noart:"Waiting, and nothing published yet. A sentence, not three grey plates.",
    fresh:"First run. A greeting and a composer, and it has to read as deliberate.",
    noposter:"A fresh install hits this on every tile at once. The bar says one is coming.",
    long:"A title that does not fit. This state caught a real grid bug — see the stylesheet.",
  }[id]||"";
}

function tabNotes(){
  return `<div class="doc2">
    <h2>What I took from Claude’s home, and what I did not</h2>
    <p><b>Taken.</b> The input in the middle of the page rather than docked at the foot of a list.
      Its generosity — three lines tall at rest, not one, because a composer you are meant to write
      in should look like somewhere to write. A greeting above it rather than a page title. A
      microphone at the lower right of the footer. A quiet <b>Recent artifacts</b> section below,
      left-aligned, with <b>View all</b> at the far right and three poster cards side by side, each
      a picture over a title and a date. And the overall calm: almost no chrome between the edge of
      the page and the one thing on it.</p>
    <p><b>Not taken.</b></p>
    <ul>
      <li><b>The serif headline and the ✳ beside it.</b> Firetower has one family, Archivo, and a
        second face for one sentence is a costume. The mark beside it is ornament, and this page
        already has an ember dot that has to be the loudest thing on it.</li>
      <li><b>Centred text.</b> Claude’s headline is centred over a centred input. The column here is
        centred and the text in it is not, because the chips and the artifact grid under the
        composer both start at a left edge. One alignment.</li>
      <li><b>The model, effort and mode row as plain words under the input.</b> Firetower splits that
        row in two on purpose, and the split is in the handoff: the <b>shelf</b> above carries the
        repository and the machine, which on this page are <i>unmade decisions</i> — making them is
        the act of starting work — and the <b>footer</b> carries who does it and how. Claude’s row is
        preferences; ours is what the thing will be.</li>
      <li><b>The waveform control.</b> It is the handle on Claude’s voice mode, which Firetower has no
        equivalent of. The microphone is drawn because dictation exists in the app; the waveform is
        not, because drawing a control for a feature that does not exist is how a prototype turns
        into a promise.</li>
      <li><b>No rail.</b> Claude’s home has nothing down the left. Dropping Firetower’s six
        destinations and its workspace panel to match would not be an alternative home, it would be
        an alternative application.</li>
    </ul>

    <h2>The greeting</h2>
    <p>Three variants off the machine’s own clock, all drawn — the <b>Greeting</b> control on
      <b>The home</b> switches between them. The boundaries are the ordinary ones:</p>
    <ul>
      <li><b>Good morning</b> — 05:00 to 11:59</li>
      <li><b>Good afternoon</b> — 12:00 to 17:59</li>
      <li><b>Good evening</b> — 18:00 to 04:59</li>
    </ul>
    <p>The only interesting call is the late-night window. <b>00:00 to 04:59 takes “Good evening”</b>
      rather than a fourth greeting. “Still up?” is funnier the first time than the fifth, and a
      joke you cannot dismiss is a joke that is always on. It is set against the clock and against
      nothing stored — no preference, no endpoint, one call to <code>Date.getHours()</code>.</p>
    <p><b>Should it vary at all?</b> Yes, and only just — I argued it both ways and came down on
      varying. A fixed sentence is one fewer thing that can be wrong, and a greeting that changes
      under you while the app sits open at 11:58 is a small strangeness nobody asked for. But the
      home is the one screen in this product allowed to be warm, and the point of the change is to
      make starting work feel like starting work rather than like clearing a queue. It is the
      cheapest warmth available, and when it is wrong it is wrong harmlessly.</p>
    <p>One thing I did not do: <b>no name in it.</b> “Good afternoon, Kevin” is available — the app
      knows — and it is the standard next step, and it is the step where a greeting stops reading as
      a product and starts reading as a mail merge. The user’s own wording carried no name.</p>

    <h2>What I think is still worth saying about the shape of this</h2>
    <p>Once, and then I will stop. <b>The thing being disliked may not have been the thing being
      described.</b> “The inbox thing” is a complaint about a <i>list</i>, and the Dashboard has two
      of them — the questions at the top, which are the product’s whole reason for being, and
      <b>Working</b> underneath, which is four rows of names and times that are already in the panel
      two inches to the left. This page removes both. If what grated was the second list, the cheaper
      change is to cut <b>Working</b>, keep the sentence and the questions where they are, and put
      the composer and the artifacts under them — and it costs none of the across-the-room reading.
      That is not what was asked for and this page does what was asked for. I am recording it because
      it is an afternoon’s work and it would settle the question.</p>

    <h2>Decisions I made where the repository did not settle it</h2>
    <ul>
      <li><b>Both sections wear the same heading.</b> Same size, same weight, same colour. They are
        peers by decision now, so drawing one louder than the other would be arguing with that
        decision in CSS. The ember dot is the only difference, and it is carrying a lot.</li>
      <li><b>The waiting section has no “View all”.</b> The chips are all of them up to the ember cap,
        and past the cap the overflow chip <i>is</i> the view-all. Two links to the same place is one
        too many.</li>
      <li><b>A chip is a name and one timestamp</b> — the design’s own definition of a row. The
        question itself is one press away rather than on the page, which is the part of this that
        costs the most and is the part the decision asked for.</li>
      <li><b>The column does not grow with the window.</b> 748px at 1280 and at 1680. A wider window
        buys more air above the greeting, not a longer line; the artifact tiles are the same size at
        both.</li>
      <li><b>Three artifacts, in one row, always.</b> Not a grid that reflows to four at 1680. Three
        is what was asked for, and a row that changes length with the window is a different object at
        each size.</li>
      <li><b>Recent artifacts is the most recent three, whoever made them</b> — not “yours”. The
        Artifacts destination has the <i>Yours / Shared with you</i> filter; this is a glance.</li>
      <li><b>“Waiting somewhere you are not” stays at the foot of the page</b>, below both sections.
        It is about another Firetower, which is a tier below the one you are looking at.</li>
      <li><b>No artifacts yet is a sentence, not three grey plates.</b> Three empty tiles on a fresh
        install say the page is broken. Three tiles with the <i>not photographed yet</i> bar are a
        different state and are drawn as one, because that is what a real fresh install looks like a
        few seconds in.</li>
      <li><b>The placeholder stays “Start something new…”.</b> Claude’s “How can I help you today?” is
        a conversation opening. This field defines a workspace.</li>
    </ul>

    <h2>What this implies, if it is built</h2>
    <p><b>No server change</b>, which is the same finding the handoff reports for the rest of the
      redesign. Posters already exist at <code>/api/v1/artifact-versions/{id}/poster</code>, with
      <code>posterUrl</code> and <code>hasPoster</code> as two separate fields precisely so a client
      can tell <i>no picture taken</i> from <i>no picture possible</i>. Three artifacts is a list call
      the Artifacts destination already makes.</p>
    <p>In the desktop client it is <code>ui/Dashboard.tsx</code> and <code>ui/StartComposer.tsx</code>.
      <code>StartComposer</code> wraps its children and docks the composer under them; the centred
      version needs it to be placeable rather than always docked, which is a prop rather than a fork.
      <code>drawnInFull()</code> survives as the chip cap — same number, same reason, different name.
      <code>also()</code> loses its only caller, because the <i>still working</i> list is not on this
      page. <code>ArtifactShot</code> is used exactly as it stands.</p>
    <p>One thing I could not determine from the repository and have assumed: <b>whether the panel stays
      pinned on this page.</b> It is pinned in every drawing here, because that is the accepted default
      and because the <i>still working</i> list this page drops lives there. If the panel were meant to
      collapse on the home — much closer to Claude’s — the band wants re-measuring and the artifacts
      would have room for four.</p>
    <p>One drift to flag rather than resolve: <code>design-handoff.md</code> now describes the rail’s
      current destination as <b>a filled square in <code>--ink</code> with a <code>--sheet</code>
      glyph</b>, and <code>desktop-redesign.html</code> still draws the white pill. The rail here is
      lifted from the artifact, on the rule that the drawing outranks the document. If the document is
      ahead rather than behind, this page inherits the fix for free when the artifact catches up.</p>

    <h2>Surfaces</h2>
    <p>This is the <b>desktop client only</b>, at 1280 × 824 and 1680 × 960, light and dark. It is the
      surface the request is about — the opinion was formed with the desktop app running. <b>The web
      client and the phone are not drawn.</b> The phone’s home is a different object and the handoff
      says mobile is its own effort; a centred composer on a 390px screen is a different design, not
      this one scaled.</p>
    <p>Three skills this brief names — <code>firetower-surfaces</code>, <code>apple-design</code> and
      <code>frontend-design</code> — are <b>not reachable in this environment</b>, which handoff §10
      records as having happened to both previous designers on this work. The surface rules used here
      come from the handoff and from the accepted artifact’s own measurements instead.</p>
  </div>`;
}

/* ── Render ──────────────────────────────────────────────────── */
function render(){
  document.documentElement.setAttribute("data-theme",S.theme);
  const body=
     S.tab==="home"    ? tabHome()
   : S.tab==="side"    ? tabSide()
   : S.tab==="where"   ? tabWaiting()
   : S.tab==="states"  ? tabStates()
   :                     tabNotes();
  document.getElementById("app").innerHTML=`
    <div class="head">
      <div>
        <h1>Firetower desktop — an alternative home</h1>
        <p>A greeting, a composer in the middle of the page, and two sections under it: the agents
          waiting for you, then the three latest artifacts. An exploration beside the accepted
          Dashboard, not a replacement for it.</p>
      </div>
      <div class="ctl">
        ${seg("theme",[["light","Light"],["dark","Dark"]],S.theme)}
      </div>
    </div>
    <div class="tabs">${TABS.map(([id,l])=>
      `<button data-act="tab" data-v="${id}" aria-pressed="${S.tab===id}">${l}</button>`).join("")}</div>
    ${body}`;
  fit();
}

/* The stage scales the window down to whatever width the frame gives
   us, rather than the frame scrolling sideways. */
function fit(){
  const stage=document.querySelector(".stage");
  if(stage){
    const scaler=stage.querySelector(".scaler"), box=stage.querySelector(".fitbox");
    if(scaler&&box){
      scaler.style.transform="none";
      const natW=scaler.scrollWidth, natH=scaler.scrollHeight;
      /* Measured against the document as well as the stage: a stage inside an
         over-wide page reports the over-wide number and the window renders
         past the right edge. */
      const avail=Math.min(stage.clientWidth, document.documentElement.clientWidth-32);
      const k=Math.min(1,(avail-2)/natW);
      scaler.style.transform=`scale(${k})`;
      box.style.width=natW*k+"px"; box.style.height=natH*k+"px";
    }
  }
  for(const m of document.querySelectorAll(".mini")){
    const inner=m.querySelector(".inner");
    if(inner) inner.style.transform=`scale(${m.clientWidth/1280})`;
  }
}
addEventListener("resize",fit);

/* Enter and Space on anything carrying role=button, since some of the
   controls here are divs for the reason above. */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const b=e.target.closest('[role="button"][data-act]');
  if(!b) return;
  e.preventDefault(); b.click();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==="tab") S.tab=v;
  else if(a==="theme") S.theme=v;
  else if(a==="state") S.state=v;
  else if(a==="when") S.when=v;
  else if(a==="order") S.order=v;
  else if(a==="w") S.w=Number(v);
  else if(a==="squint") S.squint=v==="on";
  else if(a==="open"){ S.state=b.dataset.s; S.order=b.dataset.o||"waiting"; S.tab="home"; }
  else return;
  render();
});

/* `#home,waiting,1280,light` — so a render run and somebody leaving a note can
   both name the same state. */
function applyHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(!h||h==="measure") return;
  for(const part of h.split(",")){
    if(TABS.some(x=>x[0]===part)) S.tab=part;
    else if(STATES.some(x=>x[0]===part)) S.state=part;
    else if(WHENS.some(x=>x[0]===part)) S.when=part;
    else if(part==="1280"||part==="1680") S.w=Number(part);
    else if(part==="light"||part==="dark") S.theme=part;
    else if(part==="squint") S.squint=true;
    else if(part==="artifacts-first") S.order="artifacts";
  }
}
applyHash();
addEventListener("hashchange",()=>{applyHash();render();});
render();

/* A measuring harness, for the working method: render every state and report
   whether the page overflows its own window. Only runs with #measure. */
if(location.hash==="#measure"){
  const out=[];
  const probe=lab=>{
    const hc=document.querySelector(".hcol"), sh=document.querySelector(".sheet"),
          air=document.querySelector(".air");
    out.push(`${lab}  air=${air?air.offsetHeight:"-"} col=${hc?hc.scrollHeight:"-"}`
      +` sheet=${sh.clientHeight} over=${hc?hc.scrollHeight-sh.clientHeight:"-"}`
      +` chips=${document.querySelectorAll(".chips .sw").length}`
      +` dots=${document.querySelectorAll(".chips .dot").length}`
      +` sections=${document.querySelectorAll(".sect").length}`);
  };
  /* A button inside a button is closed by the parser, silently. Every tab is
     walked and the count must be zero; it was not, once. */
  for(const [tid] of TABS){
    S.tab=tid; render();
    const bad=document.querySelectorAll("button button").length;
    const stray=document.querySelectorAll(".sheetgrid > .win, .four > .win").length;
    out.push(`tab ${tid}  nested-buttons=${bad} escaped-windows=${stray}`
      +` minis=${document.querySelectorAll(".mini").length}`);
  }
  S.tab="home";
  for(const w of [1280,1680]) for(const st of STATES.map(s=>s[0])){
    S.w=w; S.state=st; S.tab="home"; render(); probe(`${w} ${st}`);
  }
  S.w=1280; S.state="waiting"; S.order="artifacts"; render(); probe("1280 waiting/artifacts-first");

  /* A control sweep. Press everything on every tab and report anything that
     throws — a ReferenceError inside a render leaves the screen unchanged and
     says nothing, which is the failure this exists to catch. The count of
     controls pressed is reported too, so a sweep that silently pressed
     nothing cannot read as a pass. */
  let pressed=0; const threw=[];
  for(const [tid] of TABS){
    S.tab=tid; render();
    const ctrls=[...document.querySelectorAll("[data-act]")];
    for(const c of ctrls){
      const before=S.tab;
      try{ c.click(); pressed++; }catch(err){ threw.push(`${tid}/${c.dataset.act}: ${err.message}`); }
      S.tab=before; render();
    }
  }
  out.push(`sweep  pressed=${pressed} threw=${threw.length}${threw.length?"  "+threw.join(" | "):""}`);

  /* Light and dark, every tab, looking for a render that produces nothing. */
  for(const th of ["light","dark"]) for(const [tid] of TABS){
    S.theme=th; S.tab=tid; render();
    const n=document.getElementById("app").textContent.trim().length;
    if(n<200) out.push(`EMPTY ${th}/${tid} chars=${n}`);
  }
  out.push("render check  done");
  document.body.innerHTML="<pre id=measured>"+out.join("\n")+"</pre>";
}

if(location.hash.startsWith("#width")){
  const vw=document.documentElement.clientWidth, out=[`viewport=${vw} scrollWidth=${document.documentElement.scrollWidth}`];
  for(const el of document.querySelectorAll("#app *")){
    const r=el.getBoundingClientRect();
    if(r.right>vw+1) out.push(`${el.tagName}.${el.className||"-"} right=${Math.round(r.right)} w=${Math.round(r.width)}`);
  }
  document.body.innerHTML="<pre id=measured>"+out.slice(0,24).join("\n")+"</pre>";
}

</script>
</body>
