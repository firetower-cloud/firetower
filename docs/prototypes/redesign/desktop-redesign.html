      <span class="tx"><b>This app</b><s>Updates itself from GitHub — it does not ask the deployment</s></span>
      <span class="ver">2.14.0</span>
      <span class="acts"><span style="font-size:14.5px;color:var(--quiet)">Up to date</span></span>
    </div>

    <section class="upd-sec">
      <h2>Machines</h2>
      <p class="note">A machine is brought level with the control plane and never past it — a worker ahead of it is a worker talking to something that does not know its protocol. Moving one belongs to whoever administers that machine.</p>
      <div style="margin-top:12px">
        ${UP_MACH.map(m=>`<div class="mach">
          <span class="box" data-on="${m.behind&&m.mine}" data-off="${!m.mine}">${m.behind&&m.mine?ic("check",11):""}</span>
          <span class="g">${ic(m.k==="local"?"monitor":"server",17)}</span>
          <span class="tx"><b>${m.n}</b><s>${m.behind?(m.mine?"behind — can be brought to 2.14.0":"behind — you do not administer this one"):"level with the control plane"}</s></span>
          <span class="ver">${m.v}</span>
        </div>`).join("")}
      </div>
      <div style="display:flex;gap:7px;margin-top:18px;flex-wrap:wrap;align-items:center">
        <button class="btn plain" data-act="noop">${ic("save",15)}Back up now</button>
        <button class="btn primary" data-act="up" data-up="plan">${ic("arrow-up",15)}Plan the update for 1 machine</button>
        <span style="font-size:14px;color:var(--quiet)">Back up first. It takes a few seconds and it is the thing to press before anything else.</span>
      </div>
    </section>

    <section class="upd-sec">
      <h2>What changed in 2.14.0</h2>
      <div class="md" style="margin-top:10px">
        <ul>
          <li>Skills can be shared into a directory and turned on per agent.</li>
          <li>Artifacts keep a poster per version, so a library of forty costs one request.</li>
          <li>The workspace rail shows a team’s children and what each is up to.</li>
        </ul>
      </div>
    </section>`:""}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   THE GROUPING PROPOSAL
   ═══════════════════════════════════════════════════════════════════ */
const IA=[
  {icon:"house",n:"Dashboard",sub:"⌘1",why:"Where work starts — a greeting, a composer, then what is waiting on you and what you have made.",
   items:[["New workspace","the composer"],["Your workspaces","grouped where it helps"]],keep:true},
  {icon:"list-todo",n:"Tasks",sub:"⌘2",why:"Work that came from somewhere else, and the places it comes from.",
   items:[["Everything",""],["Assigned to you",""],["Trackers","from Work"]]},
  {icon:"shapes",n:"Artifacts",sub:"⌘3",why:"What the agents made. Already a destination; unchanged.",
   items:[["All artifacts",""],["Recent","live list"]],keep:true},
  {icon:"puzzle",n:"Customize",sub:"⌘4",why:"How agents behave. All of today’s Harness, promoted whole — this is the part people touch once they are past setup.",
   items:[["Skills","from Harness"],["Agent profiles","from Harness"],["Agents","from Harness"],["Your skills and profiles","live list"]]},
  {icon:"folder-git-2",n:"Repositories",sub:"⌘5",why:"The code half of what a workspace is made of. Repositories first because it is the job; the host under it is the prerequisite, touched once.",
   items:[["All repositories","from Code"],["Git hosts","from Code"],["Checked out","live list"]]},
  {icon:"server",n:"Machines",sub:"⌘6",why:"The compute half. Its own door because it is the only thing here with a health state you want without asking — which machine is down is a real at-a-glance question.",
   items:[["All machines","from Compute"],["Yours","live list, with reachability"]]},
];
/* **Not doors in the rail. Rows in the profile menu**, by the user, on
   7 November 2026. They were drawn in both places at once, which is a thing
   with no home — and a door drawn in the same square as a destination, with
   the same selected pill, is read as a destination whatever the rule under it
   says. The menu already holds the account, the Firetower switcher and the
   appearance control: the same category of thing, which is *you and this
   window* rather than where the work is.

   Updates had the better of the two arguments for a door — it carried the one
   ambient mark, and a mark needs somewhere to be seen. The mark is on the
   avatar now, which is the button the menu hangs off, so it is still seen
   without hover and without opening anything. */
const IA_MENU=[
  {icon:"settings-2",n:"Settings",sub:"⌘,",why:"Everything that is genuinely a setting: rarely opened, and half of it is a reader’s view of something the administration site owns. Its five panes index themselves inside the page, because there is no rail icon to leave one by.",
   items:[["People","from Access · read here, owned by the web"],["Teams","from Access · read here; granting is ours"],
          ["Directories","from Access"],["Vault","from Credentials"],["This Firetower","from Server"]]},
  {icon:"circle-fading-arrow-up",n:"Updates",why:"A row rather than a door. The row names the version that is ready; the mark on the avatar above it says only that there is one — and nothing else may set that mark.",
   items:[["What is running",""],["Past runs",""]]},
];
function grouping(){
  const card=(d,quiet)=>`<div class="ia-card ${quiet?"quiet":""}">
    <div class="hd"><span class="ico">${ic(d.icon,19)}</span>
      <div><h3>${d.n}</h3>${d.sub?`<div class="sub">${d.sub}</div>`:""}</div></div>
    <p class="why">${d.why}</p>
    <ul>${d.items.map(([a,b])=>`<li><b>${a}</b>${b?`<s>${b}</s>`:""}</li>`).join("")}</ul>
  </div>`;
  return `<div class="ia">
    <h2>What the rail would be</h2>
    <p class="prose-lead">Six destinations, instead of three destinations and one door with twelve panes behind it. The test for a destination is not “is it important” — everything is — but <i>do you open it, and does it have live state worth seeing without asking.</i> Each panel is a working surface: a few sub-destinations, then the things you actually have.</p>
    <div class="ia-grid">${IA.map(d=>card(d)).join("")}</div>
    <h3 style="margin-top:38px">And the two that are not destinations at all</h3>
    <p class="prose" style="margin:10px 0 16px;max-width:76ch">They were two doors under a rule in the rail <i>and</i> two rows in the profile menu. The menu is the only one of those now. A door drawn in a destination’s square, with a destination’s selected pill, is read as a destination whatever the rule above it says — and nobody goes to Settings to do their work.</p>
    <div class="ia-grid">${IA_MENU.map(d=>card(d,true)).join("")}</div>

    <h2 style="margin-top:52px">Every pane, and where it went</h2>
    <table class="movetable">
      <tr><th>Today</th><th>Goes to</th><th>Why</th></tr>
      ${[["Code › Repositories","<b>Repositories</b>","It is the job, and it is picked every time a workspace starts."],
         ["Code › Git hosts","<b>Repositories</b>","The prerequisite under it, touched once — kept a pane of its own, not merged."],
         ["Work › Trackers","<b>Tasks</b>","A tracker gives only work, and Tasks is what consumes it. <code>panes.ts</code> split it out of Integrations for exactly this reason; it stays split."],
         ["Compute › Machines","<b>Machines</b>","Its own door: reachability is a thing you want at a glance."],
         ["Harness › Agents","<b>Customize</b>","The user’s proposal. Harness moves whole."],
         ["Harness › Profiles","<b>Customize</b>","Named <i>Agent profiles</i> in the panel — <code>roles</code> stays on the wire."],
         ["Harness › Skills","<b>Customize</b>","It was promoted to the rail last round; it drops one level into Customize, which is a better home."],
         ["Access › People","<b>Settings</b>","Desktop <i>reads</i>; the administration site owns it. No invite, role, disable or delete is drawn."],
         ["Access › Teams","<b>Settings</b>","Read here; granting a team access to a resource stays ours and lives in the sharing sheet."],
         ["Access › Directories","<b>Settings</b>","Ours, but reached from the sharing sheet far more often than from a page."],
         ["Credentials › Vault","<b>Settings</b>","Rare, and sensitive enough to want a deliberate door."],
         ["Server › This Firetower","<b>Settings</b>","Rare."],
         ["—","<b>Settings itself</b>","Not a rail icon. A row in the profile menu, with ⌘,. Its five panes carry their own index at the top of the page — the same five, the same order, the same three group names the rail panel drew."],
         ["—","<b>Updates itself</b>","Not a rail icon either. A row in the profile menu that names the version that is ready, under a mark on the avatar that says only that there is one."]].map(([a,b,c])=>`<tr><td class="why">${a}</td><td>${b}</td><td>${c}</td></tr>`).join("")}
    </table>

    <h2 style="margin-top:52px">What I did not undo</h2>
    <ul class="prose" style="padding-left:1.1rem">
      <li><b>Git hosts and Trackers stay two panes.</b> <code>panes.ts</code> records that Integrations was two jobs under one word, and that sharing a pane drew every git host twice. They are separated further here, not merged — hosts under Repositories, trackers under Tasks.</li>
      <li><b>Repositories still goes first</b> and is still where that destination opens, because the screen can connect a host on its own and landing there with nothing set up is a start rather than a dead end.</li>
      <li><b>The link out to the administration site</b> goes to the base address and nothing after it, and is drawn for administrators only.</li>
    </ul>
    <p style="margin-top:18px"><b>The alternative I did not take:</b> one destination holding both Repositories and Machines — “what a workspace is made of”. It is one fewer icon and it reads cleanly, but it buries reachability one level down and there is no honest name for the pair that is not a category word. If six feels like too many, that is the first merge to make.</p>
  </div>`;
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   THE PANES
   Every one is a list page: a title, one sentence, one action, rows.
   Invented data; real shapes, real vocabulary, real permissions.
   ═══════════════════════════════════════════════════════════════════ */
const initials=n=>n.split(/[\s@._-]/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
/* Empty, loading, failed, refused, and a server that is not answering.
   A fresh install hits every empty state at once, so none of these is an
   edge case. */
const BLANKS={
  empty:   [ "shapes",        "Nothing here yet", "", ""],
  loading: [ null,            "", "", ""],
  error:   [ "triangle-alert","That did not load","Northwind answered 503. Nothing has been lost — this list is on the server, not in this window.","Try again"],
  denied:  [ "lock",          "You cannot see this","Ask an administrator of this Firetower. Nothing is hidden from you by this window — the server decides, and it said no.",""],
  dark:    [ "circle-slash-2","Can’t reach Northwind","Showing what was last known. Rows from a server that is not answering stay visible — a list that empties itself reads as work being lost.",""],
};
const EMPTY_SAYS={
  people:["Nobody else yet","Accounts are made on the administration site."],
  teams:["No teams yet","A team is made on the administration site, beside the accounts it names."],
  dirs:["No directories yet","Make one and file things into it. Whoever makes a directory administers it."],
  vault:["Nothing held yet","Each secret is made where it is used — connecting a git host, a subscription, a repository’s variables."],
  repos:["No repository yet","Connect a git host and import one. This screen can connect a host on its own."],
  hosts:["No git host yet","Add the address of a GitHub, GitLab or Gitea your company already uses."],
  machines:["No machine connected","Firetower’s own machine is always here; add another to run more at once."],
  agents:["No agent configured","An agent is installed on a machine and runs on somebody’s subscription."],
  profiles:["No profiles yet","A profile is a saved way of working. Every workspace can run without one."],
  trackers:["Nothing to read from","Connect a git host and its issues and pull requests appear here."],
  server:["",""],
};
function blank(kind,which,action){
  if(kind==="loading") return `<div class="lrows" style="margin-top:22px">${[70,45,60,38,55].map(w=>`
    <div class="r"><span class="settling" style="width:24px;height:24px;border-radius:99px"></span>
      <span class="tx"><span class="settling" style="display:block;width:${w}%;height:10px"></span>
      <span class="settling" style="display:block;width:${Math.round(w*0.4)}%;height:8px;margin-top:6px"></span></span>
      <span class="settling" style="width:54px;height:8px"></span></div>`).join("")}</div>`;
  const [icon,title,body,act]=BLANKS[kind];
  const [t2,b2]=kind==="empty"?(EMPTY_SAYS[which]||["Nothing here yet",""]):[title,body];
  return `<div style="display:grid;place-items:center;padding:90px 0 70px;text-align:center">
    <div style="max-width:44ch">
      <span style="width:52px;height:52px;border-radius:16px;background:var(--raised);display:grid;
        place-items:center;color:var(--hush);margin:0 auto">${ic(icon,22)}</span>
      <h2 style="margin-top:20px;font-size:23px;letter-spacing:-.018em;font-weight:530;color:var(--ink)">${t2}</h2>
      ${b2?`<p style="margin-top:8px;font-size:16px;line-height:1.6;color:var(--quiet)">${b2}</p>`:""}
      ${act?`<button class="btn plain" style="margin-top:20px" data-act="noop">${ic("refresh-cw",15)}${act}</button>`
        :action?`<button class="btn primary" style="margin-top:20px" data-act="noop">${action}</button>`:""}
    </div></div>`;
}
let WHICH=null, PRIMARY="";
const pane=(w,p)=>{WHICH=w;PRIMARY=p||"";};

/* ── Settings' index, in the page it indexes ──────────────────
   The list the rail panel drew while Settings was a door, moved whole: the
   same five panes, the same order, the same three group names. Taking the door
   out of the rail took the only way between the five with it, and a pane you
   can reach and then cannot leave is worse than the door was.

   Drawn by `pg`, above the head and above anything the data states swap out —
   a pane that cannot be read is the pane you most need to leave. It draws
   nothing on the panes a destination owns, which still have a rail panel. */
const SETTINGS=[
  ["Who can reach what",[["people","People"],["teams","Teams"],["dirs","Directories"]]],
  ["Secrets",[["vault","Vault"]]],
  ["This deployment",[["server","This Firetower"]]],
];
const snav=()=> !SETTINGS.some(([,items])=>items.some(([at])=>at===S.rt)) ? ""
  : `<nav class="snav" aria-label="Settings">${SETTINGS.map(([g,items])=>`<div class="sgroup">
      <span class="slabel">${g}</span>
      <span class="sitems">${items.map(([at,l])=>
        `<button class="sitem" data-act="go" data-to="${at}" aria-current="${at===S.rt}">${l}</button>`).join("")}</span>
    </div>`).join("")}</nav>`;

function pg(title,sentence,acts,body){
  const which=WHICH, primary=PRIMARY;
  if(S.data!=="full" && which) body = S.data==="dark"
    ? `<div class="whereto" style="margin:22px 0 0"><span class="g">${ic("circle-slash-2",17)}</span>
         <p><b>Can’t reach Northwind.</b> Showing what was last known. Rows from a server that is not answering stay visible — a list that empties itself reads as work being lost.</p></div>
       <div class="stale2">${body}</div>`
    : blank(S.data,which,primary);
  return `<div class="pg">
    ${snav()}
    <div class="pg-head">
      <div style="min-width:0"><h1>${title}</h1><p class="sub">${sentence}</p></div>
      ${acts?`<div class="acts">${acts}</div>`:""}
    </div>${body}</div>`;
}
const onWeb=`<a class="out" data-act="noop" title="Opens the administration site">Manage on the web${ic("arrow-up-right",15)}</a>`;
const lsec=(h,note,rows,n)=>`<section class="lsec">
  ${h?`<h2>${h}${n!==undefined?`<span class="n">${n}</span>`:""}</h2>`:""}
  ${note?`<p class="note">${note}</p>`:""}<div class="lrows">${rows}</div></section>`;

/* ── People — read, and only read ──────────────────────────────── */
const PEOPLE=[
  {n:"kevin",role:"admin",you:true},{n:"ana",role:"admin"},{n:"lisa",role:"member"},
  {n:"tomas",role:"member"},{n:"priya",role:"member"},{n:"omar",role:"member"},
];
function pPeople(){
  pane("people","");
  return pg("People",
    "Everybody with an account on this Firetower.",
    `<label class="find">${ic("search",15)}<input placeholder="Find somebody" aria-label="Find somebody"></label>${onWeb}`,
    lsec("", "", PEOPLE.map(p=>`<div class="r">
        <span class="face">${initials(p.n)}</span>
        <span class="tx"><b>${p.n}</b></span>
        <span class="path">u/${p.n}</span>
        ${p.role==="admin"?`<span class="chip3">administrator</span>`:""}
        ${p.you?`<span class="said">you</span>`:""}
      </div>`).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p>This is the list the sharing sheet reads from. To <b>invite somebody, change a role, or disable an account</b>, use the administration site — those outlive every piece of work, so they are the organisation’s rather than this seat’s.</p></div>`);
}

/* ── Teams — read here; granting is ours and lives next door ───── */
const TEAMS=[
  {n:"Everyone",everyone:true},
  {n:"Engineering",members:["ana","lisa","tomas","kevin"]},
  {n:"Finance",members:["priya","omar"]},
  {n:"Platform",members:["tomas","kevin"]},
];
function pTeams(){
  pane("teams","");
  return pg("Teams",
    "A team holds a grant, so access handed to five people is one row rather than five. Who is in one is decided on the administration site.",
    onWeb,
    lsec("","",TEAMS.map((t,i)=>{
      const open=i===1;
      return `<button class="r" data-act="noop">
        <span class="tface">${ic("users-round",14)}</span>
        <span class="tx"><b>${t.n}</b></span>
        <span class="said">${t.everyone?"everybody here, always":`${t.members.length} people`}</span>
        ${t.everyone?"":`<span class="g">${ic(open?"chevron-down":"chevron-right",15)}</span>`}
      </button>` + (open? t.members.map(m=>`<div class="r sub">
          <span class="face">${initials(m)}</span><span class="tx"><b>${m}</b><s>u/${m}</s></span>
          </div>`).join("") : "");
    }).join(""))
    + `<div class="whereto"><span class="g">${ic("folder",17)}</span>
        <p><b>Giving a team access</b> to something is resource-shaped, so it belongs beside the thing being shared — open <b>Directories</b>, or use the sharing sheet on whatever you are sharing. Who is <i>in</i> a team is people-shaped, and that is the web’s.</p></div>`);
}

/* ── Directories — ours, and the control lives here ────────────── */
const DIRS=[
  {n:"Engineering",slug:"d/eng",grants:[["t/Engineering","team","Editor"],["u/kevin","person","Admin"],["t/Everyone","team","Viewer"]]},
  {n:"Finance",slug:"d/finance",grants:[["t/Finance","team","Editor"],["u/priya","person","Admin"]]},
  {n:"Platform",slug:"d/platform",grants:[["t/Platform","team","Admin"],["u/ana","person","Editor"]]},
];
function pDirs(){
  pane("dirs","New directory");
  const open=0;
  return pg("Directories",
    "Where things are filed, who each one lets in, and at what. A grant applies to everything filed there, for as long as it is filed there.",
    `<button class="btn primary" data-act="noop">${ic("plus",15)}New directory</button>`,
    lsec("","",DIRS.map((d,i)=>`
      <button class="r" data-act="noop">
        <span class="g">${ic(i===open?"chevron-down":"chevron-right",15)}</span>
        <span class="tface">${ic("folder",14)}</span>
        <span class="tx"><b>${d.n}</b></span>
        <span class="path">${d.slug}</span>
        <span class="said">${d.grants.length} grants</span>
        <span class="gbtn hov">${ic("ellipsis",15)}</span>
      </button>
      ${i===open?d.grants.map(([who,kind,lvl])=>`<div class="r sub">
          ${kind==="team"?`<span class="tface">${ic("users-round",13)}</span>`:`<span class="face">${initials(who.slice(2))}</span>`}
          <span class="tx"><b>${who.slice(2)}</b><s>${who}</s></span>
          <button class="lvl">${lvl}${ic("chevron-down",13)}</button>
          <span class="gbtn hov">${ic("x",14)}</span>
        </div>`).join("")+`<div class="r sub"><span class="g" style="width:24px">${ic("plus",15)}</span>
          <span class="tx" style="color:var(--quiet)"><b style="font-weight:400;color:var(--quiet)">Add people or a team</b></span></div>`:""}
    `).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p><b>A grant is not an exception.</b> Letting one person into one workspace is the sharing sheet’s job, and the two are kept apart on purpose — they were one flat list once and read as equivalents, which they are not. An exception can never be <i>Admin</i>.</p></div>`);
}

/* ── Vault — a value is never shown at rest ────────────────────── */
const SECRETS=[
  {scope:"github",name:"kevin",where:"Only you",made:"connecting a git host"},
  {scope:"anthropic",name:"team-plan",where:"d/eng",made:"connecting a subscription"},
  {scope:"northwind/api",name:"DATABASE_URL",where:"d/eng",made:"the repository’s variables"},
  {scope:"northwind/api",name:"STRIPE_KEY",where:"d/eng",made:"the repository’s variables",shown:true},
  {scope:"voice",name:"deepgram",where:"Only you",made:"the composer"},
];
function pVault(){
  pane("vault","");
  return pg("Vault",
    "Held encrypted, revealed only by asking, and every read is logged. Each one is made where it is used, so there is nothing to add here.",
    "",
    lsec("","",SECRETS.map(s=>`<div class="r">
        <span class="g">${ic("key",16)}</span>
        <span class="tx"><b>${s.name}</b><s>${s.scope} · made by ${s.made}</s></span>
        <span class="path">${s.where}</span>
        ${s.shown?`<span class="shown">sk_live_51K8hR2eZvK…</span>`:`<span class="masked">••••••••••••</span>`}
        <span class="gbtn" title="${s.shown?"Hide":"Reveal — this read is logged"}">${ic(s.shown?"eye-off":"eye",15)}</span>
        <span class="gbtn hov" title="Remove">${ic("trash-2",15)}</span>
      </div>${s.shown?`<div class="logged" style="padding:0 14px 10px 52px">${ic("scroll-text",14)}Revealed by you, just now. The read is in the access log.</div>`:""}`).join(""))
    + `<div class="whereto"><span class="g">${ic("lock",17)}</span>
        <p>Nothing reads a scope somebody invented here, so there is no control that makes one — you would store the thing, reasonably expect an agent to be given it, and it never would be. What is left is seeing what is held, replacing a value, and taking one away.</p></div>`);
}

/* ── This Firetower ────────────────────────────────────────────── */
function pServer(){
  pane("server","");
  const t=tower();
  return pg("This Firetower","The deployment this window is connected to, and the account you hold on it.","",
    `<div class="fsheet">
      <div class="row"><dt>Address</dt><dd class="mono">https://northwind.firetower.dev</dd></div>
      <div class="row"><dt>Signed in as</dt><dd>${t.who} — administrator</dd></div>
      <div class="row"><dt>Running</dt><dd class="mono">2.14.0</dd></div>
      <div class="row"><dt>Your things live at</dt><dd class="mono">u/kevin</dd></div>
      <div class="row"><dt>Connected since</dt><dd>14 March</dd></div>
    </div>
    <div class="whereto" style="margin-top:22px">
      <span class="g">${ic("unplug",17)||ic("x",17)}</span>
      <p><b>Forget this Firetower on this Mac.</b> The connection and its token are dropped here and the server is not told — the sessions keep running, and you can connect again with the address and a password.</p>
      <button class="btn plain" data-act="noop" style="flex:none">Disconnect</button>
    </div>
    <p style="margin-top:22px;font-size:14.5px;color:var(--quiet)">This account exists on this server only. Switching Firetowers is under your avatar.</p>`);
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   THE PANES THAT MOVED INTO DESTINATIONS
   ═══════════════════════════════════════════════════════════════════ */

/* ── Repositories — one screen, two lists ──────────────────────── */
const MINE_REPOS=[
  {slug:"northwind/api",branch:"main",host:"github",ws:3},
  {slug:"northwind/web",branch:"main",host:"github",ws:1},
  {slug:"northwind/infra",branch:"trunk",host:"gitlab",ws:0},
  {slug:"acme/ledger-sync",branch:"main",host:"gitea",ws:1,shared:true},
];
const MORE_REPOS=[
  {slug:"northwind/design-tokens",branch:"main",priv:false,host:"github"},
  {slug:"northwind/docs",branch:"main",priv:false,host:"gitlab"},
  {slug:"northwind/billing-worker",branch:"main",priv:true,host:"github"},
];
function pRepos(){
  pane("repos","Connect a git host");
  return pg("Repositories",
    "What Firetower cuts worktrees from. Every workspace is a branch of one of these, in a copy of its own.",
    `<label class="find">${ic("search",15)}<input placeholder="Find a repository"></label>`,
    `<div class="filterline">
      ${[["all","All hosts"],["gh","GitHub"],["gl","GitLab"],["gt","Gitea"]].map(([id,l])=>
        `<button class="fp" aria-pressed="${id==="all"}">${l}</button>`).join("")}
    </div>`
    + lsec("Checked out","",MINE_REPOS.map(r=>`<div class="r">
        <span class="g">${hostMark(r.host,16)}</span>
        <span class="tx"><b>${r.slug}</b><s>${r.ws?`${r.ws} workspace${r.ws>1?"s":""} open`:"nothing open"}${r.shared?" · shared with you":""}</s></span>
        <span class="path">${r.branch}</span>
        <span class="gbtn hov" title="More">${ic("ellipsis",15)}</span>
      </div>`).join(""), MINE_REPOS.length)
    + lsec("Not imported yet","Importing one makes it available to start a workspace on. Nothing is cloned until a workspace needs it.",
        MORE_REPOS.map(r=>`<div class="r">
        <span class="g">${hostMark(r.host,16)}</span>
        <span class="tx"><b>${r.slug}</b><s>${r.branch}</s></span>
        ${r.priv?`<span class="g" title="Private">${ic("lock",14)}</span>`:""}
        <button class="btn plain hov" style="height:30px">${ic("plus",14)}Import</button>
      </div>`).join(""), 12)
    + `<div class="whereto"><span class="g">${ic("git-branch",17)}</span>
        <p>This screen can <b>connect a host on its own</b>, so landing here with nothing set up is a start rather than a signpost. Adding, renaming and removing a host is an administrator’s and lives under <b>Git hosts</b>.</p></div>`);
}

/* ── Git hosts — the installation's, and your own token ────────── */
const HOSTS=[
  {n:"GitHub",kind:"github",addr:"github.com",mode:"browser",me:"kevinp",
   ident:"Kevin Piacentini <kevin@northwind.co>",shipped:true},
  {n:"GitLab (self-hosted)",kind:"gitlab",addr:"git.northwind.internal",mode:"token",me:null,
   why:"this GitLab is older than 17.9, so it has no device flow"},
  {n:"Gitea",kind:"gitea",addr:"gitea.northwind.dev",mode:"token",me:"kevin",ident:null,
   why:"Gitea has no device flow at any version"},
];
function pHosts(){
  pane("hosts","Add a host");
  return pg("Git hosts",
    "What Firetower clones from and pushes to. Adding one is an administrator’s; connecting your own account is anybody’s — a commit has to be attributable to a person.",
    `<button class="btn primary" data-act="conn" data-conn="how">${ic("plus",15)}Add a host</button>`,
    lsec("","",HOSTS.map(h=>`<div class="r">
        <span class="st" data-s="${h.me?"ok":"off"}"></span>
        ${hostMark(h.kind,16,true)}
        <span class="tx"><b>${h.n}</b><s>${h.me
          ? `connected as ${h.me}${h.ident?` · commits as ${h.ident}`:" · no commit identity set"}`
          : `not connected — ${h.mode==="token"?"paste a token":"authorize in a browser"}`}</s></span>
        <span class="path">${h.addr}</span>
        ${h.me?`<span class="gbtn hov">${ic("ellipsis",15)}</span>`
              :`<button class="btn plain hov" style="height:30px" data-act="conn" data-conn="${h.mode==="token"?"token":"code"}">Connect</button>`}
      </div>`).join(""))
    + `<div class="whereto"><span class="g">${ic("shield",17)}</span>
        <p><b>The two shipped rows — github.com and gitlab.com — use Firetower’s own application.</b> That is what makes a fresh install work with nothing registered. A host you add uses yours, for two reasons worth saying out loud: the approval screen would otherwise carry our name rather than theirs, and GitHub’s fifty authorizations an hour are counted <i>per application</i> and shared by everyone using it.</p></div>`);
}

const MACH2=[
  {n:"Firetower’s machine",addr:"the one under the control plane",s:"ok",cpu:"8 vCPU · 16 GB",agents:"Claude Code, Codex",where:"Only you",open:false},
  {n:"build-01",addr:"ubuntu@10.4.0.21",s:"ok",cpu:"32 vCPU · 64 GB",agents:"Claude Code, Codex, Cursor",where:"d/eng",open:true},
  {n:"build-02",addr:"ubuntu@10.4.0.22",s:"warn",cpu:"16 vCPU · 32 GB",agents:"none installed",where:"d/eng",open:false},
  {n:"gpu-01",addr:"ubuntu@10.4.0.40",s:"bad",cpu:"8 vCPU · 64 GB · A10",agents:"Claude Code",where:"d/eng",open:false},
];
const CHECKS=[["ok","SSH","reached in 180ms"],["ok","Worker","2.14.0, answering"],
  ["ok","git","2.49.0"],["ok","node","22.11.0"],["warn","Claude Code","installed, not signed in"]];
function pMachines(){
  pane("machines","Add a machine");
  return pg("Machines",
    "Where agents run. One owner per machine, until sessions are isolated from each other.",
    `<button class="btn primary" data-act="mach" data-mach="where">${ic("plus",15)}Add a machine</button>`,
    lsec("","",MACH2.map(m=>`
      <button class="r" data-act="noop">
        <span class="st" data-s="${m.s}"></span>
        <span class="g">${ic(m.n.includes("Firetower")?"monitor":"server",17)}</span>
        <span class="tx"><b>${m.n}</b><s>${m.cpu} · ${m.agents}</s></span>
        <span class="path">${m.addr}</span>
        <span class="said">${m.s==="ok"?"ready":m.s==="warn"?"needs setup":"not answering"}</span>
        <span class="g">${ic(m.open?"chevron-down":"chevron-right",15)}</span>
      </button>
      ${m.open?CHECKS.map(([s,k,v])=>`<div class="r sub">
          <span class="st" data-s="${s}"></span>
          <span class="tx"><b>${k}</b></span>
          <span class="said">${v}</span>
          ${s==="warn"?`<button class="btn plain" style="height:28px">Sign in</button>`:""}
        </div>`).join("")+`<div class="r sub" style="gap:7px">
          <span style="width:7px"></span>
          <button class="btn quiet" style="height:28px">Drain</button>
          <button class="btn quiet" style="height:28px">Rename</button>
          <button class="btn quiet" style="height:28px">Remove</button>
          <span style="flex:1"></span>
          <span class="said">filed in ${m.where}</span></div>`:""}`).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p>A machine that is <b>not answering keeps its workspaces</b> until it comes back — a list that empties itself when the VPN drops reads as work being lost. Draining stops new work without ending what is running.</p></div>`);
}

/* ── Agents and the accounts they run on ───────────────────────── */
const AGENTROWS=[
  {k:"claude",label:"Claude Code",on:"4 of 4 machines",accts:[{n:"kevin@northwind.co",used:62,of:100,unit:"of the weekly limit",dflt:true},{n:"Team plan",used:88,of:100,unit:"of the weekly limit"}],open:true},
  {k:"codex",label:"Codex",on:"3 of 4 machines",accts:[{n:"Team plan",used:31,of:100,unit:"of the weekly limit",dflt:true}]},
  {k:"cursor",label:"Cursor Agent",on:"1 of 4 machines",accts:[],needs:true},
  {k:"shell",label:"A plain prompt",on:"every machine",accts:[],none:true},
];
function pAgents(){
  pane("agents","");
  return pg("Agents",
    "What is installed where, and whose subscription it runs on. An agent is a thing on a machine; an account is whose allowance it spends.",
    `<button class="out" data-act="noop">${ic("refresh-cw",15)}Check all</button>`,
    lsec("","",AGENTROWS.map(a=>`
      <button class="r" data-act="noop">
        <span class="g" style="color:var(--body)">${AGENT[a.k](17)}</span>
        <span class="tx"><b>${a.label}</b><s>${a.on}${a.accts.length?` · ${a.accts.length} account${a.accts.length>1?"s":""}`:""}</s></span>
        <span class="said">${a.none?"no credential needed":a.needs?"needs an account":"signed in"}</span>
        ${a.none?"":`<span class="st" data-s="${a.needs?"warn":"ok"}"></span>`}
        <span class="g">${ic(a.open?"chevron-down":"chevron-right",15)}</span>
      </button>
      ${a.open?a.accts.map(x=>`<div class="r sub">
          <span class="tx"><b>${x.n}</b><s>${x.dflt?"new work runs on this one":"available"}</s></span>
          <span class="quota"><span class="bar" data-near="${x.used>80}"><i style="width:${x.used}%"></i></span>
            <s>${x.used}% ${x.unit}</s></span>
          <span class="gbtn hov">${ic("ellipsis",15)}</span>
        </div>`).join("")+`<div class="r sub"><span class="g" style="width:24px">${ic("plus",15)}</span>
          <span class="tx"><b style="font-weight:400;color:var(--quiet)">Connect another account</b></span></div>`:""}`).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p>When an account runs out, a workspace can be handed to another one mid-conversation — the composer offers it, and says plainly if the hand-off changes what the agent is allowed to do.</p></div>`);
}

/* ── Agent profiles ─────────────────────────────────────────────── */
const PROFILE_ROWS=[
  {n:"Ada, the lead",a:"claude",does:"Breaks work up and hands it out",team:["Reviewer","QA","Writer"],where:"d/eng",dflt:true},
  {n:"Reviewer",a:"codex",does:"Reads the diff and argues with it",team:[],where:"d/eng"},
  {n:"QA",a:"cursor",does:"Runs it and tries to break it",team:[],where:"d/eng"},
  {n:"Writer",a:"claude",does:"Turns a change into words somebody outside can read",team:[],where:"Only you"},
];
function pProfiles(){
  pane("profiles","New profile");
  return pg("Agent profiles",
    "A saved way of working — what it is for, what it may do, and who it may hand work to. A profile with a team leads; one without is a worker.",
    `<button class="btn primary" data-act="pick" data-pick="newprofile">${ic("plus",15)}New profile${ic("chevron-down",14)}</button>`,
    lsec("","",PROFILE_ROWS.map(p=>`<button class="r" data-act="openprofile">
        <span class="g" style="color:var(--body)">${AGENT[p.a](17)}</span>
        <span class="tx"><b>${p.n}</b><s>${p.does}${p.team.length?` · hands work to ${p.team.join(", ")}`:""}</s></span>
        ${p.team.length?`<span class="chip3">can delegate</span>`:""}
        ${p.dflt?`<span class="said">${ic("star",13)} default</span>`:""}
        <span class="path">${p.where}</span>
        <span class="gbtn hov">${ic("ellipsis",15)}</span>
      </button>`).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p>A profile is filed like a skill or a machine, so sharing one is the same sheet everything else uses. <b>The team is the only thing that makes one a manager</b> — same object either way.</p></div>`);
}

/* ── Trackers, now under Tasks ─────────────────────────────────── */
const TRACKERS=[
  {n:"GitHub",kind:"github",on:true,note:"issues and pull requests · connected under Git hosts"},
  {n:"GitLab (self-hosted)",kind:"gitlab",on:false,note:"issues and merge requests — connect it under Git hosts and it appears here"},
  {n:"Gitea",kind:"gitea",on:true,note:"issues and pull requests · connected under Git hosts"},
  {n:"Linear",kind:"linear",on:false,note:"a tracker only — it takes a key of its own"},
];
function pTrackers(){
  pane("trackers","");
  return pg("Trackers",
    "Where the tasks list reads from. Every git host is also a tracker: an issue is work to pick up, and a request to merge is work to review.",
    "",
    lsec("","",TRACKERS.map(t=>`<div class="r">
        <span class="st" data-s="${t.on?"ok":"off"}"></span>
        <span class="g">${t.kind==="linear"?ic("ticket",16):hostMark(t.kind,16)}</span>
        <span class="tx"><b>${t.n}</b><s>${t.note}</s></span>
        ${t.kind==="linear"&&!t.on?`<button class="btn plain" style="height:30px">${ic("key",14)}Add a key</button>`
          :t.on?`<span class="said">reading</span>`:`<span class="said">not connected</span>`}
      </div>`).join(""))
    + `<div class="whereto"><span class="g">${ic("info",17)}</span>
        <p>Git hosts are <b>derived</b> from what is connected rather than configured again — so there is nothing to connect here, and the row says where it is done. This pane used to share a screen with the hosts under the word “Integrations”, which drew every host twice.</p></div>`);
}

const PANE={people:pPeople,teams:pTeams,dirs:pDirs,vault:pVault,server:pServer,
  repos:pRepos,hosts:pHosts,machines:pMachines,agents:pAgents,profiles:pProfiles,trackers:pTrackers};
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   THE SHARING SHEET
   Whoever the directory lets in is one row with its people folded
   under it; whoever was let into this one thing is a separate list.
   Shown flat they read as equivalents, and they are not.
   ═══════════════════════════════════════════════════════════════════ */
function sharing(){
  const step=S.share;                       // who | where | newdir
  if(!step) return "";
  const head=(t,back)=>`<div class="sh-head">
      ${back?`<button class="bk" data-act="share" data-share="${back}" aria-label="Back">${ic("chevron-left",16)}</button>`:""}
      <h2>${t}</h2>
      <button class="bk" data-act="share" data-share="" aria-label="Close   Esc">${ic("x",16)}</button>
    </div>`;

  let body,foot;
  if(step==="where"){
    body=`<p class="sh-note">A thing lives at one path, so moving it into a directory takes it out of wherever it was — and hands it over to whoever administers that one.</p>
      <div class="sh-lab">Yours</div>
      <button class="sh-row" data-act="share" data-share="who"><span class="g" style="color:var(--quiet);display:grid">${ic("user-round",16)}</span>
        <span class="tx"><b>Only you</b><s>u/kevin — nobody else can reach it</s></span>${ic("check",15)}</button>
      <div class="sh-lab">Directories you can file into</div>
      ${DIRS.map(d=>`<button class="sh-row" data-act="share" data-share="who">
        <span class="g" style="color:var(--quiet);display:grid">${ic("folder",16)}</span>
        <span class="tx"><b>${d.n}</b><s>${d.slug} — ${d.grants.length} grants apply</s></span></button>`).join("")}
      <button class="sh-row" data-act="share" data-share="newdir">
        <span class="g" style="color:var(--quiet);display:grid">${ic("plus",16)}</span>
        <span class="tx"><b>New directory…</b></span></button>`;
    foot=`<span class="where">Nothing moves until you Save.</span>
      <button class="btn quiet" data-act="share" data-share="who">Cancel</button>`;
  } else if(step==="newdir"){
    body=`<p class="sh-note">Whoever makes a directory administers it, so there is no window where one exists with nobody able to decide about it.</p>
      <div class="sh-field">${ic("folder",16)}<input placeholder="Design" autofocus aria-label="Directory name"></div>
      <p class="sh-note" style="padding-top:8px">It will be <b style="color:var(--ink);font-weight:500">d/design</b>. You can let people in once it exists.</p>`;
    foot=`<span class="where">A new directory is a pending answer like any other.</span>
      <button class="btn quiet" data-act="share" data-share="where">Back</button>
      <button class="btn primary" data-act="share" data-share="who">Create</button>`;
  } else {
    body=`<div class="sh-lab">Everyone the directory lets in</div>
      <button class="sh-row"><span class="g" style="color:var(--quiet);display:grid">${ic("folder",16)}</span>
        <span class="tx"><b>Engineering</b><s>d/eng — changed on Directories, not here</s></span>
        ${ic("chevron-down",15)}</button>
      <div class="sh-row inner"><span class="tface">${ic("users-round",13)}</span>
        <span class="tx"><b>Engineering</b></span><span class="said">Editor</span></div>
      <div class="sh-row inner"><span class="face">K</span><span class="tx"><b>kevin</b></span><span class="said">Admin</span></div>
      <div class="sh-row inner"><span class="tface">${ic("users-round",13)}</span>
        <span class="tx"><b>Everyone</b></span><span class="said">Viewer</span></div>

      <div class="sh-lab">Let into this skill on its own</div>
      <div class="sh-row" data-pending="true"><span class="face">A</span>
        <span class="tx"><b>ana</b><s>will be added when you save</s></span>
        <button class="lvl">Editor${ic("chevron-down",13)}</button>
        <span class="gbtn">${ic("x",14)}</span></div>
      <div class="sh-row"><span class="face">L</span><span class="tx"><b>lisa</b></span>
        <button class="lvl">Viewer${ic("chevron-down",13)}</button><span class="gbtn">${ic("x",14)}</span></div>
      <button class="sh-row"><span class="g" style="color:var(--quiet);display:grid">${ic("user-plus",16)}</span>
        <span class="tx"><b style="font-weight:400;color:var(--quiet)">Let somebody in…</b></span></button>
      <p class="sh-note" style="padding-top:10px">An exception can never be <i>Admin</i> — somebody let into one thing cannot administer it. Share the directory it is in instead.</p>`;
    foot=`<span class="where">Lives in <b>d/eng</b><button class="chg" data-act="share" data-share="where">Change</button></span>
      <button class="btn quiet" data-act="share" data-share="">Cancel</button>
      <button class="btn primary" data-act="share" data-share="">Save</button>`;
  }
  return `<div class="veil" data-act="share" data-share="">
    <div class="sheet2" onclick="event.stopPropagation()">
      ${head(step==="where"?"Where it lives":step==="newdir"?"New directory":"Who can access pr-screenshots",
             step==="newdir"?"where":step==="where"?"who":null)}
      <div class="sh-body">${body}</div>
      <div class="sh-foot">${foot}</div>
    </div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   SETUP, AND CONNECTING A FIRETOWER
   ═══════════════════════════════════════════════════════════════════ */
function firstRun(){
  const at=S.first;
  const steps=(n)=>`<div class="prog">${[0,1,2].map(i=>`<i data-on="${i<=n}"></i>`).join("")}</div>`;
  const C=(b)=>`<div class="first"><div class="card">${b}</div></div>`;
  if(at==="where") return C(`${steps(0)}
    <div class="mk">${ic("building",22)}</div>
    <h1>Where is your Firetower?</h1>
    <p>Enter the domain where your Firetower control plane has been installed.</p>
    <div class="in">${ic("server",17)}<input placeholder="northwind.firetower.dev" autofocus aria-label="Address"></div>
    <button class="btn primary go" data-act="first" data-first="reaching">Continue${ic("arrow-right",15)}</button>`);
  if(at==="reaching") return C(`${steps(0)}
    <div class="mk">${ic("building",22)}</div>
    <h1>Looking for it…</h1>
    <p>Trying https, then http. Only the scheme that answers is kept.</p>
    <div class="found"><span class="typing"><i></i><i></i><i></i></span>
      <span class="tx"><b>northwind.firetower.dev</b><s>asking what is there</s></span></div>`);
  if(at==="unreachable") return C(`${steps(0)}
    <div class="mk">${ic("building",22)}</div>
    <h1>Nothing answered there</h1>
    <p>The address reached nothing on https or http.</p>
    <div class="bad"><b>Could not reach northwind.firetower.dev</b>
      DNS resolved, nothing accepted a connection on 443 or 80. If it is behind a VPN, connect to that first — Firetower does not need to be on the internet.</div>
    <button class="btn plain go" data-act="first" data-first="where">${ic("chevron-left",15)}Try another address</button>`);
  if(at==="refused") return C(`${steps(0)}
    <div class="mk">${ic("building",22)}</div>
    <h1>That is not a Firetower</h1>
    <p>Something answered, but not this.</p>
    <div class="bad"><b>northwind.firetower.dev answered 404</b>
      A Firetower answers <code style="font-family:var(--mono);font-size:13.5px">/api/v1/bootstrap</code> with its name and version. This one did not — it may be a proxy in front of something else.</div>
    <button class="btn plain go" data-act="first" data-first="where">${ic("chevron-left",15)}Try another address</button>`);
  if(at==="who") return C(`${steps(1)}
    <div class="found" style="margin-top:0">
      <span class="mark" data-reach="live" style="width:32px;height:32px;font-size:14px">Nw</span>
      <span class="tx"><b>Northwind</b><s>northwind.firetower.dev · 2.14.0</s></span>
      <button class="gbtn" data-act="first" data-first="where" title="Not this one">${ic("x",15)}</button></div>
    <h1 style="margin-top:24px">Who are you here?</h1>
    <div class="in">${ic("user-round",17)}<input placeholder="kevin" autofocus aria-label="Username"></div>
    <div class="in" style="margin-top:10px">${ic("lock",17)}<input type="password" placeholder="Password" value="••••••••••" aria-label="Password"></div>
    <button class="btn primary go" data-act="first" data-first="locked">Sign in</button>
    <p class="alt">Forgotten it? Ask an administrator to reset it.</p>`);
  if(at==="locked") return C(`${steps(1)}
    <div class="mk">${ic("key",22)}</div>
    <h1>Replace this password first</h1>
    <p>The one you were given is temporary. Nothing is stored on this Mac until it is replaced — a server this Mac cannot yet use is not a server it has been connected to.</p>
    <div class="in">${ic("lock",17)}<input type="password" placeholder="A new password" autofocus aria-label="New password"></div>
    <div class="in" style="margin-top:10px">${ic("lock",17)}<input type="password" placeholder="Again" aria-label="Repeat"></div>
    <button class="btn primary go" data-act="first" data-first="setup">Replace it and continue</button>`);
  if(at==="setup") return C(`${steps(2)}
    <div class="mk">${ic("building",22)}</div>
    <h1>Name the organisation</h1>
    <p>What the people who run this Firetower call themselves. It is what this Mac shows in the title bar, and what a switcher row says.</p>
    <div class="in">${ic("building",17)}<input placeholder="Northwind" autofocus aria-label="Organisation"></div>
    <button class="btn primary go" data-act="first" data-first="done">Continue</button>`);
  return C(`${steps(2)}
    <div class="mk" style="background:var(--raised);color:var(--ink)">${ic("check",22)}</div>
    <h1>Northwind is set up</h1>
    <p>Connect a git host and add a machine when you are ready — both are one click away. Nothing else is needed to start.</p>
    <button class="btn primary go" data-act="first" data-first="">Open Firetower</button>
    <p class="alt" style="margin-top:20px;text-align:left;padding-top:16px;border-top:1px solid var(--hair)">
      Firetower reports daily usage counts so we can see how it is actually used — never your code, prompts or file names. The full list, and the switch, are in Settings.</p>`);
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   AN AGENT PROFILE — opened, created, and read-only.
   One form, not two. A profile with a team leads and one without is a
   worker; the team is the only thing that makes it a manager, so

  ["web/app/globals.css — amber and brick","modified","<b>No new names.</b> <code>--color-amber</code>, <code>--color-amber-tint</code>, <code>--color-amber-deep</code> and <code>--color-brick-tint</code> all exist at <b>77–85</b> and are dark-tuned; what was missing is a light value for each, which goes in the same <code>[data-theme=&quot;light&quot;]</code> block as the kinds, the series and the syntax. The call sites are then untouched and resolve in both themes."],
  ["web/app/globals.css — <code>--color-amber-soft</code>","<b>proposed</b>","<b>One genuine addition, and the only one.</b> On a dark ground the readable-on-tint amber and the amber of a status dot are the same colour; on a light ground they cannot be — see <i>Amber and brick</i> above. Named after <code>--color-ember-soft</code>, which is the precedent for a second step inside one signal namespace. <b>In dark it equals <code>--color-amber</code></b>, so no dark-mode pixel moves."],
  ["desktop/src/styles.css — icons","modified","<b>One stroke weight everywhere: 1.5.</b> Rail glyphs are 20px and do <i>not</i> thicken when current — the earlier pass thickened the glyph <i>and</i> lightened its background, which is two signals for one fact. The rail's current destination becomes a filled <code>--ink</code> square with a <code>--sheet</code> glyph, replacing the white pill; a current list row keeps its raised fill and loses its shadow."],
  ["web/app/globals.css — surfaces","<b>no change</b>","<b>Measured, and deliberately left alone.</b> In light, <code>--sunk</code> and <code>--hair</code> sit <b>ΔE 1.1</b> apart where dark holds a clean <b>3.7</b>. Merging them was tried and reverted: it lightened every recessed fill in <i>dark</i> by ΔE 3.7, and separating them in light means a <i>darker hairline</i>, which is the opposite of what this pass is for. They are never adjacent, so the overlap costs nothing. <b>No token moves.</b>"],
  ["Surface tokens — usage","tidied","No value changes. <code>--sunk</code> now carries every recessed <i>fill</i> and <code>--hair</code> every <i>rule</i>; the two had drifted across each other's jobs. Invisible on screen, but it is what lets either be retuned later without hunting."],
  ["desktop/src/ui/Dashboard.tsx","replaced","<b>The home replaces it.</b> A greeting with three times of day, the composer in the middle of the page, then <i>Agents waiting for you</i> and <i>Recent artifacts</i>. Approved from <code>docs/prototypes/redesign/home-alternative.html</code> and folded in here so there is one drawing of it; that file is now a record of the exploration. Two chips carry an ember dot and the rest is a count — the constant is <code>DOTTED = 2</code>."],
  ["What the home costs","noted","The answer to <i>is anything waiting on me</i> moves from a 34px headline near the top to a <b>14.5px chip about two thirds down</b>, and the agent's own question leaves the page. <b>What still carries the thesis is untouched:</b> <code>App.tsx:85</code> and <code>:97</code> — the dock badge and the island — sum across every Firetower and do not change."],
  ["web/app/globals.css — light neutrals","corrected","<b>A hue bug, not a taste.</b> Every shipped dark neutral holds <code>R = G</code> exactly — <code>--color-ground</code> through <code>--color-line</code>, and <code>--color-bone</code> through <code>--color-mute</code>. The first light derivation raised green 1–3 points above red as well, which is a different hue rather than a cooler one, and it is what read as a blue-grey cast. Every light neutral now holds <code>R = G</code> with B raised by the amount its dark counterpart uses. <b>Each value keeps its old L* to within 0.15</b>, so no contrast ratio moves by more than 0.03."],
  ["The artifact's dark branch","corrected","<b>Found while checking the light cast.</b> This document's dark neutrals were <i>not</i> <code>globals.css</code>'s — <code>--desk</code> was <code>#060608</code> against the real <code>#0b0b0c</code>, and five of the nine carried the same green contamination. The handoff says the dark branch <i>is</i> the current values; the drawing disagreed with it. All nine are now <code>globals.css</code> byte for byte, and <b>both themes hold <code>R = G</code> on every neutral</b>."],
  ["Translucent blacks","corrected","The 31 uses of <code>rgb(21 22 26 / …)</code> — hovers, shadows, scrims — carried the same cast and concentrated it. Now <code>rgb(22 22 23 / …)</code>. <b>This is what made the rail hover look wrong</b>; it was never the hover rule."],
  ["--color-ground, lightness","modified","<b>#eceef1 → #F2F2F3.</b> Lighter and exactly neutral. Deliberately <i>not</i> Codex's <code>#f6f6f6</code>: the chrome-to-sheet step would fall to <b>ΔE 3.1</b>, and this window is a rounded card floating on that chrome rather than a flat page. At <code>#F2F2F3</code> the step is <b>ΔE 4.5</b> — down from 6.2, in the same family as the rest of the ladder (3.4, 4.9). <b>#f6f6f6 is available if the softer edge is wanted; say so.</b>"],
  ["desktop/src/styles.css — the rail box","modified","<b>42px → 34px, radius 13 → 11.</b> 7px of padding around a 20px glyph rather than 11, so the current destination reads as a tight square rather than a button-sized tile. Hover and current share the one box, so the rail does not change size under the pointer. The news pip moves with it: <code>top/right 9px → 5px</code>."],
  ["desktop/src/ui/OverviewTab.tsx — the team rail","corrected","<b>No new hue. The table already existed and was not being used.</b> <code>api/view.ts</code>'s <code>BEAT_TONE</code> says working: slate, blocked: ember, done: sage, broken: brick, over: mute — and the rail drew all of them in neutral ink, so three different facts looked like one grey thing told apart by an 11px shape. Each mark now takes the tone its own status already carries."],
  ["The same word, two colours","corrected","The Plan drew a finished step in <b>sage</b> (<code>OverviewTab.tsx:325</code>, <code>:338</code>) while the Team rail two inches above drew <i>handed back</i> in grey. One meaning, one panel, two renderings. Both are sage."],
  ["A child that failed","added","<code>OverviewTab.tsx:53</code> returns <code>failed</code> and <code>:124</code> draws it; this document could not draw it at all. Added, in brick — and as a <b>warning glyph rather than the product's round pip</b>, because a brick circle two rows under an ember circle is one shape told apart by hue alone, which is the one thing <code>STYLE.md</code> forbids."],
  ["The plan's progress bar","added","<code>OverviewTab.tsx:325</code> draws one in sage. This document had the count and not the bar."],
  ["The team row — which mark leads","modified","<b>The status mark moves to the left edge; the agent mark takes its place on the right.</b> <code>OverviewTab.tsx:203</code> puts <code>AgentMark</code> first and <code>TeamMark</code> last, so <i>which model is running</i> was the first thing in the row and <i>whether it needs you</i> was the last — past the name, past a second line, at the far edge beside the age. The one you scan for was in the least prominent position. Both are already marks, so the swap costs the system nothing and adds no token."],
  ["The second line goes entirely","modified","<b>The team row is one line: status mark, name, agent mark, age.</b> No check-in, no <code>spawnReason</code>, no status word. <code>:208</code> built that line as <code>checkIn ?? spawnReason</code> prefixed with <code>labelOf(status)</code> <i>only when there was no check-in</i> — so the status was said twice half the time and the line changed shape depending on whether an agent had spoken. One line, always the same shape."],
  ["Keeping the check-in — <b>rejected</b>","noted","<b>Two shapes were drawn and rendered switchable, and the quieter one won.</b> (b) kept the check-in and dropped only the status word; it is genuinely the more informative row — <i>&ldquo;Two readings of the band — which do you want?&rdquo;</i> says what the ember is <i>about</i>, where a bare <i>Quota band thresholds</i> says only that something is there. <b>It was not chosen.</b> Both are true at once: the check-in tells you more, and the panel is calmer as one line. It stays in the document under <b>Workspace → Team row · B</b> so the comparison survives the decision."],
  ["desktop/src/ui/OverviewTab.tsx — ManagerRow","corrected","<b>The manager carries a status mark, in both of its states, like every other row.</b> <code>:168</code> is a <code>div</code> when <code>active</code> and a navigating <code>button</code> when it is not, and <i>neither</i> drew one — <code>ManagerRow</code> renders the literal word <code>manager</code> where a status would be. An earlier draft here argued the active one needs no mark, since you are standing in it and its state is the title bar; <b>overruled</b>. A rail where one row is shaped differently from the rest is a rail you have to think about. The word <code>manager</code> goes with every other second line."],
  ["The <i>here</i> chip","modified","Moves onto the name line beside the mark, and <b>is not a substitute for one</b>. It says <i>where you are</i> — placement — and the mark says <i>what state the thing is in</i>. Two different facts, both on the one line. It was in the status slot, where at ~40px it overflowed a 16px mark and printed <code>hereAda</code>."],
  ["Ember on a waiting parent","noted","<b>The parent link draws <i>working</i>, not ember.</b> A manager blocked on its own child is <code>Working</code> in <code>api/view.ts</code>'s terms — <code>NeedsYou</code> means waiting on <i>you</i>. Drawing it ember would have put one more in that rail for a state nobody is being asked about, which is how a signal that means one thing stops meaning it."],
  ["desktop/src/ui/WorkspacesPanel — a dot on every row","corrected","<b>Every workspace row carries its status dot, in both modes, uncapped</b>, taking its own <code>BEAT_TONE</code>. This overturns two things this document argued and measured: <i>no dot in Status mode</i>, on the grounds that the band already says <i>Needs you</i> and counts them, and an <b>ember cap</b> in Repository mode, because a dot per blocked row puts <b>five</b> ember marks on the Dashboard and <b>seven</b> with a full list, against a budget of three. <b>The numbers are real and the decision stands against them.</b> A dot that exists in one mode and vanishes in the other makes the same panel read as alive and then dead with nothing explaining why; and a capped row draws a blocked workspace exactly like a calm one, which is the worse failure. See the handoff, <i>What measurement does not settle</i>."],
  ["desktop/src/ui/RailPanel.tsx — the right-click menu","restored","<b>A regression the rebuild caused, not a gap in the old design.</b> <code>Rail.tsx</code> imported <code>ContextMenu</code>, <code>useMenu</code>, <code>renameSession</code> and <code>useEndWorkspace</code>; <code>RailPanel.tsx</code> imports none of them, so right-clicking a workspace does nothing. The item set is the old one <b>verbatim</b>, read off <code>Rail.tsx</code> at <code>f3cbc425</code>: <b>Open</b> &middot; <b>Rename&hellip;</b> &middot; a rule &middot; <b>End workspace</b> in brick. Deliberately not grown &mdash; a restoration that quietly gains items is a second thing to argue about."],
  ["mayWrite gates it, not maySpeak","corrected","<code>Chat.tsx:168</code> separates them: <code>mayWrite</code> is <i>the place</i> — may I work in this workspace at all — and <code>maySpeak</code> is <i>this conversation</i>, true only for whoever started it. <b>Renaming and ending are facts about the place</b>, so the gate is <code>place.mayWrite !== false</code>. <code>!== false</code> and not <code>=== true</code>: a control plane older than this app sends neither, and reading their absence as <i>you may only watch</i> takes every control away from the person whose work it is."],
  ["A row you may not act on gets no menu","added","<b>Not a menu with two dead items.</b> The only one that would survive is <i>Open</i>, which is exactly what left-clicking the row already does — a menu whose single entry duplicates the gesture that summoned it is noise. <b>No disabled control, and the screen says it instead:</b> opening the workspace shows a title that is a <code>span</code> rather than a button, with no pencil. The absence <i>is</i> the statement, and it is the same absence <code>Workbench.tsx:491</code> already produces."],
  ["End workspace does not get a second question","noted","<code>ui/end.ts</code>&rsquo;s <code>useEndWorkspace</code> <b>already confirms</b>, with a body it builds from <code>sessionWork</code> — uncommitted files, unpushed commits, how many agents stop, and the separate wording for a workspace with nothing checked out, where <i>every file goes with it</i> and there is no branch to promise anybody. The menu item calls it and adds nothing. Confirm is a <b>sheet</b> in the overlay taxonomy and takes <code>--color-scrim</code>."],
  ["desktop/src/ui/Workbench.tsx:491 — the title renames","modified","<b>One click, and an affordance that does not need a hover.</b> It answered a double click and a <code>title</code> tooltip, which made the one way to rename from this screen a thing you had to already know. The pencil is now <b>always drawn, at <code>--hush</code></b>, 13px after the title; under the pointer it comes to <code>--quiet</code> and the title takes <code>--raised</code>. Hover sharpens it and is not what announces it. <b>Double click still works</b>, and lands in the same place. Already bound in the product; this draws the affordance it needs."],
  ["The rename pencil comes out","reverted","<b>Drawn, then removed by the person using it.</b> A pencil sat beside the workspace title always-on at <code>--hush</code>, on the argument that <i>a hover state cannot be the whole affordance — you have to already be pointing at a thing to learn it is a control</i>. That argument still stands; the cost was chosen anyway, and it is a fair one: <b>a permanent mark beside the one name on the screen is a second thing to read every time you look at it, forever, to solve a problem you have once.</b> Hover is the affordance again. <b>Rename is unchanged</b> — single click and double click both open the field. <i>How a title announces itself is still open</i>: a tooltip nobody reads and a mark nobody wants are both answers that have been tried."],
  ["The rail&rsquo;s hover preview — the rule","clarified","<b>Specified three different ways in one day, so it is written down rather than inferred.</b> Active destination + panel open: <b>no preview</b>, it is already on screen. Active + panel collapsed: <b>preview</b>. Any other destination, either state: <b>preview</b>. One sentence: <i>preview unless you are pointing at the thing the open panel is already showing.</i> Two rows were unreachable in the drawing — <code>startPeek</code> refused <code>home</code> outright, and the panel only floated when collapsed, so hovering a <i>different</i> destination with the panel open did nothing. Both are drawn now, and all four rows are asserted in a render by <code>peek.py</code>."],
  ["Clicking a destination does not pin the panel","corrected","<code>peekgo</code> set <code>panel = \"pinned\"</code> on every navigation. <b>It navigates and nothing else.</b> Pinned or collapsed is the person&rsquo;s last choice and persists across destinations; a navigation is not a vote about chrome."],
  ["The rail panel joins the shared alphabet","corrected","<b>One set everywhere: filled dot, three pips, tick, warning triangle.</b> The team rail and the home chips already share it; the panel was the one surface left behind, still drawing <code>.wdot</code> — one circle in four tones. <b>That is hue alone, and it fails on measurement rather than on taste.</b> Simulated protanope in light: <i>needs you</i> vs <i>done</i> is <b>1.07:1</b>, <i>needs you</i> vs <i>broken</i> <b>1.14:1</b>. Simulated deuteranope in dark: <i>working</i> vs <i>done</i> is <b>1.00:1</b> — the same mark. <b>Three of four states collapse</b>, and the pair that collapses hardest is an agent waiting on you against one that has finished."],
  ["What it costs, measured","noted","The shaped set does not drop in: the panel&rsquo;s lead slot is <b>9px</b> and a typing mark is <b>18</b>. The slot widens to <b>16px</b> and every label moves 7px right. At 37 rows that truncates <b>two more labels — 3 to 5</b>. That is the whole bill. <b>Nothing else in the panel moves</b>: row height, band rules and the 252px width are unchanged."],
  ["Ember becomes the only filled mark","noted","An unexpected gain. In a column of strokes — ticks, triangles, pips — <b>the solid circle is the only filled thing on the panel</b>, so ember stops being one colour among four circles and becomes a different <i>weight</i>. The signal the whole design protects gets louder without getting bigger."],
  ["Animation in a 36-row list","noted","<b>The typing mark is three pips that happen to animate, not an animation.</b> Under <code>prefers-reduced-motion</code> the duration drops to <code>1e-06s</code> and the pips sit at <code>opacity .55</code> — static, legible, and still a distinct shape. So the list is not relying on motion to say anything, which is the test that matters when eight rows of it are on screen at once."],
  ["desktop/src/ui/Dashboard — <i>Recent agents</i>","added","<b>One section, not three.</b> Ordered <code>broken &rarr; blocked &rarr; done &rarr; working</code> — severity first, then what has finished, then what is still going — with <i>View all</i> at its top right in the treatment <i>Recent artifacts</i> uses. Each chip takes its mark from the same <code>beatMark</code> the team rail uses. <b>Three sections were built first and reversed:</b> with one chip under each heading, a heading per category costs more than it returns. See the handoff."],
  ["What makes one section legible","noted","<b>The marks are shapes, not colours</b> — ember dot, sage tick, slate typing, brick triangle, each readable with the colour off. That has only been true since the team-rail pass; before it a single row would have been four greys and the headings would have been load-bearing. <b>The ordering is carried by the marks alone and gets no hairline.</b> The workspaces panel rules its bands because it is a tall list you scan down; this is two to five chips, and at two rows a rule would land somewhere different every time a name changed length. A break that moves is worse than no break."],
  ["One line or two — both drawn","open","<b>Asked for as two, then one, then two within a few minutes</b>, so both are in the masthead and nothing needs rebuilding if it moves again. <b>Two is the default.</b> Measured at the 748px column: <b>one line holds 2&ndash;3 chips, two lines 4&ndash;5</b> — not double, because the second row only exists once the first overflows. Identical at 1280 and 1680."],
  ["The ember count argues for one line","measured","<b>Severity-first ordering concentrates ember at the front of the row, so each extra row revealed is <i>more</i> likely to be ember, not less.</b> Counted rendered, budget three, and the home has no exemption: one line holds <b>3</b> at seven workspaces and <b>2</b> at forty; two lines holds <b>3</b> at seven and <b>5 at forty</b> — over, and over exactly when the list is long. A second row is the worst row to add under this order."],
  ["<i>View all</i> — expand, or open the panel","open","<b>At two lines it reveals very little.</b> Seven workspaces, two rows: 5 of 7 are already shown, so <i>View all</i> is worth two chips. At forty it reveals 31 — and expanding 36 chips in place on the home rebuilds, badly, a panel that is flat, status-ordered and probably open beside it. <b>Recommended: it opens the Workspaces panel.</b> Both are drawn and the masthead switches them."],
  ["desktop/src/styles.css — the composer","modified","<b>18px → 16.5px, and it is the same number as <i>Your message</i> deliberately.</b> These are the same words before and after you press send, and typing at 18 to read it back at 16.5 shrank the text the moment it was committed. 18 also set what you type at the size of an <b>agent's question</b> — the loudest reading tier there is — and above the <b>17px prose</b> you read at length. The type pass stepped everything under 28px up a pixel, which was right; this is the one place the uniform step landed where the scale did not intend. <b>Both composers move together</b>: the home rule restated 18 rather than changing it, so the workspace composer was already the same size and they do not now disagree."],
  ["web/app/globals.css — light signals","added","Light values for <code>--color-sage</code> and <code>--color-slate</code>, derived the way §4 derives everything: measured against what the mark sits on. <b>4.49:1</b> and <b>5.83:1</b> on the chrome, past the 3:1 floor for a non-text mark. The dark values are globals.css verbatim."],
  ["Overlays — the cross-cutting pass","corrected","<b>The pass this document promised when the palette was wired and never ran.</b> Four kinds are now named with a test — <i>does the thing it is about stay on screen?</i> — and every overlay is assigned. <b>Sheets</b> take <code>--color-scrim</code>; <b>popovers</b> take none; the find <b>bar</b> takes nothing; the Gate and Boundary are <b>screens</b>. See the handoff."],
  ["desktop/src/ui/Sharing.tsx — 482, 820","modified","<code>bg-ground/40 backdrop-blur-[2px]</code> → <code>--color-scrim</code>. A surface at an alpha is a pale wash on a pale page; the card was doing all the separating. The token has shipped in both themes since and <b>one file used it</b>."],
  ["desktop/src/ui/Annotate.tsx — 165","<b>no change</b>","<b>Correct as it is, and now by rule rather than by accident.</b> No scrim: the note is attached to a specific piece of text and dimming the page would hide the thing the note is about. The full-screen <code>fixed inset-0</code> is the catcher and should stay."],
  ["desktop/src/ui/Annotate.tsx — 194","corrected","The quoted excerpt is <code>font-mono text-micro</code> for <i>every</i> quote. A quote of a <b>code selection</b> keeps mono — the characters matter. A quote of something an <b>agent said</b> is prose and takes the text face. This document already drew it that way; the product does not."],
  ["--color-scrim vs a gradient fade","renamed","This document had <code>--scrim</code> as the composer's bottom <b>fade</b> while the product has <code>--color-scrim</code> as the modal <b>dim</b>. One name, two unrelated jobs, and a mapping that would have put a dim where a fade belongs. The fade is <code>--fade</code>. The transparent click-catcher class is <code>.catcher</code> for the same reason."],
  ["desktop/src/ui/Rail.tsx — the panel","replaced","<b>Proposition C, chosen by the user.</b> Flat and status-ordered, not status-grouped: one hairline and a word where the band turns. A <b>Status / Repository</b> switch on <i>its own row</i> under the header — 252px already carries a name, a search and a collapse, and <code>Repository</code> is the longest realistic label; a fourth thing on that line is what overlapped the title in the exploration."],
  ["Roll up BEAT, not doing()","<b>important</b>","<code>doing()</code> is nearer to hand and is the wrong function. It returns <code>waiting | working | idle</code>, and its <i>waiting</i> spans <code>NeedsYou</code>, <code>HandedBack</code> <b>and</b> <code>Failed</code>. <code>view.ts</code> argues it in its own words: <i>“finished, blocked and broken are three different things to feel, and a product that paints them the same has told you to go and look without telling you what at.”</i> Worst first: broken › blocked › working › done."],
  ["What C cannot show today","<b>implied work</b>","<b>There is no “done” and no “broken” at workspace level.</b> A finished place, a never-started one and one whose run <i>failed</i> all return <code>idle</code> from <code>doing()</code>. The <i>Done</i> and <i>Broken</i> bands are drawn here from a <code>BEAT</code> rollup that does not exist yet — <b>do not build a band the data cannot fill.</b> It needs a <code>beatOfPlace()</code> beside <code>doing()</code> in <code>api/workspaces.ts</code>; no server change, the statuses are already on the wire."],
  ["The panel draws no ember in Status mode","measured","Rows carry <b>no mark</b> — the band above already says <i>Needs you</i> and counts them. Measured before and after: a dot per blocked row put <b>five</b> ember marks on the Dashboard against a budget of three. Without them it is <b>3</b> on the Dashboard and <b>1</b> elsewhere. In Repository mode the band is a repository, so the dot returns, capped at two."],
  ["web/app/globals.css — --color-sage","<b>drawing corrected</b>","The drawing had <code>#2F7D52</code>; the build ships <code>#00582b</code>. <b>The shipped value is right and the drawing was wrong by its own rule</b> — §4 says match the dark pair's ratio against the same neighbour, dark sage holds <b>8.60:1</b> on the panel, and <code>#00582b</code> holds <b>8.64:1</b> on the sheet where <code>#2F7D52</code> holds 5.03. Taken into the drawing along with <code>--color-sage-tint</code> and <code>-deep</code>."],
  ["desktop/src/styles.css — the dark ladder","modified","<b>Route chosen: override on the desk, not <code>globals.css</code>.</b> The cause is desktop-specific — the desktop gained a floating sheet on chrome, mobile is full-bleed and web is a page — so criterion 1 (dark must not drift) and criterion 6 (web and mobile still) both hold untouched, and the type pass set the precedent. <b>The cost is a second source of truth for dark</b>, and what retires it is named: when web and mobile opt into light, the whole sheet is re-derived and these values move into <code>globals.css</code> as its dark branch."],
  ["Why dark needed it at all","measured","<b>Dark was the only part of this design inherited rather than derived.</b> Those values were made for an interface that was dark-only and had no floating sheet on chrome; the structure changed under them and the numbers never moved. The rails sat at <b>L* 3.0, 0.34% luminance</b> — a void, not a frame — and the chrome-to-sheet edge was a <b>1.68× relative luminance jump</b>, which is why a ΔE of 2.2 read as a hard edge at the bottom of the range."],
  ["The surfaces","modified","<code>ground #0b0b0c → #1D1D1E</code> · <code>panel #111113 → #232325</code> · <code>raise #17171a → #2A2A2D</code> · <code>overlay #1e1e22 → #313135</code> · <code>line #26262b → #3A3A3F</code>. The relative jump falls to <b>1.37×</b> and the ladder evens out — 3.1 / 3.4 / 3.4 / 4.2 where it was 2.2 / 2.9 / 3.6 / 4.0."],
  ["The text tiers","modified","Brought down from near-white, which is most of what read as cheap. <code>bone #f4f4f5 → #EAEAEB</code> (<b>17.16 → 13.05:1</b>) · <code>text → #B9B9BF</code> (11.32 → 8.03) · <code>dim → #8A8A92</code> (5.58 → 4.58) · <code>mute → #6B6A74</code> (2.94 → 2.94, held)."],
  ["Everything gated against the panel","re-derived","Lifting the panel drops every ratio ~17%, so the <b>seven file kinds, four chart series and seven syntax colours</b> were each re-derived to hold <i>their own</i> original ratio against the new panel — reproduced within 0.04. Tints are not ratio-held: a wash is a <b>lift above</b> the panel, and holding the ratio sent two of them darker than it."],

    <h2 style="margin-top:46px">The flexbox trap, written down because it has already cost this codebase once</h2>
    <p>A flex child defaults to <code>min-height: auto</code> and <b>refuses to shrink below its content</b>, so a column without <code>min-h-0</code> grows past the window and the scroller inside it never scrolls — while reporting a perfectly healthy <code>overflow: auto</code>. Two were missing and the file viewer simply would not scroll.</p>
