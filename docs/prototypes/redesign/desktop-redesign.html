/* ═══════════════════════════════════════════════════════════════════
   THE PALETTE — six neutrals, four text tiers, one accent.

   Derived from web/app/globals.css rather than invented: the dark
   column is the repository's own ground scale and signals, nudged by
   one or two points; the light column is the same scale mirrored so
   the sheet is the one pure white and everything above it steps down.

   The neutrals are *faintly* cool — two or three points of blue over
   red — which is what the dark tokens already are (#0b0b0c, #111113).
   It costs no saturation and it makes the one warm thing on screen
   read warmer. That is the whole colour budget.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* R = G on every neutral, B raised by a controlled amount — the rule the
     shipped dark scale holds without exception (--color-ground through
     --color-line are all R=G). The first light derivation raised green
     1–3 points above red as well, which is a different hue rather than a
     cooler one, and it is what read as a blue-grey cast beside a neutral
     product. Each value below holds its old L* to within 0.15. */
  --desk:#F2F2F3;        /* the chrome the sheet sits on */
  --sheet:#FFFFFF;       /* the one white: the page you are reading */
  --raised:#F6F6F9;      /* a control, a chip, a hovered row */
  /* These two measure ΔE 1.1 apart in light, where dark holds a clean 3.7.
     **Left overlapping on purpose.** Separating them means a darker hairline,
     and this design is trying to draw fewer and fainter lines, not stronger
     ones. They are never adjacent — a fill and a rule in the same 2px of
     screen does not occur — so the overlap costs nothing and closing it would
     cost the thing the pass is for. Recorded rather than silently "fixed". */
  --sunk:#E8E8EC;        /* a pressed chip, a recessed track */
  --hair:#E5E5EA;        /* the rare hairline */

  --ink:#161617;         /* a title, the one sentence     18.1:1 */
  --body:#47474D;        /* what somebody reads            9.3:1 */
  --quiet:#7B7B83;       /* secondary                      4.2:1 */
  --hush:#A6A6AF;        /* a timestamp. The faintest.     2.4:1 */

  --ember:#FF5E1A;       /* the only saturated thing on the screen */
  --ember-ink:#BF4714;   /* ember where it has to be read  5.1:1 */
  --brick:#B83A30;       /* and only when something broke  5.7:1 */
  /* Amber and brick's tint and deep, re-gated. These are globals.css's own
     names — the badge is composed the same way in both themes: the colour on
     its tint, inside its deep. Each light value holds a* and b* and moves L*
     until it reproduces the ratio its dark counterpart holds over the same
     neighbour. Figures in Spec. */
  --color-amber:#653400;      /* on its tint           8.76:1  (dark: 8.75) */
  --color-amber-soft:#A8780F; /* proposed — see Spec   3.92:1 on white */
  --color-amber-tint:#FCEBCE; /* on the sheet          1.17:1  (dark: 1.18) */
  --color-amber-deep:#B79045; /* border, on its tint   2.53:1  (dark: 2.52) */
  --color-brick-tint:#FFF3F2; /* on the sheet          1.09:1  (dark: 1.09) */
  --color-brick-deep:#F7A9A0; /* border, on its tint   1.74:1  (dark: 1.74) */

  /* Host marks. A brand, not a signal — the rule that a server is a mark and
     never a colour is about *Firetower* servers, and these are somebody
     else's logo. Two of the three needed a light value: GitHub's #f4f4f5
     measures 1.10:1 on white, and GitLab's orange 2.86:1, under the 3:1 floor
     for a non-text graphic. Each takes its own brand's light-mode mark rather
     than a derived one — a logo is not ours to reinterpolate. */
  --color-host-github:#1B1F23;  /* GitHub's own light mark   16.58:1 */
  --color-host-gitlab:#E24329;  /* GitLab's logo dark tone    4.14:1 */
  --color-host-gitea:#609926;   /* unchanged; it already clears 3.45:1 */
  --slate-ink:#44607E;   /* a pending change, and the control that made one */

  /* The signal marks, under their own names. `api/view.ts`'s BEAT_TONE is the
     one table that says what a status means — working: slate, blocked: ember,
     done: sage, broken: brick, over: mute — and it is already shipped. These
     are its light values; the dark ones are globals.css verbatim. Not a new
     namespace: the first one, applied where it had been left grey. */
  /* globals.css:275 verbatim. The drawing had #2F7D52 at 5.03:1 on white;
     the shipped value is 8.64:1, which is what §4's own method produces —
     match the dark pair's ratio against the same neighbour, and dark sage
     holds 8.60:1 on the panel. The drawing was wrong by its own rule. */
  --color-sage:#00582b;      /* done     8.64:1 on the sheet */
  --color-sage-tint:#daf3e3; /* globals.css:276 */
  --color-sage-deep:#81b390; /* globals.css:277 */
  --color-slate:#44607E; /* working         5.83:1 */

  /* File kinds and chart series, re-gated for a white ground. Each is the
     dark hue with L* lowered, a* and b* held, until it clears the floor the
     dark set’s own weakest member clears on #111113 — 5.7:1 for a kind,
     4.8:1 for a series. Figures in the notes. */
  --color-kind-source:#4f688a; --color-kind-native:#8b5b39; --color-kind-data:#776520;
  --color-kind-style:#6b5f93; --color-kind-media:#37714d; --color-kind-store:#925178;
  --color-kind-prose:#65666f;
  --color-series-1:#2575bd; --color-series-2:#00825d; --color-series-3:#7465c1; --color-series-4:#ba4b76;

  /* Syntax. Each matches its own dark ratio against #111113, because here the
     ratios *are* the design — comment is deliberately the faintest. Chroma is
     capped at C* 34 so every one stays under the quietest loud signal. */
  --color-syn-comment:#878792; --color-syn-string:#2d5439; --color-syn-keyword:#65598e;
  --color-syn-type:#4c647d;    --color-syn-number:#5a4c14; --color-syn-fn:#895a37;
  --color-syn-attr:#676771;
  --touched:#EAF6EE;          /* a line this session wrote */
  --touched-ink:#2F7D52;

  --lift-1:0 1px 2px rgb(22 22 23 / .05);
  --lift-2:0 2px 6px rgb(22 22 23 / .06), 0 0 0 1px rgb(22 22 23 / .04);
  --lift-3:0 18px 44px -18px rgb(22 22 23 / .26), 0 2px 8px rgb(22 22 23 / .05);
  --window-lift:0 1px 1px rgb(22 22 23 / .10), 0 32px 70px -26px rgb(22 22 23 / .34);
  --fade:linear-gradient(to top, var(--sheet) 62%, rgb(255 255 255 / 0));
  /* What a sheet is laid over. Its own thing, not a surface at an alpha:
     --desk at 40% is a pale wash on a pale page and leaves the card doing all
     the separating. In light that is still dark — the half a surface token
     cannot express. globals.css:290 verbatim. */
  --scrim:rgb(22 22 23 / .22);

  --swift:cubic-bezier(.16,1,.3,1);
  --quick:140ms;

  --font:"Archivo",ui-sans-serif,-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;

  color-scheme:light;
}
:root[data-theme="dark"]{
  /* globals.css verbatim — the handoff says the dark branch *is* the
     current values, and this artifact had drifted from them. */
  /* ── Dark, derived rather than inherited ─────────────────────────
     The only part of this design that was taken verbatim. Those values
     were made for an interface that was dark-only and had no floating
     sheet on chrome; the structure changed under them and the numbers
     never moved. The rails sat at L* 3.0 — 0.34% luminance, a void, not
     a frame — and the chrome-to-sheet edge was a **1.68x relative
     luminance jump**, which is why a ΔE of 2.2 read as a hard edge at
     the bottom of the range. The whole ladder is lifted: the jump is
     now 1.37x and the rails are a frame. Everything gated against the
     panel was re-derived to hold its own ratio. */
  --desk:#1D1D1E; --sheet:#232325; --raised:#2A2A2D; --sunk:#313135; --hair:#3A3A3F;
  --ink:#EAEAEB; --body:#B9B9BF; --quiet:#8A8A92; --hush:#6B6A74;
  --ember:#FF6B2C; --ember-ink:#FF9A6B; --brick:#E5645A;
  /* globals.css verbatim. --color-amber-soft is the one proposed addition and
     equals --color-amber here, so dark does not move at all. */
  --color-amber:#fab219; --color-amber-soft:#fab219; --color-amber-tint:#3d321c;
  --color-amber-deep:#7a5a0d; --color-brick-tint:#3e2626; --color-brick-deep:#6e2f2b;
  --color-host-github:#f4f4f5; --color-host-gitlab:#fc6d26; --color-host-gitea:#609926;
  --slate-ink:#7D95B0;
  --color-sage:#6ec08a; --color-sage-tint:#24382c; --color-sage-deep:#2c5b3d;
  --color-slate:#7d95b0;
  --color-kind-source:#8aa2c7; --color-kind-native:#c8926d; --color-kind-data:#d3bb73;
  --color-kind-style:#a99bd4; --color-kind-media:#89c69d; --color-kind-store:#cd88b0;
  --color-kind-prose:#a9a9b4;
  --color-series-1:#5194de; --color-series-2:#34aa82; --color-series-3:#9a88e8; --color-series-4:#dc6a94;
  --color-syn-comment:#777781; --color-syn-string:#9fcaaa; --color-syn-keyword:#a99bd4;
  --color-syn-type:#8ca4bf;    --color-syn-number:#d3bb73; --color-syn-fn:#c8926d;
  --color-syn-attr:#9898a3;
  --touched:#24382c; --touched-ink:#6EC08A;
  --lift-1:inset 0 1px 0 rgb(255 255 255 / .03);
  --lift-2:inset 0 1px 0 rgb(255 255 255 / .04), 0 1px 2px rgb(0 0 0 / .4);
  --lift-3:inset 0 1px 0 rgb(255 255 255 / .05), 0 18px 44px -18px rgb(0 0 0 / .72);
  --window-lift:0 0 0 1px rgb(255 255 255 / .06), 0 32px 70px -26px rgb(0 0 0 / .8);
  --fade:linear-gradient(to top, var(--sheet) 62%, rgb(19 19 23 / 0));
  --scrim:rgb(0 0 0 / .55);   /* globals.css:127 verbatim */
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--desk)}
body{font-family:var(--font);color:var(--body);-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1;font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;resize:none}
::placeholder{color:var(--hush)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:rgb(255 94 26 / .18)}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ═══════════════════════════════════════════════════════════════════
   TYPE — a scale, with tracking and leading set per size rather than
   one letter-spacing for everything.

.dlg p{margin-top:9px;font-size:15px;line-height:1.6;color:var(--quiet)}
.dlg .detail{margin-top:9px;font-family:var(--mono);font-size:12.5px;color:var(--hush)}
.steps2{margin-top:13px;display:flex;flex-direction:column;gap:7px}
.steps2 li{display:flex;gap:9px;font-size:14.5px;line-height:1.5;color:var(--body);list-style:none}
.steps2 .n{color:var(--hush);font-variant-numeric:tabular-nums;flex:none}
.dlgfoot{display:flex;justify-content:flex-end;gap:7px;margin:20px -22px 0;padding:12px 16px;
  border-top:1px solid var(--hair)}
</style>
<style>
/* ═══ WHAT IS CHECKED OUT HERE ═════════════════════════════════════ */
.pr2 .says{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--hush)}
.pr2 .says[data-t="body"]{color:var(--quiet)}
.pr2 .says[data-t="quiet"]{color:var(--quiet)}
.pr2 .spin{display:grid;place-items:center;animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pr2 .tx s .br,.aside1 .br{font-family:var(--mono);font-size:12.5px}

/* ═══ THE GATE ═════════════════════════════════════════════════════
   Not a dialog: there is nothing behind it to go back to, so it takes
   the window rather than floating over a screen it has disabled. */
.gate{position:absolute;inset:0;z-index:60;background:var(--sheet);display:grid;place-items:center;padding:40px}
.gatecard{max-width:46ch}
.gatecard>.g{width:52px;height:52px;border-radius:16px;background:var(--raised);display:grid;
  place-items:center;color:var(--quiet);margin:0 auto}
.gatecard h2{margin-top:20px;text-align:center;font-size:25px;line-height:1.2;letter-spacing:-.02em;font-weight:530;color:var(--ink)}
.gatecard p{margin-top:10px;font-size:16px;line-height:1.62;color:var(--quiet)}
.gateacts{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gatefoot{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);
  font-size:14px;line-height:1.6;color:var(--hush)}
.gatefoot b{font-weight:500;color:var(--quiet)}
</style>
<style>
/* ═══ COVERAGE, AT FEATURE GRANULARITY ═════════════════════════════
   Rows rather than a table: a sub-feature is indented under its
   parent, and a parent carries a tally instead of a verdict. */
.covlegend{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--quiet)}
.covgroup{margin-top:34px;font-size:16px;font-weight:530;letter-spacing:-.008em;color:var(--ink)}
.covtable{margin-top:8px}
.covrow{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--hair)}
.covrow:first-child{border-top:none}
.covrow .f{flex:none;width:300px;font-size:15px;color:var(--ink)}
.covrow .w{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--quiet)}
.covrow[data-head="true"]{border-top-color:var(--hair)}
.covrow[data-head="true"] .f{font-weight:530}
.covrow[data-sub="true"]{border-top-color:transparent;padding:4px 0}
.covrow[data-sub="true"] .f{padding-left:18px;width:282px;color:var(--body)}
.cstat{flex:none;width:76px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--quiet)}
.cstat i,.tally i{width:8px;height:8px;border-radius:99px;display:block;flex:none}
.cstat i[data-k="Y"],.tally i[data-k="Y"]{background:var(--touched-ink)}
.cstat i[data-k="P"],.tally i[data-k="P"]{background:var(--color-amber-soft)}
.cstat i[data-k="N"],.tally i[data-k="N"]{background:var(--hush)}
.cstat i[data-k="—"]{box-shadow:inset 0 0 0 1.5px var(--hair)}
.tally{flex:none;width:76px;display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
</style>
<style>
/* A host mark. Inherits the row's colour by default; wears its own brand only
   where the brand is the thing being identified — the host list, the connect
   sheet — and never in a dense row where three logos would shout. */
.hm{display:grid;place-items:center;flex:none;color:inherit}
.hm[data-brand="github"]{color:var(--color-host-github)}
.hm[data-brand="gitlab"]{color:var(--color-host-gitlab)}
.hm[data-brand="gitea"]{color:var(--color-host-gitea)}
</style>
<style>
/* A scope name, a header, a literal. Inline inside a row's sub-line, where a
   <b> would inherit `.sh-row .tx b { display:block }` and stack one per line. */
.sh-row .tx s code,.sh-note code{font-family:var(--mono);font-size:12.5px;color:var(--body);
  background:var(--sunk);border-radius:4px;padding:1px 4px}
</style>
<style>
/* ═══ THE CONTACT SHEET ════════════════════════════════════════════ */
.cs{max-width:1340px;margin:88px auto 0;padding:0 2px}
.cs h2{font-size:23px;line-height:1.2;letter-spacing:-.02em;font-weight:530;color:var(--ink)}
.cs-group{margin-top:38px;font-size:16px;font-weight:530;letter-spacing:-.008em;color:var(--ink);
  display:flex;align-items:baseline;gap:9px}
.cs-group .n{font-size:13px;font-weight:400;color:var(--hush)}
.cs-grid{margin-top:12px;display:grid;gap:18px 16px;
  grid-template-columns:repeat(auto-fill,minmax(384px,1fr))}
.cs-tile{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;border-radius:12px}
.cs-frame{display:block;position:relative;overflow:hidden;border-radius:9px;background:var(--desk);
  box-shadow:0 0 0 1px var(--hair);transition:box-shadow var(--quick) var(--swift)}
.cs-tile:hover .cs-frame{box-shadow:0 0 0 1.5px var(--quiet),0 10px 26px -12px rgb(22 22 23 / .3)}
.cs-tile:focus-visible .cs-frame{box-shadow:0 0 0 2px var(--ink)}
/* The tile is a picture of a screen, not a screen: nothing inside it is
   clickable, so a press always means "open this one full size". */
.cs-inner{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}
.cs-cap{font-size:13.5px;line-height:1.4;color:var(--quiet)}
.cs-tile:hover .cs-cap{color:var(--ink)}
</style>
<style>
/* ═══ THE HOME ═════════════════════════════════════════════════════
   Folded in from the approved exploration. Sizes carry this document's
   current scale — the source artifact predates the +1 pass and the
   icon refinement, so it is the layout that came across, not the
   stylesheet. */
.home{min-height:0;flex:1;overflow-y:auto;position:relative}
.hcol{width:100%;max-width:748px;margin:0 auto;padding:18px 34px 12px;
  display:flex;flex-direction:column;min-height:100%}
/* Nothing waiting and nothing made: the greeting stops holding the page
   open and the composer comes up to meet it. */
.hcol[data-bare="true"] .air{min-height:0;padding-bottom:26px}
.air{min-height:192px;padding-bottom:28px;display:flex;flex-direction:column;justify-content:flex-end}
.air h1{font-size:34px;line-height:1.14;letter-spacing:-.026em;font-weight:530;color:var(--ink)}

/* The same composer card as the workspace's, with one difference that is
   the point: at rest it is three lines tall rather than one. A docked
   composer is a thing you reach for; this one is the thing you came to
   use, and it should look like somewhere to write. */
.mid{position:relative;z-index:1;flex:none}
/* Softer than the docked card's drop. That one floats over scrolling text
   and has to separate itself from it; this sits in still white with
   content above and below, where a 44px shadow reads as a dialog. */
.mid .composer{box-shadow:0 14px 36px -16px rgb(22 22 23 / .22), 0 2px 6px rgb(22 22 23 / .05)}
.mid .composer .in{min-height:64px}

/* One shape, two contents. *Agents waiting for you* is work asking for
   you and *Recent artifacts* is work you made, so the actionable one goes
   first. Same heading, same size, same colour — the only thing telling
   them apart is the ember on the chips. */
.sect{margin-top:20px;flex:none}
.sect .hd{display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:15px;font-weight:400;color:var(--quiet);letter-spacing:.004em}
.sect .all{margin-left:auto;display:inline-flex;align-items:center;gap:3px;
  font-size:14.5px;color:var(--quiet);flex:none;transition:color var(--quick) var(--swift)}
.sect .all:hover{color:var(--ink)}
.sect .none{margin-top:10px;font-size:14.5px;line-height:1.6;color:var(--quiet);max-width:56ch}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:14px}

.chips{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;flex:none}
.chips .sw{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 14px;border-radius:99px;
  background:var(--raised);font-size:14.5px;color:var(--body);flex:none;max-width:306px;
  transition:background var(--quick) var(--swift)}
.chips .sw:hover{background:var(--sunk)}
.chips .sw b{font-weight:400;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips .sw .age{color:var(--hush);font-variant-numeric:tabular-nums;flex:none}
.chips .sw[data-over="true"]{color:var(--quiet)}

/* Somewhere you are not — the whole of what the "all servers" scope and
   the Fleet screen used to do, in one line that is only here while it is
   true. Below the artifacts: it is about another Firetower, which is a
   tier below the one you are looking at. */
.hcol .elsewhere{margin-top:10px;align-self:flex-start;display:inline-flex;align-items:center;gap:9px;
  height:38px;padding:0 6px 0 15px;border-radius:99px;background:var(--raised);color:var(--quiet);
  font-size:14.5px;transition:background var(--quick) var(--swift)}
.hcol .elsewhere:hover{background:var(--sunk)}
.hcol .elsewhere b{font-weight:500;color:var(--body)}
.hcol .elsewhere .go{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 10px;
  border-radius:99px;background:var(--sheet);color:var(--ink);font-size:13.5px}
</style>
<style>
/* ═══ THE TEAM RAIL'S STATE MARKS ══════════════════════════════════
   One mark per state, each in the colour `api/view.ts` already assigns
   it. The shapes stay what they were — a dot, three dots, a tick, a
   pip — so nothing is identified by hue alone. */
.bm{display:grid;place-items:center;flex:none}
.bm[data-tone="sage"]{color:var(--color-sage)}
.bm[data-tone="brick"]{color:var(--brick)}
.bm[data-tone="over"]{color:var(--hush)}
.typing[data-tone="slate"] i{background:var(--color-slate)}
/* Done, in the plan, is the same sage as done in the team — the two sat
   two inches apart saying the same word in two different colours. */
.step[data-s="done"] .box{background:var(--color-sage);border-color:var(--color-sage)}
.planbar{margin-top:10px;height:3px;border-radius:99px;background:var(--hair);overflow:hidden}
.planbar i{display:block;height:100%;border-radius:99px;background:var(--color-sage);
  transition:width 500ms var(--swift)}
</style>
<style>
/* ═══ THE WORKSPACES PANEL — proposition C ═════════════════════════
   The switch gets a row of its own. It was in the header beside the
   title in the exploration and overlapped it: 252px already carries a
   name, a search and a collapse, and "Repository" is the longest
   realistic label. A fourth thing does not fit on that line. */
.pswitch{padding:2px 8px 8px;flex:none}
.seg2{display:inline-flex;gap:2px;padding:2px;border-radius:99px;background:var(--raised)}
.seg2 button{padding:4px 11px;border-radius:99px;font-size:13px;color:var(--quiet);
  white-space:nowrap;transition:background var(--quick) var(--swift),color var(--quick) var(--swift)}
.seg2 button:hover{color:var(--body)}
.seg2 button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--lift-1)}
:root[data-theme="dark"] .seg2 button[aria-pressed="true"]{background:var(--sunk)}

/* One hairline and a word where the band turns — a section's job for a
   line's cost. At forty rows that is the difference between seeing the
   working band and scrolling to it. */
.pband{display:flex;align-items:center;gap:8px;padding:13px 9px 4px}
.pband span{font-size:13px;color:var(--hush);flex:none}
.pband .n{margin-left:0;font-variant-numeric:tabular-nums}
.pband i{flex:1;height:1px;background:var(--hair)}
.prepo{display:flex;align-items:center;gap:7px;padding:14px 9px 4px;font-size:13.5px;color:var(--quiet)}
.prepo span:first-of-type{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prepo .n{margin-left:auto;flex:none;font-size:12.5px;color:var(--hush);font-variant-numeric:tabular-nums}
.prepo svg{flex:none;color:var(--hush)}
.prow .mk{width:9px;flex:none;display:grid;place-items:center}
.wdot{width:8px;height:8px;border-radius:99px;flex:none;background:var(--ember)}
.wdot[data-t="working"]{background:var(--color-slate)}
.wdot[data-t="done"]{background:var(--color-sage)}
.wdot[data-t="broken"]{background:var(--brick)}
.pnone{padding:14px 9px;font-size:14.5px;line-height:1.55;color:var(--quiet)}
</style>
<style>
/* The status leads the row; the agent mark moves to the right beside the age.
   Both were already marks, so the swap costs the system nothing — it only
   changes which one the eye reaches first. */
.tm .lead{width:16px;flex:none;display:grid;place-items:center}
.tm .tx.one{display:flex;align-items:center}
.tm .rt .ag{display:grid;place-items:center;color:var(--quiet);flex:none}
</style>
<style>
/* `here` moved onto the name line: it is a label about which row you are
   standing in, not a status, and at ~40px it overflowed the 16px lead slot. */
.tm .tx{min-width:0}
.tm .tx b{display:inline}
.tm .tx.one{display:block;align-self:center}
</style>
<style>
/* The title is the rename control. **It carries no mark.** A pencil was
   drawn here always-on, at `--hush`, on the argument that a hover state
   cannot be the whole affordance — you have to already be pointing at a
   thing to learn it is a control. That argument still stands and the cost
   was chosen anyway: a permanent mark beside the one name on the screen is
   a second thing to read every time you look at the title, forever, to
   solve a problem you have once.

   So hover is the affordance again, and **how a title announces itself is
   an open question** rather than a solved one. A tooltip nobody reads and
   a mark nobody wants are both answers that have been tried. */
.whead .nm.rn{display:inline-flex;align-items:center;border-radius:7px;
  margin-left:-7px;padding:2px 7px;color:var(--ink)}
.whead .nm.rn:hover{background:var(--raised)}
</style>
<style>
/* **One line, and the cut is never through a chip.** A flex row that wraps
   moves a whole item to the next line, so clipping to one row's height hides
   chips entirely rather than slicing one in half. The column is capped at
   748px, so how many fit is a constant of the design and not of the window —
   it is the same number at 1280 and at 1680. */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips[data-rows]{overflow:hidden}   /* the height is measured, not guessed */
.sect .all[hidden]{display:none}
.sw .typing{transform:scale(.86)}
.sw .bm{display:grid;place-items:center}
</style>
<style>
/* The shaped set does not fit the panel's 9px lead slot: a typing mark is
   three 4px pips with two 3px gaps — 18px — and the glyphs are 13–14. Shown
   at the panel's own size, the slot has to widen to 16px, and every label in
   the panel moves 7px right. That is the cost, drawn rather than asserted. */
.panel[data-mark="shape"] .prow .mk{width:16px}
.panel[data-mark="shape"] .prow .bm{width:14px;height:14px}
.panel[data-mark="shape"] .prow .typing{transform:scale(.8);transform-origin:left center}
</style>

</head>

/* ── The workspaces panel ─────────────────────────────────────────
   Proposition C from docs/prototypes/redesign/workspaces-exploration.html,
   chosen by the user. Flat and status-ordered rather than status-grouped:
   one hairline and a word where the band turns, not a section. A grouped
   list reorders under the pointer — the row you reached for jumps to
   another section the moment its state changes — which is why A was not

   words — "finished, blocked and broken are three different things to

   look without telling you what at." Worst first: broken › blocked ›

/* The states C was chosen against, kept because they are why it won. */
const WS_SMALL=[
  {id:"w1",name:"Quota meter rounding",        repo:"northwind/api",  beat:"blocked", age:"12m"},
  {id:"w2",name:"Light mode for the whole app",repo:"northwind/web",  beat:"blocked", age:"41m"},

/* One list, so the home and the panel cannot disagree on the same screen.
   *Nothing waiting* has to mean nothing is waiting anywhere, and the panel

  const base = S.ws==="many" ? WS_MANY

const BEAT_ORDER = { blocked:0, working:1, done:2, broken:3 };
const BEAT_BAND  = { blocked:"Needs you", working:"Working", done:"Done", broken:"Broken" };
/* **Every row carries its status dot, in both modes, with no cap.**
   `BEAT_TONE`'s own tones: ember blocked, slate working, sage done, brick
   broken.

   This overrules two things this document previously argued and measured.
   It drew *no* dot in Status mode — the band already says "Needs you" and
   counts them — and it capped ember in Repository mode, because a dot per
   blocked row put five ember marks on one screen against a budget of three.
   The arithmetic was real. **The user has seen it rendered both ways and
   chosen this one**, and it is a decision rather than an oversight.

   What the measurement missed is what the switch feels like in the hand.
   A dot that exists in one mode and vanishes in the other makes the same
   panel read as alive and then dead, with nothing on screen explaining the
   difference — and a capped row is a blocked workspace drawn exactly like a
   calm one, which is worse than a loud panel. **The dot is not mode
   dependent, and the cap is gone.**

   The ember budget still holds everywhere else — the Dashboard, the team
   rail, the chips. This panel is an exemption with a reason, not a repeal;
   see the handoff, section 4. */

function panel(){
  const ws = WORKSPACES();
  const grouped = S.wsby === "repo";
  const nothing = !ws.length;
  const sw = `<div class="pswitch">
    <span class="seg2">${[["status","Status"],["repo","Repository"]].map(([id,t])=>
      `<button data-act="wsby" data-wsby="${id}" aria-pressed="${(S.wsby||"status")===id}">${t}</button>`).join("")}</span>
  </div>`;
  let body;
  if(nothing){
    body = `<p class="pnone">Nothing running yet. Start something on the home and it appears here.</p>`;
  } else if(grouped){
    const by={}; ws.forEach(w=>(by[w.repo]=by[w.repo]||[]).push(w));
    body = Object.keys(by).map(r=>
      `<div class="prepo">${ic("folder-git-2",14)}<span>${esc(r)}</span><span class="n">${by[r].length}</span></div>`
      + by[r].sort((x,y)=>BEAT_ORDER[x.beat]-BEAT_ORDER[y.beat])
          .map(w=>wrow(w)).join("")).join("");
  } else {
    const sorted=[...ws].sort((x,y)=>BEAT_ORDER[x.beat]-BEAT_ORDER[y.beat]);
    let last=null;
    body = sorted.map(w=>{
      const turn = w.beat!==last; last=w.beat;
      const n = sorted.filter(x=>x.beat===w.beat).length;
      return (turn?`<div class="pband"><span>${BEAT_BAND[w.beat]}</span><i></i><span class="n">${n}</span></div>`:"")
        + wrow(w);   /* the band groups; the dot is the row's own and stays */
    }).join("");
  }
  return `<div class="phead">
      <span class="nm">Workspaces</span>
      <button class="gbtn" data-act="noop" title="Find anything   ⌘P" aria-label="Find anything">${ic("search",15)}</button>
      <button class="gbtn" data-act="panel" title="Hide this panel   ⌘\\" aria-label="Hide this panel">${ic("panel-left-close",15)}</button>
    </div>
    ${nothing?"":sw}
    <div class="pscroll" data-navzone>
      <button class="prow strong" data-act="noop"><span style="width:8px;flex:none;display:grid;place-items:center;color:var(--quiet)">${ic("pencil",14)}</span><span class="lbl">New workspace</span><span class="kbd">⌘N</span></button>
      ${body}
    </div>`;
}
/* One row shape for both modes. The dot is never conditional: a workspace
   that needs you looks the same wherever the panel has put it. */
function wrow(w){
  const on = S.rt==="work" && w.id===WS.id;
  /* **One alphabet, everywhere.** The panel drew its own `.wdot`: one circle
     in four tones, which is *hue alone* — the one thing the guide forbids —
     and it fails quantitatively rather than as a matter of taste. Simulated
     for a protanope in light, `needs you` and `done` sit at **1.07:1**; for a
     deuteranope in dark, `working` and `done` are **1.00:1**. Three of the
     four states collapse, and the pair that collapses hardest is the one that
     matters most: an agent waiting on you, and one that has finished.

     The shaped set survives a luminance of 1.00:1 because the shapes differ:
     a filled dot, three pips, a tick, a warning triangle. It does not drop
     in — the panel's lead slot is 9px and a typing mark is 18 — so the slot
     widens to 16 and every label moves 7px right. Measured cost at 37 rows:
     **two more labels truncate**, 3 to 5. That is what it buys. */
  const mk = S.pmark==="shape"
    ? beatMark(MARK_FOR[w.beat])
    : `<i class="wdot" data-t="${w.beat}"></i>`;
  return `<button class="prow" data-act="open" aria-current="${!!on}"

/* ── The home ────────────────────────────────────────────────────

const GREETINGS={morning:"Good morning",afternoon:"Good afternoon",evening:"Good evening"};
function partOfDay(){
  if(S.when) return S.when;
  const h=new Date().getHours();
  return h<5 ? "evening" : h<12 ? "morning" : h<18 ? "afternoon" : "evening";

const homeAsks=asks;
const homeArts=()=> (S.home==="both"||S.home==="nowait") ? ARTS.filter(a=>a.p).slice(0,3) : [];

/* ── Recent agents ─────────────────────────────────────────────────
   **One section, ordered by status.** Three headings came first —
   Waiting for you, Handed back, Working — and were reversed as soon as
   they were built: with one chip under each, a heading per category
   costs more than it returns. Three words of chrome to label three
   words of content.

   What makes one section work is that **the marks are shapes rather
   than colours**: ember dot, sage tick, slate typing, brick triangle,
   all distinguishable with the colour off. That has only been true
   since the team-rail pass. Before it, a single row would have been
   four greys and the headings would have been load-bearing.

   The order is severity first, then what has finished, then what is
   still going — which is also `BEAT_ORDER` with `broken` lifted to the
   front, because a failed run is the one thing here you cannot act on
   by waiting.

   **No visible break where the order turns**, at one row or two. The
   workspaces panel draws a hairline and a word at each band because it is
   a tall list you scan down; this is two to five chips. A rule inside it
   would divide a row that can be read in a glance, and at two rows it
   would land in a different place every time a name changed length —
   a break that moves is worse than no break. The marks are the ordering
   and they are shapes: a row this short does not need a legend, and a
   hairline in it would be more chrome than the headings it replaced. */
const AGENT_ORDER=["broken","blocked","done","working"];

   workspace name gets this long. Drawn rather than imagined. */

  const ws=WORKSPACES().map(w=>S.longname&&w.id==="w1"?{...w,name:LONGNAME}:w);
  return ws.slice().sort((x,y)=>AGENT_ORDER.indexOf(x.beat)-AGENT_ORDER.indexOf(y.beat));
}
const MARK_FOR={blocked:"needs",done:"ready",working:"working",broken:"failed"};

function waitingSection(){

<script>
/* ═══════════════════════════════════════════════════════════════════
   THE WORKSPACE
   ═══════════════════════════════════════════════════════════════════ */
/* `api/view.ts`'s BEAT_TONE, applied. It is the one table that says what a
   status means and it was already shipped — working: slate, blocked: ember,
   done: sage, broken: brick, over: mute. These marks had all been drawn in
   neutral ink, which left three different facts looking like one grey thing
   told apart only by an 11px shape. No new hue: the signals are the first
   namespace, not a fourth. */
function beatMark(state){
  if(state==="needs")   return `<span class="dot" title="Asked you a question"></span>`;
  if(state==="working") return `<span class="typing" data-tone="slate" title="Working now"><i></i><i></i><i></i></span>`;
  if(state==="ready")   return `<span class="bm" data-tone="sage" title="Handed back">${ic("check",14)}</span>`;
  /* A glyph, not a pip. The product draws this as a round pip, which beside
     the ember dot two rows up is one circle distinguished from another by
     hue alone — the one thing the guide forbids. A tick and a warning read
     apart with the colour off. */
  if(state==="failed")  return `<span class="bm" data-tone="brick" title="Failed">${ic("triangle-alert",14)}</span>`;
  if(state==="over")    return `<span class="bm" data-tone="over" title="Ended">${ic("check",14)}</span>`;
  return "";
}
/* ── The team rail ────────────────────────────────────────────────
   Second pass. The colour pass gave each state its own tone and the
   user pushed back: still not obvious. The diagnosis is structural —
   **the most important fact was in the least prominent position.**
   A row read agent-mark, name, a second line beginning with the status
   *word*, then the status *glyph* at the far right edge. The status was
   said twice and the thing you scan for was the last thing you reached.

   So the marks swap: **status leads, the agent follows.** Both are
   already marks, so this costs the system nothing.

   And the status word leaves the second line. OverviewTab builds that
   line as `checkIn ?? spawnReason`, prefixed with `labelOf(status)`
   *only when there is no check-in* — so the word was already absent
   half the time. Dropping it makes the line one thing always: what the
   agent is doing, or why it exists. */
function team(){
  const m=TEAM.manager, v=S.teamv||"b";
  const kids = S.teamfail
    ? TEAM.kids.map(k=>k.name==="Backfill the invoice index"
        ? {...k, state:"failed", note:"the migration would not apply",
           sub:"“The migration would not apply — the index already exists”"} : k)
    : TEAM.kids;

  /* "Now" keeps the shipped row so the comparison is the argument. */
  const nowRow=(x,here)=>`<button class="tm" data-act="noop" data-here="${!!here}">
      <span class="ag">${AGENT[x.agent](15)}</span>
      <span class="tx"><b>${esc(x.name)}</b><s>${esc(x.note||"")}</s></span>
      <span class="rt">${here?`<span class="here-badge">here</span>`:beatMark(x.state)}
        <span class="age">${x.age}</span></span></button>`;

  /* A · **what ships.** The whole second line goes, and every row carries a
     status mark — the manager included, in both of its states. The `here`
     chip stays beside the name: it says *where you are*, which is placement,
     not status, and the two facts both belong on the one line. */
  const rowA=(x,here)=>`<button class="tm" data-act="noop" data-here="${!!here}">
      <span class="lead">${beatMark(x.state)}</span>
      <span class="tx one"><b>${esc(x.name)}</b>${here?`<span class="here-badge">here</span>`:""}</span>
      <span class="rt"><span class="ag">${AGENT[x.agent](15)}</span>
        <span class="age">${x.age}</span></span></button>`;

  /* B · **the rejected alternative, kept.** Only the status *word* goes and
     the line keeps the check-in. It is genuinely the more informative row —
     “Two readings of the band — which do you want?” says what the ember is
     *about*, where a bare name says only that something is there. It was
     drawn, rendered switchable against A, and **not chosen**: the panel is
     quieter as one line, and both of those things are true at once. */
  const rowB=(x,here)=>`<button class="tm" data-act="noop" data-here="${!!here}">
      <span class="lead">${beatMark(x.state)}</span>
      <span class="tx"><b>${esc(x.name)}</b>${here?`<span class="here-badge">here</span>`:""}
        <s>${esc(x.sub||x.note||"")}</s></span>
      <span class="rt"><span class="ag">${AGENT[x.agent](15)}</span>
        <span class="age">${x.age}</span></span></button>`;

  const row = v==="now" ? nowRow : v==="a" ? rowA : rowB;
  /* The manager. Active, it is the workspace you are reading and its state is
     the title bar and the composer — so `here` stands in for a status. As a
     link *up* to a parent it is another workspace you are not looking at, and
     its status is worth exactly as much as a sibling's. */
  const mgr = S.teamup
    ? row({...m, name:"Ada — the lead", note:"the workspace above",
           sub:"waiting on this one to come back", state:"working"}, false)
    : row(m, true);
  return `<div class="team">${mgr}
    <div class="kids">${kids.map(k=>row(k)).join("")}</div>
  </div>`;
}

function inspector(){
  const TABS=[["overview","Overview"],["diff","Diff"],["files","Files"],["ship","Ship"]];
  const t=S.itab;
  let body="";
  if(t==="overview"){
    body=`<section class="isec">
        <p class="where">In <b>${WS.repo}</b>, on <span class="br">${WS.branch}</span></p>
        <p class="where">${WS.where}, twelve minutes in</p>
      </section>
      <section class="isec">
        <h3>Team<span class="n">${TEAM.kids.length+1}</span></h3>
        ${team()}
      </section>
      <section class="isec">
        <h3>Made</h3>
        <div class="made">${MADE.map(x=>`<a data-act="noop">
          <span class="g">${ic(x.kind==="artifact"?"shapes":"git-branch",15)}</span>
          <span class="tx">${esc(x.name)}</span>
          <span class="g">${ic("chevron-right",14)}</span></a>`).join("")}</div>
      </section>
      <section class="isec">
        <h3>Plan<span class="n">${PLAN.filter(p=>p.s==="done").length} of ${PLAN.length}</span></h3>

function workspace(){

          <button class="tool" data-act="noop"><span class="g">${ic("file-code",14)}</span><span class="path">web/app/components/QuotaMeter.tsx</span><span class="n">+41 −12</span></button>

          <button class="tool" data-act="noop"><span class="g">${ic("shapes",14)}</span>Published <b style="font-weight:500;color:var(--body)">Quota meter, four shapes</b><span class="n">v3</span></button>
        </div>

        <div class="atwork"><span class="typing"><i></i><i></i><i></i></span>Running the test suite<span class="path">cargo test quota</span></div>
      </div></div>`, S.find==="many"?"the":"soft limit")}

      ${S.wb==="chat"?`<div class="dock"><div class="wrap"><div class="composer">
        <div class="in" contenteditable="true" role="textbox" aria-label="Reply" data-ph="Reply to Claude Code…"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ARTIFACTS
   ═══════════════════════════════════════════════════════════════════ */
/* A picture of an artifact, never a running copy of it — an <img> against a
   poster rendered once per version, as ArtifactShot and posters.tsx already
   do. A live frame would be untrusted HTML same-origin with the app, and it
   was six page loads and six sets of running timers before that. */
function shot(a,cls){
  const has=!!a.p;
  if(has) return `<span class="shot" data-has="true" aria-hidden="true">
    <img class="pic" alt="" decoding="async"
      src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(poster(a.p))}"></span>`;
  return `<span class="shot" data-has="false" aria-hidden="true">
    <span class="plate">${ic("shapes",cls==="big"?26:18)}</span>
    ${a.pending?`<span class="pending"><i></i></span>`:""}</span>`;
}
function artifacts(){
  const all=S.lib==="none"?ARTS.map(a=>({...a,p:null,pending:true})):ARTS;
  const shown=all.filter(a=>S.scope==="all"||(S.scope==="mine"?a.mine:!a.mine));
  const head=`<div class="phead2">
      <div style="min-width:0">
        <h1>Artifacts</h1>
        <p class="sub">A page an agent published for you to look at. It outlives the workspace that made it.</p>
      </div>
      <div class="acts">
        <label class="find">${ic("search",15)}<input placeholder="Find an artifact" spellcheck="false" aria-label="Find an artifact"></label>
        <button class="btn primary" data-act="noop">${ic("sparkles",15)}Ask for one</button>
      </div>
    </div>
    <div class="filters">
      ${[["all","All"],["mine","Yours"],["shared","Shared with you"]].map(([id,l])=>
        `<button class="fp" data-act="scope" data-scope="${id}" aria-pressed="${S.scope===id}">${l}</button>`).join("")}
      <span class="right">
        <button class="gbtn" data-act="look" data-look="grid" title="Grid" style="color:${S.look==="grid"?"var(--ink)":"var(--hush)"}">${ic("layout-grid",16)}</button>
        <button class="gbtn" data-act="look" data-look="list" title="List" style="color:${S.look==="list"?"var(--ink)":"var(--hush)"}">${ic("rows-3",16)}</button>
      </span>
    </div>`;

  if(S.lib==="empty") return `<div class="pcol">${head}
    <div style="display:grid;place-items:center;padding:110px 0 80px;text-align:center">
      <div style="max-width:40ch">
        <span style="width:54px;height:54px;border-radius:17px;background:var(--raised);display:grid;place-items:center;color:var(--hush);margin:0 auto">${ic("shapes",24)}</span>
        <h2 style="margin-top:20px;font-size:25px;letter-spacing:-.02em;font-weight:530;color:var(--ink)">Nothing published yet</h2>
        <p style="margin-top:8px;font-size:16.5px;line-height:1.55;color:var(--quiet)">Ask an agent for a chart, a mock-up or a report and it appears here.</p>
        <button class="btn primary" style="margin-top:20px">${ic("sparkles",15)}Ask for one</button>
      </div></div></div>`;

  const body=S.look==="grid"
    ? `<div class="gal">${shown.map(a=>`<button class="art" data-act="noop">
        ${shot(a,"big")}
        <span class="nm">${esc(a.t)}</span>
        <span class="mt"><span class="from">${esc(a.from)}</span><span class="age">${a.age}</span></span>
      </button>`).join("")}</div>`
    : `<div class="colhead"><span style="width:84px;flex:none"></span><span style="flex:1">Artifact</span>
        <span style="width:200px;flex:none">From</span><span style="width:52px;flex:none;text-align:right">Updated</span>
        <span style="width:24px;flex:none"></span></div>
       <div class="alist">${shown.map(a=>`<button class="ar" data-act="noop">
        ${shot(a)}
        <span class="tx"><b>${esc(a.t)}</b><s>Version ${a.v}${a.pending?" · no picture yet":""}</s></span>
        <span class="from">${esc(a.from)}</span>
        <span class="age">${a.age}</span>
        <span class="gbtn ghost" data-act="noop">${ic("ellipsis",15)}</span>
      </button>`).join("")}</div>`;
  return `<div class="pcol">${head}${body}</div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   SKILLS
   ═══════════════════════════════════════════════════════════════════ */
function skRow(s){
  const on=(s.on||[]).length>0;
  return `<button class="sk" data-act="openskill" data-held="${s.v===0}">
    <span class="plate">${s.m}</span>
    <span class="tx">
      <span class="l1"><span class="nm">${s.n}</span>
        ${s.v===null?`<span class="v">from Firetower</span>`:s.v===0?`<span class="v">waiting for you</span>`:`<span class="v">v${s.v}</span>`}
        ${s.where?`<span class="v">shared in ${s.where}</span>`:""}</span>
      <span class="ds">${esc(s.d)}</span>
      ${s.risk.length?`<span class="risks">${s.risk.map(r=>`<span class="risk"><i></i>${r}</span>`).join("")}</span>`:""}
    </span>
    <span class="rt">
      ${(s.on||[]).length?`<span class="ags">${s.on.map(a=>AGENT[a](14)).join("")}</span>`:""}
      <span class="tog" role="switch" aria-checked="${on}" data-locked="${!!s.locked}"
        title="${s.locked?"On by default, and it cannot be turned off here — turn it off for one session in the composer":"On by default for new sessions"}"><i></i></span>
    </span>
  </button>`;
}
function sec(title,count,note,rows,all){
  return `<section class="sksec">
    <div class="hd"><h2>${title}</h2><span class="n">${count}</span>
      ${all?`<button class="all" data-act="noop">See all${ic("chevron-right",14)}</button>`:""}
      ${note?`<p class="note">${note}</p>`:""}</div>
    <div class="skgrid">${rows}</div></section>`;
}
function skills(){
  return `<div class="pcol" style="position:relative">
    ${S.drop?`<div class="drop"><div><div class="g">${ic("folder-down",28)}</div>
      <b>Drop the folder</b><p>One skill, a folder of them, or a .zip of either. Nothing is written until you have looked at what was found.</p></div></div>`:""}
    <div class="phead2">
      <div style="min-width:0">
        <h1>Skills</h1>
        <p class="sub">A folder of instructions an agent reads when it decides it is relevant. Share one, and everybody in that directory gets it.</p>
      </div>
      <div class="acts">
        <label class="find">${ic("search",15)}<input placeholder="Search by name or description" spellcheck="false" aria-label="Search skills"></label>
        <button class="btn primary" data-act="pick" data-pick="add">${ic("plus",15)}Add a skill${ic("chevron-down",14)}</button>
      </div>
    </div>

    <section class="sksec">
      <div class="hd"><h2>Waiting for you</h2><span class="n">1</span></div>
      <div class="review">
        <h3>An agent wrote this one, and it runs code</h3>
        <p>Read every file before you approve it. <code style="font-family:var(--mono);font-size:13.5px;color:var(--ink)">deploy-runbook</code> ships executable scripts and registers hooks for the whole session, so it runs on every turn rather than only when it is invoked.</p>
        <div class="acts"><button class="btn primary">${ic("check",15)}Read it, then approve</button><button class="btn quiet">${ic("trash-2",15)}Discard</button></div>
      </div>
      <div class="skgrid" style="margin-top:4px">${SK.review.map(skRow).join("")}</div>
    </section>

    ${sec("Yours",SK.mine.length,"Yours, or in a directory you administer. Select several to share or delete them together.",SK.mine.map(skRow).join(""),true)}
    ${sec("From Firetower",SK.builtin.length,"Shipped with the product and on by default. They cannot be deleted — turn one off for a single session in the composer.",SK.builtin.map(skRow).join(""))}
    ${sec("Shared with you",SK.shared.length,"You can turn these on in your sessions. Their directory’s admins decide who else gets them.",SK.shared.map(skRow).join(""))}

    <p style="margin-top:36px;display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--quiet)">
      ${ic("folder-down",15)}Or drop a folder anywhere on this page.</p>
  </div>`;
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   THE PICKERS — one shape, five contents. Each is a popover anchored
   to the chip that opened it; a drill-down replaces the pane and keeps
   a way back, so there is one thing to learn.
   ═══════════════════════════════════════════════════════════════════ */
const tick=`<span class="tick">${ic("check",15)}</span>`;

function pickRun(){
  if(S.pane){
    const c=CONTROLS.find(x=>x.k===S.pane);
    const CHOICES={
      model:[["Opus 5","The deepest. Slowest, and the one to reach for when it matters."],["Sonnet 5","Quick, and good enough for most turns."],["Haiku 4.5","Fast and cheap. Good for scaffolding."]],
      effort:[["High","Thinks for longer before it acts."],["Medium","The default."],["Low","Answers sooner, plans less."]],
      perms:[["Ask before writing","It reads freely and asks before it changes anything."],["Ask before running","Edits land; shell commands stop for you."],["Don’t ask","It works unattended. You will see what it did, afterwards."]],
    }[S.pane];
    return `<div class="pick">
      <button class="back" data-act="pane" data-pane="">${ic("chevron-left",15)}${c.label}</button>
      <div class="list">${CHOICES.map(([n,d])=>`<button class="opt" data-act="noop" aria-selected="${n===c.now}">
        <span class="tx"><b>${n}</b><s>${d}</s></span>${tick}</button>`).join("")}</div>
    </div>`;
  }
  return `<div class="pick">
    <div class="lab2">What runs this</div>
    <div class="list">
      ${AGENTS.map(a=>`<button class="opt" data-act="noop" aria-selected="${a.k==="claude"}">
        <span class="g">${AGENT[a.k](17)}</span>
        <span class="tx"><b>${a.label}</b><s>${a.sub}</s></span>${tick}</button>`).join("")}
    </div>
    <div style="height:1px;background:var(--sunk);margin:7px 11px"></div>
    <div class="lab2">How it runs</div>
    <div class="list">
      ${CONTROLS.map(c=>`<button class="opt" data-act="pane" data-pane="${c.k}">
        <span class="tx"><b>${c.label}</b><s>${c.now}</s></span>
        <span class="g">${ic("chevron-right",15)}</span></button>`).join("")}
    </div>
  </div>`;
}

function pickRepo(){
  const n=REPOS.filter(r=>r.on).length;
  return `<div class="pick">
    <label class="search">${ic("search",15)}<input placeholder="Search repositories" autofocus></label>
    <div class="list">
      ${REPOS.map(r=>`<button class="opt" data-act="noop" aria-selected="${r.on}">
        <span class="g">${ic("folder",17)}</span>
        <span class="tx"><b>${r.slug}</b><s>${r.branch}</s></span>${tick}</button>`).join("")}
    </div>
    <div class="foot">${n===0?"No repository — a bare workspace with no code in it."
      :`<b>${n} checked out.</b> Each one gets its own copy of the code, cut from its default branch.`}</div>
  </div>`;
}

function pickMachine(){
  const m=MACHINES.find(x=>x.on);
  return `<div class="pick">
    <div class="list">
      ${MACHINES.map(x=>`<button class="opt" data-act="noop" aria-selected="${x.on}">
        <span class="g">${ic(x.k==="local"?"monitor":"server",17)}</span>
        <span class="tx"><b>${x.name}</b><s>${x.sub}</s></span>
        ${x.ready?"":`<span class="chip2">needs setup</span>`}${tick}</button>`).join("")}
    </div>
    <div class="foot">
      <b>${m.name}</b><br>
      <span class="ok"><i></i>Claude Code installed, git 2.49, node 22</span><br>
      Ready — nothing to do before you start.
    </div>
  </div>`;
}

function pickProfile(){
  return `<div class="pick">
    <label class="search">${ic("search",15)}<input placeholder="Search profiles" autofocus></label>
    <div class="list">
      ${PROFILES.map(p=>`<button class="opt" data-act="noop" aria-selected="${p.id===null}">
        <span class="g">${p.agent?AGENT[p.agent](17):ic("users",17)}</span>
        <span class="tx"><b>${p.name}</b><s>${p.does}</s></span>
        ${p.manager?`<span class="chip2">can delegate</span>`:""}${tick}</button>`).join("")}
    </div>
    <div class="foot">A profile is a saved way of working — what it is for, what it may do, and who it may hand work to.</div>
  </div>`;
}

function pickSkills(){
  return `<div class="pick">
    <div class="lab2">Skills this agent reads</div>
    <div class="list">
      ${SKILLS_ON.map((s,i)=>`<button class="opt" data-act="noop" aria-selected="${i<3}">
        <span class="g">${ic("shapes",17)}</span>
        <span class="tx"><b>${s.name}</b><s>${s.sub}</s></span>${tick}</button>`).join("")}
    </div>
    <div class="foot">Only the description of each is in context until the agent decides it needs one.</div>
  </div>`;
}

function pickAdd(){
  return `<div class="pick">
    <div class="list">
      <button class="opt" data-act="mk" data-mk="ai" style="align-items:flex-start;padding:9px 10px">
        <span class="g" style="margin-top:2px">${ic("sparkles",17)}</span>
        <span class="tx"><b>Create with AI</b><s>Describe it; an agent writes it for you.</s></span></button>
      <button class="opt" data-act="drop" style="align-items:flex-start;padding:9px 10px">
        <span class="g" style="margin-top:2px">${ic("folder-down",17)}</span>
        <span class="tx"><b>Upload a folder</b><s>A skill you already have, dropped in.</s></span></button>
    </div>
  </div>`;
}

const PICKERS={run:pickRun,repo:pickRepo,machine:pickMachine,profile:pickProfile,skills:pickSkills,add:pickAdd};
const PICK_W={run:306,repo:322,machine:330,profile:326,skills:326,add:330};
function picker(){
  if(!S.pick) return "";
  const at=S.pickAt||{x:400,top:400};
  const w=PICK_W[S.pick]||310;
  const v=at.bottom!==undefined?`bottom:${at.bottom}px`:`top:${at.top}px`;
  const h=at.right!==undefined?`right:${at.right}px`:`left:${at.x}px`;
  return `<div class="catcher" data-act="close"></div>
    <div class="pop ${at.bottom===undefined?"from-top":""}" style="${h};${v};width:${w}px;min-width:0">${PICKERS[S.pick]()}</div>`;
}
</script>

<script>
/* Which destination a pane belongs to. One table, read by the rail, the
   panel and the tab strip, so they cannot disagree. */
const HOME_OF={home:"home",work:"home",
  artifacts:"artifacts",artifact:"artifacts",
  skills:"skills",skill:"skills",profiles:"skills",agents:"skills",
  profile:"skills",mkskill:"skills",
  repos:"repos",hosts:"repos",
  machines:"machines",
  tasks:"tasks",trackers:"tasks"};
/* **Settings' five panes and Updates are deliberately not in there.** They
   were, while Settings and Updates were doors in the rail; they are rows in
   the profile menu now and nothing else, so the rail marks nothing while you
   are on one — you are not in a work surface. Settings' own index is in the
   page (`snav`, drawn by `pg`), which is what replaced the panel the door
   used to open. */

/* ═══════════════════════════════════════════════════════════════════
   THE RAIL, REGROUPED
   Six destinations and the avatar. Each panel is a working surface —
   a few sub-destinations, then the live things you actually have —
   rather than an index of panes.

   **The rule and the two doors under it are gone**, by the user, on
   7 November 2026. Settings and Updates were drawn here *and* as rows
   in the profile menu, and a thing in two places has no home. The menu
   is the home: it already holds the account, the Firetower switcher and
   the appearance control, which are the same category of thing. What
   the rail keeps of Updates is the mark on the avatar.
   ═══════════════════════════════════════════════════════════════════ */
const DEST2=[
  {id:"home",     label:"Dashboard",    icon:"house",         key:"1"},
  {id:"tasks",    label:"Tasks",        icon:"list-todo",     key:"2"},
  {id:"artifacts",label:"Artifacts",    icon:"shapes",        key:"3"},
  {id:"skills",   label:"Customize",    icon:"puzzle",        key:"4"},
  {id:"repos",    label:"Repositories", icon:"folder-git-2",  key:"5"},
  {id:"machines", label:"Machines",     icon:"server",        key:"6"},
];
/* **What the avatar's mark says, and what the menu row says instead.**
   The mark is one bit: there is an update to take. The row carries the version,
   because "Update available" with no number is a sentence you have to open a
   screen to act on. In the build these are one function — `api/updates.ts`'s
   `updatesRow`, which prefers the deployment's release over this app's own
   build when both are behind.

   The drawing shows the marked state on purpose. The Updates screen below
   depicts a deployment that is level — only two machines are behind — so
   nothing would mark the avatar, and a mark nobody can see is not drawn. */
const NEWER="2.15.0";
const updatesLabel=()=> NEWER ? `Update available — ${NEWER}` : "Updates";

const MY_SKILLS=[{m:"fs",n:"firetower-surfaces"},{m:"ca",n:"claude-api"},{m:"dv",n:"dataviz"},
                 {m:"ps",n:"pr-screenshots"},{m:"sc",n:"skill-creator"},{m:"it",n:"incident-timeline"}];
const MY_PROFILES=[{n:"Ada, the lead",a:"claude"},{n:"Reviewer",a:"codex"},{n:"QA",a:"cursor"}];

function panelRow(label,icon,on,act,to,trail){
  return `<button class="prow" data-act="${act||"go"}" data-to="${to||""}" aria-current="${!!on}">
    ${icon?`<span style="width:17px;flex:none;display:grid;place-items:center;color:${on?"var(--ink)":"var(--quiet)"}">${ic(icon,15)}</span>`:""}
    <span class="lbl">${label}</span>${trail||""}</button>`;
}
function panelFor2(r){
  const head=(name,extra="")=>`<div class="phead">
      <span class="nm">${name}</span>${extra}
      <button class="gbtn" data-act="noop" title="Find anything   ⌘P" aria-label="Search">${ic("search",15)}</button>
      <button class="gbtn" data-act="panel" title="Hide this panel   ⌘\\" aria-label="Hide this panel">${ic("panel-left-close",15)}</button>
    </div>`;
  const scroll=(inner)=>`<div class="pscroll" data-navzone>${inner}</div>`;
  const lab=(t)=>`<div class="plabel"><span>${t}</span></div>`;

  /* A detail screen keeps its destination’s panel: you are still in Customize
     when you are reading one skill, and still in Artifacts when reading one. */
  /* `|| "home"`, because a pane can belong to no destination now: Settings'
     five and Updates are the profile menu's, so the rail marks nothing and
     the panel keeps showing the work. That is what `showing = peek ?? here ??
     "home"` resolves to in the build. */
  const at=r; r = HOME_OF[r] || "home";
  if(r==="home") return panel();

  if(r==="skills") return head("Customize") + scroll(`
    ${panelRow("Skills","puzzle",at==="skills"||at==="skill"||at==="mkskill","go","skills")}
    ${panelRow("Agent profiles","users-round",at==="profiles"||at==="profile","go","profiles")}
    ${panelRow("Agents","blocks",at==="agents","go","agents")}
    ${lab("Your skills")}
    ${MY_SKILLS.map(s=>`<button class="prow" data-act="go" data-to="skill" aria-current="${S.rt==="skill"&&s.n==="pr-screenshots"}">
      ${/* One quiet glyph rather than six invented two-letter tiles. The
            monograms encoded nothing a reader could decode — `it` for
            incident-timeline is not guessable — and each white tile was an
            object competing with the name beside it. */""}
      ${/* No glyph at all. Six copies of one shape encode nothing — the same
            fault the two-letter tiles had — and "Your skills" above already
            says what these are. The spacer stays so the column still lines up
            with the rows that do carry a mark. */""}
      <span style="width:17px;flex:none"></span>
      <span class="lbl">${s.n}</span>
      ${S.rt==="skill"&&s.n==="pr-screenshots"?`<span class="gbtn" style="width:20px;height:20px">${ic("ellipsis",14)}</span>`:""}
    </button>`).join("")}
    ${lab("Your profiles")}
    ${MY_PROFILES.map(p=>`<button class="prow" data-act="noop">
      <span style="width:17px;flex:none;display:grid;place-items:center;color:var(--quiet)">${AGENT[p.a](14)}</span>
      <span class="lbl">${p.n}</span></button>`).join("")}`);

  if(r==="repos") return head("Repositories") + scroll(`
    ${panelRow("All repositories","folder-git-2",at!=="hosts","go","repos")}
    ${panelRow("Git hosts","git-branch",at==="hosts","go","hosts")}
    ${lab("Checked out")}
    ${REPOS.map(x=>`<button class="prow" data-act="noop"><span class="lbl">${x.slug}</span>
      <span class="age">${x.branch}</span></button>`).join("")}`);

  if(r==="machines") return head("Machines") + scroll(`
    ${panelRow("All machines","server",true,"go","machines")}
    ${lab("Yours")}
    ${MACHINES.map(x=>`<button class="prow" data-act="noop">
      <span style="width:17px;flex:none;display:grid;place-items:center;color:var(--quiet)">${ic(x.k==="local"?"monitor":"server",14)}</span>
      <span class="lbl">${x.name}</span>
      ${x.ready?"":`<span class="age" title="Needs setup">${ic("circle-alert",13)}</span>`}</button>`).join("")}
    ${panelRow("Add a machine","plus",false,"noop")}`);

  if(r==="tasks") return head("Tasks") + scroll(`
    ${panelRow("Everything","inbox",at==="tasks")}
    ${panelRow("Assigned to you","user-round",false)}
    ${lab("Where work comes from")}
    ${panelRow("Trackers","ticket",at==="trackers","go","trackers")}`);

  /* **Settings' five panes and Updates' two rows were here.** They were the
     panels of the two doors, and the doors have gone. Settings' index moved
     into the page it indexes — `SETTINGS` and `snav` below — because a panel
     with no icon to open it cannot be reached. Updates had no index to move:
     its *What is running* was always current and its *Past runs* went to the
     same address. */

  if(r==="artifacts"||r==="artifact") return head("Artifacts") + scroll(`
    ${lab("Recent")}
    ${ARTS.slice(0,6).map((a,i)=>`<button class="prow" data-act="go" data-to="artifact" aria-current="${S.rt==="artifact"&&i===0}">
      <span style="width:26px;height:17px;border-radius:4px;overflow:hidden;flex:none;position:relative;
        background:${a.p?"#fff":"var(--hair)"};box-shadow:var(--lift-1)">
        ${a.p?`<img style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top"
          src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(poster(a.p))}" alt="">`:""}</span>
      <span class="lbl">${esc(a.t)}</span><span class="age">${a.age}</span></button>`).join("")}`);

  const label=DEST2.find(d=>d.id===r)?.label||"";
  return head(label)+scroll(`<p style="padding:12px 9px;font-size:14.5px;line-height:1.6;color:var(--quiet)">
    Not in this pass. The grouping is the thing to judge first; the panes inside it are their own round.</p>`);
}

function rail2(){
  const el=elsewhere();
  /* `|| null`, not `|| S.rt`: a pane that belongs to no destination marks
     nothing, rather than being asked to match an icon that is not there. */
  const here=HOME_OF[S.rt]||null;
  const btn=(d,on)=>`<button class="rbtn" data-act="peekgo" data-to="${d.id}" data-rail="${d.id}"
    aria-current="${on?"page":"false"}" data-peek="${S.peek===d.id&&!on}"
    title="${d.label}   ⌘${d.key}" aria-label="${d.label}">
    ${railIcon(d.icon,on)}</button>`;
  return `<nav class="rail" data-railzone aria-label="Destinations">
    ${DEST2.map(d=>btn(d,d.id===here)).join("")}
    <span class="rgrow"></span>
    <button class="avatar" data-act="menu" data-menu="profile" aria-haspopup="menu"
      aria-expanded="${S.menu==="profile"||S.menu==="switch"}"
      title="Kevin Piacentini — ${tower().org}${el.length?" · someone is waiting elsewhere":""}${NEWER?` · ${updatesLabel()}`:""}">
      <span class="face">KP</span>
      ${el.length?`<span class="dot" style="position:absolute;top:4px;right:3px;box-shadow:0 0 0 2.5px var(--desk)"></span>`:""}
      ${NEWER?`<span class="news" title="${updatesLabel()}"></span>`:""}
    </button>
  </nav>`;
}
