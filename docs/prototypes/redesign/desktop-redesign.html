/* Walk the tree: a row with a status is a leaf and counts; a row with
   children is a heading and does not. */
function covLeaves(){
  const out=[];
  COV.forEach(([,rows])=>rows.forEach(r=>{
    if(r[3]) r[3].forEach(k=>out.push(k)); else if(r[1]) out.push(r);
  }));
  return out;
}
function coverage(){
  const all=covLeaves();
  const n=k=>all.filter(r=>r[1]===k).length;
  const real=all.length-n("—");
  const bar=(k,c)=>`<span style="display:inline-flex;align-items:center;gap:7px">
    <i style="width:8px;height:8px;border-radius:99px;display:block;${
      c==="ring"?"box-shadow:inset 0 0 0 1.5px var(--hair)":"background:"+c}"></i>${k}</span>`;
  const pip=k=>`<span class="cstat"><i data-k="${k}"></i>${
    k==="Y"?"Yes":k==="P"?"Partly":k==="N"?"No":"n/a"}</span>`;

  return `<div class="ia">
    <h2>Coverage</h2>
    <p class="prose-lead">Every <b>feature</b> the desktop app has — not every component. A component-level tick hides what is inside it: “Git hosts ✓” was true of this document while only GitHub was drawn, and “Skills ✓” was true while three of the detail’s four tabs were missing. So each row below is something that can <i>independently</i> be missing — a provider, a tab, a menu item, an action, a state, a field — taken from the code, with a file and line wherever a reader might doubt it.</p>
    <p class="prose-lead"><b>${n("Y")} drawn · ${n("P")} partly · ${n("N")} not yet</b>, out of ${real} features — plus ${n("—")} marked <i>deliberately not drawn</i>, which is a different answer from “no”.</p>
    <p class="covlegend">${bar("Drawn, with its states","var(--touched-ink)")}
      ${bar("Partly — something real is missing","var(--color-amber-soft)")}
      ${bar("Not yet","var(--hush)")}
      ${bar("Deliberately not drawn","ring")}</p>

    ${COV.map(([group,rows])=>`
      <h3 class="covgroup">${group}</h3>
      <div class="covtable">
        ${rows.map(r=>{
          const kids=r[3];
          if(!kids) return `<div class="covrow">
            <span class="f">${r[0]}</span>${pip(r[1])}<span class="w">${r[2]||""}</span></div>`;
          const tally=["Y","P","N"].map(k=>{
            const c=kids.filter(x=>x[1]===k).length;
            return c?`<i data-k="${k}" title="${c} ${k==="Y"?"drawn":k==="P"?"partly":"not yet"}"></i>`.repeat(c):"";
          }).join("");
          return `<div class="covrow" data-head="true">
              <span class="f">${r[0]}</span><span class="tally">${tally}</span><span class="w">${r[2]||""}</span></div>
            ${kids.map(k=>`<div class="covrow" data-sub="true">
              <span class="f">${k[0]}</span>${pip(k[1])}<span class="w">${k[2]||""}</span></div>`).join("")}`;
        }).join("")}
      </div>`).join("")}

    <h3 class="covgroup">What “deliberately not drawn” means</h3>
    <h3 style="margin-top:26px">What this column does not check</h3>
    <p><b>The first functional regression of the rebuild got past all three checks, and it got past them for the same reason.</b>
    <code>Rail.tsx</code> imported <code>ContextMenu</code>, <code>useMenu</code>, <code>renameSession</code> and
    <code>useEndWorkspace</code>; <code>RailPanel.tsx</code> imports none of them, so right-clicking a workspace
    stopped doing anything. The audit asks whether the CSS collides. The sweep asks whether every control throws.
    This column asks whether what is drawn is built. <b>Not one of them asks whether the new build still does what
    the old one did</b> &mdash; and a feature that is in neither the drawing nor the new code is invisible to a
    comparison between them.</p>
    <p>That is a gap in the method rather than an oversight in the work. A drawing says what a screen looks like and
    Coverage says what is drawn; <b>neither has any representation of the previous build</b>, so neither can miss it.
    The evidence for a restoration is git history, not this document &mdash; the item set above was read off
    <code>Rail.tsx</code> at <code>f3cbc425</code> rather than invented, and it is the old set verbatim because a
    restoration that quietly grows is a second thing to argue about. The Engineer is adding a hook-delta assertion,
    which is the right side to fix it on: <b>the check has to compare two builds, and only the code has two.</b></p>
    <p>Three rows above are marked <i>n/a</i> rather than <i>no</i>, and the difference is the point of the column. <b>Mark</b> and <b>FileGlyph</b> are assets, not screens. <b>A Files tab on a profile</b> is the interesting one: it was reported missing, and it does not exist — <code>config/Roles.tsx</code> has no file handling of any kind. A profile is fields and a team. The thing that <i>does</i> have a files view is a skill, where it is called <b>Bundle</b>, and that one is a real gap listed as such.</p>
    <p><b>The menu-bar island is the one remaining “no”.</b> It has its own HTML entry point, its own window, no chrome, and rules that contradict this document’s on purpose — the pill is the black the notch is made of, and ember on it is the one place in the product where the colour is decoration rather than a signal. Putting it here would mean two design systems in one file. It wants an artifact of its own.</p>
  </div>`;
}
</script>

    <div class="sheet2" onclick="event.stopPropagation()">${head}

/* Light the matches. A count over unmarked text says a number and shows
   nothing; the bar's whole job is to put you on the next one. */
function lit(html,q){
  if(!q) return html;
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  let n=0;
  return html.split(/(<[^>]*>)/).map(part=>
    part.startsWith("<") ? part
      : part.replace(re,(m)=>`<mark class="hit"${++n===2?' data-on="true"':""}>${m}</mark>`)).join("");
}

/* ── ⌘F ────────────────────────────────────────────────────────────
   One bar over two very different searches — the conversation walks
   its own text nodes, an artifact asks the page in its frame to walk
   them — and it should look it. The count is a count, not a verdict:
   `none` for a query that matched nothing, `600+` past the cap.      */
function findBar(){
  if(!S.find) return "";
  const over=S.find, blank=over==="blank", many=over==="many";
  return `<div class="findbar" data-over="${over}">

    <button class="gbtn" data-act="find" data-find="" title="Close   esc">${ic("x",15)}</button>
  </div>`;
}

/* ── What is checked out here, and checking another one in ─────────

   an administrator can reset a password at any time, and the app
   would otherwise be a wall of "could not reach the control plane"

function gateHeld(){
  if(!S.gate) return "";

  return `<div class="gate">

        ${setup?`<button class="btn primary" data-act="first" data-first="setup">Name this Firetower</button>`

}

/* Draw one state without disturbing the one on screen. */
function tileFor(patch){
  /* `S` is a const binding, so this mutates in place and puts it back.
     BASE carries every key, so assigning it is a full reset. */
  const keep = JSON.parse(JSON.stringify(S));
  Object.assign(S, BASE, patch);
  try { return renderWin(); }
  finally { Object.assign(S, keep); }
}

function contact(){
  const n = SHEET.reduce((a,[,r]) => a + r.length, 0);

    <h2>Every screen</h2>
    <p class="prose-lead">All <b>${n}</b> states this document draws, at a third scale, grouped as Coverage is grouped. <b>A tab row says where you can go and never what is there</b> — which is how a screen that exists gets reported missing. Press any tile to open it full size.</p>
    ${SHEET.map(([group, rows]) => `
      <h3 class="cs-group">${group}<span class="n">${rows.length}</span></h3>

        ${rows.map(([label, patch], i) => `
          <div class="cs-tile" role="button" tabindex="0" data-act="goscreen"
               data-g="${SHEET.findIndex(x=>x[0]===group)}" data-i="${i}"
               aria-label="Open ${esc(label)}">
            <span class="cs-frame" style="width:${Math.round(TILE_W*TILE_SCALE)}px;height:${Math.round(TILE_H*TILE_SCALE)}px">

}

/* **Both the clip and the control are decided by measurement.**

   A chip is as wide as a workspace name, so how many fit on a row is not a
   number anybody can write down, and a guessed `max-height` is wrong the
   moment a name changes. The rows are found from the chips themselves: group
   them by `offsetTop`, keep the first `data-rows` of them, and clip to the
   bottom of the last one kept. **The cut is always between rows, never
   through a chip**, because a wrapped flex row moves a whole item down.

   If nothing falls past the limit there is nothing to view and the control is
   not drawn at all. */
function trimChips(){
  document.querySelectorAll("#win .chips").forEach(row=>{
    const all=row.parentElement.querySelector(".hd .all");
    const chips=[...row.children];
    row.style.maxHeight="";
    if(!chips.length) return;
    const tops=[...new Set(chips.map(c=>c.offsetTop))].sort((a,b)=>a-b);
    const limit=parseInt(row.dataset.rows||"0",10);
    const spill=!!limit && tops.length>limit;
    if(all) all.hidden=!spill;
    if(spill){
      const last=chips.filter(c=>c.offsetTop===tops[limit-1])[0];
      row.style.maxHeight=(last.offsetTop-chips[0].offsetTop+last.offsetHeight)+"px";
    }
  });
}

const stage=document.getElementById("stage"), fitbox=document.getElementById("fitbox"),
      scaler=document.getElementById("scaler"), winbox=document.getElementById("win");
let SCALE=1;
function fit(){
  const avail=stage.clientWidth;
  const want=avail/W, FLOOR=.5;
  SCALE=Math.min(1,Math.max(FLOOR,want));
  stage.dataset.pan=String(want<FLOOR);
  scaler.style.transform=`scale(${SCALE})`;
  fitbox.style.width=Math.floor(W*SCALE)+"px";
  fitbox.style.height=Math.ceil(H*SCALE)+"px";
  const px=S.rt==="work"
    ? `rail <b>62</b> · conversation <b>${W-62-(S.panel==="pinned"?252:0)-8-(S.insp?344:0)}</b> · right rail <b>${S.insp?344:0}</b>`
    : `rail <b>62</b> · panel <b>${S.panel==="pinned"?252:0}</b> · sheet <b>${W-62-(S.panel==="pinned"?252:0)-8}</b>`;
  document.getElementById("caption").innerHTML=
    `<span><b>${W} × ${H}</b> at <b>${Math.round(SCALE*100)}%</b></span><span>${px}</span>
     <span>Every name, question and timestamp is invented.</span>`;
}
function render(){
  document.documentElement.dataset.theme=S.theme;
  const doc = S.tab==="grouping"||S.tab==="spec"||S.tab==="coverage"||S.tab==="sheet";  /* a document, not a mock */
  document.getElementById("stage-wrap").style.display = doc ? "none" : "";
  if(!doc){ winbox.innerHTML=renderWin(); fit(); trimChips(); }
  document.getElementById("contact").innerHTML = S.tab==="sheet" ? contact() : "";
  chrome(); renderGrouping(); notes();
}

function startPeek(to){
  clearTimeout(pOut);
  if(S.peek===to) return;
  clearTimeout(pIn);
  pIn=setTimeout(()=>{S.peek=to;render();},180);
}
function endPeek(){ clearTimeout(pIn); clearTimeout(pOut);
  pOut=setTimeout(()=>{ if(S.peek){S.peek=null;render();} },240); }
document.addEventListener("mouseover",e=>{
  if(S.menu) return;
  if(S.pick) return;
  const r=e.target.closest?.("[data-rail]");
  if(r){ startPeek(r.dataset.rail); return; }
  if(e.target.closest?.("[data-navzone]")){ clearTimeout(pOut); clearTimeout(pIn); return; }
  if(e.target.closest?.("[data-railzone]")) return;
  if(S.peek) endPeek();
});
/* Focus does exactly what hover does, so nothing on the rail is pointer-only. */
document.addEventListener("focusin",e=>{
  const r=e.target.closest?.("[data-rail]"); if(!r) return;
  clearTimeout(pIn); clearTimeout(pOut);
  const want=r.dataset.rail==="home"?null:r.dataset.rail;
  if(S.peek===want) return;
  S.peek=want; render();
  const again=document.querySelector(`[data-rail="${r.dataset.rail}"]`); if(again) again.focus({preventScroll:true});
});
document.addEventListener("keydown",e=>{
  const tile=e.target.closest?.('[data-act="goscreen"]');
  if(tile && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); tile.click(); return; }
  if(e.key==="Escape"&&(S.pal||S.share||S.conn||S.mach||S.hand||S.confirm)){
    S.pal=null;S.share=null;S.conn=null;S.mach=null;S.hand=null;S.confirm=false; render(); return; }
  if(e.key==="Escape"&&(S.menu||S.peek||S.pick)){
    if(S.pane) S.pane=null; else {S.menu=null;S.peek=null;S.pick=null;S.pickAt=null;}
    render(); return; }
  if(!(e.metaKey||e.ctrlKey)) return;
  if(e.key==="k"||e.key==="K"){ e.preventDefault(); S.pal=S.pal==="k"?null:"k"; render(); return; }
  if(e.key==="p"||e.key==="P"){ e.preventDefault(); S.pal=S.pal==="p"?null:"p"; render(); return; }
  if(e.key==="j"||e.key==="J"){ e.preventDefault(); S.term=!S.term; render(); return; }
  if(e.key==="\\"){ e.preventDefault();
    if(S.rt==="work") S.insp=!S.insp; else { S.panel=S.panel==="pinned"?"collapsed":"pinned"; S.peek=null; }
    render(); }
});

/* ── What changed, and why ───────────────────────────────────── */
function renderGrouping(){
  const box=document.getElementById("grouping");
  box.innerHTML = S.tab==="grouping" ? `<div class="prose" style="margin-top:0">${grouping()}</div>`
    : S.tab==="spec" ? `<div class="prose" style="margin-top:0">${spec()}</div>`

}
function notes(){
  document.getElementById("notes").style.display = (S.tab==="grouping"||S.tab==="spec"||S.tab==="coverage") ? "none" : "";
  document.getElementById("notes").innerHTML=`
  <div class="prose">
    <h2>What changed</h2>
    <div class="cols">
      <section>
        <h3>Three dots, and that is the whole budget</h3>
        <p>There were six at once — two in the sheet, two in the panel, one on the Ledger chip, one on the avatar — and six of a thing that means “the one loud thing” is none of them. <b>The sheet keeps its two</b>, because that is where the question actually gets answered. <b>The avatar keeps one</b>, because it is the only signal that survives leaving this screen. <b>The panel and the chip lost theirs.</b> The panel says it with weight and the brightest text tier instead; the chip’s own words already name the Firetower and the count. Everything else on the page is neutral, and the neutrals are faintly cool — two or three points of blue over red, which is what the dark tokens already are — so the one warm thing reads warmer without anything else spending colour.</p>
      </section>
      <section>
        <h3>The screen is a sentence</h3>
        <p><i>Two agents are waiting on you.</i> Set at 40px with negative tracking and tight leading, it is the first and often the only thing anybody needs to read. The old subtitle — “a branch on one of your hosts, a git worktree per repository” — is gone. It described the implementation to somebody who wanted to know whether they could go to lunch.</p>
      </section>
      <section>
        <h3>A question, not a row of fields</h3>
        <p>What an agent is stuck on is now <i>the agent’s own words</i>, at reading size, as the body of the item. The thing you came to the screen for is the thing the screen shows. There is no “Open” or “Reply” control on it, because the whole item is already the button — hovering lifts it and clicking it takes you into the conversation.</p>
      </section>
      <section>
        <h3>A row says a name and a time</h3>
        <p>That is all, at rest. The branch, the agent and the machine are facts <i>about</i> a workspace rather than things anybody reads, so the row grows to show them when you point at it. Mono appears nowhere until then — a branch name under every line was the geekiest thing on the old screen.</p>
      </section>
      <section>
        <h3>Three dots mean someone is working</h3>
        <p>The only thing that moves at rest, and it borrows a metaphor everyone already has. A spinner says <i>wait</i>; three dots say <i>somebody is busy on the other end</i>, which is the true thing here. Under <code>prefers-reduced-motion</code> they hold still at half opacity.</p>
      </section>
      <section>
        <h3>Every vertical edge resolves to two numbers</h3>
        <p>The questions used to stop at a 56-character measure while the composer filled the column, so the eye had two right margins 257px apart and read the empty third as a mistake rather than as air. Now the column <i>is</i> the measure and the composer <i>is</i> the column: text runs 621 → 1293 and every card runs 605 → 1309, which is text ± 16 — the same inset a hovered item already uses. One line of arithmetic holds it at any sheet width: a dock of width <code>D</code> with composer padding <code>P</code> aligns to a column <code>C</code> with padding <code>Q</code> when <code>D = 2P + (C − 2Q)</code>.</p>
        <p>The residual bug underneath it: a <code>width:100%</code> block with <code>margin:0 -16px</code> is <i>shifted</i>, not widened, so every item was stopping 32px short of its own column. It wants <code>width:calc(100% + 32px)</code>.</p>
      </section>
      <section>
        <h3>The rail icons are read before they are clicked</h3>
        <p>So they are drawn heavier than an icon inside a list — 1.8 stroke at rest, 2.0 when active — and in the text tier you can actually read (9.3:1, not 4.2:1). Two were replaced outright: <code>settings-2</code>’s sliders became a <b>gear</b>, which is the single most explicit icon in any interface, and <code>circle-fading-arrow-up</code> became a <b>download arrow</b>, because what Updates offers is a new build to install. The active destination is a white pill on the grey desk — the brightest object in the rail, which is what makes “where am I” readable from across the room.</p>
      </section>
      <section>
        <h3>Almost no borders</h3>
        <p>One hairline in the rail and one in the menus. Everything else is separated by space, or by the step from the desk to the sheet. The sheet is rounded on the side that faces the chrome and flush to the window’s own corners on the other, because an app does not draw a second set of corners inside the ones it already has.</p>
      </section>
      <section>
        <h3>The composer floats, and the page fades under it</h3>
        <p>Pinned to the bottom of the sheet with the content scrolling beneath, and a soft fade where the two meet rather than a rule drawn across the page. It is the only card on the screen and the only thing carrying a real shadow — which is the one rule from <code>STYLE.md</code> this redesign keeps verbatim: <i>the conversation has no card; the composer does.</i></p>
      </section>
      <section>
        <h3>Which Firetower you are in, as text</h3>
        <p>Kept from the last round. <code>fleet.ts</code> derives a server’s mark from the first letter of its name, so Acme and Apex are both <b>A</b>; under one-at-a-time, “where am I” has to be answerable without clicking. The title bar is the one strip that never collapses, so the name lives there, and clicking it opens the switcher.</p>
      </section>
      <section>
        <h3>Ember from somewhere you are not</h3>
        <p>Also kept, and now the <i>only</i> ember outside the sheet. One dot on your avatar, and one line on the Dashboard naming the Firetower and the count — the line no longer carries a dot of its own, because it sits directly under two and its words already say it. The dock badge and the menu-bar pill are unchanged and still span every Firetower, so nothing is lost by dropping the “all servers” scope. <b>Open the switcher</b> from the avatar to see how an unreachable Firetower reads: dimmed and dashed, with its last-known count still there — never red, and never zeroed.</p>
      </section>
    </div>
    <h2>The workspace</h2>
    <div class="cols">
      <section>
        <h3>The agent speaks onto the paper</h3>
        <p>No bubble, no avatar, no card. Its turn is long and it is the thing you came to read, so it gets the page at 16px on a 1.72 leading. <i>You</i> get a card, right-aligned — two facing bubbles is a messaging app, and one of the two parties here is a machine.</p>
      </section>
      <section>
        <h3>What it did hangs off what it said</h3>
        <p>Tool calls are one quiet line each, indented, in the secondary tier — a path, a count, nothing else. Runs of three or more scaffolding steps fold into one line (“Read 7 files”), and an edit never folds, because an edit is the work. There is no rule drawn down the side of the conversation: a thousand pixels of furniture to say what the glyphs already say.</p>
      </section>
      <section>
        <h3>The approval is the one loud thing, and it is a dot</h3>
        <p>The agent is genuinely stopped while this is up — the tool call is held open on the host and it can sit for hours. In the old design it would have been a filled orange panel. Here it is a <code>--raised</code> card, the question at 17px, three buttons, and one ember dot. Louder, because nothing else on the page is competing.</p>
      </section>
      <section>
        <h3>The context window is a shape</h3>
        <p>A 46px bar in the composer, filling. No token count at rest; the number is in the title. It answers <i>am I near the edge</i>, which is the only question anybody asks of it, and it does so without a second colour.</p>

        <p>The manager is a card; the agents it spawned sit indented under a hairline that runs down their left. That rule is the one structural line in the whole design, and it encodes a real relationship — these were started <i>by</i> that one. Each row says who, what it is doing in five words, its state, and how long.</p>
      </section>
      <section>
        <h3>Three states, three marks, no words</h3>
        <p>An ember dot for <i>asked you a question</i>, the typing dots for <i>working</i>, a tick for <i>handed back</i>. Nothing has a badge and nothing has a colour it did not earn. The row you are reading wears a white card and the word <i>here</i>, so “you are here” needs no highlight.</p>

        <p>Four answers to one question — what has this agent actually done to my repository — so you want one at a time while you read the conversation beside it. Overview is on every workspace and comes first; Diff and Commit only exist when a repository is checked out, because otherwise they are panels that can only ever say nothing.</p>

        <p>Per-child token spend. It is recorded server-side in <code>consumption_events</code> but is not exposed per session, so a number here would be invented. <code>OverviewTab.tsx</code> says the same thing in its own header comment. The colour and the percentage come back when the endpoint does.</p>
      </section>
    </div>

    <h2>Artifacts, and the list pattern</h2>
    <div class="cols">
      <section>
        <h3>The poster is the card</h3>
        <p>No border around the tile, no shadow under the caption — the picture carries its own elevation and the name sits on the paper beneath it. A library is for browsing, so the grid is the default; the list is one click away for when you are finding rather than looking. The posters are also the only arbitrary colour in the window, and that is fine: they are somebody’s document, not chrome.</p>
      </section>
      <section>
        <h3>A picture, never a running copy</h3>
        <p>Each tile is an <code>&lt;img&gt;</code> against a poster rendered once per version, as <code>ArtifactShot.tsx</code> and <code>artifacts/posters.tsx</code> already do. No live frame, no hover-to-render: artifact HTML in an unsandboxed iframe is same-origin with the app, which puts the Tauri bridge within reach of untrusted content — and before that it was six page loads and six sets of running timers behind a grid nobody was looking at. <b>Switch Pictures to “None yet”</b> for the state a fresh library hits on every tile at once.</p>
      </section>
      <section>
        <h3>One primary, and an honest label</h3>
        <p>Codex has one black pill per page. The honest primary action here is <i>nothing</i> — you do not make an artifact, an agent does — so the pill says what actually happens: it opens the composer with the intent already in it.</p>
      </section>
    </div>

    <h2>Skills</h2>
    <div class="cols">
      <section>
        <h3>Out of Configuration, onto the rail</h3>
        <p>It is a library you browse, share and turn on — not a setting you change once. Today it is the seventh pane under <i>Harness</i> in <code>config/panes.ts</code>, behind a rail that replaces the workspaces to reach it. Codex’s plugin gallery is the shape; everything in it is Firetower’s.</p>
      </section>
      <section>
        <h3>Amber, and only two pixels of it</h3>
        <p>A skill an agent wrote runs code on every turn before anybody reads it, so it waits for approval — and it is still not ember, because ember answers whether an <i>agent</i> is waiting on you. It gets a 2px rule down its left side and the real risk strings out of <code>RISK_SAYS</code>: what the bundle will do to a session, reported and never configured.</p>
      </section>
      <section>
        <h3>A monogram, not a logo</h3>
        <p>A plugin has a vendor icon; a skill has neither vendor nor icon. So it gets the two-letter plate <code>Skills.tsx</code> already draws — the same rule as a server’s mark: identity is a shape, never a hue. And nothing previews a skill’s contents live, for the same reason the artifact grid does not.</p>
      </section>
      <section>
        <h3>Add a skill has two items</h3>
        <p>Because <code>config/Skills.tsx</code> offers exactly two — <i>Create with AI</i> and <i>Upload a folder</i> — plus a drop target over the whole surface. Codex’s menu also offers a marketplace, an archive upload, a custom MCP server and a recorder. None of those exist in Firetower, and drawing them would be drawing a feature rather than a design.</p>
      </section>
    </div>

    <h2>The pickers</h2>
    <p class="prose-lead">One shape, five contents, each anchored to the chip that opened it. Open them from the composer on the Dashboard and in the workspace.</p>
    <div class="cols">
      <section>
        <h3>What runs this, and how</h3>
        <p>One control, two halves, matching <code>RunPicker.tsx</code>: the engine and whose account it runs on, then model, effort and permissions as a drill-down with a way back. The conversation’s version keeps the engine fixed — a running session cannot change what it is — and starting one can, so it is the same menu with the top half live.</p>
      </section>
      <section>
        <h3>Repositories, and what checking one out means</h3>
        <p>Multi-select with a search that takes <kbd class="keycap">⏎</kbd> when one row is left, as <code>RepoMenu</code> already does. The line at the foot says what the choice costs: each one gets its own copy of the code, cut from its default branch.</p>
      </section>
      <section>
        <h3>Machines say whether they are ready</h3>
        <p>The list, and then the readout for the one you picked — outside the scroller, because it is what that machine is up to rather than another machine to pick. A machine that needs setup says so on its row rather than failing after you press send.</p>
      </section>
      <section>
        <h3>Profiles lead with “just an agent”</h3>
        <p>Most workspaces have no profile, so that is the first row and the default. The rest carry what they are for in one line and a <i>can delegate</i> chip, because whether this thing can start other agents is the only property that changes what the workspace becomes.</p>
      </section>
    </div>

    <h2>The composer’s two planes</h2>
    <div class="cols">
      <section>
        <h3>The shelf carries what the workspace <i>will be</i></h3>
        <p>A repository and a machine are not preferences — a workspace <i>is</i> a branch on a machine with code checked out. So they get their own recessed plane above the input, tucked behind the card’s top edge, and the footer keeps who does the work and how. That line is sharper here than it is in Codex, and it takes a five-chip footer down to three.</p>
        <p>Both shelf chips also carry state worth seeing at rest: a machine can be unreachable or need setup, a repository may not be checked out. The chips open the pickers that already exist.</p>
      </section>
      <section>
        <h3>Inside a workspace there is no shelf</h3>
        <p>The repository and the machine are already settled — the workspace is that branch on that machine — and the right rail says so in a sentence. Repeating it above the composer would be saying one thing twice. <b>Different job, different composer:</b> on the Dashboard you are defining a workspace; inside one you are talking to it.</p>
        <p>The alternative, if you want them identical: a shelf that reads as a statement rather than a picker. It costs 40px of conversation and buys consistency.</p>
      </section>
    </div>

    <h2>Reading an artifact, and writing a note on it</h2>
    <div class="cols">
      <section>
        <h3>A document, not an application</h3>
        <p>A preview is something you navigate — back, forward, an address bar. An artifact is one document, and all of that chrome is width taken from the only thing on screen. So: the title, the version, and the handful of things you do to it. The page sits on its own white paper inside the app’s paper, because it is somebody’s document and the app does not restyle it — which is why it stays light in dark mode.</p>
      </section>
      <section>
        <h3>The note opens where you pointed</h3>
        <p>Not at the foot of the window. The whole point of annotating rather than typing into the composer is that the note is attached to a specific piece of text, and a panel three hundred pixels away loses the connection the gesture just made. It is anchored to the point, flipped above when there is no room below, clamped inside the window, and it does not follow on scroll — you scrolled to leave.</p>
      </section>
      <section>
        <h3>A selection asks two questions</h3>
        <p>Note it, or take it away. So the card’s header carries a copy as well as a close, and <kbd class="keycap">⌘C</kbd> means copy while the note is still blank — the textarea takes focus the moment the card opens, and the hand that reaches for ⌘C next should not land in an empty box.</p>
        <p>The highlight is <b>slate, not ember</b>. <code>globals.css</code> paints a text selection in slate for exactly this reason: finding or marking a passage is not the app asking for you.</p>
      </section>
      <section>
        <h3>A kept note is a marker, and the only summary is a pill</h3>
        <p>In the margin of the thing it is about, numbered. Listing them again in a tray would repeat what the markers already say, so the one summary is a floating pill with the count and one way to send. <b>Switch to “Notes kept”</b> to see it.</p>
      </section>
    </div>

    <h2>A skill, opened and brought up a version</h2>
    <div class="cols">
      <section>
        <h3>Reported, never configured</h3>
        <p>What a bundle holds, what it costs a turn, and what it will do to a session are facts about the thing. A control beside a fact invites somebody to change what they have no say over — so the right column reads out and only the name and the description can be edited, which are the two that are reliably wrong on arrival.</p>
      </section>
      <section>
        <h3>A new version is a folder, and nothing is written until you look</h3>
        <p>Drop it and the card says what it would become — <i>this is your v6, changed; it would become v7</i> — then lists every file as added, changed, removed or the same. The risk line is repeated at the bottom precisely because it <i>has not</i> changed: a new version of a skill that runs shell commands still runs shell commands.</p>
      </section>
    </div>

    <h2>Updates</h2>
    <div class="cols">
      <section>
        <h3>Reading is not upgrading</h3>
        <p>Everyone can see what this Firetower runs and whether a release is out — somebody who cannot tell that their work runs on something months old cannot ask for anything about it. The controls are what narrow. The headline says what <i>this</i> person can act on, so an administrator reads “2.14.0 is out” and somebody else reads “build-01 is behind”.</p>
      </section>
      <section>
        <h3>Level with the control plane, never past it</h3>
        <p>A worker ahead of the control plane is a worker talking to something that does not know its protocol. So the screen offers exactly the version the server would accept, and a machine you do not administer is listed, dimmed, with the reason — rather than hidden, which would read as it not existing.</p>
      </section>
      <section>
        <h3>Back up first, then see what it will write</h3>
        <p><code>back_up_now</code> is the thing to press before anything else, so it sits to the left of the primary and says so in a line beside it. The plan names the files and, critically, <i>whether your edits are in the way</i> — one amber line among twenty-three neutral ones, which is the only place colour appears on this screen.</p>
      </section>
    </div>

    <h2>The panes, in their new homes</h2>
    <p class="prose-lead">Eleven of them, all list pages on one shell: a title, one sentence, one action, rows. Nothing here is a form — every pane is somewhere you look at what exists and change one thing about it.</p>
    <div class="cols">
      <section>
        <h3>People and Teams are a reader’s view, and must not look withheld</h3>
        <p>This was the interesting problem of the round. <code>which-surface.md</code> is explicit: who exists and who is in a team are the organisation’s, and the administration site owns them. So there is no invite, no role menu, no disable, no delete — and critically <b>no disabled control either</b>, because a greyed-out button is the clearest possible way to say “you are being withheld from”.</p>
        <p>Instead each page ends with a line that says <i>where the thing you came for actually lives</i>, and why it lives there. “This is the list the sharing sheet reads from” tells somebody what the screen is <b>for</b>, which is the real answer to why it has no buttons.</p>
      </section>
      <section>
        <h3>And next door, Directories is generous</h3>
        <p>Grants are ours, so that screen has a primary action, an expander per directory, a level menu per grant and a remove on each. The asymmetry is the point: a reader’s view beside an owner’s view, and the difference reads as <i>whose thing this is</i> rather than as one screen being broken.</p>
      </section>
      <section>
        <h3>Vault has no primary action, on purpose</h3>
        <p>Nothing reads a scope somebody invented here — you would store the thing, reasonably expect an agent to be given it, and it never would be. So the page says where each secret <i>was</i> made, and the only controls are reveal, replace and remove. <b>A value is never shown at rest:</b> twelve dots, an eye, and a line afterwards saying the read is in the access log.</p>
      </section>
      <section>
        <h3>Machines is the one with a health state</h3>
        <p>Which is why it earned a destination. Three dots — ready, needs setup, not answering — and expanding a machine shows the readiness checks with the fix beside whichever one failed. Draining, renaming and removing sit under the checks rather than on the row, because they are rarer than looking.</p>
      </section>
      <section>
        <h3>Repositories is two lists on one screen</h3>
        <p>What is checked out, and what the chosen host can see that is not. Importing used to be behind a modal, which meant the only way to look at your repositories was to already be committed to adding one. Already-imported projects are left out of the lower list rather than shown ticked — the count carries the fact that there is more without three hundred rows that do nothing.</p>
      </section>
      <section>
        <h3>Git hosts draws two different things</h3>
        <p>A host is the installation’s — its address, the application everybody authorizes against. A token is one person’s, because a commit has to be attributable to a person. So <i>Add</i> is an administrator’s and <i>Connect</i> is anybody’s, and the row says which of the two ways that host offers. A pasted token is not the lesser one: Gitea has no device flow at any version.</p>
      </section>
      <section>
        <h3>Trackers says where it is done, rather than doing it twice</h3>
        <p>Every git host is also a tracker — an issue is work to pick up, a request to merge is work to review — so they are derived rather than configured again. Linear is a tracker only and takes a key of its own. It sits under Tasks because Tasks is what consumes it.</p>
      </section>
      <section>
        <h3>Agents, and whose allowance they spend</h3>
        <p>An agent is a thing installed on a machine; an account is whose subscription it uses. The row says how many machines have it and whether it is signed in; expanding shows each account with what is left of its allowance as a bar — the one place a meter appears outside the composer.</p>
      </section>
      <section>
        <h3>Agent profiles: the team is the only thing that makes one a manager</h3>
        <p>Same object either way. A profile with a team leads and a profile without one is a worker, so the row says what it is for and who it hands work to, and <i>can delegate</i> is a chip rather than a separate kind of thing.</p>
      </section>
    </div>

    <h2>Where this departs from the style guide</h2>
    <p style="margin-top:6px;color:var(--quiet)">Five proposals. <code>desktop/STYLE.md</code> describes the app this replaces, so each of these is a deliberate break rather than an oversight.</p>
    <ul>
      <li><b>No ALL-CAPS eyebrows.</b> The guide names them as a habit to avoid and then uses <code>.eyebrow</code> nineteen times. Section labels here are sentence case at 13.5px in the secondary tier — and most of them are a sentence doing a label’s job (“Four others are still working”).</li>
      <li><b>Rows are 46px in the sheet and 34px in the panel, not one number for both.</b> The guide says 34px and calls it the measurement the whole inbox is built on; <code>.row</code> actually ships 32px (<code>styles.css:495</code>) and the only literal 34 in <code>desktop/src</code> is in the menu-bar pill. Neither number survives this brief. What a person reads gets air; what they operate stays tight.</li>
      <li><b>A branch is not on every row.</b> The guide calls it non-optional. It is how you tell two workspaces on one repository apart — which is a disambiguation problem, not a resting-state one, so it moved to hover.</li>
      <li><b>No status badges anywhere.</b> Working is the default and needs no label; waiting gets the dot; handed back gets a tick. The team rail, the Dashboard and every list use the same three marks.</li>
<li><b>No status bar along the bottom of a workspace.</b> The 22px mono strip is gone; the branch, the machine and the elapsed time live in the right rail, in sentences. Mono survives for one thing: a path or a branch, where the exact characters matter.</li>
      <li><b>Type went up.</b> 14px for controls, 15–17px for anything a person reads, 40px for the one sentence. The guide’s instrument-panel voice is the voice of the app this replaces.</li>
    </ul>
    <p class="kept"><b>Kept, non-negotiably:</b> ember means one thing and is rare. Servers are marks, never colours. White is the accent for a primary action, not a second hue.</p>
    <p class="scope">Out of this pass: the Workbench, Tasks, Artifacts, Skills, Configuration, Updates, Account and all of mobile. The shell, the rail and the switcher are drawn because the Dashboard cannot be judged without them. Hover-to-expand on the rail is desktop-only and cannot survive to a touch screen — the mobile round inherits push, float and dock from <code>firetower-surfaces</code> instead.</p>
  </div>`;
}
render();
</script>
