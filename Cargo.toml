[workspace]
resolver = "2"
members = ["crates/*"]
# `cargo run` means the product. gen-openapi is a build tool, not a program
# anyone runs by hand.
default-members = ["crates/ft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/westlabs/firetower"
authors = ["Westlabs LLC"]

[workspace.dependencies]
ft-core = { path = "crates/ft-core" }
ft-proto = { path = "crates/ft-proto" }
ft-server = { path = "crates/ft-server" }
ft-worker = { path = "crates/ft-worker" }

# runtime
tokio = { version = "1", features = [
  "io-std",
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "signal",
  "time",
  "sync",
  "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }

# http
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# api contract
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"

# data
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "chrono",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# binary
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"

# worker
portable-pty = "0.9"

# secrets
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }

# talking to git hosts: their device-flow and repository endpoints
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# plumbing
anyhow = "1"
dotenvy = "0.15"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
async-trait = "0.1"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
