[workspace]
resolver = "2"
members = ["crates/*"]
# `cargo run` means the product. gen-openapi is a build tool, not a program
# anyone runs by hand.
default-members = ["crates/ft-cli"]

[workspace.package]
# The one version. Every crate inherits it, and the release rewrites this line.
version = "0.2.0" # x-release-please-version
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/westlabs/firetower"
authors = ["Westlabs LLC"]

[workspace.dependencies]
ft-core = { path = "crates/ft-core" }
ft-proto = { path = "crates/ft-proto" }
ft-server = { path = "crates/ft-server" }
ft-worker = { path = "crates/ft-worker" }

# runtime
tokio = { version = "1", features = [
  "io-std",
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "signal",
  "time",
  "sync",
  "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }

# http
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# api contract
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"

# data
# Postgres for the control plane, SQLite for a worker's own log — a worker is
# a binary dropped onto a server, and requiring a database beside it would undo
# the thing that makes adding a host easy.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "sqlite",
  "migrate",
  "chrono",
  "macros",
  "json",
  "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# binary
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"

# worker
portable-pty = "0.9"

# secrets
# Envelope encryption for the vault: a root key wraps a key per secret, and
# every ciphertext is bound to the name it is stored under. XChaCha20-Poly1305
# for its 24-byte nonce — random nonces stop being a birthday-bound worry.
chacha20poly1305 = "0.10"
# The access log is a chain of keyed digests, so rewriting history needs the
# root key and not merely a connection to the database.
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
# Passwords. Not a hash we choose ourselves and not one that is fast: argon2id
# is the current answer to someone who has the table and time to spend on it.
# The salt and the cost parameters travel inside the encoded hash, so raising
# the cost later leaves every existing password verifiable.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }

# talking to git hosts: their device-flow and repository endpoints
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# plumbing
anyhow = "1"
dotenvy = "0.15"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
async-trait = "0.1"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
