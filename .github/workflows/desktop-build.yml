# The desktop app, built where each installer can be built: the .dmg on
# macOS, the .exe and .msi on Windows. Unsigned, no secrets, so it is safe to
# run for a pull request from a fork; the release workflow reuses these jobs
# and adds signing behind a protected environment.
#
# Run it by hand:  gh workflow run desktop-build.yml   then   gh run download
name: desktop build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "web/src/**"
      - "web/components/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            platform: mac
            args: --target universal-apple-darwin --bundles dmg --config {"bundle":{"createUpdaterArtifacts":false}}
            artifact: firetower-macos
            glob: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: depot-windows-2022
            platform: windows
            args: --bundles nsis,msi --config {"bundle":{"createUpdaterArtifacts":false}}
            artifact: firetower-windows
            glob: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Both halves of the universal binary; a no-op on Windows.

      # Both halves of the universal binary, whatever the runner came with.
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      # The renderer resolves components out of ../web, which has its own
      # dependencies.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      - run: pnpm tsc --noEmit
        working-directory: desktop

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
