# Publish the worker image — what a remote host runs.
#
# Goes to the registry that comes with the repository, so the job signs in as
# itself and there is no stored credential.
#
# Note: the first push creates the package as private, even from a public
# repository, and `docker compose pull` will then ask for a login. Make it
# public once at Packages → firetower-worker → Package settings.
name: worker image

on:
  push:
    branches: [main]
    # Only when something in the image could have changed.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "migrations/**"
      - "Dockerfile.worker"
      - ".github/workflows/worker-image.yml"

  # How a release publishes a versioned image: a tag pushed by a workflow
  # cannot trigger another, so `release.yml` calls this directly.
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build.
        type: string
        required: true
      version:
        description: The released version, without a leading v.
        type: string
        required: true

  # The escape hatch: rebuild main, or republish a version by hand.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish as. Empty builds edge from main.
        type: string
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/firetower-worker

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds the tagged commit, not wherever main is now.
          ref: ${{ inputs.ref || github.ref }}

      # The tag on the image and the version in the binary have to agree.
      #
      # Every crate takes its version from `[workspace.package]`, and the
      # control plane compares its own against the worker's on each handshake.
      # Tagging an image without moving that line publishes a binary that
      # reports a different version, and every host then shows a false drift.
      - name: the binary agrees with the tag
        if: inputs.version != ''
        run: |
          found=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$found" != "${{ inputs.version }}" ]; then
            echo "::error::releasing ${{ inputs.version }}, but Cargo.toml says $found." \
                 "The release should bump [workspace.package] before tagging."
            exit 1
          fi
          echo "Cargo.toml and the tag both say $found"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the version passed in, never from the ref: a called
      # workflow sees the caller's ref, so reading a version from it would
      # publish `edge` for a release.
      #
      #   no version  → edge, the tip of main
      #   0.2.0       → 0.2.0, 0.2, latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version || '0.0.0' }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || '0.0.0' }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          # Cross-compiled in the Dockerfile, so both build at native speed.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || 'edge' }}
          # Layer cache, so a run that changed nothing reuses the compile step.
          #
          # This does not cover the `--mount=type=cache` in the Dockerfile —
          # that kind of cache is not exported, so a commit touching `crates/`
          # rebuilds dependencies on a fresh runner. A dependencies-only layer
          # is the fix if that becomes the slow part.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: what was published
        run: |
          {
            echo "### Worker image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
