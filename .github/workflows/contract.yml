# The contract, and the three clients generated from it, proved against the
# sources they come from.
#
# `api/openapi.json` is written from the Rust handlers, and each client's
# `src/api/generated` is written from that document. All of it is committed, on
# purpose: a fresh clone typechecks without a Rust toolchain, and a renamed
# field shows its blast radius across all three clients in review. That only
# holds if something proves the committed copy is what the sources produce —
# otherwise the generated code is just three snapshots nobody is checking.
# This is that proof. It is `just gen-check`, split so the half that needs
# Rust and the halves that need Node do not wait on each other.
#
# A failure here is almost never a bug in the code. It means `just gen` was not
# run — do that, and commit what it changes.
name: contract

on:
  workflow_dispatch:
  pull_request:
    # Not on a release PR: it changes versions and changelogs, nothing a
    # regenerate would catch. The contract no longer carries the release
    # version at all (see the note on `info` in crates/ft-server/src/api.rs),
    # so a release cannot make it stale.
    branches-ignore:
      - "release-please--branches--**"
    paths:
      # The handlers define the document...
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # ...the document defines the clients...
      - "api/**"
      # ...and these decide what the generator makes of it. A lockfile is in
      # here because it pins orval, and two orval versions do not agree on
      # what the same document means.
      - "web/orval.config.ts"
      - "web/src/api/generated/**"
      - "web/pnpm-lock.yaml"
      - "desktop/orval.config.ts"
      - "desktop/src/api/generated/**"
      - "desktop/pnpm-lock.yaml"
      - "mobile/orval.config.ts"
      - "mobile/src/api/generated/**"
      - "mobile/pnpm-lock.yaml"
      # The design tokens are generated by the same command, from the one
      # place the colours live.
      - "web/app/globals.css"
      - "mobile/scripts/tokens.mjs"
      - "mobile/src/design/**"
      - ".github/workflows/contract.yml"

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is the committed contract still what the handlers say it is? This is the
  # gap that mattered: `crates/**` changing without the contract changing is
  # exactly the case where no client workflow triggers, because the file they
  # watch did not move.
  spec:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ github.repository == 'firetower-cloud/firetower' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'depot-ubuntu-22.04' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Before anything is generated: one generator, or the clients below each
      # pass their own check while disagreeing with each other.
      - name: all three clients use the same orval
        run: .github/scripts/same-orval.sh

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo run --quiet --locked -p ft-server --bin gen-openapi
      - run: cargo run --quiet --locked -p ft-updater --bin firetower-updater -- openapi > api/updater.json

      - name: the contract is what the handlers say it is
        run: $GITHUB_WORKSPACE/.github/scripts/unchanged.sh api

  # And is each client still what the contract says it is? Independent of the
  # job above — these regenerate from the *committed* document, so both
  # answers are useful at once and neither has to wait.
  #
  # All three on Linux, including desktop: its own workflow is a macOS and
  # Windows matrix, and this check has no reason to run twice on expensive
  # runners, nor to discover what Windows thinks a line ending is.
  clients:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ github.repository == 'firetower-cloud/firetower' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'depot-ubuntu-22.04' || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        app: [web, desktop, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      # --frozen-lockfile matters more here than anywhere: the whole check is
      # meaningless if the generator that runs is not the pinned one.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec orval

      # The phone draws its colours from web/app/globals.css, read at build
      # time because a phone cannot read a CSS file at runtime.
      - if: matrix.app == 'mobile'
        run: pnpm tokens

      - name: the client is what the contract says it is
        run: $GITHUB_WORKSPACE/.github/scripts/unchanged.sh .
