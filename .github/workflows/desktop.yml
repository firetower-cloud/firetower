# The desktop app on every pull request that touches it, built where each
# installer can be built: the .dmg on macOS, the .exe and .msi on Windows.
# Types, tests and lints first, then the unsigned installers as artifacts on
# the run, so a branch can be tried before it is merged. No secrets, so it is
# safe for a pull request from a fork; the release workflow adds signing
# behind a protected environment.
#
# Run it by hand:  gh workflow run desktop.yml   then   gh run download
name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "api/openapi.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            platform: mac
            args: --target universal-apple-darwin --bundles app --config src-tauri/unsigned.conf.json
            artifact: firetower-macos
            glob: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: depot-windows-2022
            platform: windows
            args: --bundles nsis,msi --config src-tauri/unsigned.conf.json
            artifact: firetower-windows
            glob: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # Both halves of the universal binary, whatever the runner came with.
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: cargo clippy --locked -- -D warnings
        working-directory: desktop/src-tauri

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      # A plain disk image from the .app: Tauri's own DMG script styles it
      # through Finder, which a headless runner has no session for.
      - if: matrix.platform == 'mac'
        shell: bash
        working-directory: desktop/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          version=$(node -p "require('../../../../tauri.conf.json').version")
          mkdir -p dmg
          hdiutil create -volname Firetower -srcfolder macos/Firetower.app -ov -format UDZO "dmg/Firetower_${version}_universal.dmg"
          ls -la dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
