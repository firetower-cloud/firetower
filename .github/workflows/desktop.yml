# The desktop app on every pull request that touches it, built where each
# installer can be built: the .dmg on macOS, the .exe and .msi on Windows, the
# .deb and the AppImage on Linux.
# Types, tests and lints first, then the unsigned installers as artifacts on
# the run, so a branch can be tried before it is merged. No secrets, so it is
# safe for a pull request from a fork; the release workflow adds signing
# behind a protected environment — and does not publish Linux at all, which is
# why the Linux packages here are the only way to get one.
#
# Run it by hand:  gh workflow run desktop.yml   then   gh run download
name: desktop

on:
  workflow_dispatch:
  pull_request:
    # Not on a release PR: it changes versions and changelogs, nothing a
    # build would catch.
    branches-ignore:
      - "release-please--branches--**"
    paths:
      - "desktop/**"
      - "api/openapi.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Not on release-please's own pull request: it changes versions and
    # changelogs, nothing a build would catch. `branches-ignore` above filters
    # the *target* branch, so this is the check that actually skips it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            platform: mac
            args: --target universal-apple-darwin --bundles app --config src-tauri/unsigned.conf.json
            artifact: firetower-macos
            glob: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: depot-windows-2022
            platform: windows
            args: --bundles nsis,msi --config src-tauri/unsigned.conf.json
            artifact: firetower-windows
            glob: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          # 22.04 and not 24.04 on purpose. glibc is forward- but not
          # backward-compatible, so the oldest distribution we build on is the
          # oldest one the `.deb` installs on — building on 24.04 would refuse
          # to install on everything older than it.
          - os: depot-ubuntu-22.04
            platform: linux
            args: --bundles deb,appimage --config src-tauri/unsigned.conf.json
            artifact: firetower-linux
            glob: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Tauri's published Linux prerequisites, plus the two that are on
      # nobody's list and that the spike had to find:
      #
      #   libdbus-1-dev  `keyring`'s `sync-secret-service` feature pulls
      #                  dbus-secret-service -> dbus -> libdbus-1, a C library.
      #                  Without it the build fails in `dbus-sys`, which names
      #                  nothing recognisable.
      #   xdg-utils      the AppImage bundler copies /usr/bin/xdg-open into the
      #                  AppDir and refuses to continue without it. `--bundles
      #                  deb` does not care, so this only appears once you ask
      #                  for the other artifact.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev xdg-utils

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # Both halves of the universal binary, whatever the runner came with.
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      # The shell's own tests, on all three platforms, which is the only
      # instrument there is for the keychain on Windows: nobody has a Windows
      # machine to drive, so what the OS keychain's failures are *read as* has
      # to be asserted rather than measured. `main.rs`'s tests carry the error
      # shapes each backend really produces and check that none of them is
      # read as "there is no credential here". Running them here is what makes
      # that true of Windows and not only of this Mac.
      - run: cargo test --locked
        working-directory: desktop/src-tauri

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      # Tauri's own DMG script arranges the window through Finder, which a
      # build machine has no session for; this assembles the image instead.
      - if: matrix.platform == 'mac'
        shell: bash
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          scripts/make-dmg.sh "$bundle/macos/Firetower.app" \
            "$bundle/dmg/Firetower_${version}_macos.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
