# The control plane, the worker and the CLI on every pull request that touches
# them: format, lints, and the test suite against a real Postgres. No secrets,
# so it is safe for a pull request from a fork.
name: backend ci

on:
  pull_request:
    # Not on a release PR: it changes versions and changelogs, nothing a
    # build would catch.
    branches-ignore:
      - "release-please--branches--**"
    paths:
      - "crates/**"
      - "migrations/**"
      - "install/**"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: depot-ubuntu-22.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: firetower
          POSTGRES_PASSWORD: firetower
          POSTGRES_DB: firetower
        ports:
          # The port the tests default to, so nothing here needs configuring.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U firetower -d firetower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The worker's tests commit in throwaway repositories, and a runner has
      # no identity of its own. Configuration rather than the GIT_AUTHOR_*
      # variables: those would override the author the worker names on purpose.
      - run: |
          git config --global user.name firetower
          git config --global user.email ci@firetower.cloud
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          DATABASE_URL: postgres://firetower:firetower@localhost:5433/firetower

  # The installer, on the platform it is not developed on: a bare Debian with
  # nothing but tar, the way a fresh VM arrives. Proves the script's own
  # logic — shape detection, --from, --skip-packages, where the binary lands,
  # the doctor naming apt-get for what is missing — without a release.
  installer:
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # The action adds targets to the toolchain it installed; cargo then reads
      # rust-toolchain.toml and uses that one, which has no musl std. Add the
      # target to whichever toolchain will actually build.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools shellcheck
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: installer
      - run: shellcheck -s sh install/worker.sh install/install.sh
      - run: cargo build --release -p ft-cli --no-default-features --bin firetower-worker --target x86_64-unknown-linux-musl
      - run: |
          mkdir -p dist
          tar -czf dist/firetower-worker-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release firetower-worker
      - name: a bare machine, the worker from a tarball, nothing installed for it
        run: |
          docker run --rm -v "$PWD/install:/install:ro" -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -c '
            set -e
            useradd -m editor
            su editor -c "sh /install/worker.sh --from /dist/firetower-worker-linux-x86_64.tar.gz --skip-packages" | tee /tmp/out
            grep -q "Installed firetower-worker" /tmp/out
            su editor -c "~/.firetower/worker/bin/firetower-worker --version"
            # git and tmux are not there, and the doctor says how to get them.
            su editor -c "~/.firetower/worker/bin/firetower-worker doctor" > /tmp/doctor 2>&1 || true
            grep -q "MISSING  tmux" /tmp/doctor
            grep -q "apt-get install -y tmux" /tmp/doctor
          '
      - name: with the packages, the machine is ready
        run: |
          docker run --rm -v "$PWD/install:/install:ro" -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -c '
            set -e
            apt-get update >/dev/null && apt-get install -y --no-install-recommends git tmux >/dev/null
            useradd -m editor
            su editor -c "sh /install/worker.sh --from /dist/firetower-worker-linux-x86_64.tar.gz --skip-packages" >/dev/null
            su editor -c "~/.firetower/worker/bin/firetower-worker doctor"
          '
      # The control plane's installer on the same bare machine: no Node, no
      # CLI, and afterwards `firetower --version` answers. Docker's installer
      # is not exercised in a container; a real VM is where that is tried.
      - name: the control-plane installer gets Node and the CLI onto a bare machine
        run: |
          docker run --rm -v "$PWD/install:/install:ro" debian:bookworm-slim sh -c '
            set -e
            apt-get update >/dev/null && apt-get install -y --no-install-recommends curl ca-certificates >/dev/null
            sh /install/install.sh --yes --deps-only --skip-docker
            firetower --version
          '

  # The image, built the way a release builds it, so a file the binary embeds
  # and the Dockerfile does not copy fails a pull request rather than a
  # release. Only the build stage: compiling is the check, and pushing is not.
  image:
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          target: build
          push: false
          cache-from: type=gha,scope=firetower
          cache-to: type=gha,mode=max,scope=firetower-pr
