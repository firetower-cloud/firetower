name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  please:
    runs-on: ubuntu-latest
    outputs:
      # Only true on the run where a release PR was merged and the tag cut.
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The desktop app is its own package with its own tag (desktop-v*).
      desktop_released: ${{ steps.release.outputs['desktop--release_created'] }}
      desktop_tag: ${{ steps.release.outputs['desktop--tag_name'] }}
      desktop_version: ${{ steps.release.outputs['desktop--version'] }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Called, not triggered. The tag above is pushed with this workflow's own
  # token, and GitHub does not let that start another workflow — so a
  # `on: push: tags` job would never run, leaving a release with no image.
  # Calling it directly also avoids needing a personal access token.
  image:
    needs: please
    if: needs.please.outputs.released == 'true'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.please.outputs.tag }}
      version: ${{ needs.please.outputs.version }}

  # The desktop app: signed, notarized installers onto the draft release
  # release-please just made, then published. Same reason for calling rather
  # than triggering as above — and the signing job runs in the `release`
  # environment, where a reviewer approves before any secret is read.
  desktop:
    needs: please
    if: needs.please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/desktop-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.please.outputs.desktop_tag }}
      version: ${{ needs.please.outputs.desktop_version }}
      ref: ${{ github.sha }}

  # The worker, as a binary a machine installs: one per shape it runs on, plus
  # the installer script and a checksum file, all on the release the job
  # above cut. `usefiretower.com/worker.sh` redirects to the newest release's
  # copy of the script, and the script downloads its binary from the same
  # release — so the two can never disagree.
  worker:
    needs: please
    if: needs.please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            target: aarch64-apple-darwin
            asset: firetower-worker-darwin-arm64.tar.gz
          - os: depot-macos-latest
            target: x86_64-apple-darwin
            asset: firetower-worker-darwin-x86_64.tar.gz
          # Static, so one Linux binary runs on whatever libc a distribution
          # ships — there is no glibc version to argue about.
          - os: depot-ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: firetower-worker-linux-x86_64.tar.gz
          - os: depot-ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: firetower-worker-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: worker-${{ matrix.target }}
      - name: build
        run: cargo build --release -p ft-cli --no-default-features --bin firetower-worker --target ${{ matrix.target }}
      - name: the binary agrees with the tag
        env:
          VERSION: ${{ needs.please.outputs.version }}
        run: |
          said="$(target/${{ matrix.target }}/release/firetower-worker --version || true)"
          case "$said" in *"$VERSION"*) ;; *) echo "built $said, tag says $VERSION" >&2; exit 1 ;; esac
      - name: pack
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" firetower-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Everything the installer reads, on the release, in one step — so a
  # release either has the whole set or none of it.
  worker-release:
    needs: [please, worker]
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firetower-worker-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.please.outputs.tag }}
        run: |
          cp install/worker.sh dist/worker.sh
          cd dist
          sha256sum firetower-worker-*.tar.gz worker.sh > SHA256SUMS
          ls -la
          gh release upload "$TAG" firetower-worker-*.tar.gz worker.sh SHA256SUMS --clobber
