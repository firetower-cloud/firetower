name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  please:
    runs-on: ubuntu-latest
    outputs:
      # Only true on the run where a release PR was merged and the tag cut.
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The desktop app is its own package with its own tag (desktop-v*).
      desktop_released: ${{ steps.release.outputs['desktop--release_created'] }}
      desktop_tag: ${{ steps.release.outputs['desktop--tag_name'] }}
      desktop_version: ${{ steps.release.outputs['desktop--version'] }}
      mobile_released: ${{ steps.release.outputs['mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['mobile--tag_name'] }}
      mobile_version: ${{ steps.release.outputs['mobile--version'] }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Called, not triggered. The tag above is pushed with this workflow's own
  # token, and GitHub does not let that start another workflow — so a
  # `on: push: tags` job would never run, leaving a release with no image.
  # Calling it directly also avoids needing a personal access token.
  image:
    # After the worker is on the release: the image carries the worker
    # tarballs it was released with, so a control plane installs the worker
    # it ships rather than one a machine has to fetch from GitHub.
    needs: [please, worker-release]
    if: needs.please.outputs.released == 'true'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.please.outputs.tag }}
      version: ${{ needs.please.outputs.version }}

  # The desktop app: signed, notarized installers onto the draft release
  # release-please just made, then published. Same reason for calling rather
  # than triggering as above — and the signing job runs in the `release`
  # environment, where a reviewer approves before any secret is read.
  desktop:
    needs: please
    if: needs.please.outputs.desktop_released == 'true'
    uses: ./.github/workflows/desktop-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.please.outputs.desktop_tag }}
      version: ${{ needs.please.outputs.desktop_version }}
      ref: ${{ github.sha }}

  # The phone, on the same terms: an APK onto the release and a build into
  # TestFlight, from the `release` environment behind an approval.
  mobile:
    needs: please
    if: needs.please.outputs.mobile_released == 'true'
    uses: ./.github/workflows/mobile-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.please.outputs.mobile_tag }}
      version: ${{ needs.please.outputs.mobile_version }}
      ref: ${{ github.sha }}

  # Every released version is on beta, and this is what says so.
  #
  # Beta is continuous: merging release-please's pull request *is* the beta
  # deploy. There is no second gate and no way to hold a release back from it,
  # which is why this job has no condition of its own beyond "something was
  # released" — the `beta` image tag and the `desktop-beta` address are moved
  # by the jobs above, and this records the same fact in the one document every
  # installation reads.
  #
  # The `general` pins are not touched here and never are by a release.
  # General access is a pin moved by `promote.yml`, by hand, and that
  # separation is the whole of the design.
  #
  # After the jobs that publish the artifacts, and only for the packages whose
  # job actually succeeded: a manifest saying 0.57.0 is on beta when the image
  # never pushed would point every beta installation at something that is not
  # there. `!cancelled()` rather than `always()` so a cancelled run does not
  # publish half a release, and `result == 'success'` per package rather than
  # one condition for both, because the two release independently.
  channels:
    needs: [please, image, desktop]
    if: >-
      ${{ !cancelled()
          && (needs.please.outputs.released == 'true'
              || needs.please.outputs.desktop_released == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE: ${{ needs.please.outputs.released == 'true' && needs.image.result == 'success' && needs.please.outputs.version || '' }}
          DESKTOP: ${{ needs.please.outputs.desktop_released == 'true' && needs.desktop.result == 'success' && needs.please.outputs.desktop_version || '' }}
        run: |
          set -euo pipefail
          pins=()
          # `if` rather than `[ … ] && …`: under `set -e` a bare test that is
          # false is the statement's exit status, so a desktop-only release
          # would end this step successfully having published nothing.
          if [ -n "$CONTROL_PLANE" ]; then pins+=("control_plane:beta=$CONTROL_PLANE"); fi
          if [ -n "$DESKTOP" ]; then pins+=("desktop:beta=$DESKTOP"); fi
          if [ ${#pins[@]} -eq 0 ]; then
            echo "::warning::Nothing published, so nothing is going on beta." \
                 "A package that released but whose artifacts did not build is" \
                 "deliberately left off the manifest: pointing beta at a build" \
                 "that is not in the registry is worse than lagging by one release."
            exit 0
          fi
          .github/scripts/publish-channel-pin.sh "${pins[@]}"

  # The worker, as a binary a machine installs: one per shape it runs on, plus
  # the installer script and a checksum file, all on the release the job
  # above cut. The script on a release downloads its binary from that same
  # release, so a script and a binary can never disagree about a version.
  #
  # **A release does not touch `worker-latest`**, the rolling release
  # `usefiretower.com/worker.sh` redirects to. That release follows general
  # access and is moved by `promote.yml` alone — see the `worker` job there,
  # and #459 for why a pointer meaning "newest" became wrong the moment there
  # were two channels.
  worker:
    needs: please
    if: needs.please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            target: aarch64-apple-darwin
            asset: firetower-worker-darwin-arm64.tar.gz
          - os: depot-macos-latest
            target: x86_64-apple-darwin
            asset: firetower-worker-darwin-x86_64.tar.gz
          # Static, so one Linux binary runs on whatever libc a distribution
          # ships — there is no glibc version to argue about.
          - os: depot-ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: firetower-worker-linux-x86_64.tar.gz
          - os: depot-ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: firetower-worker-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # To the toolchain rust-toolchain.toml names, which is the one cargo
      # will use — the action only knows about the one it installed.
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: worker-${{ matrix.target }}
      - name: build
        run: cargo build --release -p ft-cli --no-default-features --bin firetower-worker --target ${{ matrix.target }}
      - name: the binary agrees with the tag
        env:
          VERSION: ${{ needs.please.outputs.version }}
        run: |
          said="$(target/${{ matrix.target }}/release/firetower-worker --version || true)"
          case "$said" in *"$VERSION"*) ;; *) echo "built $said, tag says $VERSION" >&2; exit 1 ;; esac
      - name: pack
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" firetower-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Everything the installer reads, on the release, in one step — so a
  # release either has the whole set or none of it.
  worker-release:
    needs: [please, worker]
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.please.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firetower-worker-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.please.outputs.tag }}
        run: |
          cp install/worker.sh install/install.sh dist/
          cd dist
          sha256sum firetower-worker-*.tar.gz worker.sh install.sh > SHA256SUMS
          ls -la
          gh release upload "$TAG" firetower-worker-*.tar.gz worker.sh install.sh SHA256SUMS --clobber

      # The whole chain, before anybody is told the release exists: the
      # published script, the tarball it names, the checksum, and the binary
      # answering. A failure here fails the release.
      #
      # **Against this version's own release, because that is the path this
      # workflow publishes.** It used to be against `worker-latest` — correct
      # while a release moved that too, which it no longer does (#459): the
      # rolling release follows general access and is moved by `promote.yml`,
      # so asserting here that it holds this version would assert the opposite
      # of the thing that was just fixed.
      #
      # Nothing is weakened by the move. It is still the published script from
      # a published release, downloading the published tarball and checking it
      # against the published checksum — and it is now the *pinned* path
      # specifically, which is the one the control-plane-generated authorize
      # command uses (`--version X.Y.Z`) and the one every worker upgrade runs.
      # The unpinned one-liner is exercised by `promote.yml`, where the release
      # it resolves to is written.
      - name: the published installer installs the published worker
        env:
          TAG: ${{ needs.please.outputs.tag }}
          VERSION: ${{ needs.please.outputs.version }}
        run: |
          export FIRETOWER_WORKER_ROOT="$RUNNER_TEMP/worker-smoke"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/worker.sh" \
            | sh -s -- --version "$VERSION" --skip-packages
          said="$("$FIRETOWER_WORKER_ROOT/bin/firetower-worker" --version)"
          case "$said" in *"$VERSION"*) echo "ok: $said" ;; *) echo "installed $said, expected $VERSION" >&2; exit 1 ;; esac
      # And the control plane's: the published script gets the CLI onto a
      # machine. The runner has Docker and Node already, so this proves the
      # download, the script and the npm step — the rest is a real server's.
      - name: the published installer gets the CLI onto a machine
        env:
          TAG: ${{ needs.please.outputs.tag }}
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            | sh -s -- --yes --deps-only --skip-docker
          firetower --version
