# The desktop app's release: installers for macOS and Windows onto the
# GitHub Release for a `desktop-v*` tag, signed and notarized, then published.
#
# Called by release.yml when release-please cuts the tag (the release exists
# as a draft by then), or run by hand for an existing tag when a build has
# to be redone. The jobs that sign run in the `release` environment: a
# reviewer approves the deployment before its secrets are readable, and
# nothing here prints one. Actions are pinned by commit.
name: desktop release

on:
  workflow_call:
    inputs:
      tag: { required: true, type: string }
      version: { required: true, type: string }
      ref: { required: true, type: string }
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing desktop-v* tag to rebuild"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Which release the assets go onto. release-please leaves a draft; a rerun
  # by hand finds the published one.
  release:
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.find.outputs.id }}
      ref: ${{ inputs.ref || inputs.tag }}
      version: ${{ inputs.version || steps.find.outputs.version }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then echo "no release for $TAG" >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: depot-macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows
            os: depot-windows-2022
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Both halves of the universal binary, whatever the runner came with.
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      # The notarization key is a file to notarytool. It exists only inside
      # this job, from the secret, and is removed however the job ends.
      - if: matrix.platform == 'mac'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Windows code signing, once the Trusted Signing certificate profile
      # exists. Until then the installer is unsigned, and the release notes
      # say so. The profile is read as a secret so its absence is a decision
      # here rather than a failed sign step.
      - if: matrix.platform == 'windows' && env.PROFILE != ''
        env:
          PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          printf 'SIGN_CONFIG=%s\n' "$(jq -cn --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg p "$PROFILE" '{bundle:{windows:{signCommand:("trusted-signing-cli -e " + $e + " -a " + $a + " -c " + $p + " %1")}}}')" >> "$GITHUB_ENV"
        # (the endpoint and account are read below, with the same names)

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing and notarization by API key.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # The updater's signature on every bundle.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows: Trusted Signing signs in as this app registration.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.SIGN_CONFIG != '' && format('--config {0}', toJSON(env.SIGN_CONFIG)) || '' }}

      - if: always() && matrix.platform == 'mac'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Nothing is visible until both platforms are on it.
  publish:
    needs: [release, build]
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.release.outputs.id }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Pre-release while the version is 0.x: the updater's `latest`
          # endpoint skips pre-releases, so people on a stable build are never
          # offered a beta.
          pre=false; case "$VERSION" in 0.*) pre=true;; esac
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$ID" -F draft=false -F prerelease=$pre >/dev/null
          echo "published $VERSION (prerelease=$pre)"
