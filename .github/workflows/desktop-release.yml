# The desktop app's release: installers for macOS, Windows and Linux onto the
# GitHub Release for a `desktop-v*` tag, signed and notarized, then published.
#
# **Linux is one artifact, the AppImage, and that is a decision rather than an
# omission.** The per-pull-request build in `desktop.yml` makes a `.deb` too
# and will carry on doing so, because it is the easier thing to install on a
# machine you already administer. But a released download has to be able to
# update itself, and a `.deb` cannot: the only way to update one in place is a
# root-privileged `dpkg -i`, which an app cannot ask for mid-update the way
# Windows can elevate. The AppImage replaces its own file and needs nothing.
# One Linux download also means nobody has to be told which one to take.
# Adding a format later costs nothing; removing one later strands everybody
# who installed it, so the `.deb` comes back when there is an apt repository
# to serve it from, and not before — please do not add it to a matrix line
# here without that.
#
# Called by release.yml when release-please cuts the tag (the release is
# published by then; the installers land on it as they are built), or run by
# hand for an existing tag when a build has to be redone. The jobs that sign run in the `release` environment: a
# reviewer approves the deployment before its secrets are readable, and
# nothing here prints one. Actions are pinned by commit.
name: desktop release

on:
  workflow_call:
    inputs:
      tag: { required: true, type: string }
      version: { required: true, type: string }
      ref: { required: true, type: string }
      # Which address the manifest is written to. See `publish` below for the
      # three of them and why the legacy one can never be retired.
      #
      # `beta` is the default because a release is a beta deploy: every
      # released version goes to beta and nothing else does. A promotion calls
      # this workflow again with `general`, against a tag that is already
      # built — which re-runs the one writer rather than copying a manifest
      # across, because a second writer is exactly what this job was rewritten
      # to eliminate.
      channel:
        required: false
        type: string
        default: beta
      # Write the manifest from the bundles already on the release, and do not
      # build or sign anything. This is what makes a promotion a pointer move:
      # the bytes general access gets are the bytes beta was tested on, and no
      # bundle is re-signed. The publish job still verifies every signature
      # against the payload it will point at, so a release missing an asset is
      # still refused rather than half-published.
      publish_only:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing desktop-v* tag to rebuild"
        required: true
        type: string
      # **Beta only, and general access deliberately absent.**
      #
      # Dispatching this with `channel: general` published `desktop-stable` and
      # `desktop-latest` — the two addresses every desktop copy on general
      # access reads — with no typed confirmation, no check that the version is
      # on beta, and no channel-manifest write. It was an unguarded second
      # route to the thing `promote.yml` exists to guard, and it was
      # reproduced: it published 0.60.0 to both addresses while the manifest
      # still said beta 0.59.0, general 0.58.0.
      #
      # General access now reaches this job only through `workflow_call`, which
      # means only through `promote.yml`. The step guarding it is below; this
      # list is the half somebody sees before they press anything.
      channel:
        description: "Which channel's address to write (general access is promotion's, not this)"
        required: false
        type: choice
        default: beta
        options: [beta]
      publish_only:
        description: "Rewrite the manifest only — build and sign nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# **Two runs of this workflow must not overlap.** Nothing inside one can clobber
# another leg's manifest entry any more — `publish` is the only writer — but
# that is a property of one run. Across two, `tauri-action` deletes an existing
# asset before re-uploading it, so a rerun racing a release can have one run
# read the release at the moment the other has a `.sig` deleted: the manifest
# job then fails for a reason that has nothing to do with the build. And this
# is not hypothetical here — release-please has cut several desktop releases in
# one morning before, which is why `release.yml` waits for an approval at all.
#
# Queued rather than cancelled: a release that is slow is better than one
# abandoned halfway through uploading its installers. One group for every tag
# rather than one per tag, because the point is that no two desktop releases
# are ever in flight together.
#
# **`queue: max` is the half that keeps the queue, and it is a separate
# setting from `cancel-in-progress`.** That one protects the run that is
# executing; what happens to the runs *waiting* is `queue`, and its default
# holds exactly one of them. So: A is in progress, a newer release B queues
# behind it, somebody dispatches a rebuild of an older tag — and C evicts B.
# A finishes, C correctly refuses to move `desktop-latest` backwards, and B
# never publishes its installers or its updates at all. `queue: max` holds up
# to 100, first in first out.
#
# Measured on this repository rather than read off the page, because the
# difference is invisible until it costs a release: with the default, the
# waiting run was cancelled the moment a third arrived; with this, both
# stayed pending and ran in turn. (`queue: max` with `cancel-in-progress:
# true` is a validation error, which is the right way round.)
concurrency:
  group: desktop-release
  queue: max
  cancel-in-progress: false

jobs:
  # Which release the assets go onto.
  release:
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.find.outputs.id }}
      ref: ${{ inputs.ref || inputs.tag }}
      version: ${{ inputs.version || steps.find.outputs.version }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then echo "no release for $TAG" >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

  # The two platforms that sign with material the operating system issues:
  # a Developer ID certificate and an Azure Trusted Signing identity. Linux is
  # a job of its own below, and the reason it is not a third line here is
  # written there.
  build:
    needs: release
    if: ${{ !inputs.publish_only }}
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: depot-macos-latest
            args: --target universal-apple-darwin --bundles app
          - platform: windows
            os: depot-windows-2022
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Both halves of the universal binary, whatever the runner came with.
      - if: matrix.platform == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: matrix.platform == 'mac'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      # The notarization key is a file to notarytool. It exists only inside
      # this job, from the secret, and is removed however the job ends.
      - if: matrix.platform == 'mac'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Windows code signing, once the Trusted Signing certificate profile
      # exists. Until then the installer is unsigned, and the release notes
      # say so. The profile is read as a secret so its absence is a decision
      # here rather than a failed sign step.
      - if: matrix.platform == 'windows' && env.PROFILE != ''
        env:
          PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          printf 'SIGN_CONFIG=%s\n' "$(jq -cn --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg p "$PROFILE" '{bundle:{windows:{signCommand:("trusted-signing-cli -e " + $e + " -a " + $a + " -c " + $p + " %1")}}}')" >> "$GITHUB_ENV"
        # (the endpoint and account are read below, with the same names)

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID signing and notarization by API key.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # The updater's signature on every bundle.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows: Trusted Signing signs in as this app registration.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release.outputs.id }}
          # The bundles and their signatures are uploaded; `latest.json` is
          # not. The action's own manifest step has no single writer — see the
          # `publish` job, which is the one place it is written now.
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.SIGN_CONFIG != '' && format('--config {0}', toJSON(env.SIGN_CONFIG)) || '' }}

      # A plain disk image from the .app: Tauri's own DMG script styles it
      # through Finder, which a headless runner has no session for.
      - if: matrix.platform == 'mac'
        id: dmg
        shell: bash
        working-directory: desktop
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="$bundle/dmg/Firetower_${version}_macos.dmg"
          scripts/make-dmg.sh "$bundle/macos/Firetower.app" "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      # Apple notarises the image as well as the app inside it, and staples
      # the ticket to the image. The image itself is not code-signed: the app
      # inside carries the signature, and the keychain Tauri imported the
      # certificate into was deleted when its build ended.
      - if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        working-directory: desktop
        run: |
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          gh release upload "$TAG" "$DMG" --clobber
      - if: always() && matrix.platform == 'mac'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Linux: the AppImage, and nothing else on the release.
  #
  # **A job of its own, and that is the security boundary rather than a
  # tidiness choice.** The step above hands `tauri-action` the Developer ID
  # certificate and the Azure client secret with no platform condition, which
  # is harmless while every leg in that matrix needs one of them. Linux needs
  # neither — and packaging an AppImage *executes a third-party shell script*
  # (`linuxdeploy-plugin-gtk.sh`, with the AppDir in its hands). Putting that
  # script in the same environment as a code-signing certificate for two other
  # operating systems is not a risk worth taking for twenty lines of shared
  # setup.
  #
  # Written as a separate job, the scoping is structural: the Apple and Azure
  # secrets are not named anywhere in it, so there is nothing to leak and
  # nothing for a later edit to the matrix to leak by accident. The one secret
  # it does hold is the updater signing key, which is the whole point of a
  # released tier — an unsigned AppImage is one an installed copy will refuse.
  #
  # 22.04 and not 24.04, for the same reason as `desktop.yml`: glibc is
  # forward- but not backward-compatible, and the AppImage carries its own GTK
  # and WebKit but not its own libc.
  linux:
    needs: release
    if: ${{ !inputs.publish_only }}
    environment: release
    permissions:
      contents: write
    runs-on: depot-ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}

      # Tauri's published prerequisites, plus `libdbus-1-dev` (keyring) and
      # `xdg-utils` (the AppImage bundler copies `xdg-open` into the AppDir
      # and refuses to continue without it). `desktop.yml` has the long
      # version of why those two are on nobody's list.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev xdg-utils

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - run: pnpm install --frozen-lockfile

      # Pinned, checksum-verified packaging tools where the bundler looks, so
      # it downloads none of its own — and so the AppImage does not bundle
      # `libwayland-client`, which is what made the window come up white on
      # current distributions. The guard after the build is what keeps that
      # true if the CLI is ever bumped.
      #
      # It also exports `LDAI_RUNTIME_FILE`, which is how the pinned AppImage
      # runtime reaches the bundle step below: `appimagetool` fetches that one
      # from a rolling upstream tag unless it is handed a file, and it is both
      # the first code that runs on a user's machine and inside what the
      # updater key signs a few lines further down.
      - run: $GITHUB_WORKSPACE/.github/scripts/appimage-tools.sh

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's signature on the AppImage, checked by every
          # installed copy against the public key in `tauri.conf.json`. The
          # same minisign key as macOS and Windows: there is no Linux-specific
          # signing, and no Apple or Azure material in this job at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: false
          # `--bundles appimage` and not the config's targets, which is the
          # smaller change: `tauri.conf.json` lists what each platform *can*
          # build and the command line says what this release *does*. No
          # `.deb` on a release — the header says why.
          args: --bundles appimage

      - run: $GITHUB_WORKSPACE/.github/scripts/appimage-guard.sh src-tauri/target/release/bundle/appimage/*.AppImage

  # Every platform is on the release; now the updater is pointed at it. The
  # release itself was published when the tag was cut: a draft had no tag,
  # and release-please then re-released the desktop on every push to main
  # until somebody approved the signing — four times in one morning.
  #
  # **This job is the only writer of `latest.json`.** It used to be written by
  # each build leg, by `tauri-action`'s `uploadVersionJSON`: read the manifest
  # off the release, merge in its own platform, delete the asset, upload the
  # new one — with no lock. Two legs finishing within a few seconds of each
  # other both read the same file and the second upload is the one that
  # survives, so a platform silently vanishes from the manifest and every
  # installed copy on it is told there is no update. Nothing goes red. That
  # was live with two platforms; Linux would have been a third chance for it.
  #
  # So the legs upload bundles and signatures only, and the manifest is built
  # once, here, from what is actually on the release — and this job fails
  # rather than publishing one that is missing a platform.
  publish:
    needs: [release, build, linux]
    # Both legs must have finished for a release — a manifest missing a
    # platform is worse than no manifest at all. A promotion skips them both
    # on purpose and reads the bundles off the release instead, which is what
    # `publish_only` means; `!cancelled()` is what lets a skipped `needs`
    # through, and the explicit results are what stops a *failed* one.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success'
          && (inputs.publish_only
              || (needs.build.result == 'success' && needs.linux.result == 'success')) }}
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The list of dispatch options above is a courtesy; this is the rule.
      # `workflow_dispatch` and `workflow_call` share one `inputs` context, so
      # the only thing that distinguishes "a person pressed Run workflow" from
      # "promotion called it" is the event name.
      - name: general access comes from promotion and from nowhere else
        env:
          CHANNEL: ${{ inputs.channel || 'beta' }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != beta ] && [ "$CHANNEL" != general ]; then
            echo "::error::channel must be beta or general, not '$CHANNEL'."; exit 1
          fi
          if [ "$CHANNEL" = general ] && [ "${{ github.event_name }}" != workflow_call ]; then
            echo "::error::Writing the general-access address is promotion's job." \
                 "Run the 'promote' workflow, which requires a typed confirmation, checks the" \
                 "version is on beta and is not a downgrade, and writes the channel manifest." \
                 "Nothing has been published."
            exit 1
          fi
          # Signing and general access are never the same run. A promotion
          # moves what is already built; anything that builds is a release.
          if [ "$CHANNEL" = general ] && [ "$PUBLISH_ONLY" != true ]; then
            echo "::error::channel=general requires publish_only=true." \
                 "General access is reached by moving what was already built and signed," \
                 "never by building again. Nothing has been published."
            exit 1
          fi

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ inputs.channel || 'beta' }}
        run: |
          # The signatures are the evidence that a leg got to the end: one
          # per updater artifact, uploaded beside it. A leg that failed or
          # never ran leaves none, and `latest-json.mjs` refuses to write a
          # manifest it cannot fill — which is the same check as "did every
          # platform build", without a second list to keep up to date.
          #
          # **Every asset and not just the `.sig` files**, because naming an
          # artifact is not signing it. Each signature is verified against the
          # bytes of the asset its entry will point at, which is the only
          # thing that establishes the two belong together — a signature left
          # over from the previous build of a rebuilt tag names exactly what
          # this one's artifact is called.
          #
          # The four payloads are 106MB, 82 of them the AppImage, and hashing
          # all four takes 100ms. No pattern, so the `.dmg` comes down too and
          # the transfer is nearer 121MB — a few seconds on a release that
          # takes twenty minutes, and cheaper than keeping a list of asset
          # names here in step with `WANTED` in the script.
          #
          # `--clobber` so that re-running this job after a leg was rebuilt
          # reads what is on the release now.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/assets" --clobber
          node desktop/scripts/latest-json.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --assets "$RUNNER_TEMP/assets" \
            --out "$RUNNER_TEMP/latest.json"

          # The app's updater reads one fixed address. GitHub's own `latest`
          # is the newest release of the whole repository, whichever package
          # cut it, so `latest.json` is copied onto a rolling release of the
          # desktop's own. Its links point at this versioned release, and the
          # versioned release keeps its own copy so that a rebuild of an older
          # tag can be read back and compared.
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" -R "$GITHUB_REPOSITORY" --clobber

          # **Three addresses, and the third can never be retired.**
          #
          #   desktop-beta    the beta channel. Written by every release.
          #   desktop-stable  general access. Written only by a promotion.
          #   desktop-latest  the address that existed before channels, kept
          #                   forever as an alias of general access.
          #
          # That last one is not scaffolding. Every installed copy has its
          # updater address compiled into its bundle, and the only way a copy
          # ever reads a different one is by updating — which it can only do
          # through the address it already has. There is no migration, ever:
          # whatever `desktop-latest` serves is what every copy predating
          # channels gets, permanently. So it is written with exactly the
          # bytes general access gets, and a copy that never takes the channel
          # release stays on general access forever by construction, which is
          # the answer to "why am I not getting betas".
          #
          # Deliberately not mirroring the image tags, where `latest` kept its
          # conventional "newest build" meaning: that was a Docker convention,
          # which does not apply to a Firetower-invented release name. And the
          # control plane has a second opinion — the updater compares the
          # image's stamped version against what it was told to fetch —
          # whereas this manifest is the only source of truth. Tauri installs
          # whatever it says, if the version is greater. Nothing would catch a
          # mistake here.
          case "$CHANNEL" in
            beta) ROLLING=desktop-beta; ALIASES="" ;;
            general) ROLLING=desktop-stable; ALIASES="desktop-latest" ;;
            *) echo "::error::channel must be beta or general, not $CHANNEL" >&2; exit 1 ;;
          esac
          echo "writing the $CHANNEL address: $ROLLING${ALIASES:+ (and $ALIASES)}"

          # The rolling release only ever moves forward. Serialising runs above
          # stops two of them interleaving, but it does not order them by
          # version: a rebuild of an older tag, dispatched by hand after a
          # newer release has gone out, would otherwise point every installed
          # copy back at the older build — and that is a silent downgrade of
          # the one address they all read, which is exactly the class of
          # failure this job was rewritten to remove.
          #
          # The versioned release above always gets its copy, so a rebuild of
          # an old tag is still readable and comparable afterwards.
          #
          # **And it does not move at all if what it holds cannot be read.**
          # Three outcomes, which are not interchangeable:
          #
          #   * no rolling release, or one with no manifest on it yet — there
          #     is nothing to go backwards past, and this release is the one
          #     that creates it. This is `github.token` on its own
          #     repository, so a 404 is absence rather than a permission it
          #     was refused.
          #   * a manifest that reads — compare the versions, below.
          #   * anything else: a rate limit, a network failure, a manifest
          #     with no version in it. Stop, and move nothing.
          #
          # That last one is the point. It used to fall through to the upload
          # with an empty `held`, which made this advisory rather than a rule:
          # a read that went wrong was all it took to permit the one thing the
          # rule exists to prevent. Leaving `desktop-latest` where it is is
          # always the safe answer — it is the single address every installed
          # copy reads, `$TAG` already has its own copy of this manifest a few
          # lines up, and this job can be re-run once whatever failed is over.
          # **Every address is guarded, not just the first one.**
          #
          # This used to read what `$ROLLING` held, compare that, and then
          # upload to `$ROLLING` *and* `$ALIASES` in a loop. `desktop-latest`
          # was therefore clobbered having been compared against nothing — and
          # it is the address every copy predating channels reads, forever.
          # The loop had a second hole: a failure between its two iterations
          # left `desktop-stable` moved and `desktop-latest` not, two
          # general-access addresses disagreeing with nothing to notice.
          #
          # So each address answers for itself: read what it holds, refuse to
          # move it backwards, write it. An address that is already ahead is
          # skipped and said out loud rather than silently overwritten, and if
          # a later address fails the earlier ones have already landed — which
          # is the same "re-run it" position as before, now with the state
          # printed.
          #
          # **Per channel, and it has to be.** Beta is legitimately and
          # permanently ahead of general access, so a guard spanning both
          # channels would read every promotion as a downgrade and refuse
          # forever. Within one address the rule is unchanged: it is the single
          # thing every copy reading it reads, and moving it back is a silent
          # downgrade of all of them.
          moved=""
          skipped=""
          failed=""
          for address in $ROLLING $ALIASES; do
            held=""
            rolling=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$address" \
              --jq '[.assets[] | select(.name == "latest.json")] | length' \
              2>"$RUNNER_TEMP/rolling.err") || rolling=""
            if [ -z "$rolling" ]; then
              if ! grep -q '(HTTP 404)' "$RUNNER_TEMP/rolling.err"; then
                cat "$RUNNER_TEMP/rolling.err" >&2
                echo "Could not read what $address holds, so it is not being moved." >&2
                echo "$TAG keeps its own copy of this manifest; re-run this job." >&2
                exit 1
              fi
              echo "No $address release yet — this one creates it."
              gh release create "$address" -R "$GITHUB_REPOSITORY" --prerelease \
                --title "desktop: $CHANNEL" \
                --notes "The desktop app's $CHANNEL address. Its \`latest.json\` is what an installed copy reading this address gets; the versioned releases hold the same manifest." \
                >/dev/null
              rolling=0
            fi
            if [ "$rolling" != 0 ]; then
              rm -rf "$RUNNER_TEMP/held"
              if ! gh release download "$address" -R "$GITHUB_REPOSITORY" \
                  -p latest.json -D "$RUNNER_TEMP/held" --clobber; then
                echo "$address holds a manifest that would not download, so it is" >&2
                echo "not being moved. $TAG keeps its own copy; re-run this job." >&2
                exit 1
              fi
              held=$(jq -r '.version // empty' "$RUNNER_TEMP/held/latest.json" || true)
              if [ -z "$held" ]; then
                echo "$address holds a manifest with no version in it, so there is" >&2
                echo "nothing to compare $VERSION against and it is not being moved." >&2
                exit 1
              fi
            fi

            # Captured on its own line and checked, never inside the `if`: a
            # command substitution *in* a condition is exempt from `set -e`, so
            # a `sort` that failed used to read as "not newer" and let the
            # write through. Third instance of that shape found in this effort.
            newest=""
            if [ -n "$held" ]; then
              newest=$(printf '%s\n%s\n' "$held" "$VERSION" | sort -V | tail -1)
              if [ -z "$newest" ]; then
                echo "Could not compare $held against $VERSION, so $address is not" >&2
                echo "being moved. $TAG keeps its own copy; re-run this job." >&2
                exit 1
              fi
            fi
            if [ -n "$held" ] && [ "$held" != "$VERSION" ] && [ "$newest" = "$held" ]; then
              echo "$address holds $held, which is newer than $VERSION. Leaving it alone."
              skipped="$skipped $address($held)"
              continue
            fi

            # **Not allowed to die inside the loop.** Under `set -e` an upload
            # that failed used to end the step then and there, so neither the
            # summary below nor the warning ever ran: `desktop-stable` moved,
            # `desktop-latest` did not, and the log said so only by which
            # `published` lines happened to be present. The skipped case was
            # already announced; the failed case is the one where nobody is
            # looking, so it deserves it more.
            #
            # Every address is attempted. Stopping after the first failure
            # would *guarantee* the split that carrying on only risks.
            if gh release upload "$address" "$RUNNER_TEMP/latest.json" -R "$GITHUB_REPOSITORY" --clobber; then
              echo "published $VERSION to $address"
              moved="$moved $address"
            else
              echo "::error::Could not publish $VERSION to $address."
              failed="$failed $address"
            fi
          done

          echo "moved:${moved:- nothing}${skipped:+ · left alone:$skipped}${failed:+ · failed:$failed}"
          if [ -n "$failed" ]; then
            echo "::error::$CHANNEL's addresses now disagree: moved$moved, failed$failed." \
                 "The ones that failed are *behind*, so re-running this job moves them forward" \
                 "— the no-backwards rule will leave the ones that already landed alone."
            exit 1
          fi
          if [ -n "$skipped" ] && [ -n "$moved" ]; then
            echo "::warning::$CHANNEL's addresses do not all hold the same version:" \
                 "moved$moved, left alone$skipped. That is the no-backwards rule doing its job," \
                 "but two general-access addresses disagreeing is worth knowing about."
          fi
