# Firetower, on a machine you own.
#
#   curl -O https://raw.githubusercontent.com/firetower-cloud/firetower/main/deploy/firetower.yml
#   curl -O https://raw.githubusercontent.com/firetower-cloud/firetower/main/deploy/Caddyfile
#   curl -O https://raw.githubusercontent.com/firetower-cloud/firetower/main/deploy/Caddyfile.dockerfile
#   curl -o .env https://raw.githubusercontent.com/firetower-cloud/firetower/main/deploy/.env.example
#   # edit .env
#   docker compose -f firetower.yml up -d
#
# The last two of those are only read with the `tls` profile on, and that
# start becomes `up -d --build` — see the `caddy` service.
#
# Then read the log: the first start prints an administrator to sign in as.
#
#   docker compose -f firetower.yml logs firetower
#
# **The published port is on loopback, and that is the point.** The control
# plane holds every credential Firetower has — every git token, every agent
# credential, the root key. Somebody who reaches it can erase the codebase of
# the company that installed it. So nothing here is published to the internet,
# and the two shapes below are both ways of reaching it without doing that.
#
# **Reached from your own machine**, which is the default and needs nothing at
# all. Firetower publishes HTTP_PORT on 127.0.0.1, no proxy is created, and an
# ssh tunnel from wherever you actually sit is the whole story:
#
#   ssh -N -L 8080:127.0.0.1:8080 -o ServerAliveInterval=20 you@this-machine
#
# **Reached on a name, over HTTPS**, when more than one person uses it and a
# tunnel each is not reasonable. That turns Caddy on — it is behind the `tls`
# profile, so it is not created otherwise — and Caddy obtains a certificate
# for the name, and renews it, on its own. It does that over DNS-01, which
# proves control by writing a record through your DNS provider's API rather
# than by answering a connection: the name never has to be reachable from the
# internet, and it should not be. See the Caddyfile.
#
# Sessions run in the control plane's own container, the same way they run on a
# laptop: as a child process, with `localhost` in the fleet. To run them
# somewhere else instead, add that machine over ssh — Compute → Add compute →
# A server — and drain `localhost`.

# The namespace for the containers, the network and the volumes below. Fixed,
# because changing it would orphan the volumes of every installation that
# already exists and hand them back an empty database.
#
# `compose.yaml` at the repository root is deliberately `firetower-dev` so that
# running Firetower on the machine you develop it on does not have the two
# fighting over one `firetower_postgres`.
name: firetower

services:
  firetower:
    image: ghcr.io/firetower-cloud/firetower:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback unless somebody asks otherwise, because the default has to be
      # the safe one: a bare `${HTTP_PORT}:4400` would publish the vault on
      # every interface this machine has, and `ufw deny` would not stop it —
      # Docker's own DNAT rules are consulted before the host's INPUT chain.
      #
      # Reach it with an ssh tunnel. Widening this to 0.0.0.0 is a decision to
      # put the control plane on the network, and one worth making on purpose.
      #
      # With the `tls` profile on, leave this alone: Caddy reaches 4400 over
      # the network below, not through here.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:4400"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-firetower}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-firetower}

      # The administrator, made before anything listens. Left empty, one is
      # made anyway and its password printed once in the log.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}

      # What every stored credential is sealed with. Left empty, a key is
      # written to the volume below — which works, and means the volume is now
      # as valuable as the database. Setting it keeps the key off disk.
      FIRETOWER_ROOT_KEY: ${FIRETOWER_ROOT_KEY:-}

      # The address you actually open, for the URL the log prints on the first
      # start and for the deep link in a notification. This process listens on
      # 4400 in here and has no way to know what is in front of it.
      #
      # The port belongs in here. Over a tunnel the browser is at
      # `localhost:8080`, and a URL that says `localhost` sends somebody to
      # port 80 on their own machine.
      FIRETOWER_PUBLIC_URL: ${FIRETOWER_PUBLIC_URL:-http://localhost:8080}

      # The updater beside this container — see the `updater` service. With
      # these two set, the Updates screen can recreate the control plane
      # itself; without them it upgrades workers only and says how to add it.
      FIRETOWER_UPDATER_URL: http://updater:4410
      FIRETOWER_UPDATER_TOKEN: ${FIRETOWER_UPDATER_TOKEN:-}

      # What a session's preview hangs off.
      #
      # `localhost` needs nothing: every browser resolves anything under it to
      # this machine, so a laptop — or anybody on a tunnel — gets previews with
      # no DNS and no certificate.
      #
      # With the `tls` profile on, set this to DOMAIN and add `*.that-domain`
      # as a DNS record. **The hostname is the credential**: it carries a
      # signature, and anyone holding one reaches that port of that session.
      # Treat one like a share link.
      FIRETOWER_PREVIEW_DOMAIN: ${FIRETOWER_PREVIEW_DOMAIN:-localhost}
    volumes:
      # The root key, the token, and everything the worker on this machine
      # keeps: repository mirrors, worktrees, the event log, and the agent's
      # own directory.
      - firetower:/var/lib/firetower

  # Upgrades, from the Updates screen.
  #
  # The control plane cannot recreate its own container, so this one does it
  # when asked: pulls the release, rewrites the files the release changed,
  # runs `docker compose up -d firetower` against this very file, waits for
  # the new one to answer, and puts the old image back if it does not. It
  # also takes a `pg_dump` into ./backups first. See crates/ft-updater.
  #
  # **It holds the Docker socket, which is root on this machine.** That is
  # the one privilege it has and the reason it has nothing else: no key, no
  # password, no database connection, no published port — the control plane
  # reaches it on this compose network with the token below, and nothing else
  # reaches it at all. It decides nothing on its own; every job is a person
  # pressing a button on the Updates screen.
  #
  # Workers on other machines are not its business. The control plane
  # recreates those itself, over the ssh connection it already has.
  updater:
    image: ghcr.io/firetower-cloud/firetower-updater:latest
    restart: unless-stopped
    environment:
      # The same token the control plane carries. Refuses everything without
      # it, and says so in its log.
      FIRETOWER_UPDATER_TOKEN: ${FIRETOWER_UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This directory: firetower.yml, .env, the Caddyfile, and backups/.
      # Compose runs against it, and a release's changes to firetower.yml are
      # written here — the previous copy kept as firetower.yml.backup. The
      # `.env` is read for the names of its variables and never written.
      - .:/deploy
    # Do not set `hostname:` here. The updater finds its own container by it.

  # TLS, and only TLS.
  #
  # Behind a profile because it is not needed otherwise: the control plane
  # serves its own interface, its own API and its own preview routing, so with
  # no certificate to terminate this container would be a pass-through in front
  # of a server that is already complete. `docker compose up -d` does not
  # create it. `COMPOSE_PROFILES=tls` — or `--profile tls` — does.
  #
  # Turning it on is a commitment to three things: DOMAIN, DNS credentials for
  # it, and A records for both `DOMAIN` and `*.DOMAIN`. Caddy obtains the
  # certificate itself over DNS-01 and renews it unattended — which it can do
  # without this machine ever being reachable from the internet, because the
  # challenge is answered by writing a TXT record outbound rather than by
  # answering a connection inbound. The Caddyfile explains the whole shape,
  # including how to supply your own certificate instead.
  caddy:
    profiles: [tls]
    # Built, not pulled. Caddy resolves DNS providers as compiled-in modules
    # and `caddy:2-alpine` ships none of them, so the module for your DNS has
    # to be baked in — see Caddyfile.dockerfile, which is where the cost of
    # this lives: the first build pulls a Go toolchain and takes a few
    # minutes. Nothing builds without the profile above.
    #
    # `up -d` builds this on its own the first time, because there is no
    # image yet. It does not build again afterwards — so changing
    # DNS_PROVIDER or DNS_MODULE_VERSION later needs `up -d --build`, or the
    # image already here is reused and the change does nothing visible.
    build:
      context: .
      dockerfile: Caddyfile.dockerfile
      args:
        # Empty, or `none`, builds a stock Caddy with no provider in it —
        # which is the bring-your-own-certificate path in the Caddyfile.
        DNS_MODULE: ${DNS_PROVIDER:-}
        # Optional. Empty builds whatever the module's default branch is
        # today, so the same .env a month apart is not the same binary.
        DNS_MODULE_VERSION: ${DNS_MODULE_VERSION:-}
        # Optional. `old=new@version`, for a provider module held back by
        # something it depends on rather than by anything in it. See
        # Caddyfile.dockerfile.
        DNS_MODULE_REPLACE: ${DNS_MODULE_REPLACE:-}
    # Named, so that the build does not overwrite the `caddy:2-alpine` tag
    # this machine may be holding for something else.
    image: firetower-caddy
    restart: unless-stopped
    depends_on: [firetower]
    ports:
      # 0.0.0.0 by default, unlike the control plane above: the entire reason
      # this container exists is that somebody else has to reach it. Narrow it
      # to one interface — a tailnet address, say — with HTTPS_BIND.
      #
      # Caddy always listens on 443 in here; HTTPS_PORT only moves the host
      # side, for a machine where something else already holds it.
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      # Redirects to the address above. Nothing is served here and no
      # certificate is issued here — DNS-01 needs no inbound port at all, which
      # is the reason it is the challenge in use; drop the line if you would
      # rather nothing answered on 80.
      - "${HTTPS_BIND:-0.0.0.0}:80:80"
    environment:
      # Empty defaults, and every one of these is in fact required — the
      # image refuses to start without them, and says which are missing.
      #
      # They are not `${DOMAIN:?...}` guards, which is where this check used
      # to live and is the obvious place for it, because Compose interpolates
      # the whole file before it decides which profiles are on. A required
      # variable inside a profile therefore fires with the profile off: one
      # `:?` here is enough to stop `docker compose up -d` on the default
      # install, which never creates this container at all. Neither
      # `--profile` nor the no-colon `${DOMAIN?}` form avoids it.
      #
      # So the refusing happens in the entrypoint, which runs only when this
      # container does. See Caddyfile.dockerfile.

      # The name Caddy answers for, and the name on the certificate.
      DOMAIN: ${DOMAIN:-}

      # The same value the module above was built from, and it has to match:
      # the Caddyfile substitutes it before parsing, and names a module that
      # is either compiled in or is not.
      DNS_PROVIDER: ${DNS_PROVIDER:-}

      # The credential Caddy writes the challenge record with. Read from the
      # environment by the Caddyfile at run time, so it is never written into
      # a config file — and, unlike the build argument above, not baked into
      # an image layer. Unread when DNS_PROVIDER=none.
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}

      # Where Let's Encrypt writes about an expiry that somehow got past
      # Caddy's own renewal. Optional — issuance works without it, and there
      # is nothing to notify at all on the bring-your-own-certificate path.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate, the key, and the ACME account. **Keep this volume.**
      # Losing it is a fresh issuance on the next start, and Let's Encrypt
      # allows five duplicate certificates a week.
      - caddy_data:/data
      - caddy_config:/config
      # Only for the bring-your-own-certificate path in the Caddyfile. Empty
      # and unread otherwise; Docker creates the directory if it is missing.
      - ./certs:/certs:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firetower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-firetower}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # "ready for queries", not "the process started" — everything else waits
      # on this.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firetower} -d ${POSTGRES_DB:-firetower}"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No `ports`. Nothing outside this file has any business here.

volumes:
  postgres:
  firetower:
  caddy_data:
  caddy_config:
