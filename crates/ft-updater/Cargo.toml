[package]
name = "ft-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Firetower updater: recreates the control plane, and itself, on request."

[[bin]]
name = "firetower-updater"
path = "src/main.rs"

[dependencies]
ft-updater-api.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
# The Docker Engine API over its socket, by hand. Twelve endpoints, all of
# them one request and one JSON document — a client crate for that would be
# a dependency to keep patched forever, in the one image that holds the
# machine's Docker socket.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
