[package]
name = "ft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Firetower domain types and the session state machine."

[dependencies]
serde.workspace = true
# The normaliser reads an agent's output, which is JSON, so this is no
# longer only a test concern.
serde_json.workspace = true
# An agent that wants a UUID for its session gets one derived from ours,
# so resuming needs nothing stored. See `agent_session_uuid`.
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true
chrono.workspace = true
utoipa.workspace = true

[dev-dependencies]
# The protocol check asks the installed Codex for its schema and reads it out
# of a directory it then throws away.
tempfile.workspace = true
