# The whole stack. `just dev` uses the database from here; `docker compose up`
# runs everything in containers.
#
# Nothing in this file is a secret. Postgres credentials come from .env, which
# is gitignored, with .env.example beside it.

# **Not `firetower`.** `deploy/firetower.yml` is that, and a Compose project
# name is the namespace for containers, networks and volumes alike — so sharing
# one means both files resolve `postgres:` to the same `firetower_postgres`
# volume. Running Firetower on the machine you develop it on then goes wrong in
# ways that look like nothing to do with Docker:
#
#   * whichever came up first owns the database, and the other authenticates
#     against credentials baked into a data directory at initdb, which no
#     amount of editing `.env` will change;
#   * `docker compose` here reports the deployment's containers as orphans, and
#     offers to remove them;
#   * `just reset` runs `docker compose down -v`, which would take the
#     deployment's database with it.
#
# Renaming this one rather than the deployment is deliberate. A contributor's
# database is disposable and rebuilt by the next `just db`; changing the name in
# `deploy/` would orphan the volumes of every installation that already exists,
# and their database would come back empty.
name: firetower-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firetower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firetower}
      POSTGRES_DB: ${POSTGRES_DB:-firetower}
    ports:
      # 5433 on purpose: 5432 is usually already taken by something local, and
      # a port conflict at start-up is a confusing way to learn that.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # Everything else waits for this, so it has to mean "ready for queries"
      # rather than "the process started".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firetower} -d ${POSTGRES_DB:-firetower}"]
      interval: 2s
      timeout: 3s
      retries: 30

  firetower:
    build:
      context: .
      dockerfile: Dockerfile.development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-firetower}:${POSTGRES_PASSWORD:-firetower}@postgres:5432/${POSTGRES_DB:-firetower}
      FIRETOWER_HOME: /workspace/.firetower
      # A container that listened on loopback would be reachable by nothing,
      # and the port published below would answer nothing. The release image
      # sets the same pair for the same reason — see Dockerfile. Firetower
      # refuses to bind an address like this with authentication turned off,
      # which is why the two belong next to each other.
      FIRETOWER_BIND: 0.0.0.0
      # The interface runs in here. The browser that loads it does not, so the
      # API address it is handed has to be the one published on the host —
      # this container's own 4400 means nothing to a browser. Overrides
      # web/.env.development, which is right for the two-processes-on-a-laptop
      # case it was written for.
      NEXT_PUBLIC_FIRETOWER_API: http://localhost:${FIRETOWER_PORT:-4400}
      # And the other direction: the address start-up prints to open, which in
      # development is the interface's rather than the control plane's. It
      # guesses 3000 — right until WEB_PORT below moves it, and then it names
      # a port with nothing on it.
      FIRETOWER_PUBLIC_URL: http://localhost:${WEB_PORT:-3000}
      # Passed through rather than baked in — see the README.
      FIRETOWER_GITHUB_CLIENT_ID: ${FIRETOWER_GITHUB_CLIENT_ID:-}
      # The key every stored credential is encrypted with. Left unset, one is
      # created under FIRETOWER_HOME above — which is a bind mount, so it
      # survives rebuilding the container. Set it to supply your own.
      FIRETOWER_ROOT_KEY: ${FIRETOWER_ROOT_KEY:-}
    volumes:
      - .:/workspace
      - cargo:/cargo
      - target:/target
      # The interface's dependencies, in a volume rather than the bind mount
      # above. Some of what pnpm installs is compiled for the platform that
      # installed it — development here tends to happen on macOS and this
      # container is Linux — so one shared node_modules leaves whichever ran
      # second with a native module it cannot load. A volume starts empty, so
      # `just _dev` fills it on the first start.
      - web_node_modules:/workspace/web/node_modules
      # Machines are reached over ssh with this key.
      - ./.dev/ssh:/root/.ssh:ro
    ports:
      # Parameterised like postgres above, and for the same reason: a second
      # checkout cannot also hold 4400, and a port conflict at start-up is a
      # confusing way to learn that.
      - "${FIRETOWER_PORT:-4400}:4400"
      - "${WEB_PORT:-3000}:3000"
    # The two halves of `just dev`, without the database it starts first —
    # postgres is the service above and `depends_on` has already waited for it
    # to answer queries. `just dev` here ran `docker compose up -d postgres`
    # from inside a container of this very stack: compose re-entering itself,
    # which the development image has no docker client to even attempt.
    command: just _dev
    profiles: ["full"]

volumes:
  postgres:
  cargo:
  target:
  web_node_modules:
