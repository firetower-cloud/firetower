# Run against an installed development build, a matching control plane and
# worker, and a connected Cursor Agent account on a disposable repository.
#
# maestro --device emulator-5554 test --test-output-dir=../docs/evidence/mobile \
#   -e ADDRESS=localhost:4400 -e USER=admin -e PASS=<test-password> \
#   -e WORKSPACE_NAME='Cursor ACP Mobile <unique-suffix>' \
#   e2e/cursor-agent.yaml
appId: com.usefiretower.app
---
- launchApp:
    permissions: { all: allow }

- assertVisible: "Connect to a Firetower"
- tapOn:
    id: "address"
- inputText: "${ADDRESS}"
- tapOn: "Connect"
# The field, not the "Sign in" button: the button is under the keyboard that
# the username field's own `autoFocus` raises. See `connect.yaml`.
- assertVisible:
    id: "username"
- tapOn:
    id: "username"
- inputText: "${USER}"
- tapOn:
    id: "password"
- inputText: "${PASS}"
- hideKeyboard
- tapOn: "Sign in"
- assertVisible: "Dashboard"

# **The `+` is gone and so is the form.** The screen the `+` opened is the
# screen you are already on, and every control on the composer now resolves
# over it: the shelf carries where the work happens, the picks carry what does
# it, and `start-send` creates the session rather than pushing `/new`. Nothing
# on this screen links to that route any more — only Tasks does, which is the
# one arrival carrying a key and a URL.
- tapOn:
    id: "start-text"
- inputText: "${WORKSPACE_NAME}"
- hideKeyboard

# The repository is the one thing that does not default: checking one out
# nobody named is work done in the wrong place. Multi-select, so the picker
# stays up and the back gesture is what closes it.
- tapOn:
    id: "shelf-repo"
- tapOn: "firetower-cursor-pw-repo"
- pressKey: Back
- tapOn:
    id: "shelf-host"
- tapOn: "localhost"

# Agent and account are inside the run pick, where the desk's `RunPicker`
# puts them. Each row opens a picker over the sheet and choosing returns to
# the sheet, so both are taken without reopening anything.
- tapOn:
    id: "start-pick-run"
- tapOn: "Agent"
- tapOn: "Cursor Agent"
- tapOn: "Account"
- tapOn: "Cursor Playwright"
- pressKey: Back

# **What was typed is sent.** The workspace is named after the first line and
# the agent is already working on it when the conversation opens, rather than
# coming up idle — so this asserts the composer itself and not a line about
# what the conversation holds.
- tapOn:
    id: "start-send"
- assertVisible:
    id: "composer"
- tapOn:
    id: "composer"
- inputText: "Read README.md and reply with its exact one-line content. Do not edit any files."
- tapOn:
    id: "send"
- extendedWaitUntil:
    visible: "(?s).*Playwright Cursor ACP smoke test.*"
    timeout: 120000
- takeScreenshot: cursor-agent-mobile-turn

- tapOn:
    id: "composer"
- inputText: "What was the exact README line you just returned? Reply with MOBILE FOLLOWUP followed by that line."
- tapOn:
    id: "send"
- extendedWaitUntil:
    visible: "(?s).*MOBILE FOLLOWUP.*Playwright Cursor ACP smoke test.*"
    timeout: 120000
- takeScreenshot: cursor-agent-mobile-followup
