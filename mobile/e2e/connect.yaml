# Connecting to a Firetower, and finding the inbox on the other side.
#
# The one flow that is only real end to end: it crosses the network, the
# keychain and the socket, and every one of those is something a unit test
# would have to pretend about. Everything else in `pnpm test` is a pure
# function over the contract precisely so that this can stay small.
#
#   maestro test e2e/connect.yaml -e ADDRESS=192.168.50.254:4400 -e USER=admin -e PASS=...
appId: com.usefiretower.app
---
- launchApp:
    clearState: true
    # Asked for up front rather than when iOS first resolves a `.local` name,
    # so the prompt is not sitting over the screen being asserted on.
    permissions: { all: allow }

# Waited for rather than asserted: a debug build fetches and parses its
# JavaScript from Metro on every launch, which is seconds on a laptop and
# measured past Maestro's default patience on a CI emulator — a black screen
# that is only an app still starting. It returns as soon as the text is there,
# so a healthy run pays nothing for the headroom.
- extendedWaitUntil:
    visible: "Connect to a Firetower"
    timeout: 180000
- tapOn:
    id: "address"
- inputText: "${ADDRESS}"
- tapOn: "Connect"

# `/bootstrap` is unauthenticated, so the organisation is named before anybody
# is asked for a password. That is the whole reason the address is asked first.
#
# The landmark is the username field and **not the "Sign in" button**, which
# is a race this lost. The button sits below the password field, and the
# username field above it carries `autoFocus` (`app/connect.tsx`), so the
# keyboard comes up over the button the moment the screen arrives. Whether
# the assertion or the keyboard animation got there first decided the run: on
# a CI emulator the keyboard won, and a flow whose server had answered and
# whose screen was perfectly correct failed on a keyboard. The field is above
# it either way — and an id rather than a caption, so copy cannot move it.
# `hideKeyboard` below is what makes the button tappable when it is wanted.
- assertVisible:
    id: "username"
    label: "The server answered, and it is asking who you are"
- tapOn:
    id: "username"
- inputText: "${USER}"
- tapOn:
    id: "password"
- inputText: "${PASS}"
- hideKeyboard
- tapOn: "Sign in"

# iOS offers to save the password the moment the sign-in succeeds, and the
# sheet lands over the inbox — so the assertion below fails on a flow that
# worked. `answer.yaml` already steps around this; this is where it starts.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# The home. It no longer announces itself — the page a tab opens does not
# repeat the tab's own name — so the landmark is the destination in the tab
# bar. `Inbox` was the old page heading and the old tab label at once.
- assertVisible: "Dashboard"
