# React Native's Metro resolver walks node_modules by path, not by symlink, so
# a package only reachable through .pnpm is one it cannot find — NativeWind's
# jsx-runtime is the first casualty and nothing renders. pnpm 10 moved this
# setting out of .npmrc, which is why it belongs here and not there.
nodeLinker: hoisted

# Same convention as web/ and desktop/: approving a build script means the
# decision is reviewed and in version control rather than re-prompted on every
# clone.
#
# It is also not optional. pnpm 11 *fails* an install that has ignored build
# scripts, and it writes the entries here as `set this to true or false` when
# it cannot ask — which is a file that installs on a laptop, where somebody
# answered the prompt once, and fails on a build machine, where nobody can.
# Three EAS builds died in "Install dependencies" on exactly that.
allowBuilds:
  # the bundler Vite runs on, for vitest and orval
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23
  - '@expo/metro-runtime@58.0.17'
  - expo-linking@58.0.16
  - expo-router@58.0.30
  - expo-splash-screen@58.0.13
  - expo-updates@58.0.21
